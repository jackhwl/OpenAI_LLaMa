<!--
  文件名：agentic-workflow-autonomous-intelligence.svg
  图表名称：智能体式工作流与自主智能：工作流的终极形态
  描述：展示从自动化工作流向自主智能体系统的演进，强调“感知-决策-行动”闭环与多智能体协作的涌现效应。

  核心层次：
  1. L1 自动化 (Automated): 固定流程，线性执行。
  2. L2 智能体式 (Agentic): 目标驱动，动态规划 (PEAR)。
  3. L3 自主智能 (Autonomous): 自我进化，多智能体协作 (Swarm)。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  修改记录：
-->
<svg width="1200" height="840" viewBox="0 0 1200 840" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .level-label { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 800; text-anchor: start; }
      .level-desc { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: normal; fill: #4B5563; text-anchor: start; }

      .node-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .icon-text { font-family: 'Noto Sans', sans-serif; font-size: 20px; text-anchor: middle; dominant-baseline: central; }

      /* 区域背景 */
      .bg-l1 { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1px; stroke-dasharray: 4,4; }
      .bg-l2 { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .bg-l3 { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }

      /* 节点样式 */
      .node-core { fill: white; stroke: #2563EB; stroke-width: 2px; }
      .node-tool { fill: #F3E8FF; stroke: #A855F7; stroke-width: 2px; }
      .node-memory { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; }

      /* 连接线 */
      .flow-line { fill: none; stroke: #9CA3AF; stroke-width: 2px; marker-end: url(#arrow-gray); }
      .agent-loop { fill: none; stroke: #2563EB; stroke-width: 3px; marker-end: url(#arrow-blue); }
      .swarm-link { stroke: #34D399; stroke-width: 1px; stroke-dasharray: 2,2; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#9CA3AF"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">智能体式工作流与自主智能</text>
  <text x="600" y="80" class="sub-title">工作流的终极形态：从“自动化执行”到“自主进化系统”</text>

  <!-- ================================================================================== -->
  <!-- 左侧：L1 自动化 (The Past) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 150)">
    <rect x="0" y="0" width="250" height="550" rx="12" class="bg-l1"/>
    <text x="20" y="40" class="level-label" fill="#4B5563">L1. 自动化 (Automated)</text>
    <text x="20" y="60" class="level-desc">预定义规则 · 线性执行</text>

    <!-- 线性流程示意 -->
    <g transform="translate(75, 100)">
        <rect x="0" y="0" width="100" height="40" rx="4" fill="white" stroke="#9CA3AF"/>
        <text x="50" y="25" class="node-text" fill="#4B5563">Trigger</text>
        <line x1="50" y1="40" x2="50" y2="80" class="flow-line"/>

        <rect x="0" y="80" width="100" height="40" rx="4" fill="white" stroke="#9CA3AF"/>
        <text x="50" y="105" class="node-text" fill="#4B5563">Step 1</text>
        <line x1="50" y1="120" x2="50" y2="160" class="flow-line"/>

        <rect x="0" y="160" width="100" height="40" rx="4" fill="white" stroke="#9CA3AF"/>
        <text x="50" y="185" class="node-text" fill="#4B5563">Step 2</text>
        <line x1="50" y1="200" x2="50" y2="240" class="flow-line"/>

        <rect x="0" y="240" width="100" height="40" rx="4" fill="white" stroke="#9CA3AF"/>
        <text x="50" y="265" class="node-text" fill="#4B5563">End</text>
    </g>

    <text x="125" y="450" class="node-text" fill="#EF4444">❌ 僵化，无适应性</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 中间：L2 智能体式 (The Present) -->
  <!-- ================================================================================== -->
  <g transform="translate(330, 120)">
    <rect x="0" y="0" width="400" height="600" rx="16" class="bg-l2"/>
    <text x="30" y="40" class="level-label" fill="#1E40AF">L2. 智能体式 (Agentic)</text>
    <text x="30" y="60" class="level-desc">目标驱动 · 动态规划 (PEAR Loop)</text>

    <!-- Agent Core Structure -->
    <g transform="translate(200, 300)">
        <!-- Brain (Center) -->
        <circle r="60" class="node-core"/>
        <text x="0" y="-10" class="icon-text">🧠</text>
        <text x="0" y="20" class="node-text" fill="#1E40AF">LLM Brain</text>

        <!-- Memory (Left) -->
        <circle cx="-120" cy="0" r="40" class="node-memory"/>
        <text x="-120" y="-5" class="icon-text">💾</text>
        <text x="-120" y="20" class="node-text" fill="#854D0E">Memory</text>

        <!-- Tools (Right) -->
        <circle cx="120" cy="0" r="40" class="node-tool"/>
        <text x="120" y="-5" class="icon-text">🛠️</text>
        <text x="120" y="20" class="node-text" fill="#6B21A8">Tools</text>

        <!-- Environment (Bottom) -->
        <rect x="-80" y="120" width="160" height="40" rx="20" fill="#E5E7EB" stroke="#9CA3AF"/>
        <text x="0" y="145" class="node-text" fill="#374151">Environment</text>

        <!-- Dynamic Loop Arrows (Updated) -->
        <!-- Memory -> Tools (Top Arc) -->
        <path d="M -120 -50 Q 0 -130 120 -50" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
        <!-- Tools -> Memory (Bottom Arc) -->
        <path d="M 120 50 Q 0 110 -120 50" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

        <!-- Labels for Flow -->
        <text x="0" y="-95" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="bold">Plan &amp; Act</text>
        <text x="0" y="95" font-size="10" fill="#2563EB" text-anchor="middle" font-weight="bold">Observe &amp; Update</text>
    </g>

    <text x="200" y="550" class="node-text" fill="#2563EB">✅ 自主规划与纠错</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 右侧：L3 自主智能 (The Future) -->
  <!-- ================================================================================== -->
  <g transform="translate(760, 150)">
    <rect x="0" y="0" width="390" height="550" rx="12" class="bg-l3"/>
    <text x="20" y="40" class="level-label" fill="#065F46">L3. 自主智能 (Autonomous)</text>
    <text x="20" y="60" class="level-desc">多智能体协作 · 系统涌现 (Swarm)</text>

    <!-- Swarm Network -->
    <g transform="translate(195, 280)">
        <!-- Central Goal -->
        <circle cx="0" cy="0" r="30" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
        <text x="0" y="5" class="node-text" fill="#065F46">Goal</text>

        <!-- Agents -->
        <g id="agent-nodes">
            <circle cx="0" cy="-100" r="20" fill="white" stroke="#34D399" stroke-width="2"/>
            <text x="0" y="-95" font-size="10" text-anchor="middle">A1</text>

            <circle cx="86" cy="-50" r="20" fill="white" stroke="#34D399" stroke-width="2"/>
            <text x="86" y="-45" font-size="10" text-anchor="middle">A2</text>

            <circle cx="86" cy="50" r="20" fill="white" stroke="#34D399" stroke-width="2"/>
            <text x="86" y="55" font-size="10" text-anchor="middle">A3</text>

            <circle cx="0" cy="100" r="20" fill="white" stroke="#34D399" stroke-width="2"/>
            <text x="0" y="105" font-size="10" text-anchor="middle">A4</text>

            <circle cx="-86" cy="50" r="20" fill="white" stroke="#34D399" stroke-width="2"/>
            <text x="-86" y="55" font-size="10" text-anchor="middle">A5</text>

            <circle cx="-86" cy="-50" r="20" fill="white" stroke="#34D399" stroke-width="2"/>
            <text x="-86" y="-45" font-size="10" text-anchor="middle">A6</text>
        </g>

        <!-- Connections (Mesh) -->
        <line x1="0" y1="-80" x2="0" y2="-30" class="swarm-link"/>
        <line x1="68" y1="-40" x2="26" y2="-15" class="swarm-link"/>
        <line x1="68" y1="40" x2="26" y2="15" class="swarm-link"/>
        <line x1="0" y1="80" x2="0" y2="30" class="swarm-link"/>
        <line x1="-68" y1="40" x2="-26" y2="15" class="swarm-link"/>
        <line x1="-68" y1="-40" x2="-26" y2="-15" class="swarm-link"/>

        <!-- Inter-agent links -->
        <line x1="0" y1="-100" x2="86" y2="-50" class="swarm-link"/>
        <line x1="86" y1="-50" x2="86" y2="50" class="swarm-link"/>
        <line x1="86" y1="50" x2="0" y2="100" class="swarm-link"/>
        <line x1="0" y1="100" x2="-86" y2="50" class="swarm-link"/>
        <line x1="-86" y1="50" x2="-86" y2="-50" class="swarm-link"/>
        <line x1="-86" y1="-50" x2="0" y2="-100" class="swarm-link"/>
    </g>

    <text x="195" y="480" class="node-text" fill="#059669">🌟 复杂系统涌现与自我进化</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部进化趋势 -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 740)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#E5E7EB" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <text x="500" y="30" text-anchor="middle" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#6B7280">
      系统复杂度 / 智能程度 (System Complexity / Intelligence)
    </text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="820" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
