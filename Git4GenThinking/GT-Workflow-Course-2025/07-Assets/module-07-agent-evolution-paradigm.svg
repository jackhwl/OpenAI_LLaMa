<!--
  ================================================================================
  图表名称：多智能体协作范式演进图 (Evolution of Collaboration Paradigm)
  文件命名：module-07-agent-evolution-paradigm.svg
  描述：
    展示从单体 Agent 到 Agent Network 的三个演进阶段：
    1. Single Agent: 单点全能，内部耦合 (黄色 - 瓶颈)
    2. MAS (Multi-Agent System): 结构化分工，SOP 驱动 (蓝色 - 秩序)
    3. Agent Network: 分布式互联，生态涌现 (绿色 - 生态)
  SPDX-License-Identifier: MIT AND CC-BY-4.0
  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  ================================================================================
-->
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- ========================================================================= -->
  <!-- Definitions -->
  <!-- ========================================================================= -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9CA3AF" />
    </marker>
  </defs>
  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="600" fill="#FFFFFF"/>

  <!-- ========================================================================= -->
  <!-- Header -->
  <!-- ========================================================================= -->
  <text x="600" y="50" font-family="'Noto Sans', sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="middle">
    智能体协作范式演进：从单体孤岛到智能网络
  </text>
  <text x="600" y="80" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle">
    Evolution from Single Agent to Agent Network
  </text>

  <!-- ========================================================================= -->
  <!-- STAGE 1: Single Agent (The Monolith) -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 180)">
    <!-- Title -->
    <text x="125" y="-20" font-family="'Noto Sans', sans-serif" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">Phase 1: 单体 Agent</text>

    <!-- Container Body -->
    <rect x="0" y="0" width="250" height="250" rx="16" fill="#FEF9C3" stroke="#FACC15" stroke-width="3"/>

    <!-- Internal Chaos -->
    <rect x="25" y="30" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="125" y="55" font-family="'Noto Sans', sans-serif" font-size="12" fill="#92400E" text-anchor="middle">Planning &amp; Execution</text>

    <rect x="25" y="80" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="125" y="105" font-family="'Noto Sans', sans-serif" font-size="12" fill="#92400E" text-anchor="middle">Context Management</text>

    <rect x="25" y="130" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="125" y="155" font-family="'Noto Sans', sans-serif" font-size="12" fill="#92400E" text-anchor="middle">Tool Selection</text>

    <rect x="25" y="180" width="200" height="40" rx="4" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
    <text x="125" y="205" font-family="'Noto Sans', sans-serif" font-size="12" fill="#92400E" text-anchor="middle">Memory &amp; Recall</text>

    <!-- Bottleneck Icon (Exclamation) -->
    <circle cx="220" cy="30" r="12" fill="#F59E0B"/>
    <text x="220" y="35" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">!</text>

    <!-- Description -->
    <text x="125" y="290" font-family="'Noto Sans', sans-serif" font-size="14" fill="#4B5563" text-anchor="middle">
      特点：全能、高耦合
    </text>
    <text x="125" y="310" font-family="'Noto Sans', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      瓶颈：上下文拥挤，扩展难
    </text>
  </g>

  <!-- Evolution Arrow 1 -->
  <path d="M 370 305 L 430 305" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>

  <!-- ========================================================================= -->
  <!-- STAGE 2: Multi-Agent System (Structure) -->
  <!-- ========================================================================= -->
  <g transform="translate(450, 180)">
    <!-- Title -->
    <text x="150" y="-20" font-family="'Noto Sans', sans-serif" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">Phase 2: 多智能体 (MAS)</text>

    <!-- Outer Container (Invisible Boundary) -->
    <rect x="0" y="0" width="300" height="250" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Structure: Hierarchy -->
    <!-- Top: Controller -->
    <rect x="100" y="20" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="150" y="50" font-family="'Noto Sans', sans-serif" font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">Manager</text>

    <!-- Middle: Workers -->
    <line x1="150" y1="70" x2="150" y2="100" stroke="#3B82F6" stroke-width="2"/>
    <line x1="70" y1="100" x2="230" y2="100" stroke="#3B82F6" stroke-width="2"/>

    <line x1="70" y1="100" x2="70" y2="130" stroke="#3B82F6" stroke-width="2"/>
    <line x1="230" y1="100" x2="230" y2="130" stroke="#3B82F6" stroke-width="2"/>

    <!-- Worker A -->
    <rect x="20" y="130" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1"/>
    <text x="70" y="160" font-family="'Noto Sans', sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">Specialist A</text>

    <!-- Worker B -->
    <rect x="180" y="130" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1"/>
    <text x="230" y="160" font-family="'Noto Sans', sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">Specialist B</text>

    <!-- Protocol Label -->
    <rect x="110" y="200" width="80" height="24" rx="12" fill="#DBEAFE"/>
    <text x="150" y="216" font-family="'Noto Sans', sans-serif" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle">SOP Protocol</text>

    <!-- Description -->
    <text x="150" y="290" font-family="'Noto Sans', sans-serif" font-size="14" fill="#4B5563" text-anchor="middle">
      特点：科层制、角色分工
    </text>
    <text x="150" y="310" font-family="'Noto Sans', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      优势：流程可控，专业度高
    </text>
  </g>

  <!-- Evolution Arrow 2 -->
  <path d="M 770 305 L 830 305" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>

  <!-- ========================================================================= -->
  <!-- STAGE 3: Agent Network (Ecosystem) -->
  <!-- ========================================================================= -->
  <g transform="translate(850, 180)">
    <!-- Title -->
    <text x="125" y="-20" font-family="'Noto Sans', sans-serif" font-size="18" font-weight="700" fill="#047857" text-anchor="middle">Phase 3: Agent Network</text>

    <!-- Container Body -->
    <rect x="0" y="0" width="250" height="250" rx="16" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>

    <!-- Nodes (Distributed) -->
    <!-- Node 1 -->
    <circle cx="50" cy="50" r="20" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>

    <!-- Node 2 -->
    <circle cx="200" cy="60" r="20" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>

    <!-- Node 3 -->
    <circle cx="125" cy="125" r="25" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>

    <!-- Node 4 -->
    <circle cx="60" cy="200" r="20" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>

    <!-- Node 5 -->
    <circle cx="190" cy="190" r="20" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>

    <!-- Connections (Mesh) -->
    <line x1="50" y1="50" x2="125" y2="125" stroke="#34D399" stroke-width="1"/>
    <line x1="200" y1="60" x2="125" y2="125" stroke="#34D399" stroke-width="1"/>
    <line x1="60" y1="200" x2="125" y2="125" stroke="#34D399" stroke-width="1"/>
    <line x1="190" y1="190" x2="125" y2="125" stroke="#34D399" stroke-width="1"/>

    <line x1="50" y1="50" x2="200" y2="60" stroke="#86EFAC" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="60" y1="200" x2="190" y2="190" stroke="#86EFAC" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="50" y1="50" x2="60" y2="200" stroke="#86EFAC" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Description -->
    <text x="125" y="290" font-family="'Noto Sans', sans-serif" font-size="14" fill="#4B5563" text-anchor="middle">
      特点：去中心化、自组织
    </text>
    <text x="125" y="310" font-family="'Noto Sans', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      优势：生态涌现，无限扩展
    </text>
  </g>

  <!-- License -->
  <text x="600" y="550" font-family="'Noto Sans', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
