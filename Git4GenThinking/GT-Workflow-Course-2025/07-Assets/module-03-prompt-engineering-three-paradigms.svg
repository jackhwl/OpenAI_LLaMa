<!--
  文件名：module-03-prompt-engineering-three-paradigms.svg
  图表名称：Prompt工程三大范式示意图
  描述：展示提示词工程从简单的说明式交互，到结构化约束，再到系统化编排的三个发展阶段。

  核心范式：
  1. 说明式 (Instructional): 自然语言指令，单轮交互。
  2. 结构式 (Structured): 模版与约束，标准化输出。
  3. 编排式 (Orchestrated): 工作流与代理，动态系统。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }
      .card-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .card-subtitle { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; opacity: 0.8; }
      .body-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; fill: #4B5563; }
      .code-text { font-family: 'Courier New', monospace; font-size: 11px; fill: #374151; }
      .tag-text { font-family: 'Noto Sans', sans-serif; font-size: 10px; font-weight: bold; text-anchor: middle; fill: white; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">提示词工程三大范式演进</text>
  <text x="600" y="80" class="sub-title">从“自然对话”到“系统工程”的认知跃迁</text>

  <!-- ================================================================================== -->
  <!-- 范式 1：说明式 (Instructional) - 蓝色系 -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 150)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="300" height="400" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>

    <!-- 标题头 -->
    <rect x="0" y="0" width="300" height="60" rx="12" fill="#DBEAFE" stroke="none"/>
    <path d="M 0 60 L 300 60" stroke="#60A5FA" stroke-width="1"/>
    <text x="150" y="35" class="card-title" fill="#1E40AF">1. 说明式</text>
    <text x="150" y="52" class="card-subtitle" fill="#1E40AF">Instructional Paradigm</text>

    <!-- 视觉隐喻：对话气泡 -->
    <g transform="translate(150, 120)">
        <circle cx="0" cy="0" r="40" fill="white" stroke="#60A5FA" stroke-width="2"/>
        <text x="0" y="10" text-anchor="middle" font-size="24">💬</text>
    </g>

    <!-- 核心特征 -->
    <g transform="translate(20, 180)">
        <text x="0" y="0" class="body-text" font-weight="bold" fill="#1E40AF">核心特征：</text>
        <circle cx="5" cy="20" r="3" fill="#60A5FA"/> <text x="15" y="24" class="body-text">自然语言直觉驱动</text>
        <circle cx="5" cy="40" r="3" fill="#60A5FA"/> <text x="15" y="44" class="body-text">单轮/多轮简单对话</text>
        <circle cx="5" cy="60" r="3" fill="#60A5FA"/> <text x="15" y="64" class="body-text">依赖模型自身理解力</text>
    </g>

    <!-- 示例代码块 -->
    <rect x="20" y="260" width="260" height="80" rx="4" fill="white" stroke="#BFDBFE" stroke-width="1"/>
    <text x="30" y="280" class="code-text" font-weight="bold">User:</text>
    <text x="30" y="300" class="code-text">"帮我写一篇关于AI的文章，</text>
    <text x="30" y="315" class="code-text">要通俗易懂一点。"</text>

    <!-- 底部标签 -->
    <rect x="100" y="360" width="100" height="24" rx="12" fill="#60A5FA"/>
    <text x="150" y="376" class="tag-text">低门槛 / 高随机</text>
  </g>

  <!-- 连接箭头 1 -> 2 -->
  <g transform="translate(365, 350)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- ================================================================================== -->
  <!-- 范式 2：结构式 (Structured) - 绿色系 -->
  <!-- ================================================================================== -->
  <g transform="translate(425, 150)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="350" height="400" rx="12" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>

    <!-- 标题头 -->
    <rect x="0" y="0" width="350" height="60" rx="12" fill="#DCFCE7" stroke="none"/>
    <path d="M 0 60 L 350 60" stroke="#34D399" stroke-width="1"/>
    <text x="175" y="35" class="card-title" fill="#065F46">2. 结构式</text>
    <text x="175" y="52" class="card-subtitle" fill="#065F46">Structured Paradigm</text>

    <!-- 视觉隐喻：框架模板 -->
    <g transform="translate(175, 120)">
        <rect x="-30" y="-30" width="60" height="60" rx="4" fill="white" stroke="#34D399" stroke-width="2"/>
        <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#34D399" stroke-width="1"/>
        <line x1="-20" y1="10" x2="20" y2="10" stroke="#34D399" stroke-width="1"/>
        <text x="0" y="10" text-anchor="middle" font-size="24">📋</text>
    </g>

    <!-- 核心特征 -->
    <g transform="translate(20, 180)">
        <text x="0" y="0" class="body-text" font-weight="bold" fill="#065F46">核心特征：</text>
        <circle cx="5" cy="20" r="3" fill="#34D399"/> <text x="15" y="24" class="body-text">引入 Role/Context/Format</text>
        <circle cx="5" cy="40" r="3" fill="#34D399"/> <text x="15" y="44" class="body-text">标准化输出 (JSON/Markdown)</text>
        <circle cx="5" cy="60" r="3" fill="#34D399"/> <text x="15" y="64" class="body-text">降低熵值，提高确定性</text>
    </g>

    <!-- 示例代码块 -->
    <rect x="20" y="260" width="310" height="80" rx="4" fill="white" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="280" class="code-text" fill="#047857"># Role: Tech Writer</text>
    <text x="30" y="295" class="code-text" fill="#047857"># Task: Explain AI concepts</text>
    <text x="30" y="310" class="code-text" fill="#047857"># Output Format: {"topic": str...}</text>
    <text x="30" y="325" class="code-text" fill="#047857"># Constraints: Use simple analogies</text>

    <!-- 底部标签 -->
    <rect x="125" y="360" width="100" height="24" rx="12" fill="#34D399"/>
    <text x="175" y="376" class="tag-text">高确定性 / 机器友好</text>
  </g>

  <!-- 连接箭头 2 -> 3 -->
  <g transform="translate(790, 350)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- ================================================================================== -->
  <!-- 范式 3：编排式 (Orchestrated) - 黄色系 -->
  <!-- ================================================================================== -->
  <g transform="translate(850, 150)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="300" height="400" rx="12" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>

    <!-- 标题头 -->
    <rect x="0" y="0" width="300" height="60" rx="12" fill="#FEF3C7" stroke="none"/>
    <path d="M 0 60 L 300 60" stroke="#FACC15" stroke-width="1"/>
    <text x="150" y="35" class="card-title" fill="#92400E">3. 编排式</text>
    <text x="150" y="52" class="card-subtitle" fill="#92400E">Orchestrated Paradigm</text>

    <!-- 视觉隐喻：系统齿轮 -->
    <g transform="translate(150, 120)">
        <circle cx="-15" cy="-10" r="15" fill="none" stroke="#FACC15" stroke-width="2"/>
        <circle cx="15" cy="10" r="15" fill="none" stroke="#FACC15" stroke-width="2"/>
        <path d="M -15 -10 L 15 10" stroke="#FACC15" stroke-width="2"/>
        <text x="0" y="10" text-anchor="middle" font-size="24">⚙️</text>
    </g>

    <!-- 核心特征 -->
    <g transform="translate(20, 180)">
        <text x="0" y="0" class="body-text" font-weight="bold" fill="#92400E">核心特征：</text>
        <circle cx="5" cy="20" r="3" fill="#FACC15"/> <text x="15" y="24" class="body-text">多Prompt协作与路由</text>
        <circle cx="5" cy="40" r="3" fill="#FACC15"/> <text x="15" y="44" class="body-text">引入外部工具与记忆</text>
        <circle cx="5" cy="60" r="3" fill="#FACC15"/> <text x="15" y="64" class="body-text">动态工作流 (Workflow)</text>
    </g>

    <!-- 示例代码块 -->
    <rect x="20" y="260" width="260" height="80" rx="4" fill="white" stroke="#FDE68A" stroke-width="1"/>
    <text x="30" y="280" class="code-text" fill="#92400E">if intent == "research":</text>
    <text x="40" y="295" class="code-text" fill="#92400E">agent.use_tool("search")</text>
    <text x="30" y="310" class="code-text" fill="#92400E">elif intent == "draft":</text>
    <text x="40" y="325" class="code-text" fill="#92400E">agent.run_chain("writer")</text>

    <!-- 底部标签 -->
    <rect x="100" y="360" width="100" height="24" rx="12" fill="#FACC15"/>
    <text x="150" y="376" class="tag-text">复杂任务 / 自动化</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部趋势分析 -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 600)">
    <line x1="0" y1="0" x2="1100" y2="0" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- 左轴标签 -->
    <text x="0" y="30" font-family="Noto Sans" font-size="12" fill="#6B7280">Human-Centric</text>
    <text x="0" y="45" font-family="Noto Sans" font-size="12" fill="#6B7280">(人类直觉)</text>

    <!-- 右轴标签 -->
    <text x="1100" y="30" text-anchor="end" font-family="Noto Sans" font-size="12" fill="#6B7280">System-Centric</text>
    <text x="1100" y="45" text-anchor="end" font-family="Noto Sans" font-size="12" fill="#6B7280">(系统工程)</text>

    <!-- 趋势箭头 -->
    <path d="M 100 30 L 1000 30" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.5"/>
    <text x="550" y="25" text-anchor="middle" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#2563EB">控制粒度与系统复杂度提升</text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="680" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
