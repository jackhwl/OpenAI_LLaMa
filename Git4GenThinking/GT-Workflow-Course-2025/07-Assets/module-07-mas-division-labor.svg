<!--
  ================================================================================
  图表名称：多智能体：不是“并行模型”，而是“分工系统”
  文件命名：module-07-mas-division-labor.svg
  描述：
    对比 MAS 的两种认知模式：
    1. 左侧 (Misconception): 并行模型 (Parallelism). 认为是简单的数量堆叠，三个同样的 Agent 做同一件事 (Redundant/Inefficient).
    2. 右侧 (Reality): 分工系统 (Division of Labor). 强调角色异构与流水线协作 (Specialized/Synergistic).
  SPDX-License-Identifier: MIT AND CC-BY-4.0
  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  ================================================================================
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- ========================================================================= -->
  <!-- DEFINITIONS & STYLES -->
  <!-- ========================================================================= -->
  <defs>
    <style>
      /* 全局字体 */
      .font-sans { font-family: 'Noto Sans', sans-serif; }

      /* 文本样式 */
      .title-main { font-size: 24px; font-weight: 800; fill: #111827; }
      .title-sub { font-size: 16px; font-weight: 400; fill: #6B7280; }

      .text-head { font-size: 18px; font-weight: 700; }
      .text-label { font-size: 14px; font-weight: 700; }
      .text-body { font-size: 12px; font-weight: 400; }
      .text-small { font-size: 11px; font-weight: 400; }

      /* 颜色定义 */
      /* Left Side (Wrong/Parallel) */
      .box-wrong { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 2px; }
      .box-generic { fill: #FFFFFF; stroke: #F59E0B; stroke-width: 1px; stroke-dasharray: 4,2; }
      .text-wrong { fill: #B45309; }
      .conn-wrong { stroke: #F59E0B; stroke-width: 1.5px; }

      /* Right Side (Right/Division) */
      .box-right { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 2px; }
      .text-right { fill: #1E40AF; }

      /* Specialized Agents */
      .box-planner { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1px; }
      .box-coder { fill: #DCFCE7; stroke: #059669; stroke-width: 1px; }
      .box-reviewer { fill: #FEF3C7; stroke: #D97706; stroke-width: 1px; }

      .conn-flow { stroke: #111827; stroke-width: 2px; }

      /* Separator */
      .separator { stroke: #E5E7EB; stroke-width: 2px; stroke-dasharray: 8,4; }
    </style>

    <!-- Markers -->
    <marker id="arrow-wrong" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-flow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- Header -->
  <!-- ========================================================================= -->
  <text x="600" y="50" class="font-sans title-main" text-anchor="middle">
    多智能体：不是“并行模型”，而是“分工系统”
  </text>
  <text x="600" y="80" class="font-sans title-sub" text-anchor="middle">
    Misconception vs Reality: Parallelism vs Division of Labor
  </text>

  <!-- ========================================================================= -->
  <!-- LEFT: MISCONCEPTION (Parallelism) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 130)">
    <text x="250" y="30" class="font-sans text-head text-wrong" text-anchor="middle">
      ❌ 误区：并行模型 (Parallelism)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#9CA3AF" text-anchor="middle">
      "More Agents = Better?" (Redundancy)
    </text>

    <!-- Main Container -->
    <rect x="20" y="80" width="460" height="420" rx="16" class="box-wrong"/>

    <!-- Task Input -->
    <g transform="translate(40, 200)">
      <circle cx="40" cy="40" r="30" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
      <text x="40" y="45" class="font-sans text-label" fill="#374151" text-anchor="middle">Task</text>
    </g>

    <!-- Generic Agents Stack -->
    <g transform="translate(200, 100)">
      <!-- Agent 1 -->
      <rect x="0" y="0" width="160" height="80" rx="6" class="box-generic"/>
      <text x="80" y="35" class="font-sans text-label text-wrong" text-anchor="middle">Generic Agent A</text>
      <text x="80" y="55" class="font-sans text-small" fill="#9CA3AF" text-anchor="middle">Full Context</text>

      <!-- Agent 2 -->
      <rect x="0" y="110" width="160" height="80" rx="6" class="box-generic"/>
      <text x="80" y="35" class="font-sans text-label text-wrong" text-anchor="middle">Generic Agent B</text>
      <text x="80" y="55" class="font-sans text-small" fill="#9CA3AF" text-anchor="middle">Full Context</text>

      <!-- Agent 3 -->
      <rect x="0" y="220" width="160" height="80" rx="6" class="box-generic"/>
      <text x="80" y="35" class="font-sans text-label text-wrong" text-anchor="middle">Generic Agent C</text>
      <text x="80" y="55" class="font-sans text-small" fill="#9CA3AF" text-anchor="middle">Full Context</text>
    </g>

    <!-- Messy Arrows -->
    <line x1="110" y1="240" x2="200" y2="140" class="conn-wrong" marker-end="url(#arrow-wrong)"/>
    <line x1="110" y1="240" x2="200" y2="250" class="conn-wrong" marker-end="url(#arrow-wrong)"/>
    <line x1="110" y1="240" x2="200" y2="360" class="conn-wrong" marker-end="url(#arrow-wrong)"/>

    <!-- Outcome -->
    <g transform="translate(200, 340)">
      <text x="80" y="120" class="font-sans text-small text-wrong" text-anchor="middle">⚠️ 重复计算</text>
      <text x="80" y="140" class="font-sans text-small text-wrong" text-anchor="middle">⚠️ 上下文冲突</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER: SEPARATOR -->
  <!-- ========================================================================= -->
  <line x1="600" y1="150" x2="600" y2="550" class="separator"/>

  <!-- ========================================================================= -->
  <!-- RIGHT: REALITY (Division of Labor) -->
  <!-- ========================================================================= -->
  <g transform="translate(650, 130)">
    <text x="250" y="30" class="font-sans text-head text-right" text-anchor="middle">
      ✅ 正解：分工系统 (Division of Labor)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#60A5FA" text-anchor="middle">
      "Specialization + SOP = Synergy"
    </text>

    <!-- Main Container -->
    <rect x="20" y="80" width="460" height="420" rx="16" class="box-right"/>

    <!-- The Pipeline -->
    <g transform="translate(50, 120)">

      <!-- Step 1: Planner -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="140" height="80" rx="6" class="box-planner"/>
        <text x="70" y="35" class="font-sans text-label" fill="#1E40AF" text-anchor="middle">1. Planner</text>
        <text x="70" y="55" class="font-sans text-small" fill="#60A5FA" text-anchor="middle">拆解任务</text>
      </g>

      <!-- Arrow -->
      <path d="M 140 40 L 180 40" class="conn-flow" marker-end="url(#arrow-flow)"/>

      <!-- Step 2: Coder -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="140" height="80" rx="6" class="box-coder"/>
        <text x="70" y="35" class="font-sans text-label" fill="#065F46" text-anchor="middle">2. Coder</text>
        <text x="70" y="55" class="font-sans text-small" fill="#10B981" text-anchor="middle">专注实现</text>
      </g>

      <!-- Arrow Down -->
      <path d="M 250 80 L 250 120" class="conn-flow" marker-end="url(#arrow-flow)"/>

      <!-- Step 3: Reviewer -->
      <g transform="translate(180, 120)">
        <rect x="0" y="0" width="140" height="80" rx="6" class="box-reviewer"/>
        <text x="70" y="35" class="font-sans text-label" fill="#92400E" text-anchor="middle">3. Reviewer</text>
        <text x="70" y="55" class="font-sans text-small" fill="#D97706" text-anchor="middle">安全审计</text>
      </g>

      <!-- Loop Back (Feedback) -->
      <path d="M 180 160 L 70 160 L 70 80" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="125" y="175" class="font-sans text-small" fill="#D97706" text-anchor="middle">Feedback</text>

      <!-- Step 4: Output -->
      <path d="M 320 160 L 360 160" class="conn-flow" marker-end="url(#arrow-flow)"/>
      <g transform="translate(360, 130)">
        <rect x="0" y="0" width="60" height="60" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
        <text x="30" y="35" class="font-sans text-small" fill="#374151" text-anchor="middle">Result</text>
      </g>
    </g>

    <!-- Outcome Summary -->
    <g transform="translate(40, 360)">
      <text x="0" y="0" class="font-sans text-body" fill="#1E40AF">优势 (Advantages):</text>
      <text x="0" y="20" class="font-sans text-small" fill="#374151">• 上下文隔离：每个 Agent 只看必要信息</text>
      <text x="0" y="40" class="font-sans text-small" fill="#374151">• 专业化：用不同 Prompt/Model 处理不同环节</text>
      <text x="0" y="60" class="font-sans text-small" fill="#374151">• 流程可控：SOP 定义了数据流向</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER -->
  <!-- ========================================================================= -->
  <g transform="translate(150, 660)">
    <rect x="0" y="0" width="900" height="60" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="450" y="35" class="font-sans text-label text-right" text-anchor="middle">
      本质区别：从“三个臭皮匠凑在一起(Chat)” 变为 “建筑师+泥瓦匠+质检员(System)”
    </text>
  </g>

  <!-- License -->
  <text x="600" y="780" class="font-sans text-body" fill="#64748B" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
