<!--
  文件名：module-05-pear-to-engineering-mapping.svg
  图表名称：PEAR → 工程模块映射图
  描述：将 PEAR 认知模型（感知-评估-行动-反思）映射到具体的工程实现层，展示各阶段对应的工具、数据结构与系统组件。

  核心映射：
  1. Perceive (感知) -> 输入适配层 (Input Adapter): 多模态解析、RAG、Context Window。
  2. Evaluate (评估) -> 决策引擎 (Decision Engine): Router, Planner, FSM。
  3. Act (行动) -> 执行环境 (Execution Env): Sandbox, API Client, Middleware。
  4. Reflect (反思) -> 反馈系统 (Feedback System): Log, Eval Metrics, Vector Memory。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .layer-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: start; }
      .module-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .tech-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }
      .tag-text { font-family: 'Noto Sans', sans-serif; font-size: 10px; font-weight: bold; fill: white; text-anchor: middle; }

      /* 区域背景 */
      .pear-bg { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 12; }
      .eng-bg { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; rx: 12; }

      /* 模块样式 */
      .box-blue { fill: white; stroke: #2563EB; stroke-width: 2px; rx: 8; }
      .box-green { fill: white; stroke: #059669; stroke-width: 2px; rx: 8; }
      .box-yellow { fill: white; stroke: #FACC15; stroke-width: 2px; rx: 8; }
      .box-purple { fill: white; stroke: #A855F7; stroke-width: 2px; rx: 8; }

      /* 连接线 */
      .map-line { fill: none; stroke: #94A3B8; stroke-width: 2px; stroke-dasharray: 4,4; marker-end: url(#arrow-gray); }
      .flow-line { fill: none; stroke: #374151; stroke-width: 2px; marker-end: url(#arrow-dark); }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">PEAR → 工程模块映射图</text>
  <text x="600" y="80" class="sub-title">打通“认知模型”与“工程实现”：从抽象概念到具体组件</text>

  <!-- ================================================================================== -->
  <!-- 上层：认知层 (Cognitive Layer - PEAR) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="1100" height="150" class="pear-bg"/>
    <text x="20" y="30" class="layer-title" fill="#1E40AF">认知层 (Cognitive Model)</text>

    <!-- P: Perceive -->
    <g transform="translate(100, 50)">
        <rect x="0" y="0" width="180" height="80" class="box-blue"/>
        <text x="90" y="30" class="module-title" fill="#1E40AF">Perceive (感知)</text>
        <text x="90" y="55" class="tech-text">意图识别 · 上下文构建</text>
    </g>

    <!-- E: Evaluate -->
    <g transform="translate(350, 50)">
        <rect x="0" y="0" width="180" height="80" class="box-yellow"/>
        <text x="90" y="30" class="module-title" fill="#B45309">Evaluate (评估)</text>
        <text x="90" y="55" class="tech-text">规划 · 决策 · 路由</text>
    </g>

    <!-- A: Act -->
    <g transform="translate(600, 50)">
        <rect x="0" y="0" width="180" height="80" class="box-green"/>
        <text x="90" y="30" class="module-title" fill="#065F46">Act (行动)</text>
        <text x="90" y="55" class="tech-text">执行 · 交互 · 副作用</text>
    </g>

    <g transform="translate(850, 50)">
        <rect x="0" y="0" width="180" height="80" class="box-purple"/>
        <text x="90" y="30" class="module-title" fill="#6B21A8">Reflect (反思)</text>
        <text x="90" y="55" class="tech-text">校验 · 归因 · 记忆</text>
    </g>

    <!-- Flow Arrows -->
    <path d="M 280 90 L 350 90" class="flow-line"/>
    <path d="M 530 90 L 600 90" class="flow-line"/>
    <path d="M 780 90 L 850 90" class="flow-line"/>
  </g>

  <!-- ================================================================================== -->
  <!-- 映射层：垂直连接线 -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 270)">
    <!-- P Mapping -->
    <line x1="190" y1="0" x2="190" y2="50" class="map-line"/>

    <!-- E Mapping -->
    <line x1="440" y1="0" x2="440" y2="50" class="map-line"/>

    <!-- A Mapping -->
    <line x1="690" y1="0" x2="690" y2="50" class="map-line"/>

    <!-- R Mapping -->
    <line x1="940" y1="0" x2="940" y2="50" class="map-line"/>
  </g>

  <!-- ================================================================================== -->
  <!-- 下层：工程层 (Engineering Layer - Implementation) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="1100" height="300" class="eng-bg"/>
    <text x="20" y="30" class="layer-title" fill="#065F46">工程层 (System Implementation)</text>

    <!-- 1. Input Adapter -->
    <g transform="translate(50, 60)">
        <rect x="0" y="0" width="230" height="200" rx="8" fill="white" stroke="#2563EB" stroke-width="1"/>
        <rect x="0" y="0" width="230" height="30" rx="8" fill="#DBEAFE"/>
        <text x="115" y="20" class="module-title" fill="#1E40AF">输入适配层</text>

        <!-- Components -->
        <g transform="translate(100, 55)">
            <text x="0" y="0" class="tech-text" text-anchor="start" font-weight="bold">工具栈 (Tools):</text>
            <text x="10" y="20" class="tech-text" text-anchor="start">• 多模态: Whisper / ViT</text>
            <text x="10" y="40" class="tech-text" text-anchor="start">• RAG: Vector Store / BM25</text>
            <text x="10" y="60" class="tech-text" text-anchor="start">• Prompt: Jinja2 Templates</text>

            <text x="0" y="90" class="tech-text" text-anchor="start" font-weight="bold">数据结构 (Data):</text>
            <text x="10" y="110" class="tech-text" text-anchor="start">• ChatHistory List</text>
            <text x="10" y="130" class="tech-text" text-anchor="start">• Context Window Object</text>
        </g>
    </g>

    <!-- 2. Decision Engine -->
    <g transform="translate(300, 60)">
        <rect x="0" y="0" width="230" height="200" rx="8" fill="white" stroke="#FACC15" stroke-width="1"/>
        <rect x="0" y="0" width="230" height="30" rx="8" fill="#FEF9C3"/>
        <text x="115" y="20" class="module-title" fill="#B45309">决策与控制层</text>

        <!-- Components -->
        <g transform="translate(100, 55)">
            <text x="0" y="0" class="tech-text" text-anchor="start" font-weight="bold">工具栈 (Tools):</text>
            <text x="10" y="20" class="tech-text" text-anchor="start">• 路由: Semantic Router</text>
            <text x="10" y="40" class="tech-text" text-anchor="start">• 编排: LangGraph / FSM</text>
            <text x="10" y="60" class="tech-text" text-anchor="start">• 规划: ReAct Planner</text>

            <text x="0" y="90" class="tech-text" text-anchor="start" font-weight="bold">数据结构 (Data):</text>
            <text x="10" y="110" class="tech-text" text-anchor="start">• Plan JSON Schema</text>
            <text x="10" y="130" class="tech-text" text-anchor="start">• State Graph Node</text>
        </g>
    </g>

    <!-- 3. Execution Env -->
    <g transform="translate(550, 60)">
        <rect x="0" y="0" width="230" height="200" rx="8" fill="white" stroke="#059669" stroke-width="1"/>
        <rect x="0" y="0" width="230" height="30" rx="8" fill="#DCFCE7"/>
        <text x="115" y="20" class="module-title" fill="#065F46">执行与副作用层</text>

        <!-- Components -->
        <g transform="translate(100, 55)">
            <text x="0" y="0" class="tech-text" text-anchor="start" font-weight="bold">工具栈 (Tools):</text>
            <text x="10" y="20" class="tech-text" text-anchor="start">• 沙箱: Docker / E2B</text>
            <text x="10" y="40" class="tech-text" text-anchor="start">• 接口: OpenAPI / Swagger</text>
            <text x="10" y="60" class="tech-text" text-anchor="start">• 审批: Human-in-loop UI</text>

            <text x="0" y="90" class="tech-text" text-anchor="start" font-weight="bold">数据结构 (Data):</text>
            <text x="10" y="110" class="tech-text" text-anchor="start">• Tool Output JSON</text>
            <text x="10" y="130" class="tech-text" text-anchor="start">• Error Trace Logs</text>
        </g>
    </g>

    <!-- 4. Feedback System -->
    <g transform="translate(800, 60)">
        <rect x="0" y="0" width="230" height="200" rx="8" fill="white" stroke="#A855F7" stroke-width="1"/>
        <rect x="0" y="0" width="230" height="30" rx="8" fill="#F3E8FF"/>
        <text x="115" y="20" class="module-title" fill="#6B21A8">反馈与记忆层</text>

        <!-- Components -->
        <g transform="translate(100, 55)">
            <text x="0" y="0" class="tech-text" text-anchor="start" font-weight="bold">工具栈 (Tools):</text>
            <text x="10" y="20" class="tech-text" text-anchor="start">• 评估: LLM-as-a-Judge</text>
            <text x="10" y="40" class="tech-text" text-anchor="start">• 追踪: LangSmith / Phoenix</text>
            <text x="10" y="60" class="tech-text" text-anchor="start">• 记忆: Vector DB (Write)</text>

            <text x="0" y="90" class="tech-text" text-anchor="start" font-weight="bold">数据结构 (Data):</text>
            <text x="10" y="110" class="tech-text" text-anchor="start">• Evaluation Report</text>
            <text x="10" y="130" class="tech-text" text-anchor="start">• Experience Embedding</text>
        </g>
    </g>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="650" class="tech-text" fill="#94A3B8">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>
</svg>
