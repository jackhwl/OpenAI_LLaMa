<!--
  文件名：module-03-agent-as-second-brain.svg
  图表名称：未来趋势：Agent 行动计划与可执行的第二大脑
  描述：展示从“静态知识存储”向“可执行能力库”的范式转移，以及 Agent 如何利用行动计划连接两者。

  核心逻辑：
  1. 左侧 (Static): 传统的第二大脑，存储静态信息 (Notes, Docs)。
  2. 中间 (Agent): 智能体核心，负责意图理解与任务拆解 (Planning)。
  3. 右侧 (Executable): 未来的第二大脑，存储可执行能力 (Prompts, Tools, Scripts)。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }
      .box-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .item-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: normal; text-anchor: left; fill: #4B5563; }
      .action-label { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">智能体作可执行的第二大脑趋势</text>
  <text x="600" y="80" class="sub-title">范式转移：从“存储信息 (Information Storage)”到“封装能力 (Capability Encapsulation)”</text>

  <!-- ================================================================================== -->
  <!-- 左侧：静态第二大脑 (Static Second Brain) -->
  <!-- ================================================================================== -->
  <g transform="translate(40, 150)">
    <!-- 背景框 -->
    <rect x="0" y="0" width="280" height="400" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- 标题 -->
    <rect x="0" y="0" width="280" height="50" rx="12" fill="#E5E7EB" stroke="none"/>
    <path d="M 0 50 L 280 50" stroke="#9CA3AF" stroke-width="1"/>
    <text x="140" y="32" class="box-title" fill="#374151">静态第二大脑</text>

    <!-- 内容图标：文档堆叠 -->
    <g transform="translate(140, 100)">
        <rect x="-40" y="-50" width="80" height="100" rx="4" fill="white" stroke="#9CA3AF" stroke-width="1.5"/>
        <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#E5E7EB" stroke-width="2"/>
        <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#E5E7EB" stroke-width="2"/>
        <line x1="-30" y1="10" x2="10" y2="10" stroke="#E5E7EB" stroke-width="2"/>

        <rect x="-35" y="-45" width="80" height="100" rx="4" fill="white" stroke="#6B7280" stroke-width="1.5" transform="rotate(5)"/>
        <text x="0" y="15" text-anchor="middle" font-size="24" transform="rotate(5)">📄</text>
    </g>

    <!-- 列表项 -->
    <g transform="translate(140, 200)">
        <text x="0" y="0" class="item-text" fill="#4B5563">Markdown 笔记</text>
        <text x="0" y="25" class="item-text" fill="#4B5563">PDF 文档 / 网页</text>
        <text x="0" y="50" class="item-text" fill="#4B5563">碎片化想法</text>
    </g>

    <!-- 核心交互模式 -->
    <rect x="40" y="300" width="200" height="60" rx="30" fill="#E5E7EB"/>
    <text x="140" y="325" class="item-text" fill="#374151">交互模式：</text>
    <text x="80" y="345" class="desc-text">阅读 (Read) / 检索 (Search)</text>
eft
    <!-- 标签 -->
    <text x="90" y="385" class="desc-text" font-style="italic">"只读的知识库"</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 中间：Agent 智能体 (The Bridge) -->
  <!-- ================================================================================== -->
  <g transform="translate(420, 120)">
    <!-- 巨大的处理引擎 -->
    <rect x="0" y="0" width="360" height="460" rx="16" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="3"/>

    <!-- 标题 -->
    <text x="180" y="40" class="box-title" fill="#6B21A8">Agent (智能体)</text>
    <text x="180" y="60" class="desc-text" fill="#7C3AED">意图理解与任务编排</text>

    <!-- 1. 感知 (Perceive) -->
    <g transform="translate(180, 110)">
        <circle cx="0" cy="0" r="30" fill="white" stroke="#A855F7" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" font-size="20">👁️</text>
        <text x="70" y="5" class="item-text" text-anchor="start" fill="#6B21A8">感知意图</text>
    </g>

    <!-- 连接线 -->
    <line x1="180" y1="140" x2="180" y2="180" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- 2. 规划 (Plan) - 核心 -->
    <g transform="translate(60, 180)">
        <rect x="0" y="0" width="240" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/>
        <text x="120" y="25" class="item-text" fill="#6B21A8">行动计划 (Action Plan)</text>

        <!-- 思维链展示 -->
        <line x1="30" y1="50" x2="30" y2="100" stroke="#E9D5FF" stroke-width="2"/>

        <circle cx="30" cy="50" r="4" fill="#8B5CF6"/>
        <text x="45" y="55" class="desc-text" text-anchor="start">Step 1: 检索资料</text>

        <circle cx="30" cy="75" r="4" fill="#8B5CF6"/>
        <text x="45" y="80" class="desc-text" text-anchor="start">Step 2: 调用分析工具</text>

        <circle cx="30" cy="100" r="4" fill="#8B5CF6"/>
        <text x="45" y="105" class="desc-text" text-anchor="start">Step 3: 生成报告</text>
    </g>

    <!-- 连接线 -->
    <line x1="180" y1="300" x2="180" y2="340" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>

    <!-- 3. 行动 (Act) -->
    <g transform="translate(180, 370)">
        <circle cx="0" cy="0" r="30" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2"/>
        <text x="0" y="5" text-anchor="middle" font-size="20" fill="white">⚡</text>
        <text x="70" y="5" class="item-text" text-anchor="start" fill="#6B21A8">执行操作</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 右侧：可执行第二大脑 (Executable Second Brain) -->
  <!-- ================================================================================== -->
  <g transform="translate(880, 150)">
    <!-- 背景框 -->
    <rect x="0" y="0" width="280" height="400" rx="12" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>

    <!-- 标题 -->
    <rect x="0" y="0" width="280" height="50" rx="12" fill="#DCFCE7" stroke="none"/>
    <path d="M 0 50 L 280 50" stroke="#34D399" stroke-width="1"/>
    <text x="140" y="32" class="box-title" fill="#065F46">可执行第二大脑</text>

    <!-- 内容图标：工具箱 -->
    <g transform="translate(140, 100)">
        <rect x="-40" y="-30" width="80" height="60" rx="4" fill="white" stroke="#34D399" stroke-width="1.5"/>
        <path d="M -40 -10 L 40 -10" stroke="#86EFAC" stroke-width="1"/>
        <rect x="-10" y="-35" width="20" height="10" rx="2" fill="#34D399"/>
        <text x="0" y="10" text-anchor="middle" font-size="24">🧰</text>
    </g>

    <!-- 列表项 (封装的能力) -->
    <g transform="translate(140, 180)">
        <!-- 能力 1 -->
        <rect x="-100" y="0" width="200" height="30" rx="4" fill="white" stroke="#86EFAC"/>
        <text x="0" y="20" class="item-text" fill="#059669">Prompt 模版 (SOP)</text>

        <!-- 能力 2 -->
        <rect x="-100" y="40" width="200" height="30" rx="4" fill="white" stroke="#86EFAC"/>
        <text x="0" y="60" class="item-text" fill="#059669">Python 脚本 / Tools</text>

        <!-- 能力 3 -->
        <rect x="-100" y="80" width="200" height="30" rx="4" fill="white" stroke="#86EFAC"/>
        <text x="0" y="100" class="item-text" fill="#059669">API 接口配置</text>
    </g>

    <!-- 核心交互模式 -->
    <rect x="40" y="300" width="200" height="60" rx="30" fill="#34D399"/>
    <text x="140" y="325" class="item-text" fill="white">交互模式：</text>
    <text x="80" y="345" class="desc-text" fill="white">调用 (Invoke) / 运行 (Run)</text>

    <!-- 标签 -->
    <text x="100" y="385" class="desc-text" fill="#065F46" font-style="italic">"可行动的能力库"</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 连接与三个卡片之间的间距为50个单位流向 -->
  <!-- ================================================================================== -->

  <!-- 1. 左 -> 中 (读取上下文) -->
  <g transform="translate(320, 250)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-gray)"/>
    <text x="20" y="-10" class="desc-text">提取上下文</text>
  </g>

  <!-- 2. 中 -> 右 (调用能力) -->
  <g transform="translate(780, 250)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="20" y="-10" class="desc-text" font-weight="bold" fill="#7C3AED">调用工具</text>
  </g>

  <!-- 3. 底部大箭头 (进化方向) -->
  <g transform="translate(40, 620)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#E5E7EB" stroke-width="4"/>
    <polygon points="1120,0 1110,-5 1110,5" fill="#E5E7EB"/>

    <text x="560" y="30" text-anchor="middle" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#6B7280">
      进化方向：从“知识的搬运工”到“解决问题的执行者”
    </text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="700" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
