<!--
  ================================================================================
  图表名称：基于 MCP 的多智能体系统架构参考设计
  文件命名：module-07-mcp-architecture-reference.svg
  描述：
    展示 MCP 如何作为多智能体系统的标准化底层架构：
    1. 上层 (Host/Runtime): 多智能体协作层 (Blue)，包含 Router, Planner, Executor，共享 MCP Client。
    2. 中层 (Protocol): JSON-RPC 通信层 (Yellow)，标准化上下文注入 (Context Injection)。
    3. 下层 (Servers): 分布式能力层 (Green)，包含 Memory, File, DB, Web 等独立服务。
  SPDX-License-Identifier: MIT AND CC-BY-4.0
  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  ================================================================================
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- ========================================================================= -->
  <!-- DEFINITIONS & STYLES -->
  <!-- ========================================================================= -->
  <defs>
    <style>
      /* 全局字体 */
      .font-sans { font-family: 'Noto Sans', sans-serif; }

      /* 文本样式 */
      .title-main { font-size: 24px; font-weight: 800; fill: #111827; }
      .title-sub { font-size: 16px; font-weight: 400; fill: #6B7280; }

      .text-head { font-size: 16px; font-weight: 700; }
      .text-label { font-size: 14px; font-weight: 600; }
      .text-body { font-size: 12px; font-weight: 400; }
      .text-small { font-size: 11px; font-weight: 400; }
      .text-icon { font-size: 20px; }

      /* 颜色定义 */
      /* Host / Runtime (Blue) */
      .box-host { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .box-agent { fill: #FFFFFF; stroke: #3B82F6; stroke-width: 2px; }
      .box-client { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1px; }
      .text-host { fill: #1E40AF; }

      /* Protocol (Yellow) */
      .box-protocol { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 2px; stroke-dasharray: 8,4; }
      .text-protocol { fill: #B45309; }
      .line-protocol { stroke: #F59E0B; stroke-width: 2px; stroke-dasharray: 4,2; }

      /* Server (Green) */
      .box-server { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .box-cap { fill: #FFFFFF; stroke: #34D399; stroke-width: 1px; }
      .text-server { fill: #065F46; }

      /* Connectors */
      .conn-main { stroke: #111827; stroke-width: 2px; }
      .conn-bus { stroke: #111827; stroke-width: 3px; }
    </style>

    <!-- Markers -->
    <marker id="arrow-main" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
    <marker id="arrow-protocol" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- Header -->
  <!-- ========================================================================= -->
  <text x="600" y="50" class="font-sans title-main" text-anchor="middle">
    基于MCP的多智能体系统架构参考设计
  </text>
  <text x="600" y="80" class="font-sans title-sub" text-anchor="middle">
    Reference Architecture: Multi-Agent Runtime on Model Context Protocol
  </text>

  <!-- ========================================================================= -->
  <!-- TOP LAYER: HOST / RUNTIME -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 120)">
    <!-- Main Container -->
    <rect x="0" y="0" width="1000" height="300" rx="16" class="box-host"/>

    <!-- Title -->
    <text x="30" y="40" class="font-sans text-head text-host">Host Application (Agent Runtime)</text>
    <text x="950" y="40" class="font-sans text-body text-host" text-anchor="end">Environment: Local / Cloud Container</text>

    <!-- Input -->
    <g transform="translate(-60, 120)">
      <circle cx="30" cy="30" r="30" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
      <text x="30" y="35" class="font-sans text-label" text-anchor="middle" fill="#374151">User</text>
      <line x1="60" y1="30" x2="90" y2="30" class="conn-main" marker-end="url(#arrow-main)"/>
    </g>

    <!-- Agents Cluster -->
    <g transform="translate(50, 70)">
      <!-- Router -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="120" height="60" rx="8" class="box-agent"/>
        <text x="60" y="35" class="font-sans text-label text-host" text-anchor="middle">Router</text>
      </g>

      <!-- Connections -->
      <path d="M 120 80 L 180 80" class="conn-main"/>
      <path d="M 180 40 L 180 120" class="conn-main"/>

      <!-- Planner -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="140" height="70" rx="8" class="box-agent"/>
        <text x="70" y="30" class="font-sans text-label text-host" text-anchor="middle">Planner</text>
        <text x="70" y="50" class="font-sans text-small text-host" text-anchor="middle">任务拆解</text>
      </g>

      <!-- Executor -->
      <g transform="translate(220, 90)">
        <rect x="0" y="0" width="140" height="70" rx="8" class="box-agent"/>
        <text x="70" y="30" class="font-sans text-label text-host" text-anchor="middle">Executor</text>
        <text x="70" y="50" class="font-sans text-small text-host" text-anchor="middle">代码/操作</text>
      </g>

      <!-- Connectors to Client -->
      <line x1="360" y1="35" x2="400" y2="35" class="conn-main" stroke-dasharray="4,2"/>
      <line x1="360" y1="125" x2="400" y2="125" class="conn-main" stroke-dasharray="4,2"/>
      <path d="M 400 35 L 400 125" class="conn-main" stroke-dasharray="4,2"/>
      <line x1="400" y1="80" x2="440" y2="80" class="conn-main" marker-end="url(#arrow-main)"/>
    </g>

    <!-- MCP Client Module -->
    <g transform="translate(500, 60)">
      <rect x="0" y="0" width="450" height="200" rx="12" class="box-client"/>
      <text x="225" y="30" class="font-sans text-head text-host" text-anchor="middle">Shared MCP Client Integration</text>

      <!-- Context Assembly -->
      <g transform="translate(50, 60)">
        <rect x="0" y="0" width="350" height="40" rx="4" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1"/>
        <text x="175" y="25" class="font-sans text-label text-host" text-anchor="middle">Context Assembler (Prompt Injection)</text>
      </g>

      <!-- Tool Registry -->
      <g transform="translate(50, 110)">
        <rect x="0" y="0" width="350" height="40" rx="4" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1"/>
        <text x="175" y="25" class="font-sans text-label text-host" text-anchor="middle">Dynamic Tool Registry</text>
      </g>

      <!-- Connection Manager -->
      <g transform="translate(50, 160)">
        <rect x="0" y="0" width="350" height="20" rx="2" fill="#3B82F6"/>
        <text x="175" y="14" class="font-sans text-small" fill="#FFFFFF" text-anchor="middle">Connection Transport (Stdio / SSE)</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- MIDDLE LAYER: PROTOCOL BUS -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 440)">
    <!-- Bus Line -->
    <line x1="50" y1="0" x2="950" y2="0" class="conn-bus"/>

    <!-- Protocol Label -->
    <rect x="420" y="-15" width="200" height="30" rx="15" class="box-protocol"/>
    <text x="520" y="5" class="font-sans text-label text-protocol" text-anchor="middle">JSON-RPC 2.0 Protocol</text>

    <!-- Downward Connections (Servers) -->
    <line x1="160" y1="0" x2="160" y2="60" class="conn-main" marker-end="url(#arrow-main)"/>
    <line x1="400" y1="0" x2="400" y2="60" class="conn-main" marker-end="url(#arrow-main)"/>
    <line x1="640" y1="0" x2="640" y2="60" class="conn-main" marker-end="url(#arrow-main)"/>
    <line x1="880" y1="0" x2="880" y2="60" class="conn-main" marker-end="url(#arrow-main)"/>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM LAYER: SERVERS -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 520)">

    <!-- Server 1: Memory -->
    <g transform="translate(60, 0)">
      <rect x="0" y="0" width="200" height="140" rx="8" class="box-server"/>
      <text x="100" y="30" class="font-sans text-head text-server" text-anchor="middle">🧠 Memory</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Resource: User Profile</text>
      </g>
      <g transform="translate(20, 85)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Tool: save_insight()</text>
      </g>
    </g>

    <!-- Server 2: Filesystem -->
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="200" height="140" rx="8" class="box-server"/>
      <text x="100" y="30" class="font-sans text-head text-server" text-anchor="middle">📂 Filesystem</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Resource: ./project/*</text>
      </g>
      <g transform="translate(20, 85)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Tool: write_file()</text>
      </g>
    </g>

    <!-- Server 3: Database -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="200" height="140" rx="8" class="box-server"/>
      <text x="100" y="30" class="font-sans text-head text-server" text-anchor="middle">🗄️ Database</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Resource: Schema</text>
      </g>
      <g transform="translate(20, 85)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Tool: run_sql()</text>
      </g>
    </g>

    <!-- Server 4: Web/Search -->
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="200" height="140" rx="8" class="box-server"/>
      <text x="100" y="30" class="font-sans text-head text-server" text-anchor="middle">🌐 Web/Search</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Resource: Search Log</text>
      </g>
      <g transform="translate(20, 85)">
        <rect x="0" y="0" width="160" height="25" rx="4" class="box-cap"/>
        <text x="80" y="17" class="font-sans text-small text-server" text-anchor="middle">Tool: fetch_url()</text>
      </g>
    </g>

  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER -->
  <!-- ========================================================================= -->
  <g transform="translate(100, 700)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#E5E7EB" stroke-width="2"/>
    <text x="0" y="30" class="font-sans text-label" fill="#111827">核心优势 (Core Benefits):</text>

    <g transform="translate(200, 15)">
      <circle cx="0" cy="10" r="4" fill="#3B82F6"/>
      <text x="15" y="15" class="font-sans text-body" fill="#374151">通用性：一套 Prompt 和工具可被 Planner 和 Executor 复用</text>
    </g>

    <g transform="translate(600, 15)">
      <circle cx="0" cy="10" r="4" fill="#10B981"/>
      <text x="15" y="15" class="font-sans text-body" fill="#374151">扩展性：新增 Server 无需修改 Host 代码</text>
    </g>
  </g>

  <!-- License -->
  <text x="600" y="780" class="font-sans text-body" fill="#64748B" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
