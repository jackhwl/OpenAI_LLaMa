<!--
  文件名：module-05-single-turn-vs-agent-system.svg
  图表名称：单轮生成 vs 智能体系统对比图
  描述：对比传统 LLM 的“单轮生成”模式与 Agent 的“持续系统”模式，揭示智能体在时间连续性、状态记忆与环境反馈上的本质差异。

  核心对比：
  1. 左侧 (Single-Turn): 线性、瞬时、无状态 (Function)。
  2. 右侧 (Agent): 循环、持续、有状态 (System)。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .panel-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .label-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
      .desc-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }

      /* 区域背景 */
      .panel-bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2px; rx: 12; }
      .highlight-bg { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 8; }

      /* 节点样式 */
      .node-box { fill: white; stroke: #94A3B8; stroke-width: 2px; rx: 6; }
      .node-agent { fill: white; stroke: #059669; stroke-width: 2px; rx: 50%; }

      /* 连接线 */
      .flow-line { fill: none; stroke: #94A3B8; stroke-width: 2px; marker-end: url(#arrow-gray); }
      .agent-loop { fill: none; stroke: #059669; stroke-width: 3px; marker-end: url(#arrow-green); }
      .feedback-line { fill: none; stroke: #F59E0B; stroke-width: 2px; stroke-dasharray: 4,4; marker-end: url(#arrow-yellow); }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#059669"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">单轮生成 vs 智能体系统</text>
  <text x="600" y="80" class="sub-title">范式对比：瞬时的“函数调用” vs 持续的“生命周期”</text>

  <!-- ================================================================================== -->
  <!-- 左侧：单轮生成 (Single-Turn Generation) -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="450" height="400" class="panel-bg"/>
    <text x="225" y="40" class="panel-title" fill="#64748B">单轮生成 (Chatbot)</text>

    <!-- 流程图 -->
    <g transform="translate(50, 120)">
        <!-- Input -->
        <rect x="0" y="20" width="80" height="40" class="node-box"/>
        <text x="40" y="45" class="label-text" fill="#475569">Prompt</text>

        <!-- LLM -->
        <rect x="130" y="0" width="100" height="80" class="node-box" stroke="#2563EB"/>
        <text x="180" y="45" class="label-text" fill="#2563EB">LLM</text>
        <text x="180" y="65" class="desc-text">(Stateless)</text>

        <!-- Output -->
        <rect x="280" y="20" width="80" height="40" class="node-box"/>
        <text x="320" y="45" class="label-text" fill="#475569">Response</text>

        <!-- Arrows -->
        <line x1="80" y1="40" x2="130" y2="40" class="flow-line"/>
        <line x1="230" y1="40" x2="280" y2="40" class="flow-line"/>
    </g>

    <!-- 时间轴隐喻 -->
    <g transform="translate(50, 280)">
        <line x1="0" y1="0" x2="360" y2="0" stroke="#E2E8F0" stroke-width="2"/>
        <text x="360" y="5" font-size="10" fill="#94A3B8" text-anchor="start">Time</text>

        <!-- 脉冲 -->
        <path d="M 50 0 L 55 -20 L 60 0" fill="none" stroke="#2563EB" stroke-width="2"/>
        <text x="55" y="20" class="desc-text">T1</text>

        <path d="M 200 0 L 205 -20 L 210 0" fill="none" stroke="#2563EB" stroke-width="2"/>
        <text x="205" y="20" class="desc-text">T2</text>

        <text x="180" y="50" class="desc-text" font-style="italic">每次交互都是独立的，T2 不知道 T1 发生了什么</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 右侧：智能体系统 (Agent System) -->
  <!-- ================================================================================== -->
  <g transform="translate(650, 120)">
    <rect x="0" y="0" width="450" height="400" class="panel-bg" stroke="#059669"/>
    <text x="225" y="40" class="panel-title" fill="#059669">智能体系统 (Agent)</text>

    <!-- Agent Core Loop -->
    <g transform="translate(225, 180)">
        <!-- Center Brain -->
        <circle cx="0" cy="0" r="40" class="node-agent"/>
        <text x="0" y="5" class="label-text" fill="#059669">Agent</text>

        <!-- Loop Arrows -->
        <path d="M 0 -60 A 60 60 0 1 1 -1 -60" class="agent-loop" fill="none"/>

        <!-- Loop Nodes -->
        <rect x="-25" y="-100" width="50" height="24" rx="4" fill="white" stroke="#059669"/>
        <text x="0" y="-84" class="desc-text" font-weight="bold" fill="#059669">Act</text>

        <rect x="70" y="-12" width="60" height="24" rx="4" fill="white" stroke="#059669"/>
        <text x="100" y="4" class="desc-text" font-weight="bold" fill="#059669">Observe</text>

        <rect x="-30" y="76" width="60" height="24" rx="4" fill="white" stroke="#059669"/>
        <text x="0" y="92" class="desc-text" font-weight="bold" fill="#059669">Reflect</text>

        <rect x="-130" y="-12" width="60" height="24" rx="4" fill="white" stroke="#059669"/>
        <text x="-100" y="4" class="desc-text" font-weight="bold" fill="#059669">Plan</text>
    </g>

    <!-- External Components -->
    <g transform="translate(225, 180)">
        <!-- Memory -->
        <rect x="-160" y="100" width="80" height="60" rx="6" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>
        <text x="-120" y="125" class="label-text" fill="#B45309">Memory</text>
        <text x="-120" y="145" class="desc-text">(State)</text>
        <!-- Link to Agent -->
        <path d="M -120 100 L -40 40" class="feedback-line"/>

        <!-- Environment/Tools -->
        <rect x="80" y="100" width="80" height="60" rx="6" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>
        <text x="120" y="125" class="label-text" fill="#6B21A8">Env/Tools</text>
        <text x="120" y="145" class="desc-text">(Feedback)</text>
        <!-- Link to Agent -->
        <path d="M 120 100 L 40 40" class="feedback-line"/>
    </g>

    <text x="225" y="370" class="desc-text" fill="#059669" font-weight="bold">持续循环，直到目标达成</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部：维度对比表格 -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 550)">
    <rect x="0" y="0" width="1000" height="100" rx="0" fill="none"/>
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#E2E8F0" stroke-width="2"/>

    <!-- 标题行 -->
    <text x="100" y="30" class="label-text" fill="#64748B">维度</text>
    <text x="350" y="30" class="label-text" fill="#64748B">单轮生成 (LLM)</text>
    <text x="800" y="30" class="label-text" fill="#64748B">智能体 (Agent)</text>

    <!-- 时间 -->
    <text x="100" y="60" class="label-text" fill="#111827">时间属性</text>
    <text x="350" y="60" class="desc-text">瞬时 (Instant)</text>
    <text x="800" y="60" class="label-text" fill="#059669">持续 (Continuous)</text>

    <!-- 状态 -->
    <text x="100" y="85" class="label-text" fill="#111827">状态管理</text>
    <text x="350" y="85" class="desc-text">无状态 (Stateless)</text>
    <text x="800" y="85" class="label-text" fill="#059669">有记忆 (Stateful)</text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="680" class="desc-text" fill="#94A3B8">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
