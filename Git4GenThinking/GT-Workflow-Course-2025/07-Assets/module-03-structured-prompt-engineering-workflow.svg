<!--
  文件名：module-03-structured-prompt-engineering-workflow.svg
  图表名称：结构化提示工程流程系统架构图
  描述：展示结构化提示工程如何将模糊意图转化为机器可执行协议的完整闭环流程。

  核心模块：
  1. 阶段一：输入收集与意图解析（蓝色系）。
  2. 阶段二：结构化提示设计（绿色系）。
  3. 阶段三：生成与评估（黄色系，含反馈闭环）。
  4. 阶段四：可执行输出（粉色系）。
  5. 底部：八大核心组件详解。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  修改记录：
-->
<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
    </style>
    <!-- 蓝色箭头 -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <!-- 红色箭头 -->
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
    </marker>
    <!-- 蓝色小箭头 -->
    <marker id="smallArrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2563EB" />
    </marker>
    <!-- 粉色小箭头 (新增) -->
    <marker id="smallArrow-pink" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#EC4899" />
    </marker>
    <!-- 紫色小箭头 (新增) -->
    <marker id="smallArrow-purple" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- 主标题 -->
  <text x="600" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="22" font-weight="800" fill="#111827">
    结构化提示工程流程系统架构图
  </text>

  <!-- 副标题 -->
  <text x="600" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="16" font-weight="bold" fill="#374151">
    从模糊意图到可执行协议的完整工作流
  </text>

  <!-- ================================================================================== -->
  <!-- 阶段一：输入收集与意图解析 (x: 50, w: 200) -->
  <!-- ================================================================================== -->
  <rect x="50" y="150" width="200" height="180" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="150" y="180" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="16" font-weight="bold" fill="#111827">
    阶段一：输入收集
  </text>
  <text x="150" y="205" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#374151">
    模糊意图收集
  </text>
  <text x="150" y="225" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • 自然语言输入
  </text>
  <text x="150" y="245" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • 上下文信息
  </text>
  <text x="150" y="265" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • 业务需求
  </text>
  <text x="150" y="285" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • 约束条件
  </text>

  <!-- 意图解析模块 -->
  <rect x="100" y="300" width="100" height="40" rx="5" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="150" y="325" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#111827">
    意图解析
  </text>

  <!-- 箭头到第二阶段 (250 -> 300) -->
  <line x1="250" y1="240" x2="300" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="275" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    需求分析
  </text>

  <!-- ================================================================================== -->
  <!-- 第二阶段：结构化提示设计 (x: 300, w: 280) -->
  <!-- ================================================================================== -->
  <rect x="300" y="150" width="280" height="180" rx="10" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
  <text x="440" y="180" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="16" font-weight="bold" fill="#111827">
    阶段二：结构化设计
  </text>

  <!-- 结构化提示设计子模块 -->
  <rect x="320" y="200" width="70" height="50" rx="5" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="355" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#111827">
    角色定义
  </text>

  <rect x="405" y="200" width="70" height="50" rx="5" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="440" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#111827">
    格式约束
  </text>

  <rect x="490" y="200" width="70" height="50" rx="5" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="525" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#111827">
    示例引导
  </text>

  <rect x="360" y="260" width="160" height="50" rx="5" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
  <text x="440" y="290" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#111827">
    控制流设计
  </text>

  <!-- 箭头到第三阶段 (580 -> 630) -->
  <line x1="580" y1="240" x2="630" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="605" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    提示执行
  </text>

  <!-- ================================================================================== -->
  <!-- 第三阶段：生成与评估 (x: 630, w: 280) - 宽度缩小，布局调整 -->
  <!-- ================================================================================== -->
  <rect x="630" y="150" width="280" height="180" rx="10" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>
  <text x="770" y="180" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="16" font-weight="bold" fill="#111827">
    阶段三：生成与评估
  </text>

  <!-- 生成模块 (左) -->
  <rect x="650" y="200" width="80" height="50" rx="5" fill="#FFFFFF" stroke="#FACC15" stroke-width="1.5"/>
  <text x="690" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#111827">
    模型生成
  </text>

  <!-- 评估模块 (右) -->
  <rect x="810" y="200" width="80" height="50" rx="5" fill="#FFFFFF" stroke="#FACC15" stroke-width="1.5"/>
  <text x="850" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#111827">
    质量评估
  </text>

  <!-- 迭代模块 (中下) -->
  <rect x="720" y="270" width="100" height="40" rx="5" fill="#FFFFFF" stroke="#FACC15" stroke-width="1.5"/>
  <text x="770" y="295" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#111827">
    迭代优化
  </text>

  <!-- 反馈循环路径 (连接3个卡片，且不溢出) -->
  <!-- 路径：评估(底) -> 迭代(右) -> 迭代(左) -> 生成(底) -->
  <path d="M 850 250 Q 850 290 820 290" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>
  <path d="M 720 290 Q 690 290 690 250" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>

  <text x="770" y="265" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="10" fill="#DC2626" font-weight="bold">
    反馈闭环
  </text>

  <!-- 箭头到第四阶段 (910 -> 960) -->
  <line x1="910" y1="240" x2="960" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="935" y="230" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    输出部署
  </text>

  <!-- ================================================================================== -->
  <!-- 第四阶段：可执行输出 (x: 960, w: 200) - 确保不溢出 1200 -->
  <!-- ================================================================================== -->
  <rect x="960" y="150" width="200" height="180" rx="10" fill="#FCE7F3" stroke="#EC4899" stroke-width="2"/>
  <text x="1060" y="180" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="16" font-weight="bold" fill="#111827">
    阶段四：输出
  </text>
  <text x="1060" y="205" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#374151">
    可执行协议
  </text>
  <text x="1060" y="225" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • JSON格式输出
  </text>
  <text x="1060" y="245" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • API调用参数
  </text>
  <text x="1060" y="265" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • 结构化数据
  </text>
  <text x="1060" y="285" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#6B7280">
    • 自动化脚本
  </text>

  <!-- 输出示例 -->
  <rect x="1000" y="310" width="120" height="30" rx="5" fill="#FFFFFF" stroke="#EC4899" stroke-width="1"/>
  <text x="1060" y="330" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="10" fill="#111827">
    {"action": "execute"...}
  </text>

  <!-- 流程主线 (贯穿) -->
  <line x1="50" y1="420" x2="1160" y2="420" stroke="#64748B" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- 详细流程说明 (坐标相应左移) -->
  <!-- 1. 模糊意图收集 -->
  <g transform="translate(50, 450)">
    <circle cx="20" cy="20" r="15" fill="#3B82F6" stroke="#1E40AF" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">1</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">意图收集</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">自然语言输入</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">业务需求文档</text>
  </g>

  <!-- 2. 需求分析与拆解 -->
  <g transform="translate(180, 450)">
    <circle cx="20" cy="20" r="15" fill="#34D399" stroke="#059669" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">2</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">需求分析</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">识别关键需求</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">分解子任务</text>
  </g>

  <!-- 3. 提示词结构化设计 -->
  <g transform="translate(310, 450)">
    <circle cx="20" cy="20" r="15" fill="#60A5FA" stroke="#2563EB" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">3</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">提示设计</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">角色/格式/示例</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">控制流定义</text>
  </g>
ystem-architecture
  <!-- 4. 模型生成与执行 -->
  <g transform="translate(440, 450)">
    <circle cx="20" cy="20" r="15" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">4</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">模型生成</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">LLM推理</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">初始输出生成</text>
  </g>

  <!-- 5. 质量评估与验证 -->
  <g transform="translate(570, 450)">
    <circle cx="20" cy="20" r="15" fill="#FACC15" stroke="#EAB308" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">5</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">质量评估</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">格式/逻辑/事实</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">评分标准应用</text>
  </g>

  <!-- 6. 反馈与迭代优化 -->
  <g transform="translate(700, 450)">
    <circle cx="20" cy="20" r="15" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">6</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">迭代优化</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">基于反馈修正</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">提示词调优</text>
  </g>

  <!-- 7. 最终输出与部署 -->
  <g transform="translate(830, 450)">
    <circle cx="20" cy="20" r="15" fill="#EC4899" stroke="#BE185D" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">7</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">部署输出</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">可执行协议</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">系统集成</text>
  </g>

  <!-- 8. 监控与持续优化 -->
  <g transform="translate(960, 450)">
    <circle cx="20" cy="20" r="15" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2"/>
    <text x="20" y="25" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" font-weight="bold" fill="white">8</text>
    <text x="20" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" font-weight="bold" fill="#111827">监控优化</text>
    <text x="20" y="70" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">性能监控</text>
    <text x="20" y="85" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="11" fill="#374151">持续改进</text>
  </g>

  <!-- 流程连接线 (更新坐标) -->
  <line x1="35" y1="420" x2="155" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>
  <line x1="165" y1="420" x2="285" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>
  <line x1="295" y1="420" x2="415" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>
  <line x1="425" y1="420" x2="545" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>
  <line x1="555" y1="420" x2="675" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>
  <line x1="685" y1="420" x2="805" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>
  <line x1="815" y1="420" x2="935" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>
  <line x1="945" y1="420" x2="1065" y2="420" stroke="#2563EB" stroke-width="2" marker-end="url(#smallArrow)"/>

  <!-- 许可声明 -->
  <text x="600" y="600" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>
</svg>
