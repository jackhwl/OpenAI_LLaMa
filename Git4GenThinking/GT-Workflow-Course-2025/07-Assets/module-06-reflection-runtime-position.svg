<!--
  文件名：module-06-reflection-runtime-position.svg
  图表名称：反思在 Agent Runtime 中的位置图
  描述：展示 Reflect (反思) 模块在智能体运行时中的三个关键介入时机（失败后、完成后、周期性）及其与记忆和评估模块的闭环交互。

  核心逻辑：
  1. 介入时机：
     - Post-Failure (热修复): 任务失败 -> 反思原因 -> 立即重试。
     - Post-Success (冷沉淀): 任务成功 -> 总结经验 -> 存入长期记忆。
     - Periodic (系统维护): 闲时扫描 -> 优化策略 -> 更新全局配置。
  2. 数据流向: Reflect -> Memory (Write) -> Evaluate (Read next time).
  3. 核心差异: Log 是"发生了什么"，Reflection 是"为什么发生"以及"下次如何做得更好"。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .phase-label { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #6B7280; text-anchor: middle; }
      .box-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .box-desc { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: 400; fill: #4B5563; text-anchor: middle; }

      /* 模块背景 */
      .bg-runtime { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 2px; rx: 16; }
      .bg-reflect { fill: #F3E8FF; stroke: #A855F7; stroke-width: 2px; rx: 8; }
      .bg-process { fill: white; stroke: #94A3B8; stroke-width: 2px; rx: 8; }
      .bg-memory { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2px; rx: 8; }

      /* 连接线 */
      .flow-line { fill: none; stroke: #64748B; stroke-width: 2px; marker-end: url(#arrow-gray); }
      .feedback-line { fill: none; stroke: #A855F7; stroke-width: 2px; marker-end: url(#arrow-purple); }
      .memory-line { fill: none; stroke: #2563EB; stroke-width: 2px; stroke-dasharray: 4,4; marker-end: url(#arrow-blue); }

      /* 状态指示 */
      .status-fail { fill: #FEE2E2; stroke: #EF4444; }
      .status-success { fill: #DCFCE7; stroke: #059669; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#64748B"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#A855F7"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">反思 (Reflect)在智能体运行时的位置</text>
  <text x="600" y="80" class="sub-title">反思的三种时机与认知闭环：失败即时修正、成功经验沉淀、周期性系统优化</text>

  <!-- ================================================================================== -->
  <!-- 主体框架：Runtime Timeline -->
  <!-- ================================================================================== -->
  <rect x="50" y="120" width="1100" height="450" class="bg-runtime"/>
  <text x="600" y="150" class="phase-label" font-size="16" fill="#374151">Agent Execution Timeline (执行时间轴)</text>

  <!-- 主流程线 -->
  <line x1="100" y1="350" x2="1100" y2="350" stroke="#E5E7EB" stroke-width="4"/>

  <!-- ================================================================================== -->
  <!-- 上半部分：核心流程 (Process) -->
  <!-- ================================================================================== -->

  <!-- 1. Task Start -->
  <g transform="translate(100, 310)">
    <circle cx="0" cy="40" r="10" fill="#374151"/>
    <text x="0" y="10" class="box-title">Start</text>
  </g>

  <!-- 2. Evaluate (Decision) -->
  <g transform="translate(250, 310)">
    <rect x="-60" y="0" width="120" height="80" class="bg-process" stroke="#F59E0B"/>
    <text x="0" y="35" class="box-title" fill="#B45309">Evaluate</text>
    <text x="0" y="55" class="box-desc">规划与决策</text>
  </g>

  <!-- 3. Act (Execution) -->
  <g transform="translate(450, 310)">
    <rect x="-60" y="0" width="120" height="80" class="bg-process" stroke="#059669"/>
    <text x="0" y="35" class="box-title" fill="#047857">Act</text>
    <text x="0" y="55" class="box-desc">工具执行</text>
  </g>

  <!-- 4. Result Check -->
  <g transform="translate(650, 310)">
    <polygon points="0,0 60,40 0,80 -60,40" fill="white" stroke="#374151" stroke-width="2"/>
    <text x="0" y="45" class="box-title" font-size="12">Check</text>
  </g>

  <!-- 连接线 -->
  <path d="M 120 350 L 190 350" class="flow-line"/>
  <path d="M 310 350 L 390 350" class="flow-line"/>
  <path d="M 510 350 L 590 350" class="flow-line"/>

  <!-- ================================================================================== -->
  <!-- 下半部分：反思模块 (Reflection Modules) -->
  <!-- ================================================================================== -->

  <!-- Scenario A: Post-Failure (失败后即时反思) -->
  <g transform="translate(650, 450)">
    <!-- 路径：Check -> Fail -> Reflect -->
    <path d="M 0 -60 L 0 0" class="flow-line" stroke="#EF4444"/>
    <rect x="-20" y="-40" width="40" height="20" rx="4" fill="#FEE2E2"/>
    <text x="0" y="-26" class="box-desc" fill="#B91C1C" font-weight="bold">Fail</text>

    <rect x="-80" y="0" width="160" height="80" class="bg-reflect" fill="#FEE2E2" stroke="#EF4444"/>
    <text x="0" y="25" class="box-title" fill="#B91C1C">🔥 Hot Fix Reflect</text>
    <text x="0" y="45" class="box-desc">分析错误原因</text>
    <text x="0" y="65" class="box-desc">(Self-Correction)</text>

    <!-- 反馈回路：Reflect -> Evaluate (Retry) -->
    <path d="M -80 40 L -400 40 L -400 -60" class="feedback-line" stroke="#EF4444"/>
    <text x="-240" y="30" class="box-desc" fill="#EF4444" font-weight="bold">修正策略 &amp; 重试 (Retry)</text>
  </g>

  <!-- Scenario B: Post-Success (完成后经验沉淀) -->
  <g transform="translate(850, 310)">
    <!-- 路径：Check -> Success -> Reflect -->
    <path d="M -140 40 L -60 40" class="flow-line" stroke="#059669"/>
    <rect x="-120" y="25" width="40" height="20" rx="4" fill="#DCFCE7"/>
    <text x="-100" y="39" class="box-desc" fill="#047857" font-weight="bold">Pass</text>

    <rect x="-60" y="0" width="160" height="80" class="bg-reflect" fill="#DCFCE7" stroke="#059669"/>
    <text x="20" y="25" class="box-title" fill="#047857">🧊 Cold Store Reflect</text>
    <text x="20" y="45" class="box-desc">提炼成功模式</text>
    <text x="20" y="65" class="box-desc">(Summarization)</text>
  </g>

  <!-- Scenario C: Periodic (周期性系统优化) -->
  <g transform="translate(1000, 180)">
    <circle cx="0" cy="0" r="30" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>
    <text x="0" y="5" font-size="20" text-anchor="middle">⏰</text>

    <rect x="-80" y="40" width="160" height="80" class="bg-reflect" fill="#FEF9C3" stroke="#FACC15"/>
    <text x="0" y="65" class="box-title" fill="#B45309">🔄 Periodic Reflect</text>
    <text x="0" y="85" class="box-desc">闲时全局扫描</text>
    <text x="0" y="105" class="box-desc">(Optimization)</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 顶部：记忆系统 (Memory System) - 知识沉淀与调用 -->
  <!-- ================================================================================== -->
  <g transform="translate(250, 100)">
    <rect x="-100" y="0" width="900" height="80" class="bg-memory"/>
    <text x="350" y="25" class="box-title" fill="#1E40AF">🧠 Memory &amp; Knowledge Base</text>
    <text x="350" y="45" class="box-desc" fill="#1E40AF">Long-term Storage (Vector DB / Graph)</text>

    <!-- 写入流向 (Write) -->
    <!-- From Post-Success -->
    <path d="M 620 230 L 620 150 L 500 150 L 500 80" class="feedback-line" stroke-dasharray="4,4"/>
    <text x="560" y="140" class="box-desc" fill="#A855F7">写入经验 (SOP)</text>

    <!-- From Periodic -->
    <path d="M 750 180 L 750 80" class="feedback-line" stroke-dasharray="4,4"/>
    <text x="790" y="130" class="box-desc" fill="#A855F7">更新配置</text>

    <!-- 读取流向 (Read) -->
    <!-- To Evaluate -->
    <path d="M 0 80 L 0 230" class="memory-line"/>
    <text x="10" y="160" class="box-desc" fill="#2563EB">调用上下文</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部对比：反思 vs 日志 -->
  <!-- ================================================================================== -->
  <g transform="translate(300, 600)">
    <rect x="0" y="0" width="600" height="60" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
    <text x="300" y="25" class="box-title" fill="#374151">关键区分：</text>

    <text x="150" y="45" class="box-desc" text-anchor="middle">📋 <tspan font-weight="bold">Log (日志)</tspan>: 原始流水账 ("做了A，报错B")</text>
    <text x="450" y="45" class="box-desc" text-anchor="middle">💡 <tspan font-weight="bold">Reflection (反思)</tspan>: 认知结晶 ("A导致B，下次应做C")</text>

    <line x1="300" y1="10" x2="300" y2="50" stroke="#D1D5DB" stroke-width="1"/>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="700" class="box-desc" fill="#9CA3AF">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
