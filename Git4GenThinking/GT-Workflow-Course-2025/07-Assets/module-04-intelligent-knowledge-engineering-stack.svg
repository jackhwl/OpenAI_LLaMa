<!--
  文件名：module-04-intelligent-knowledge-engineering-stack.svg
  图表名称：智能知识工程（IKE）四层体系框架图
  描述：展示智能知识工程从底层数据到顶层运维的完整技术堆栈，明确 Prompt, RAG, Agent 的系统定位。

  核心层次：
  1. L4 运维层 (Ops): 系统保障 (CI/CD, Eval)。
  2. L3 智能体层 (Agent): 行动中枢 (Planning, Tools)。
  3. L2 交互层 (Interaction): 协议接口 (Prompt, Schema)。
  4. L1 数据层 (Data): 知识基座 (Git, Vector DB, Graph)。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  修改记录：
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
      .layer-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: start; }
      .layer-desc { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: normal; text-anchor: start; fill: #4B5563; }
      .module-text { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .tech-tag { font-family: 'Noto Sans', sans-serif; font-size: 10px; font-weight: normal; text-anchor: middle; fill: #6B7280; }

      /* 层次背景 */
      .layer-bg-1 { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; } /* Data - Blue */
      .layer-bg-2 { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; } /* Interaction - Green */
      .layer-bg-3 { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; } /* Agent - Yellow */
      .layer-bg-4 { fill: #F3E8FF; stroke: #A855F7; stroke-width: 2px; } /* Ops - Purple */
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-up" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" text-anchor="middle" font-family="Noto Sans" font-size="24" font-weight="800" fill="#111827">
    智能知识工程 (IKE) 四层体系框架
  </text>
  <text x="600" y="80" text-anchor="middle" font-family="Noto Sans" font-size="14" fill="#6B7280">
    从“数据存储”到“自主系统”的完整技术堆栈
  </text>

  <!-- 左侧：层次坐标轴 -->
  <line x1="100" y1="700" x2="100" y2="150" stroke="#E5E7EB" stroke-width="4" marker-end="url(#arrow-up)"/>
  <!-- 修改部分：使用 writing-mode: tb (top-to-bottom) 或 transform 实现竖向文本 -->
  <!-- 这里使用 transform rotate 更加通用 -->
  <text x="80" y="425" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#6B7280" font-weight="bold" transform="rotate(-90, 80, 425)">智能密度 / 系统复杂度</text>

  <!-- ================================================================================== -->
  <!-- L4: 运维层 (Ops Layer) - 顶部 -->
  <!-- ================================================================================== -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="900" height="120" rx="8" class="layer-bg-4"/>
    <text x="20" y="40" class="layer-title" fill="#6B21A8">L4. 运维层 (Knowledge Ops)</text>
    <text x="20" y="65" class="layer-desc">保障系统的稳定性、质量与持续进化</text>

    <!-- 模块 1: 持续集成 -->
    <g transform="translate(300, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#A855F7" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#6B21A8">CI/CD 流水线</text>
        <text x="80" y="60" class="tech-tag">GitHub Actions, Linting</text>
    </g>

    <!-- 模块 2: 评估体系 -->
    <g transform="translate(500, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#A855F7" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#6B21A8">质量评估 (Eval)</text>
        <text x="80" y="60" class="tech-tag">LLM-as-a-Judge, RAGAs</text>
    </g>

    <!-- 模块 3: 人机回环 -->
    <g transform="translate(700, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#A855F7" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#6B21A8">人机回环 (HITL)</text>
        <text x="80" y="60" class="tech-tag">Review, Approval</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- L3: 智能体层 (Agent Layer) -->
  <!-- ================================================================================== -->
  <g transform="translate(150, 290)">
    <rect x="0" y="0" width="900" height="120" rx="8" class="layer-bg-3"/>
    <text x="20" y="40" class="layer-title" fill="#B45309">L3. 智能体层 (Agent)</text>
    <text x="20" y="65" class="layer-desc">赋予系统自主规划与行动能力</text>

    <!-- 模块 1: 规划与推理 -->
    <g transform="translate(300, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#FACC15" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#B45309">规划 (Planning)</text>
        <text x="80" y="60" class="tech-tag">ReAct, COT, Reflection</text>
    </g>

    <!-- 模块 2: 工具使用 -->
    <g transform="translate(500, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#FACC15" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#B45309">工具 (Tools)</text>
        <text x="80" y="60" class="tech-tag">Function Call, APIs</text>
    </g>

    <!-- 模块 3: 多智能体 -->
    <g transform="translate(700, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#FACC15" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#B45309">编排 (Orchestration)</text>
        <text x="80" y="60" class="tech-tag">Multi-Agent System</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- L2: 交互层 (Interaction Layer) -->
  <!-- ================================================================================== -->
  <g transform="translate(150, 430)">
    <rect x="0" y="0" width="900" height="120" rx="8" class="layer-bg-2"/>
    <text x="20" y="40" class="layer-title" fill="#047857">L2. 交互层 (Protocol)</text>
    <text x="20" y="65" class="layer-desc">定义人与 AI 的沟通协议与接口</text>

    <!-- 模块 1: 结构化提示 -->
    <g transform="translate(300, 20)">
        <rect 目的与作用变成可视流程x="0" y="0" width="260" height="80" rx="4" fill="white" stroke="#34D399" stroke-width="1"/>
        <text x="130" y="35" class="module-text" fill="#047857">结构化提示 (Prompt)</text>
        <text x="130" y="60" class="tech-tag">Role, Context, Constraints (S.C.O.R.E)</text>
    </g>

    <!-- 模块 2: 输出协议 -->
    <g transform="translate(600, 20)">
        <rect x="0" y="0" width="260" height="80" rx="4" fill="white" stroke="#34D399" stroke-width="1"/>
        <text x="130" y="35" class="module-text" fill="#047857">数据协议 (Schema)</text>
        <text x="130" y="60" class="tech-tag">JSON Schema, Markdown, Pydantic</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- L1: 数据层 (Data Layer) - 底部 -->
  <!-- ================================================================================== -->
  <g transform="translate(150, 570)">
    <rect x="0" y="0" width="900" height="120" rx="8" class="layer-bg-1"/>
    <text x="20" y="40" class="layer-title" fill="#1E40AF">L1. 数据层 (Base)</text>
    <text x="20" y="65" class="layer-desc">知识的存储、版本管理与检索增强</text>

    <!-- 模块 1: 版本控制 -->
    <g transform="translate(300, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#60A5FA" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#1E40AF">知识即代码</text>
        <text x="80" y="60" class="tech-tag">Git, Atomic Commits</text>
    </g>

    <!-- 模块 2: 向量数据库 -->
    <g transform="translate(500, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#60A5FA" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#1E40AF">RAG 检索增强</text>
        <text x="80" y="60" class="tech-tag">Vector DB, Chunking</text>
    </g>

    <!-- 模块 3: 知识图谱 -->
    <g transform="translate(700, 20)">
        <rect x="0" y="0" width="160" height="80" rx="4" fill="white" stroke="#60A5FA" stroke-width="1"/>
        <text x="80" y="35" class="module-text" fill="#1E40AF">GraphRAG</text>
        <text x="80" y="60" class="tech-tag">Knowledge Graph</text>
    </g>目的与作用

  </g>

  <!-- 底部许可 -->
  <text x="600" y="750" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
