<!--
  ================================================================================
  图表名称：协议化协作的必要性：从“工具能力”到“系统责任”
  文件命名：module-07-protocol-necessity.svg
  描述：
    对比两种架构思维：
    1. 左侧 (以能力为中心): 关注点在“工具能做什么”，安全/治理责任分散在 Agent 代码中（混乱且高风险）。
    2. 右侧 (以责任为中心): 关注点在“系统如何治理”，安全/日志/权限下沉到 MCP 协议层（结构化且安全）。
  SPDX-License-Identifier: MIT AND CC-BY-4.0
  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  ================================================================================
-->
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" style="background-color: white;" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">协议化协作的必要性</title>
  <desc id="chart-desc">对比以能力为中心和以责任为中心两种 AI 架构模式的区别</desc>

  <!-- ========================================================================= -->
  <!-- 样式定义 -->
  <!-- ========================================================================= -->
  <defs>
    <style>
      .font-sans { font-family: 'Noto Sans SC', sans-serif; }

      /* 文本样式 */
      .title-main { font-size: 24px; font-weight: 800; fill: #111827; }
      .title-sub { font-size: 16px; font-weight: 400; fill: #6B7280; }

      .text-head { font-size: 18px; font-weight: 700; }
      .text-label { font-size: 14px; font-weight: 700; }
      .text-body { font-size: 12px; font-weight: 400; }
      .text-alert { font-size: 11px; font-weight: 700; fill: #B91C1C; }

      /* 左侧颜色 (混乱/陈旧) */
      .box-legacy { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 2px; stroke-dasharray: 4,2; }
      .text-legacy-title { fill: #4B5563; }
      .conn-risk { stroke: #EF4444; stroke-width: 2px; }

      /* 右侧颜色 (有序/现代) */
      .box-agent { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .box-tool { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .box-system { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 2px; }
      .box-module { fill: #FFFFFF; stroke: #F59E0B; stroke-width: 1px; }

      .text-agent { fill: #1E40AF; }
      .text-tool { fill: #065F46; }
      .text-system { fill: #B45309; }

      .conn-safe { stroke: #111827; stroke-width: 2px; }

      /* 分隔线 */
      .separator { stroke: #E5E7EB; stroke-width: 2px; stroke-dasharray: 8,4; }
    </style>

    <!-- 箭头标记 -->
    <marker id="arrow-risk" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-safe" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- 标题栏 -->
  <!-- ========================================================================= -->
  <text x="600" y="50" class="font-sans title-main" text-anchor="middle">
    协议化协作的必要性：从“工具能力”到“系统责任”
  </text>
  <text x="600" y="80" class="font-sans title-sub" text-anchor="middle">
    为何需要协议？从以能力为中心的架构转向以责任为中心的治理架构
  </text>

  <!-- ========================================================================= -->
  <!-- 左侧：以能力为中心 (传统集成模式) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 130)">
    <text x="250" y="30" class="font-sans text-head text-legacy-title" text-anchor="middle">
      1. 工具能力视角 (Capability)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#9CA3AF" text-anchor="middle">
      “我能做这件事吗？” (关注技术可行性)
    </text>

    <!-- 容器 -->
    <rect x="20" y="80" width="460" height="420" rx="16" class="box-legacy"/>

    <!-- Agent -->
    <g transform="translate(180, 100)">
      <rect x="0" y="0" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
      <text x="70" y="25" class="font-sans text-label text-legacy-title" text-anchor="middle">智能体 (Agent)</text>
      <text x="70" y="45" class="font-sans text-body" fill="#9CA3AF" text-anchor="middle">(持有 API 密钥)</text>
    </g>

    <!-- 直接连接 (高风险) -->
    <line x1="250" y1="160" x2="100" y2="280" class="conn-risk" marker-end="url(#arrow-risk)"/>
    <line x1="250" y1="160" x2="250" y2="280" class="conn-risk" marker-end="url(#arrow-risk)"/>
    <line x1="250" y1="160" x2="400" y2="280" class="conn-risk" marker-end="url(#arrow-risk)"/>

    <!-- 工具 -->
    <g transform="translate(40, 280)">
      <rect x="0" y="0" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">数据库</text>
      <!-- 风险标签 -->
      <text x="60" y="80" class="font-sans text-alert" text-anchor="middle">缺乏审计日志!</text>
    </g>

    <g transform="translate(190, 280)">
      <rect x="0" y="0" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">文件系统</text>
      <!-- 风险标签 -->
      <text x="60" y="80" class="font-sans text-alert" text-anchor="middle">权限过大!</text>
    </g>

    <g transform="translate(340, 280)">
      <rect x="0" y="0" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#6B7280" stroke-width="1"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">支付接口</text>
      <!-- 风险标签 -->
      <text x="60" y="80" class="font-sans text-alert" text-anchor="middle">缺乏确认机制!</text>
    </g>

    <!-- 负担总结 -->
    <g transform="translate(100, 390)">
      <text x="0" y="0" class="font-sans text-label" fill="#EF4444">治理责任负担：</text>
      <text x="0" y="20" class="font-sans text-body text-legacy-title">• 开发者必须手动编写日志代码</text>
      <text x="0" y="40" class="font-sans text-body text-legacy-title">• 鉴权逻辑硬编码在 Agent 业务中</text>
      <text x="0" y="60" class="font-sans text-body text-legacy-title">• 局部错误可能导致整体工作流崩溃</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 中间：分隔线 -->
  <!-- ========================================================================= -->
  <line x1="600" y1="150" x2="600" y2="550" class="separator"/>

  <!-- ========================================================================= -->
  <!-- 右侧：以责任为中心 (MCP 系统治理模式) -->
  <!-- ========================================================================= -->
  <g transform="translate(650, 130)">
    <text x="250" y="30" class="font-sans text-head text-system" text-anchor="middle">
      2. 系统责任视角 (Responsibility)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#60A5FA" text-anchor="middle">
      “我应该做这件事吗？” (关注系统治理)
    </text>

    <!-- Agent (解耦) -->
    <g transform="translate(180, 80)">
      <rect x="0" y="0" width="140" height="50" rx="6" class="box-agent"/>
      <text x="70" y="30" class="font-sans text-label text-agent" text-anchor="middle">Agent (表达意图)</text>
    </g>

    <!-- 系统层 (治理网关) -->
    <g transform="translate(50, 160)">
      <!-- Box -->
      <rect x="0" y="0" width="400" height="140" rx="12" class="box-system"/>
      <text x="200" y="25" class="font-sans text-label text-system" text-anchor="middle">MCP 系统层 (协议与治理核心)</text>

      <!-- 功能模块 -->
      <g transform="translate(30, 40)">
        <rect x="0" y="0" width="100" height="40" rx="4" class="box-module"/>
        <text x="50" y="25" class="font-sans text-body text-system" text-anchor="middle">🛡️ 访问控制</text>
      </g>
      <g transform="translate(150, 40)">
        <rect x="0" y="0" width="100" height="40" rx="4" class="box-module"/>
        <text x="50" y="25" class="font-sans text-body text-system" text-anchor="middle">📝 审计日志</text>
      </g>
      <g transform="translate(270, 40)">
        <rect x="0" y="0" width="100" height="40" rx="4" class="box-module"/>
        <text x="50" y="25" class="font-sans text-body text-system" text-anchor="middle">🚦 流量限制</text>
      </g>

      <g transform="translate(90, 90)">
        <rect x="0" y="0" width="220" height="30" rx="4" class="box-module" style="stroke-dasharray: 4,2"/>
        <text x="110" y="20" class="font-sans text-body text-system" text-anchor="middle">🔄 人机交互确认 (Human-in-the-loop)</text>
      </g>
    </g>

    <!-- 连接线 -->
    <line x1="250" y1="130" x2="250" y2="160" class="conn-safe" marker-end="url(#arrow-safe)"/>
    <line x1="120" y1="300" x2="120" y2="340" class="conn-safe" marker-end="url(#arrow-safe)"/>
    <line x1="250" y1="300" x2="250" y2="340" class="conn-safe" marker-end="url(#arrow-safe)"/>
    <line x1="380" y1="300" x2="380" y2="340" class="conn-safe" marker-end="url(#arrow-safe)"/>

    <!-- 工具 (受保护) -->
    <g transform="translate(60, 340)">
      <rect x="0" y="0" width="120" height="50" rx="6" class="box-tool"/>
      <text x="60" y="30" class="font-sans text-label text-tool" text-anchor="middle">数据库</text>
    </g>
    <g transform="translate(190, 340)">
      <rect x="0" y="0" width="120" height="50" rx="6" class="box-tool"/>
      <text x="60" y="30" class="font-sans text-label text-tool" text-anchor="middle">文件系统</text>
    </g>
    <g transform="translate(320, 340)">
      <rect x="0" y="0" width="120" height="50" rx="6" class="box-tool"/>
      <text x="60" y="30" class="font-sans text-label text-tool" text-anchor="middle">支付</text>
    </g>

    <!-- 优势总结 -->
    <g transform="translate(100, 420)">
      <text x="0" y="0" class="font-sans text-label text-system">系统性保证：</text>
      <text x="0" y="20" class="font-sans text-body text-legacy-title">• 安全由平台强制执行，而非依赖 Prompt</text>
      <text x="0" y="40" class="font-sans text-body text-legacy-title">• 所有行为可追踪 (具备可观测性)</text>
      <text x="0" y="60" class="font-sans text-body text-legacy-title">• 异常在协议层得到优雅处理</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 页脚 -->
  <!-- ========================================================================= -->
  <g transform="translate(150, 660)">
    <rect x="0" y="0" width="900" height="60" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="450" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">
      核心差异：从“靠 Agent 负责不把事情搞砸” 变为 “靠系统架构保证事情不会搞砸”
    </text>
  </g>

  <!-- 版权信息 -->
  <text x="600" y="760" class="font-sans text-body" fill="#64748B" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
