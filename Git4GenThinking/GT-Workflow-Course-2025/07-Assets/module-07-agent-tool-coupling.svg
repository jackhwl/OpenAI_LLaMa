<!--
  ================================================================================
  图表名称：多智能体与工具生态的天然耦合示意图
  文件命名：module-07-agent-tool-coupling.svg
  描述：
    展示 Agent 与 Tool 之间互补且必要的耦合关系：
    1. Agent (Cognitive Layer): 负责处理模糊性 (Ambiguity) 和意图 (Intent) - 蓝色系.
    2. Tool (Deterministic Layer): 负责处理确定性 (Determinism) 和执行 (Execution) - 绿色系.
    3. Coupling (Interface): 通过 Schema 与 Arguments 进行协议化对接.
  SPDX-License-Identifier: MIT AND CC-BY-4.0
  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  ================================================================================
-->
<svg width="1300" height="650" viewBox="0 0 1300 650" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- ========================================================================= -->
  <!-- DEFINITIONS & STYLES -->
  <!-- ========================================================================= -->
  <defs>
    <style>
      /* 全局字体 */
      .font-sans { font-family: 'Noto Sans', sans-serif; }

      /* 文本层级 */
      .title-main { font-size: 24px; font-weight: 800; fill: #111827; }
      .title-sub { font-size: 16px; font-weight: 400; fill: #6B7280; }
      .text-head { font-size: 18px; font-weight: 700; }
      .text-label-lg { font-size: 14px; font-weight: 700; }
      .text-label-md { font-size: 13px; font-weight: 700; }
      .text-body { font-size: 12px; }
      .text-xs { font-size: 11px; }

      /* 颜色通用类 */
      .fill-white { fill: #FFFFFF; }
      .fill-bg { fill: #F9FAFB; }
      .stroke-gray { stroke: #E5E7EB; stroke-width: 1px; }
      .text-dark { fill: #1F2937; }
      .text-gray { fill: #374151; }
      .text-light { fill: #6B7280; }
      .text-warn { fill: #B45309; }

      /* 左侧 Agent System (Blue) */
      .box-agent { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .text-agent-title { fill: #1E40AF; }
      .text-agent-sub { fill: #3B82F6; }
      .chip-agent { fill: #DBEAFE; }
      .text-agent-chip { fill: #1E3A8A; }
      .node-agent { fill: #FFFFFF; stroke: #3B82F6; stroke-width: 2px; }
      .text-agent-node { fill: #1E40AF; font-weight: bold; }
      .line-agent { stroke: #3B82F6; stroke-width: 2px; }

      /* 右侧 Tool Ecosystem (Green) */
      .box-tool { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .text-tool-title { fill: #065F46; }
      .text-tool-sub { fill: #10B981; }
      .chip-tool { fill: #DCFCE7; }
      .text-tool-chip { fill: #064E3B; }
      .node-tool { fill: #FFFFFF; stroke: #10B981; stroke-width: 2px; }
      .text-tool-node { fill: #047857; font-weight: bold; }

      /* 中间 Coupling (Yellow) */
      .box-coupling { fill: #FEF9C3; stroke: #FACC15; stroke-width: 3px; stroke-dasharray: 8,4; }
      .box-interface { fill: #FFFFFF; stroke: #F59E0B; stroke-width: 1px; }
      .text-coupling-title { fill: #B45309; }
      .text-interface-title { fill: #92400E; }
      .line-interface { stroke: #FDE68A; stroke-width: 2px; }

      /* Connectors */
      .conn-blue { stroke: #3B82F6; stroke-width: 2px; }
      .conn-green { stroke: #10B981; stroke-width: 2px; }
      .conn-gray { stroke: #9CA3AF; stroke-width: 2px; }
    </style>

    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- Header -->
  <!-- ========================================================================= -->
  <text x="650" y="50" class="font-sans title-main" text-anchor="middle">
    多智能体与工具生态的天然耦合
  </text>
  <text x="650" y="80" class="font-sans title-sub" text-anchor="middle">
    The Natural Coupling: Cognitive Agents &amp; Deterministic Tools
  </text>

  <!-- ========================================================================= -->
  <!-- LEFT SIDE: AGENT SYSTEM (The Brain) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 140)">
    <!-- Container -->
    <rect x="0" y="0" width="450" height="380" rx="16" class="box-agent"/>

    <!-- Title -->
    <text x="225" y="40" class="font-sans text-head text-agent-title" text-anchor="middle">
      智能体系统 (Agent System)
    </text>
    <text x="225" y="60" class="font-sans text-label-lg text-agent-sub" text-anchor="middle">
      认知层 (Cognitive Layer)
    </text>

    <!-- Characteristics -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="120" height="30" rx="4" class="chip-agent"/>
      <text x="60" y="20" class="font-sans text-body text-agent-chip" text-anchor="middle">处理模糊性</text>

      <rect x="135" y="0" width="120" height="30" rx="4" class="chip-agent"/>
      <text x="195" y="20" class="font-sans text-body text-agent-chip" text-anchor="middle">规划与决策</text>

      <rect x="270" y="0" width="120" height="30" rx="4" class="chip-agent"/>
      <text x="330" y="20" class="font-sans text-body text-agent-chip" text-anchor="middle">上下文记忆</text>
    </g>

    <!-- The Gap Representation -->
    <g transform="translate(100, 160)">
      <text x="125" y="0" class="font-sans text-label-lg text-warn" text-anchor="middle">
        需求 (Need)
      </text>
      <text x="125" y="25" class="font-sans text-label-md text-gray" text-anchor="middle">
        "我有意图，但我没有手"
      </text>
      <text x="125" y="45" class="font-sans text-body text-light" text-anchor="middle">
        (Cannot affect the real world directly)
      </text>
    </g>

    <!-- Agent Nodes Visual -->
    <g transform="translate(110, 240)">
      <circle cx="40" cy="40" r="30" class="node-agent"/>
      <text x="40" y="45" class="font-sans text-body text-agent-node" text-anchor="middle">Plan</text>

      <circle cx="110" cy="40" r="30" class="node-agent"/>
      <text x="110" y="45" class="font-sans text-body text-agent-node" text-anchor="middle">Act</text>

      <circle cx="180" cy="40" r="30" class="node-agent"/>
      <text x="180" y="45" class="font-sans text-body text-agent-node" text-anchor="middle">Reflect</text>

      <!-- Connectors -->
      <line x1="70" y1="40" x2="80" y2="40" class="line-agent"/>
      <line x1="140" y1="40" x2="150" y2="40" class="line-agent"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT SIDE: TOOL ECOSYSTEM (The Hands) -->
  <!-- ========================================================================= -->
  <g transform="translate(800, 140)">
    <!-- Container -->
    <rect x="0" y="0" width="450" height="380" rx="16" class="box-tool"/>

    <!-- Title -->
    <text x="225" y="40" class="font-sans text-head text-tool-title" text-anchor="middle">
      工具生态 (Tool Ecosystem)
    </text>
    <text x="225" y="60" class="font-sans text-label-lg text-tool-sub" text-anchor="middle">
      确定性层 (Deterministic Layer)
    </text>

    <!-- Characteristics -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="120" height="30" rx="4" class="chip-tool"/>
      <text x="60" y="20" class="font-sans text-body text-tool-chip" text-anchor="middle">执行确定逻辑</text>

      <rect x="135" y="0" width="120" height="30" rx="4" class="chip-tool"/>
      <text x="195" y="20" class="font-sans text-body text-tool-chip" text-anchor="middle">产生副作用</text>

      <rect x="270" y="0" width="120" height="30" rx="4" class="chip-tool"/>
      <text x="330" y="20" class="font-sans text-body text-tool-chip" text-anchor="middle">提供数据</text>
    </g>

    <!-- The Gap Representation -->
    <g transform="translate(100, 160)">
      <text x="125" y="0" class="font-sans text-label-lg text-warn" text-anchor="middle">
        需求 (Need)
      </text>
      <text x="125" y="25" class="font-sans text-label-md text-gray" text-anchor="middle">
        "我有能力，但我没有脑子"
      </text>
      <text x="125" y="45" class="font-sans text-body text-light" text-anchor="middle">
        (No intent, purely reactive)
      </text>
    </g>

    <!-- Tool Nodes Visual -->
    <g transform="translate(110, 240)">
      <rect x="10" y="20" width="60" height="40" rx="4" class="node-tool"/>
      <text x="40" y="45" class="font-sans text-xs text-tool-node" text-anchor="middle">API</text>

      <rect x="90" y="20" width="60" height="40" rx="4" class="node-tool"/>
      <text x="120" y="45" class="font-sans text-xs text-tool-node" text-anchor="middle">DB</text>

      <rect x="170" y="20" width="60" height="40" rx="4" class="node-tool"/>
      <text x="200" y="45" class="font-sans text-xs text-tool-node" text-anchor="middle">File</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER: THE COUPLING (Protocol / Interface) -->
  <!-- ========================================================================= -->
  <g transform="translate(550, 260)">
    <!-- Coupling Box -->
    <rect x="0" y="0" width="200" height="140" rx="12" class="box-coupling"/>

    <text x="100" y="-15" class="font-sans text-label-lg text-coupling-title" text-anchor="middle">
      耦合点 (Coupling Point)
    </text>

    <!-- Left Arrow (Input from Agent) -->
    <path d="M -50 40 L -5 40" class="conn-blue" marker-end="url(#arrow-blue)"/>
    <text x="-60" y="35" class="font-sans text-xs text-agent-title" text-anchor="end">Arguments (参数)</text>
    <text x="-60" y="50" class="font-sans text-xs text-agent-title" text-anchor="end">Intent (意图)</text>

    <!-- Right Arrow (Input from Tool) -->
    <path d="M 250 40 L 200 40" class="conn-green" marker-end="url(#arrow-green)"/>
    <text x="260" y="35" class="font-sans text-xs text-tool-title" text-anchor="start">Schema (定义)</text>
    <text x="260" y="50" class="font-sans text-xs text-tool-title" text-anchor="start">Result (结果)</text>

    <!-- Center Content -->
    <rect x="20" y="25" width="160" height="90" rx="6" class="box-interface"/>

    <text x="100" y="50" class="font-sans text-body text-interface-title" font-weight="700" text-anchor="middle">
      Standard Interface
    </text>
    <line x1="30" y1="60" x2="170" y2="60" class="line-interface"/>

    <text x="100" y="80" class="font-sans text-xs text-gray" text-anchor="middle">Agent 填空 (Fill-in)</text>
    <text x="100" y="100" class="font-sans text-xs text-gray" text-anchor="middle">Tool 执行 (Execute)</text>

  </g>

  <!-- ========================================================================= -->
  <!-- Footer: The Logic Summary -->
  <!-- ========================================================================= -->
  <g transform="translate(150, 560)">
    <rect x="0" y="0" width="1000" height="60" rx="8" class="fill-bg stroke-gray"/>

    <text x="30" y="35" class="font-sans text-label-lg text-dark">天然耦合的本质：</text>
    <text x="150" y="35" class="font-sans text-label-lg text-gray">
      工具生态需要智能体来提供<tspan class="text-agent-sub">“灵活的意图”</tspan>，智能体需要工具生态来提供<tspan class="text-tool-sub">“确定的能力”</tspan>。协议层是它们握手的桥梁。
    </text>
  </g>

  <!-- License -->
  <text x="650" y="640" class="font-sans text-body text-light" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
