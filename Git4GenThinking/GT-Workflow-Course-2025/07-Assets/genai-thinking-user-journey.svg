<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" style="background-color: #f8fafc;">

  <!--
    图表名称：生成式思维学习者旅程图 (User Journey Map) - v2.0
    描述：展示学习者从AI新手到人机共创者的两周成长路径，集成 Cherry Studio 与 MCP 智能体开发节点。
    设计规范：遵循 Gitconomy 社区图形即代码设计规范 v1.0 (SVG)。
  -->

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;800&amp;display=swap');
      .main-title { font-family: 'Noto Sans SC', sans-serif; font-size: 24px; font-weight: 800; fill: #0f172a; }
      .sub-title { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 400; fill: #64748b; }
      .phase-label { font-family: 'Noto Sans SC', sans-serif; font-size: 16px; font-weight: 700; fill: #3b82f6; letter-spacing: 2px; }
      .task-title { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 700; fill: #1e293b; }
      .task-desc { font-family: 'Noto Sans SC', sans-serif; font-size: 11px; font-weight: 400; fill: #475569; }
      .role-text { font-family: 'Noto Sans SC', sans-serif; font-size: 12px; font-weight: 600; fill: #0f766e; }
      .collab-text { font-family: 'Noto Sans SC', sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; }
      .license-text { font-family: 'Noto Sans SC', sans-serif; font-size: 10px; font-weight: 400; fill: #94a3b8; }
    </style>

    <!-- Markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="500" y="50" text-anchor="middle" class="main-title">生成式思维与知识工作流 · 学习者旅程图</text>
  <text x="500" y="75" text-anchor="middle" class="sub-title">User Journey: 从 AI 使用新手到 MCP 智能体开发者的成长路径</text>

  <!-- ==========================================
       Timeline & Phases (Background)
       ========================================== -->

  <!-- Phase 1: Awakening -->
  <rect x="50" y="100" width="280" height="420" rx="12" fill="#eff6ff" stroke="none" opacity="0.5"/>
  <text x="190" y="130" text-anchor="middle" class="phase-label">阶段一：认知觉醒</text>

  <!-- Phase 2: Practice -->
  <rect x="350" y="100" width="280" height="420" rx="12" fill="#fffbeb" stroke="none" opacity="0.5"/>
  <text x="490" y="130" text-anchor="middle" class="phase-label" fill="#d97706" style="fill:#d97706;">阶段二：闭环实践</text>

  <!-- Phase 3: Mastery -->
  <rect x="650" y="100" width="300" height="420" rx="12" fill="#f0fdf4" stroke="none" opacity="0.5"/>
  <text x="800" y="130" text-anchor="middle" class="phase-label" fill="#059669" style="fill:#059669;">阶段三：智能体沉淀</text>

  <!-- ==========================================
       The Journey Path (Curved Line)
       ========================================== -->
  <path d="M100,320 C200,320 250,300 350,250 C450,200 550,200 650,250 C750,300 850,250 900,220"
        fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 4" />

  <!-- ==========================================
       Task Nodes
       ========================================== -->

  <!-- Node 1: Task 01 -->
  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="10" y="25" class="task-title">Task 01</text>
    <text x="10" y="45" class="task-desc">理解知识工作流</text>
    <text x="10" y="65" class="task-desc" fill="#64748b">Output: 思维导图</text>
    <!-- Tool Icon Placeholder -->
    <circle cx="120" cy="20" r="12" fill="#e0f2fe"/>
    <text x="120" y="24" text-anchor="middle" font-size="9" fill="#0369a1">Obs</text>
  </g>

  <!-- Node 2: Task 02 -->
  <g transform="translate(240, 250)">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="10" y="25" class="task-title">Task 02</text>
    <text x="10" y="45" class="task-desc">结构化输入</text>
    <text x="10" y="65" class="task-desc" fill="#64748b">Output: 结构化笔记</text>
    <circle cx="120" cy="20" r="12" fill="#e0f2fe"/>
    <text x="120" y="24" text-anchor="middle" font-size="9" fill="#0369a1">MD</text>
  </g>

  <!-- Node 3: Task 03 (Highlight) -->
  <g transform="translate(420, 180)">
    <rect x="0" y="0" width="140" height="90" rx="6" fill="#fefce8" stroke="#facc15" stroke-width="3"/>
    <text x="10" y="25" class="task-title">Task 03 (Core)</text>
    <text x="10" y="45" class="task-desc">生成与迭代闭环</text>
    <text x="10" y="65" class="task-desc" fill="#64748b">Output: 初稿+迭代</text>
    <!-- Tool: Cherry Studio -->
    <circle cx="120" cy="20" r="14" fill="#fef08a"/>
    <text x="120" y="24" text-anchor="middle" font-size="8" fill="#854d0e">Cherry</text>
  </g>

  <!-- Node 4: Task 04 -->
  <g transform="translate(620, 240)">
    <rect x="0" y="0" width="140" height="80" rx="6" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="10" y="25" class="task-title">Task 04</text>
    <text x="10" y="45" class="task-desc">抽象个人工作流</text>
    <text x="10" y="65" class="task-desc" fill="#64748b">Output: SOP 模板</text>
  </g>

  <!-- Node 5: Task 05 (Success) -->
  <g transform="translate(780, 180)">
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
    <text x="10" y="25" class="task-title">Task 05 (Agent)</text>
    <text x="10" y="45" class="task-desc">构建 MCP 智能体</text>
    <text x="10" y="65" class="task-desc" fill="#64748b">Output: Agent Config</text>
    <!-- Tool: MCP -->
    <circle cx="130" cy="20" r="14" fill="#bbf7d0"/>
    <text x="130" y="24" text-anchor="middle" font-size="9" fill="#14532d">MCP</text>
  </g>

  <!-- ==========================================
       Identity Shift Layer (Bottom Annotations)
       ========================================== -->
  <g transform="translate(0, 420)">
    <!-- Role 1 -->
    <text x="190" y="0" text-anchor="middle" class="role-text">角色：信息采集者</text>
    <text x="190" y="20" text-anchor="middle" class="task-desc">建立结构化意识</text>

    <!-- Role 2 -->
    <text x="490" y="0" text-anchor="middle" class="role-text" fill="#b45309" style="fill:#b45309;">角色：Prompt 工程师</text>
    <text x="490" y="20" text-anchor="middle" class="task-desc">掌握人机协作迭代</text>

    <!-- Role 3 -->
    <text x="800" y="0" text-anchor="middle" class="role-text" fill="#047857" style="fill:#047857;">角色：智能体架构师</text>
    <text x="800" y="20" text-anchor="middle" class="task-desc">具备工具链编排能力</text>
  </g>

  <!-- ==========================================
       Collaboration Layer (Footer)
       ========================================== -->
  <line x1="50" y1="460" x2="950" y2="460" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="50" y="475" width="900" height="60" rx="30" fill="#f1f5f9"/>

  <text x="80" y="510" class="collab-text" font-weight="bold">Git协作流：</text>

  <g transform="translate(180, 495)">
    <circle cx="10" cy="15" r="4" fill="#64748b"/>
    <text x="25" y="20" class="collab-text">Fork &amp; Clone</text>
    <line x1="90" y1="15" x2="110" y2="15" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(320, 495)">
    <circle cx="10" cy="15" r="4" fill="#64748b"/>
    <text x="25" y="20" class="collab-text">Branch 开发</text>
    <line x1="90" y1="15" x2="110" y2="15" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(460, 495)">
    <circle cx="10" cy="15" r="4" fill="#f59e0b"/>
    <text x="25" y="20" class="collab-text">Commit (M01-M07)</text>
    <line x1="110" y1="15" x2="130" y2="15" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(620, 495)">
    <circle cx="10" cy="15" r="4" fill="#3b82f6"/>
    <text x="25" y="20" class="collab-text">Pull Request</text>
    <line x1="90" y1="15" x2="110" y2="15" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(760, 495)">
    <circle cx="10" cy="15" r="4" fill="#10b981"/>
    <text x="25" y="20" class="collab-text">Merge &amp; Review</text>
  </g>

  <!-- Connectors between tasks -->
  <path d="M220,330 L240,290" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M380,290 L420,225" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M560,225 L620,280" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M760,280 L780,225" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- License -->
  <text x="500" y="580" text-anchor="middle" class="license-text">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
