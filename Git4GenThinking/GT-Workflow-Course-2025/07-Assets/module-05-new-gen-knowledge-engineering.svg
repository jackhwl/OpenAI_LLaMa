<!--
  文件名：module-05-new-gen-knowledge-engineering.svg
  图表名称：新一代知识工程：语义分块、知识图谱与 GraphRAG
  描述：展示从非结构化文本到语义分块，再到构建知识图谱和 GraphRAG 的完整知识工程流程。

  核心逻辑：
  1. 输入层：非结构化文档 (Unstructured Docs)。
  2. 处理层 A (语义分块): 基于语义相似度切分，而非固定字符 (Semantic Chunking)。
  3. 处理层 B (图谱构建): 实体抽取、关系构建、社区检测 (Knowledge Graph)。
  4. 输出层 (GraphRAG): 结合图谱结构与文本块，支持全局理解与多跳推理。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }
      .section-title { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 800; fill: #1E40AF; text-anchor: middle; }
      .box-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #374151; text-anchor: middle; }
      .box-desc { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: normal; fill: #4B5563; text-anchor: middle; }
      .arrow-text { font-family: 'Noto Sans', sans-serif; font-size: 10px; font-weight: bold; fill: #2563EB; text-anchor: middle; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">新一代知识工程核心要素：语义分块、知识图谱与GraphRAG</text>
  <text x="600" y="80" class="sub-title">从“文本切片”到“结构化认知”的工程演进</text>

  <!-- ================================================================================== -->
  <!-- 左侧：输入层 (Input Layer) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 150)">
    <text x="100" y="-15" class="section-title">1. 非结构化输入</text>

    <!-- 文档图标 -->
    <rect x="20" y="20" width="160" height="200" rx="4" fill="white" stroke="#9CA3AF" stroke-width="2"/>
    <!-- 模拟文本行 -->
    <line x1="40" y1="50" x2="160" y2="50" stroke="#E5E7EB" stroke-width="4"/>
    <line x1="40" y1="70" x2="160" y2="70" stroke="#E5E7EB" stroke-width="4"/>
    <line x1="40" y1="90" x2="120" y2="90" stroke="#E5E7EB" stroke-width="4"/>
    <line x1="40" y1="130" x2="160" y2="130" stroke="#E5E7EB" stroke-width="4"/>
    <line x1="40" y1="150" x2="140" y2="150" stroke="#E5E7EB" stroke-width="4"/>
    <line x1="40" y1="190" x2="160" y2="190" stroke="#E5E7EB" stroke-width="4"/>

    <text x="100" y="250" class="box-desc">原始文档 / 笔记 / 记录</text>
  </g>

  <!-- 箭头 1 -> 2 -->
  <g transform="translate(230, 250)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="30" y="-10" class="arrow-text">输入处理</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 中间上部：语义分块 (Semantic Chunking) -->
  <!-- ================================================================================== -->
  <g transform="translate(300, 100)">
    <!-- 容器 -->
    <rect x="0" y="0" width="350" height="220" rx="12" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <text x="175" y="30" class="section-title">2. 语义分块 (Semantic Chunking)</text>

    <!-- 传统分块 (对比) -->
    <g transform="translate(30, 60)">
        <rect x="0" y="0" width="130" height="120" rx="4" fill="white" stroke="#93C5FD" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="65" y="20" class="box-title" font-size="12">传统: 固定长度</text>
        <!-- 切割线 -->
        <line x1="0" y1="40" x2="130" y2="40" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2,2"/>
        <line x1="0" y1="80" x2="130" y2="80" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="65" y="110" class="box-desc" fill="#EF4444">语义可能被切断</text>
    </g>

    <!-- 语义分块 (正解) -->
    <g transform="translate(190, 60)">
        <rect x="0" y="0" width="130" height="120" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
        <text x="65" y="20" class="box-title" font-size="12" fill="#1E40AF">新一代: 语义聚合</text>
        <!-- 语义块 -->
        <rect x="10" y="35" width="110" height="30" rx="4" fill="#60A5FA" stroke="none"/>
        <text x="65" y="54" class="box-desc" fill="white">Chunk A (主题1)</text>

        <rect x="10" y="75" width="110" height="35" rx="4" fill="#3B82F6" stroke="none"/>
        <text x="65" y="96" class="box-desc" fill="white">Chunk B (主题2)</text>
    </g>

    <text x="175" y="200" class="box-desc" fill="#1E40AF">基于 Embedding 相似度突变点进行切分</text>
  </g>

  <!-- 箭头 2 -> 3 (向下) -->
  <g transform="translate(475, 330)">
    <line x1="0" y1="-5" x2="0" y2="50" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="30" y="25" class="arrow-text" text-anchor="start">提取实体</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 中间下部：知识图谱构建 (KG Construction) -->
  <!-- ================================================================================== -->
  <g transform="translate(300, 380)">
    <!-- 容器 -->
    <rect x="0" y="0" width="350" height="250" rx="12" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
    <text x="175" y="30" class="section-title" fill="#047857">3. 知识图谱 (Knowledge Graph)</text>

    <!-- 实体与关系示意 -->
    <g transform="translate(60, 60)">
        <!-- 节点 -->
        <circle cx="40" cy="40" r="15" fill="#34D399" stroke="#047857" stroke-width="2"/>
        <text x="40" y="44" text-anchor="middle" font-size="10" fill="white" font-weight="bold">E1</text>

        <circle cx="180" cy="40" r="15" fill="#34D399" stroke="#047857" stroke-width="2"/>
        <text x="180" y="44" text-anchor="middle" font-size="10" fill="white" font-weight="bold">E2</text>

        <circle cx="110" cy="120" r="15" fill="#10B981" stroke="#047857" stroke-width="2"/>
        <text x="110" y="124" text-anchor="middle" font-size="10" fill="white" font-weight="bold">E3</text>

        <!-- 边 -->
        <path d="M 55 40 L 165 40" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
        <text x="110" y="35" class="arrow-text" fill="#059669">Relation A</text>

        <path d="M 50 50 L 100 110" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
        <text x="60" y="90" class="arrow-text" fill="#059669">Rel B</text>

        <path d="M 170 50 L 120 110" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    </g>

    <!-- 社区检测 -->
    <circle cx="110" cy="90" r="100" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="220" y="180" class="box-desc" fill="#D97706" font-weight="bold">Community Detection</text>

    <text x="175" y="230" class="box-desc" fill="#047857">实体抽取 + 关系链接 + 社区摘要</text>
  </g>

  <!-- 箭头 3 -> 4 (向右) -->
  <g transform="translate(670, 500)">
    <line x1="-15" y1="0" x2="80" y2="0" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text x="30" y="-10" class="arrow-text" fill="#7C3AED">生成增强</text>
  </g>

  <!-- 箭头 2 -> 4 (向右) - 语义分块也直接支持 RAG -->
  <g transform="translate(670, 200)">
    <path d="M -10 0 L 230 0, 230 100" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-blue)"/>
    <text x="40" y="20" class="arrow-text" fill="#3B82F6">向量检索支持</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 右侧：GraphRAG 输出 (GraphRAG Output) -->
  <!-- ================================================================================== -->
  <g transform="translate(750, 300)">
    <!-- 容器 -->
    <rect x="0" y="0" width="350" height="300" rx="12" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="3"/>
    <text x="175" y="40" class="section-title" fill="#6B21A8">4. GraphRAG (全景检索)</text>

    <!-- 核心能力列表 -->
    <g transform="translate(150, 70)">
        <!-- 能力 1: 社区摘要 -->
        <rect x="-120" y="0" width="290" height="50" rx="4" fill="white" stroke="#A855F7" stroke-width="1"/>
        <text x="20" y="20" class="box-title" text-anchor="start" fill="#7C3AED">🌍 全局概览 (Global Search)</text>
        <text x="20" y="40" class="box-desc" text-anchor="start" fill="#6B7280">基于社区摘要回答“这篇文档讲了什么”</text>

        <!-- 能力 2: 多跳推理 -->
        <rect x="-120" y="60" width="290" height="50" rx="4" fill="white" stroke="#A855F7" stroke-width="1"/>
        <text x="20" y="80" class="box-title" text-anchor="start" fill="#7C3AED">🔗 多跳推理 (Multi-hop)</text>
        <text x="20" y="100" class="box-desc" text-anchor="start" fill="#6B7280">连接 A -> B -> C 跨文档寻找答案</text>

        <!-- 能力 3: 溯源 -->
        <rect x="-120" y="120" width="290" height="50" rx="4" fill="white" stroke="#A855F7" stroke-width="1"/>
        <text x="20" y="140" class="box-title" text-anchor="start" fill="#7C3AED">🔍 可解释溯源 (Provenance)</text>
        <text x="20" y="160" class="box-desc" text-anchor="start" fill="#6B7280">明确指出依据了哪些实体与关系</text>
    </g>

    <text x="175" y="280" class="box-desc" fill="#6B21A8" font-weight="bold">“结构化记忆”的核心载体</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部说明 -->
  <!-- ================================================================================== -->
  <g transform="translate(200, 680)">
    <rect x="0" y="0" width="800" height="60" rx="30" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="400" y="35" class="box-desc" font-size="14">
      <tspan fill="#EF4444" font-weight="bold">Chunking</tspan> 决定了感知的粒度，
      <tspan fill="#10B981" font-weight="bold">Graph</tspan> 决定了记忆的结构，
      <tspan fill="#8B5CF6" font-weight="bold">RAG</tspan> 决定了调用的能力。
    </text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="770" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>
</svg>
