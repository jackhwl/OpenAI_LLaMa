<!--
  文件名：module-04-machine-readable-knowledge-pipeline.svg
  图表名称：从原始笔记到机器可读知识的转化路径
  描述：展示非结构化文本如何经过原子化、元数据标注、分块与向量化，最终转化为机器可读的索引或图谱。

  核心流程：
  1. Raw Text (原始文本): 非结构化、线性的。
  2. Atomic Split (原子化拆分): 语义独立的知识单元。
  3. Metadata (元数据标注): 增加结构化上下文 (YAML)。
  4. Chunk & Embed (分块与向量化): 转化为数学表达。
  5. Knowledge Base (知识基座): 向量索引与知识图谱。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
      .stage-title { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 800; text-anchor: middle; }
      .desc-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; fill: #4B5563; text-anchor: middle; }
      .code-text { font-family: 'Courier New', monospace; font-size: 10px; fill: #6B7280; }
      .process-label { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: bold; fill: #2563EB; text-anchor: middle; }

      /* 背景色 */
      .bg-raw { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 2px; stroke-dasharray: 5,5; }
      .bg-atomic { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .bg-meta { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .bg-vector { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; }
      .bg-final { fill: #F3E8FF; stroke: #A855F7; stroke-width: 2px; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" text-anchor="middle" font-family="Noto Sans" font-size="24" font-weight="800" fill="#111827">
    从“人类笔记”到“机器知识”的转化管道
  </text>

  <!-- 管道主轴线 (上移 90px: 350 -> 260) -->
  <line x1="100" y1="260" x2="1100" y2="260" stroke="#E5E7EB" stroke-width="4" />

  <!-- ================================================================================== -->
  <!-- Stage 1: 原始文本 (Raw Text) (上移 90px: 250 -> 160) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 160)">
    <!-- 图标：长卷轴 -->
    <rect x="0" y="0" width="140" height="200" rx="4" class="bg-raw" />
    <text x="70" y="30" class="stage-title" fill="#374151">1. 原始文本</text>

    <!-- 文本行示意 -->
    <line x1="20" y1="60" x2="120" y2="60" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="20" y1="80" x2="100" y2="80" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="20" y1="100" x2="120" y2="100" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="20" y1="120" x2="110" y2="120" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="20" y1="140" x2="90" y2="140" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="20" y1="160" x2="120" y2="160" stroke="#9CA3AF" stroke-width="2"/>

    <text x="70" y="230" class="desc-text">线性、非结构化</text>
    <text x="70" y="250" class="desc-text" fill="#DC2626">(AI 难以定位)</text>
  </g>

  <!-- 连接 1 -> 2 (上移 90px: 320 -> 230) -->
  <g transform="translate(190, 230)">
    <line x1="0" y1="30" x2="60" y2="30" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="30" y="0" class="process-label">拆分</text>
    <text x="30" y="15" class="process-label">(Split)</text>
  </g>

  <!-- ================================================================================== -->
  <!-- Stage 2: 原子化单元 (Atomic Units) (上移 90px: 250 -> 160) -->
  <!-- ================================================================================== -->
  <g transform="translate(250, 160)">
    <!-- 卡片组 -->
    <rect x="0" y="20" width="100" height="80" rx="4" class="bg-atomic" />
    <rect x="110" y="20" width="100" height="80" rx="4" class="bg-atomic" />
    <rect x="55" y="110" width="100" height="80" rx="4" class="bg-atomic" />

    <text x="105" y="-10" class="stage-title" fill="#1E40AF">2. 原子化单元</text>

    <!-- 内容示意 -->
    <text x="50" y="60" text-anchor="middle" font-size="10" fill="#1E40AF">概念 A</text>
    <text x="160" y="60" text-anchor="middle" font-size="10" fill="#1E40AF">案例 B</text>
    <text x="105" y="150" text-anchor="middle" font-size="10" fill="#1E40AF">结论 C</text>

    <text x="105" y="230" class="desc-text">语义独立</text>
    <text x="105" y="250" class="desc-text">(Context 完整)</text>
  </g>

  <!-- 连接 2 -> 3 (上移 90px: 320 -> 230) -->
  <g transform="translate(460, 230)">
    <line x1="0" y1="30" x2="60" y2="30" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="30" y="" class="process-label">标注</text>
    <text x="30" y="15" class="process-label">(Enrich)</text>
  </g>

  <!-- ================================================================================== -->
  <!-- Stage 3: Metadata 标注 (Structured) (上移 90px: 220 -> 130) -->
  <!-- ================================================================================== -->
  <g transform="translate(520, 130)">
    <!-- 带 Header 的卡片 -->
    <rect x="0" y="30" width="160" height="170" rx="4" class="bg-meta" />
    <text x="80" y="0" class="stage-title" fill="#047857">3. 元数据标注</text>

    <!-- YAML 区域 -->
    <rect x="10" y="40" width="140" height="60" rx="2" fill="#DCFCE7" stroke="#34D399" stroke-width="1"/>
    <text x="20" y="55" class="code-text" fill="#065F46">---</text>
    <text x="20" y="68" class="code-text" fill="#065F46">type: concept</text>
    <text x="20" y="81" class="code-text" fill="#065F46">tags: [AI, RAG]</text>
    <text x="20" y="94" class="code-text" fill="#065F46">---</text>

    <!-- 正文区域 -->
    <rect x="10" y="110" width="140" height="80" rx="2" fill="white" stroke="#34D399" stroke-width="1"/>
    <text x="80" y="150" text-anchor="middle" font-size="10" fill="#065F46">正文内容...</text>

    <text x="80" y="230" class="desc-text">显式结构</text>
    <text x="80" y="250" class="desc-text">(便于过滤/路由)</text>
  </g>

  <!-- 连接 3 -> 4 (上移 90px: 320 -> 230) -->
  <g transform="translate(680, 230)">
    <line x1="0" y1="30" x2="60" y2="30" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="30" y="0" class="process-label">编码</text>
    <text x="30" y="15" class="process-label">(Embed)</text>
  </g>

  <!-- ================================================================================== -->
  <!-- Stage 4: 向量化 (Embedding) (上移 90px: 250 -> 160) -->
  <!-- ================================================================================== -->
  <g transform="translate(740, 160)">
    <!-- 矩阵/数组示意 -->
    <rect x="0" y="20" width="160" height="160" rx="4" class="bg-vector" />
    <text x="80" y="-10" class="stage-title" fill="#B45309">4. 向量化 Chunk</text>

    <text x="80" y="60" class="code-text" text-anchor="middle" font-size="12">[0.12, -0.58, 0.93...]</text>

    <!-- 向量空间网格 -->
    <line x1="20" y1="80" x2="140" y2="80" stroke="#FDE047" stroke-width="1"/>
    <line x1="20" y1="100" x2="140" y2="100" stroke="#FDE047" stroke-width="1"/>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#FDE047" stroke-width="1"/>
    <line x1="80" y="40" x2="80" y2="140" stroke="#FDE047" stroke-width="1"/>

    <!-- 点 -->
    <circle cx="50" cy="90" r="3" fill="#B45309"/>
    <circle cx="110" cy="110" r="3" fill="#B45309"/>

    <text x="80" y="210" class="desc-text">高维数学空间</text>
    <text x="80" y="230" class="desc-text">(语义相似性计算)</text>
  </g>

  <!-- 连接 4 -> 5 (上移 90px: 320 -> 230) -->
  <g transform="translate(900, 230)">
    <line x1="0" y1="30" x2="60" y2="30" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="30" y="0" class="process-label">索引</text>
    <text x="30" y="15" class="process-label">(Index)</text>
  </g>

  <!-- ================================================================================== -->
  <!-- Stage 5: 知识基座 (Graph/Index) (上移 90px: 230 -> 140) -->
  <!-- ================================================================================== -->
  <g transform="translate(960, 140)">
    <!-- 数据库图标 -->
    <path d="M 0 30 Q 80 0 160 30 L 160 170 Q 80 200 0 170 Z" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>
    <path d="M 0 30 Q 80 60 160 30" fill="none" stroke="#A855F7" stroke-width="2"/>

    <text x="80" y="-10" class="stage-title" fill="#6B21A8">5. 机器知识基座</text>

    <!-- 内部：图谱连接 -->
    <circle cx="50" cy="80" r="5" fill="#A855F7"/>
    <circle cx="110" cy="100" r="5" fill="#A855F7"/>
    <circle cx="70" cy="140" r="5" fill="#A855F7"/>
    <line x1="50" y1="80" x2="110" y2="100" stroke="#D8B4FE" stroke-width="2"/>
    <line x1="110" y1="100" x2="70" y2="140" stroke="#D8B4FE" stroke-width="2"/>
    <line x1="70" y1="140" x2="50" y2="80" stroke="#D8B4FE" stroke-width="2"/>

    <text x="80" y="210" class="desc-text">Vector DB / Graph</text>
    <text x="80" y="230" class="desc-text">(支持 Agent 检索)</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部对比说明 (上移 90px: 550 -> 460) -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 460)">
    <text x="0" y="0" font-family="Noto Sans" font-size="14" font-weight="bold" fill="#374151">为什么要这么做？</text>
    <text x="0" y="30" font-family="Noto Sans" font-size="12" fill="#6B7280">• 人类阅读：喜欢连贯的长文 (Flow)</text>
    <text x="0" y="50" font-family="Noto Sans" font-size="12" fill="#6B7280">• AI 检索：喜欢独立的碎片 (Chunks) + 明确的标签 (Tags)</text>
    <text x="0" y="70" font-family="Noto Sans" font-size="12" fill="#2563EB" font-weight="bold">→ 这个过程就是将“为了人写的内容”重构为“AI 可用的数据”</text>
  </g>

  <!-- 底部许可 (上移 90px: 650 -> 560) -->
  <text x="600" y="580" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
