<!--
  图表名称：Chain-of-Thought vs 直接生成对比图 (Chain-of-Thought vs Direct Generation Comparison)
  描述：基于 Gitconomy DaC 设计规范标准版。对比了直接生成（单跳、高风险）与
       思维链推理（多跳、结构化、可控）的路径差异。
  关键模块：
  - 左侧：直接生成模式 (Direct) - 使用红色预警样式
  - 右侧：思维链模式 (CoT) - 使用蓝/绿标准样式
  - 底部：结论总结
  设计决策：
  - 配色遵循 DaC 指南 3.1：蓝色代表结构/输入，绿色代表优质产出，红色代表风险/劣质产出。
  - 字体遵循 DaC 指南 4.0：Noto Sans, 主标题 22px, 正文 12px。
-->
<svg width="1000" height="740" viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" style="background-color: white; font-family: 'Noto Sans', sans-serif;">
  <defs>
    <style>
      :root {
        /* DaC 指南 3.1 标准配色方案 */
        --main-fill: #EFF6FF;      /* 淡蓝 */
        --main-stroke: #60A5FA;    /* 亮蓝 */
        --std-fill: #F0FDF4;       /* 淡绿 */
        --std-stroke: #34D399;     /* 活力绿 */
        --highlight-fill: #FEF9C3; /* 淡黄 */
        --highlight-stroke: #FACC15; /* 亮黄 */
        --card-bg: #DBEAFE;        /* 柔和蓝 */
        --card-stroke: #3B82F6;    /* 中度蓝 */

        /* 扩展配色：风险/负面 (用于左侧直接生成) */
        --risk-fill: #FEF2F2;      /* 淡红 */
        --risk-stroke: #F87171;    /* 亮红 */
        --text-risk: #B91C1C;      /* 深红文本 */

        /* 文本颜色 - DaC 指南 3.1 */
        --text-main: #111827;      /* 深灰/黑 */
        --text-body: #374151;      /* 中灰 */
        --text-small: #6B7280;     /* 浅灰 */
        --connector: #2563EB;      /* 深蓝连接线 */
        --connector-risk: #EF4444; /* 红色连接线 */
      }

      /* 字体规范 - DaC 指南 4.0 */
      .main-title-text { font-size: 22px; font-weight: 800; fill: var(--text-main); }
      .title-text { font-size: 16px; font-weight: 700; fill: var(--text-main); }
      .body-text { font-size: 12px; font-weight: 400; fill: var(--text-body); line-height: 1.5; }
      .highlight-text { font-size: 12px; font-weight: 700; fill: var(--text-main); }
      .risk-title { font-size: 14px; font-weight: 700; fill: var(--text-risk); }
      .small-text { font-size: 11px; font-weight: 400; fill: var(--text-small); }
      .license-text { font-size: 12px; font-weight: 400; fill: #64748B; }

      /* 组件样式 */
      .main-box { fill: var(--main-fill); stroke: var(--main-stroke); stroke-width: 2px; }
      .std-box { fill: var(--std-fill); stroke: var(--std-stroke); stroke-width: 2px; }
      .risk-box { fill: var(--risk-fill); stroke: var(--risk-stroke); stroke-width: 2px; }
      .card-bg { fill: var(--card-bg); stroke: var(--card-stroke); stroke-width: 2px; }
      .dashed { stroke-dasharray: 6 4; }

      .lane-bg { fill: #FAFAFA; stroke: #E5E7EB; stroke-width: 1px; rx: 8px; }
      .chip { fill: white; stroke: #E5E7EB; stroke-width: 1px; rx: 4px; }

      /* 连接线 */
      .connector { fill: none; stroke: var(--connector); stroke-width: 2px; stroke-linecap: round; marker-end: url(#arrow); }
      .connector-risk { fill: none; stroke: var(--connector-risk); stroke-width: 2px; stroke-linecap: round; marker-end: url(#arrow-risk); stroke-dasharray: 4 4;}
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-risk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#EF4444"/>
    </marker>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 标题区域 -->
  <text x="500" y="50" text-anchor="middle" class="main-title-text">思维连vs直接生成——推理路径对比</text>
  <text x="500" y="75" text-anchor="middle" class="body-text">直觉：直接生成 = 一跳输出；分步推理 = 多跳校验与结构化展开（更易控制复杂任务）</text>

  <!-- 顶部说明卡片 -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="800" height="60" rx="8" class="card-bg" />
    <text x="20" y="25" class="highlight-text" fill="#1E3A8A">如何读这张图</text>
    <text x="20" y="45" class="body-text">左侧：直接生成（Input→Output）；右侧：分步推理（Input→步骤→检查点→Output）。适用于复杂写作与方案设计。</text>
  </g>

  <!-- 主体对比区域 -->
  <g transform="translate(50, 180)">

    <!-- 左侧：直接生成 (Direct Generation) - Risk Style -->
    <g>
      <rect x="0" y="0" width="420" height="420" class="lane-bg" stroke="#FECACA" fill="#FEF2F2" />

      <!-- Header -->
      <rect x="0" y="0" width="420" height="40" rx="8" fill="#FEE2E2" stroke="#F87171" stroke-width="1" />
      <text x="210" y="25" text-anchor="middle" class="risk-title">❌ 直接生成 (Input → Output)</text>

      <!-- Components -->
      <g transform="translate(60, 60)">

        <!-- Input -->
        <g>
          <rect x="0" y="0" width="300" height="80" class="risk-box dashed" filter="url(#shadow)" />
          <text x="15" y="25" class="highlight-text" fill="#B91C1C">输入 (Input)</text>
          <text x="15" y="45" class="body-text">• 目标模糊 / 无约束</text>
          <text x="15" y="60" class="body-text">• 缺乏格式声明</text>

          <!-- Tag -->
          <rect x="230" y="10" width="60" height="20" rx="10" fill="#FECACA" />
          <text x="260" y="24" text-anchor="middle" font-size="10" fill="#B91C1C">Human</text>
        </g>

        <!-- Risk Arrow -->
        <path d="M 150 80 L 150 160" class="connector-risk" />
        <text x="160" y="125" class="small-text" fill="#EF4444">黑盒过程</text>

        <!-- Output -->
        <g transform="translate(0, 160)">
          <rect x="0" y="0" width="300" height="100" class="risk-box" filter="url(#shadow)" />
          <text x="15" y="25" class="highlight-text" fill="#B91C1C">输出 (Output)</text>
          <text x="15" y="45" class="body-text">• 容易跳步 / 产生幻觉</text>
          <text x="15" y="60" class="body-text">• 逻辑不可回溯</text>
          <text x="15" y="75" class="body-text">• 错误难定位</text>

          <!-- Tag -->
          <rect x="230" y="10" width="60" height="20" rx="10" fill="#FECACA" />
          <text x="260" y="24" text-anchor="middle" font-size="10" fill="#B91C1C">AI</text>
        </g>

        <!-- Risk Note -->
        <g transform="translate(0, 280)">
           <rect x="0" y="0" width="300" height="60" fill="white" stroke="#E5E7EB" rx="4" />
           <text x="10" y="20" class="highlight-text">典型问题</text>
           <text x="10" y="40" class="body-text">关键中间步骤缺失，结论不可复现。</text>
        </g>

      </g>
    </g>

    <!-- 右侧：分步推理 (CoT) - Standard Style -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="420" height="420" class="lane-bg" stroke="#BBF7D0" fill="#F0FDF4" />

      <!-- Header -->
      <rect x="0" y="0" width="420" height="40" rx="8" fill="#DCFCE7" stroke="#34D399" stroke-width="1" />
      <text x="210" y="25" text-anchor="middle" class="highlight-text" fill="#065F46">✅ 分步推理 (Input → Steps → Output)</text>

      <!-- Components -->
      <g transform="translate(60, 60)">

        <!-- Input -->
        <g>
          <rect x="0" y="0" width="300" height="70" class="main-box" filter="url(#shadow)" />
          <text x="15" y="25" class="highlight-text">输入 (Input)</text>
          <text x="15" y="45" class="body-text">• 明确目标 + 格式 + 约束</text>
          <text x="15" y="60" class="body-text">• 要求“自检”</text>

          <rect x="230" y="10" width="60" height="20" rx="10" fill="#BFDBFE" />
          <text x="260" y="24" text-anchor="middle" font-size="10" fill="#1E3A8A">Human</text>
        </g>

        <!-- Arrow -->
        <path d="M 150 70 L 150 100" class="connector" />

        <!-- Step 1 -->
        <g transform="translate(20, 100)">
          <rect x="0" y="0" width="260" height="40" class="chip" />
          <text x="10" y="25" class="body-text" fill="#2563EB">Step 1: 拆解问题 (Sub-tasks)</text>
        </g>

        <!-- Arrow -->
        <path d="M 150 140 L 150 160" class="connector" />

        <!-- Step 2 -->
        <g transform="translate(20, 160)">
          <rect x="0" y="0" width="260" height="40" class="chip" />
          <text x="10" y="25" class="body-text" fill="#2563EB">Step 2: 逐步推理和证据链</text>
        </g>

        <!-- Arrow -->
        <path d="M 150 200 L 150 230" class="connector" />

        <!-- Output -->
        <g transform="translate(0, 230)">
          <rect x="0" y="0" width="300" height="80" class="std-box" filter="url(#shadow)" />
          <text x="15" y="25" class="highlight-text" fill="#065F46">可交付结果 (Deliverable)</text>
          <text x="15" y="45" class="body-text">• 结构清晰 / 可复审</text>
          <text x="15" y="60" class="body-text">• 错误易定位</text>

          <rect x="230" y="10" width="60" height="20" rx="10" fill="#BBF7D0" />
          <text x="260" y="24" text-anchor="middle" font-size="10" fill="#065F46">AI</text>
        </g>

        <!-- Note -->
        <g transform="translate(0, 320)">
           <rect x="0" y="0" width="300" height="40" fill="white" stroke="#E5E7EB" rx="4" />
           <text x="10" y="25" class="body-text">提示：最终交付可隐藏中间步骤。</text>
        </g>

      </g>
    </g>
  </g>

  <!-- 底部总结 -->
  <g transform="translate(100, 620)">
    <rect x="0" y="0" width="800" height="50" rx="8" class="card-bg" />
    <text x="400" y="30" text-anchor="middle" class="highlight-text" fill="#1E40AF">结论：分步推理的价值不在“更长”，而在“可控”。将隐性思维外化，提升稳定性。</text>
  </g>

  <!-- 许可声明 (DaC Standard) -->
  <text x="500" y="720" text-anchor="middle" class="license-text">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>
</svg>
