<!--
  ================================================================================
  图表名称：MCP与工具生态：从“内嵌调用”到“市场化发现”
  文件命名：module-07-mcp-tool-discovery.svg
  描述：
    对比两种工具集成模式：
    1. 左侧 (Embedded): 传统的 SDK 集成，工具是 Agent 代码的一部分，更新需重部署。
    2. 右侧 (Discovery): 基于 MCP 的动态发现，Agent 通过 Registry 查找能力，即插即用。

  遵循 Gitconomy 社区 DaC 设计规范 (Git 兼容版)：
  - 样式：采用 <style> 集中定义 CSS 类
  - 结构：<defs> 位于头部
  - 字体：Noto Sans / sans-serif
  ================================================================================
-->
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- ========================================================================= -->
  <!-- DEFINITIONS & STYLES -->
  <!-- ========================================================================= -->
  <defs>
    <style>
      /* 全局字体 */
      .font-sans { font-family: 'Noto Sans', sans-serif; }

      /* 文本样式 */
      .title-main { font-size: 24px; font-weight: 800; fill: #111827; }
      .title-sub { font-size: 16px; font-weight: 400; fill: #6B7280; }

      .text-head { font-size: 18px; font-weight: 700; }
      .text-label { font-size: 14px; font-weight: 700; }
      .text-body { font-size: 12px; font-weight: 400; }
      .text-small { font-size: 11px; font-weight: 400; }

      /* 颜色定义 */
      /* Old Way (Gray/Legacy) */
      .box-legacy { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 2px; }
      .box-legacy-inner { fill: #E5E7EB; stroke: #9CA3AF; stroke-width: 1px; }
      .text-legacy-title { fill: #4B5563; }
      .conn-legacy { stroke: #6B7280; stroke-width: 2px; }

      /* New Way (Blue/Green/Yellow) */
      .box-host { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .box-server { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .box-registry { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 2px; stroke-dasharray: 8,4; }

      .text-host { fill: #1E40AF; }
      .text-server { fill: #065F46; }
      .text-registry { fill: #B45309; }

      .conn-query { stroke: #F59E0B; stroke-width: 2px; stroke-dasharray: 4,2; }
      .conn-bind { stroke: #111827; stroke-width: 2px; }
    </style>

    <!-- Markers -->
    <marker id="arrow-legacy" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#6B7280" />
    </marker>
    <marker id="arrow-query" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-bind" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- Header -->
  <!-- ========================================================================= -->
  <text x="600" y="50" class="font-sans title-main" text-anchor="middle">
    MCP与工具生态：从“内嵌调用”到“市场化发现”
  </text>
  <text x="600" y="80" class="font-sans title-sub" text-anchor="middle">
    Evolution: From Hardcoded SDK Integration to Dynamic Marketplace Discovery
  </text>

  <!-- ========================================================================= -->
  <!-- LEFT: LEGACY (Embedded Call) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 130)">
    <text x="250" y="30" class="font-sans text-head text-legacy-title" text-anchor="middle">
      1. 内嵌调用 (Embedded)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#9CA3AF" text-anchor="middle">
      Code Dependency / Hardcoded
    </text>

    <!-- Main App Container -->
    <rect x="50" y="80" width="400" height="400" rx="16" class="box-legacy"/>
    <text x="250" y="110" class="font-sans text-label text-legacy-title" text-anchor="middle">Monolithic Agent App</text>

    <!-- The "Hardwired" Code -->
    <g transform="translate(100, 140)">
      <!-- Logic -->
      <rect x="0" y="0" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
      <text x="150" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">Agent Core Logic</text>

      <!-- Hard Links -->
      <line x1="80" y1="60" x2="80" y2="100" class="conn-legacy" marker-end="url(#arrow-legacy)"/>
      <line x1="220" y1="60" x2="220" y2="100" class="conn-legacy" marker-end="url(#arrow-legacy)"/>

      <!-- Integrated SDKs -->
      <g transform="translate(20, 100)">
        <rect x="0" y="0" width="120" height="160" rx="6" class="box-legacy-inner"/>
        <text x="60" y="25" class="font-sans text-label text-legacy-title" text-anchor="middle">Slack SDK</text>
        <rect x="10" y="40" width="100" height="20" fill="#FFFFFF" stroke="none"/>
        <text x="60" y="55" class="font-sans text-small" fill="#9CA3AF" text-anchor="middle">auth_token</text>
        <rect x="10" y="70" width="100" height="20" fill="#FFFFFF" stroke="none"/>
        <text x="60" y="85" class="font-sans text-small" fill="#9CA3AF" text-anchor="middle">client_id</text>
        <text x="60" y="140" class="font-sans text-small" fill="#EF4444" text-anchor="middle">Locked Version</text>
      </g>

      <g transform="translate(160, 100)">
        <rect x="0" y="0" width="120" height="160" rx="6" class="box-legacy-inner"/>
        <text x="60" y="25" class="font-sans text-label text-legacy-title" text-anchor="middle">PG Driver</text>
        <rect x="10" y="40" width="100" height="20" fill="#FFFFFF" stroke="none"/>
        <text x="60" y="55" class="font-sans text-small" fill="#9CA3AF" text-anchor="middle">connection_str</text>
        <text x="60" y="140" class="font-sans text-small" fill="#EF4444" text-anchor="middle">Locked Version</text>
      </g>
    </g>

    <!-- Status -->
    <rect x="150" y="430" width="200" height="30" rx="15" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
    <text x="250" y="450" class="font-sans text-small" fill="#B91C1C" text-anchor="middle">⚠️ 更新需重部署 (Redeploy)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER: SEPARATOR -->
  <!-- ========================================================================= -->
  <line x1="600" y1="150" x2="600" y2="500" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- ========================================================================= -->
  <!-- RIGHT: DISCOVERY (Marketplace) -->
  <!-- ========================================================================= -->
  <g transform="translate(650, 130)">
    <text x="250" y="30" class="font-sans text-head text-host" text-anchor="middle">
      2. 市场化发现 (Discovery)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#60A5FA" text-anchor="middle">
      Runtime Binding / Plug &amp; Play
    </text>

    <!-- Agent (Thin Client) -->
    <g transform="translate(100, 80)">
      <rect x="0" y="0" width="300" height="60" rx="8" class="box-host"/>
      <text x="150" y="25" class="font-sans text-label text-host" text-anchor="middle">MCP Host (Agent)</text>
      <text x="150" y="45" class="font-sans text-small text-host" text-anchor="middle">"I need to read a file..."</text>
    </g>

    <!-- Discovery Layer (Registry) -->
    <g transform="translate(50, 200)">
      <rect x="0" y="0" width="400" height="80" rx="40" class="box-registry"/>
      <text x="200" y="30" class="font-sans text-label text-registry" text-anchor="middle">MCP Registry / Marketplace</text>
      <text x="200" y="50" class="font-sans text-small text-registry" text-anchor="middle">Capability Catalog (Schema Store)</text>
    </g>

    <!-- Query Arrows -->
    <path d="M 250 140 L 250 200" class="conn-query" marker-end="url(#arrow-query)"/>
    <text x="260" y="170" class="font-sans text-small text-registry">1. Query Capability</text>

    <!-- Servers (Independent) -->
    <g transform="translate(0, 340)">
      <!-- Server A -->
      <g transform="translate(50, 0)">
        <rect x="0" y="0" width="120" height="80" rx="6" class="box-server"/>
        <text x="60" y="30" class="font-sans text-label text-server" text-anchor="middle">File Server</text>
        <rect x="10" y="50" width="100" height="20" rx="10" fill="#DCFCE7"/>
        <text x="60" y="64" class="font-sans text-small text-server" text-anchor="middle">Cap: Read/Write</text>
      </g>

      <!-- Server B -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="120" height="80" rx="6" class="box-server"/>
        <text x="60" y="30" class="font-sans text-label text-server" text-anchor="middle">Github Server</text>
        <rect x="10" y="50" width="100" height="20" rx="10" fill="#DCFCE7"/>
        <text x="60" y="64" class="font-sans text-small text-server" text-anchor="middle">Cap: PR/Issue</text>
      </g>

      <!-- Server C -->
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="120" height="80" rx="6" class="box-server" stroke-dasharray="4,2"/>
        <text x="70" y="30" class="font-sans text-label text-server" text-anchor="middle">Remote API</text>
        <text x="70" y="55" class="font-sans text-small" fill="#9CA3AF" text-anchor="middle">New Arrival</text>
      </g>
    </g>

    <!-- Binding Arrows -->
    <path d="M 120 280 L 120 340" class="conn-bind" marker-end="url(#arrow-bind)"/>
    <path d="M 250 280 L 250 340" class="conn-bind" marker-end="url(#arrow-bind)"/>
    <path d="M 380 280 L 380 340" class="conn-bind" marker-end="url(#arrow-bind)"/>
    <text x="130" y="310" class="font-sans text-small" fill="#111827">2. Connect</text>

    <!-- Status -->
    <rect x="150" y="440" width="200" height="30" rx="15" fill="#DCFCE7" stroke="#10B981" stroke-width="1"/>
    <text x="250" y="460" class="font-sans text-small" fill="#047857" text-anchor="middle">✅ 即插即用 (Hot-Plug)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER: COMPARISON -->
  <!-- ========================================================================= -->
  <g transform="translate(150, 640)">
    <rect x="0" y="0" width="900" height="80" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>

    <text x="30" y="45" class="font-sans text-head" fill="#111827">核心转变：</text>

    <g transform="translate(150, 20)">
      <text x="0" y="15" class="font-sans text-label text-legacy-title">From:</text>
      <text x="50" y="15" class="font-sans text-body">Agent 拥有工具的代码 (Owns Code)</text>
      <text x="50" y="35" class="font-sans text-body">能力边界由<b>编译时间</b>决定</text>
    </g>

    <path d="M 400 25 L 450 25" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-legacy)"/>

    <g transform="translate(500, 20)">
      <text x="0" y="15" class="font-sans text-label text-host">To:</text>
      <text x="50" y="15" class="font-sans text-body">Agent 拥有工具的目录 (Accesses Catalog)</text>
      <text x="50" y="35" class="font-sans text-body">能力边界由<b>生态市场</b>决定</text>
    </g>
  </g>

  <!-- License -->
  <text x="600" y="760" class="font-sans text-body" fill="#64748B" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
