<!--
  文件名：react-minimal-structure.svg
  图表名称：ReAct：推理与行动交替的最小结构
  描述：展示 ReAct (Reasoning + Acting) 范式的核心循环结构：Thought -> Act -> Obs -> Thought...

  核心逻辑：
  1. Thought (思考): 模型内部推理，决定下一步做什么。
  2. Act (行动): 模型输出具体的工具调用指令。
  3. Obs (观察): 外部环境返回的执行结果。
  4. 循环: Obs 作为新的 Context 输入给模型，触发下一轮 Thought。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      .title-text { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-text { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .step-title { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 800; text-anchor: middle; }
      .step-desc { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 400; text-anchor: middle; }

      /* 节点样式 */
      .node-thought { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2px; rx: 25; }
      .node-act { fill: #F0FDF4; stroke: #059669; stroke-width: 2px; rx: 8; }
      .node-obs { fill: #FEF9C3; stroke: #D97706; stroke-width: 2px; stroke-dasharray: 4,2; rx: 8; }

      /* 环境区域 */
      .env-area { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 2px; rx: 16; }

      /* 连接线 */
      .flow-arrow { fill: none; stroke: #4B5563; stroke-width: 2px; marker-end: url(#arrow-gray); }
      .loop-arrow { fill: none; stroke: #2563EB; stroke-width: 2px; marker-end: url(#arrow-blue); stroke-dasharray: 6,4; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="400" y="50" class="title-text">ReAct：推理与行动交替循环</text>
  <text x="400" y="80" class="sub-text">Reasoning + Acting = Synergized Intelligence</text>

  <!-- ================================================================================== -->
  <!-- 核心循环结构 (Triangle Layout) -->
  <!-- ================================================================================== -->

  <!-- 1. Thought (Top) -->
  <g transform="translate(400, 150)">
    <rect x="-80" y="-30" width="160" height="60" class="node-thought"/>
    <text x="0" y="0" class="step-title" fill="#1E40AF">Thought (思考)</text>
    <text x="0" y="20" class="step-desc" fill="#1E40AF">推理 &amp; 规划</text>
  </g>

  <!-- 2. Act (Right) -->
  <g transform="translate(600, 350)">
    <rect x="-70" y="-30" width="140" height="60" class="node-act"/>
    <text x="0" y="0" class="step-title" fill="#047857">Act (行动)</text>
    <text x="0" y="20" class="step-desc" fill="#047857">工具调用指令</text>
  </g>

  <!-- 3. Obs (Left) -->
  <g transform="translate(200, 350)">
    <rect x="-70" y="-30" width="140" height="60" class="node-obs"/>
    <text x="0" y="0" class="step-title" fill="#B45309">Obs (观察)</text>
    <text x="0" y="20" class="step-desc" fill="#B45309">环境反馈结果</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 环境区域 (Environment) -->
  <!-- ================================================================================== -->
  <rect x="100" y="450" width="600" height="60" class="env-area"/>
  <text x="400" y="480" class="step-title" fill="#6B7280">Environment (外部环境)</text>
  <text x="400" y="500" class="step-desc" fill="#9CA3AF">API / Database / Search Engine</text>

  <!-- ================================================================================== -->
  <!-- 连接流向 -->
  <!-- ================================================================================== -->

  <!-- Thought -> Act -->
  <path d="M 480 180 L 600 320" class="flow-arrow"/>
  <text x="560" y="240" class="step-desc" fill="#4B5563" transform="rotate(50, 560, 240)">生成指令</text>

  <!-- Act -> Environment (Interaction) -->
  <path d="M 600 380 L 600 450" class="flow-arrow" stroke-dasharray="4,2"/>
  <text x="620" y="420" class="step-desc" fill="#059669">执行</text>

  <!-- Environment -> Obs -->
  <path d="M 200 450 L 200 380" class="flow-arrow" stroke-dasharray="4,2"/>
  <text x="180" y="420" class="step-desc" fill="#D97706">返回</text>

  <!-- Obs -> Thought (The Loop) -->
  <path d="M 200 320 L 320 180" class="loop-arrow"/>
  <text x="240" y="240" class="step-desc" fill="#2563EB" font-weight="bold" transform="rotate(-50, 240, 240)">更新上下文 (Context)</text>

  <!-- 底部连接 Act -> Obs (Direct logical link) -->
  <path d="M 530 350 L 270 350" class="flow-arrow" opacity="0.3"/>

  <!-- 底部许可 -->
  <text x="400" y="580" class="step-desc" fill="#9CA3AF">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
