<!--
  文件名：module0-03-engineering-workflow-loop.svg
  图表名称：结构化提示工程核心工作流示意图
  描述：展示结构化提示工程的四大核心环节（表达-评估-迭代-系统）及其关键技术栈和反馈闭环。

  核心逻辑：
  1. 表达 (Express): 翻译层 - 将模糊思维转化为精确协议 (JSON Schema)
  2. 评价 (Evaluate): 判断层 - 建立质量标准与反馈信号 (LLM-as-a-Judge)
  3. 迭代 (Iterate): 推理层 - 利用元认知进行自我优化 (Reflection)
  4. 系统 (System): 编排层 - 管理硅基与碳基的协作 (HITL)

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1000" height="450" viewBox="0 0 1000 450" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
      .title-text { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 800; text-anchor: middle; }
      .concept-text { font-family: 'Noto Sans', sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .tech-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: normal; text-anchor: middle; }
      .cognitive-label { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: bold; text-anchor: middle; fill: white; }
    </style>
    <!-- 蓝色箭头 (主流程) -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <!-- 红色箭头 (反馈环) -->
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626" />
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="500" y="50" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="24" font-weight="800" fill="#111827">
    结构化提示工程核心工作流
  </text>
  <text x="500" y="80" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="14" fill="#6B7280">
    从“单点生成”到“系统智能”
  </text>

  <!-- ================================================================================== -->
  <!-- 1. 表达层 (Express) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 150)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="200" height="160" rx="8" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>

    <!-- 顶部标签：认知映射 -->
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 30 L 0 30 Z" fill="#34D399"/>
    <text x="100" y="20" class="cognitive-label">翻译 (Translation)</text>

    <!-- 内容 -->
    <text x="100" y="60" class="title-text" fill="#047857">1. 表达 (Express)</text>
    <line x1="20" y1="75" x2="180" y2="75" stroke="#BBF7D0" stroke-width="1"/>

    <text x="100" y="100" class="concept-text" fill="#059669">接口协议 / 熵减输出</text>

    <!-- 工具栈 -->
    <rect x="20" y="120" width="160" height="25" rx="4" fill="white" stroke="#34D399" stroke-dasharray="2,2"/>
    <text x="100" y="137" class="tech-text" fill="#059669">JSON Schema, Pydantic</text>
  </g>

  <!-- 连接箭头 1 -> 2 -->
  <line x1="250" y1="230" x2="290" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ================================================================================== -->
  <!-- 2. 评价层 (Evaluate) -->
  <!-- ================================================================================== -->
  <g transform="translate(290, 150)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="200" height="160" rx="8" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>

    <!-- 顶部标签 -->
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 30 L 0 30 Z" fill="#FACC15"/>
    <text x="100" y="20" class="cognitive-label" fill="#713F12">判断 (Judgment)</text>

    <!-- 内容 -->
    <text x="100" y="60" class="title-text" fill="#B45309">2. 评价 (Evaluate)</text>
    <line x1="20" y1="75" x2="180" y2="75" stroke="#FDE68A" stroke-width="1"/>

    <text x="100" y="100" class="concept-text" fill="#D97706">黄金指标 / AI 裁判</text>

    <!-- 工具栈 -->
    <rect x="20" y="120" width="160" height="25" rx="4" fill="white" stroke="#FACC15" stroke-dasharray="2,2"/>
    <text x="100" y="137" class="tech-text" fill="#B45309">RAGAs, LLM-as-a-Judge</text>
  </g>

  <!-- 连接箭头 2 -> 3 -->
  <line x1="490" y1="230" x2="530" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ================================================================================== -->
  <!-- 3. 迭代层 (Iterate) -->
  <!-- ================================================================================== -->
  <g transform="translate(530, 150)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="200" height="160" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>

    <!-- 顶部标签 -->
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 30 L 0 30 Z" fill="#60A5FA"/>
    <text x="100" y="20" class="cognitive-label">推理 (Reasoning)</text>

    <!-- 内容 -->
    <text x="100" y="60" class="title-text" fill="#1E40AF">3. 迭代 (Iterate)</text>
    <line x1="20" y1="75" x2="180" y2="75" stroke="#BFDBFE" stroke-width="1"/>

    <text x="100" y="100" class="concept-text" fill="#2563EB">反思模式 / 自我修正</text>

    <!-- 工具栈 -->
    <rect x="20" y="120" width="160" height="25" rx="4" fill="white" stroke="#60A5FA" stroke-dasharray="2,2"/>
    <text x="100" y="137" class="tech-text" fill="#1E40AF">Reflection, Chain of Thought</text>
  </g>

  <!-- 连接箭头 3 -> 4 -->
  <line x1="730" y1="230" x2="770" y2="230" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ================================================================================== -->
  <!-- 4. 系统层 (System) -->
  <!-- ================================================================================== -->
  <g transform="translate(770, 150)">
    <!-- 卡片背景 -->
    <rect x="0" y="0" width="200" height="160" rx="8" fill="#F3E8FF" stroke="#A855F7" stroke-width="2"/>

    <!-- 顶部标签 -->
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 30 L 0 30 Z" fill="#A855F7"/>
    <text x="100" y="20" class="cognitive-label">编排 (Orchestration)</text>

    <!-- 内容 -->
    <text x="100" y="60" class="title-text" fill="#6B21A8">4. 系统 (System)</text>
    <line x1="20" y1="75" x2="180" y2="75" stroke="#E9D5FF" stroke-width="1"/>

    <text x="100" y="100" class="concept-text" fill="#7E22CE">人机回环 / 路由</text>

    <!-- 工具栈 -->
    <rect x="20" y="120" width="160" height="25" rx="4" fill="white" stroke="#A855F7" stroke-dasharray="2,2"/>
    <text x="100" y="137" class="tech-text" fill="#6B21A8">HITL, Approval Gates</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 反馈闭环 (Iterate -> Express) -->
  <!-- ================================================================================== -->
  <g>
    <!-- 路径：从 Iterate 底部出来，向左回到 Express 底部 -->
    <path d="M 630 310 L 630 360 L 150 360 L 150 320" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>

    <!-- 闭环标签 -->
    <rect x="340" y="345" width="100" height="30" rx="15" fill="#FEE2E2" stroke="#DC2626"/>
    <text x="390" y="365" text-anchor="middle" font-family="Noto Sans" font-size="12" font-weight="bold" fill="#B91C1C">
      自我进化闭环
    </text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="430" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
