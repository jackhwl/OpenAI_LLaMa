<!--
  ================================================================================
  图表名称：MCP 工程化路径：从模型接口到协议接口
  文件命名：module-07-mcp-engineering-path.svg
  描述：
    展示 MCP 带来的工程范式转变：
    1. 左侧 (Model Interface): 传统的 N*M 集成模式，依赖 SDK 和胶水代码 (High Coupling).
    2. 右侧 (Protocol Interface): 基于 MCP 的 1*N 集成模式，依赖标准协议 (Decoupled).
    3. 底部 (Path): 总结从“硬编码”到“动态发现”的工程演进路径.
  SPDX-License-Identifier: MIT AND CC-BY-4.0
  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  ================================================================================
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- ========================================================================= -->
  <!-- DEFINITIONS & STYLES -->
  <!-- ========================================================================= -->
  <defs>
    <style>
      /* 全局字体 */
      .font-sans { font-family: 'Noto Sans', sans-serif; }

      /* 文本样式 */
      .title-main { font-size: 24px; font-weight: 800; fill: #111827; }
      .title-sub { font-size: 16px; font-weight: 400; fill: #6B7280; }

      .text-head { font-size: 18px; font-weight: 700; }
      .text-label { font-size: 14px; font-weight: 700; }
      .text-body { font-size: 12px; font-weight: 400; }
      .text-small { font-size: 11px; font-weight: 400; }

      /* 颜色定义 */
      /* Old Way (Gray/Orange) */
      .box-legacy { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 2px; }
      .text-legacy-title { fill: #4B5563; }
      .conn-messy { stroke: #F97316; stroke-width: 1.5px; stroke-dasharray: 4,2; }

      /* New Way (Blue/Green/Yellow) */
      .box-host { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .box-server { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .box-protocol { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 2px; }

      .text-host { fill: #1E40AF; }
      .text-server { fill: #065F46; }
      .text-protocol { fill: #B45309; }

      .conn-clean { stroke: #111827; stroke-width: 2px; }

      /* Footer Path */
      .path-step { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 1px; }
      .text-step { fill: #1F2937; }
    </style>

    <!-- Markers -->
    <marker id="arrow-messy" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#F97316" />
    </marker>
    <marker id="arrow-clean" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
  </defs>

  <!-- ========================================================================= -->
  <!-- Header -->
  <!-- ========================================================================= -->
  <text x="600" y="50" class="font-sans title-main" text-anchor="middle">
    MCP工程化路径：从模型接口到协议接口
  </text>
  <text x="600" y="80" class="font-sans title-sub" text-anchor="middle">
    Engineering Shift: From "N×M Ad-hoc Integration" to "1×N Protocol Standardization"
  </text>

  <!-- ========================================================================= -->
  <!-- LEFT: OLD PARADIGM (Model Interface) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 130)">
    <!-- Section Title -->
    <text x="250" y="30" class="font-sans text-head text-legacy-title" text-anchor="middle">
      1. 模型接口 (Model Interface)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#9CA3AF" text-anchor="middle">
      "Manual Integration Hell"
    </text>

    <!-- Container -->
    <rect x="0" y="70" width="500" height="400" rx="16" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="8,4"/>

    <!-- App Layer -->
    <g transform="translate(50, 100)">
      <rect x="0" y="0" width="120" height="60" rx="6" class="box-legacy"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">App A (Py)</text>
    </g>
    <g transform="translate(330, 100)">
      <rect x="0" y="0" width="120" height="60" rx="6" class="box-legacy"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">App B (JS)</text>
    </g>

    <!-- Messy Connections (N*M) -->
    <!-- App A connections -->
    <line x1="110" y1="160" x2="80" y2="300" class="conn-messy" marker-end="url(#arrow-messy)"/>
    <line x1="110" y1="160" x2="250" y2="300" class="conn-messy" marker-end="url(#arrow-messy)"/>
    <line x1="110" y1="160" x2="420" y2="300" class="conn-messy" marker-end="url(#arrow-messy)"/>

    <!-- App B connections -->
    <line x1="390" y1="160" x2="80" y2="300" class="conn-messy" marker-end="url(#arrow-messy)"/>
    <line x1="390" y1="160" x2="250" y2="300" class="conn-messy" marker-end="url(#arrow-messy)"/>
    <line x1="390" y1="160" x2="420" y2="300" class="conn-messy" marker-end="url(#arrow-messy)"/>

    <!-- Glue Code Labels -->
    <text x="250" y="230" class="font-sans text-small" fill="#F97316" text-anchor="middle" transform="rotate(-10 250 230)">Glue Code &amp; SDKs</text>

    <!-- Resource Layer -->
    <g transform="translate(20, 300)">
      <rect x="0" y="0" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">Postgres</text>
    </g>
    <g transform="translate(190, 300)">
      <rect x="0" y="0" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">Slack API</text>
    </g>
    <g transform="translate(360, 300)">
      <rect x="0" y="0" width="120" height="60" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
      <text x="60" y="35" class="font-sans text-label text-legacy-title" text-anchor="middle">Local File</text>
    </g>

    <!-- Problem Summary -->
    <text x="250" y="440" class="font-sans text-label text-legacy-title" text-anchor="middle">❌ 紧耦合 (High Coupling)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTER: TRANSITION ARROW -->
  <!-- ========================================================================= -->
  <g transform="translate(565, 300)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#111827" stroke-width="2" marker-end="url(#arrow-clean)"/>
    <text x="35" y="-15" class="font-sans text-label" fill="#111827" text-anchor="middle">工程化 (Eng)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: NEW PARADIGM (Protocol Interface) -->
  <!-- ========================================================================= -->
  <g transform="translate(650, 130)">
    <!-- Section Title -->
    <text x="250" y="30" class="font-sans text-head text-host" text-anchor="middle">
      2. 协议接口 (Protocol Interface)
    </text>
    <text x="250" y="50" class="font-sans text-body" fill="#60A5FA" text-anchor="middle">
      "One Standard to Rule Them All"
    </text>

    <!-- Container -->
    <rect x="0" y="70" width="500" height="400" rx="16" fill="none" stroke="#E5E7EB" stroke-width="2"/>

    <!-- Host Layer -->
    <g transform="translate(50, 100)">
      <rect x="0" y="0" width="120" height="60" rx="6" class="box-host"/>
      <text x="60" y="35" class="font-sans text-label text-host" text-anchor="middle">MCP Host A</text>
    </g>
    <g transform="translate(330, 100)">
      <rect x="0" y="0" width="120" height="60" rx="6" class="box-host"/>
      <text x="60" y="35" class="font-sans text-label text-host" text-anchor="middle">MCP Host B</text>
    </g>

    <!-- PROTOCOL LAYER (The Bridge) -->
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="460" height="50" rx="25" class="box-protocol"/>
      <text x="230" y="30" class="font-sans text-label text-protocol" text-anchor="middle">MCP Protocol (JSON-RPC Channel)</text>
    </g>

    <!-- Clean Connections -->
    <!-- Hosts down to Protocol -->
    <line x1="110" y1="160" x2="110" y2="210" class="conn-clean"/>
    <line x1="390" y1="160" x2="390" y2="210" class="conn-clean"/>

    <!-- Protocol down to Servers -->
    <line x1="80" y1="260" x2="80" y2="300" class="conn-clean"/>
    <line x1="250" y1="260" x2="250" y2="300" class="conn-clean"/>
    <line x1="420" y1="260" x2="420" y2="300" class="conn-clean"/>

    <!-- Server Layer -->
    <g transform="translate(20, 300)">
      <rect x="0" y="0" width="120" height="60" rx="6" class="box-server"/>
      <text x="60" y="25" class="font-sans text-label text-server" text-anchor="middle">Server</text>
      <text x="60" y="45" class="font-sans text-small text-server" text-anchor="middle">(Postgres)</text>
    </g>
    <g transform="translate(190, 300)">
      <rect x="0" y="0" width="120" height="60" rx="6" class="box-server"/>
      <text x="60" y="25" class="font-sans text-label text-server" text-anchor="middle">Server</text>
      <text x="60" y="45" class="font-sans text-small text-server" text-anchor="middle">(Slack)</text>
    </g>
    <g transform="translate(360, 300)">
      <rect x="0" y="0" width="120" height="60" rx="6" class="box-server"/>
      <text x="60" y="25" class="font-sans text-label text-server" text-anchor="middle">Server</text>
      <text x="60" y="45" class="font-sans text-small text-server" text-anchor="middle">(Files)</text>
    </g>

    <!-- Benefit Summary -->
    <text x="250" y="440" class="font-sans text-label text-server" text-anchor="middle">✅ 解耦 (Decoupled &amp; Scalable)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER: THE ENGINEERING PATH -->
  <!-- ========================================================================= -->
  <g transform="translate(150, 620)">
    <rect x="0" y="0" width="900" height="100" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>

    <text x="30" y="45" class="font-sans text-head" fill="#111827">核心路径：</text>

    <!-- Step 1 -->
    <g transform="translate(150, 20)">
      <rect x="0" y="0" width="200" height="40" rx="20" class="path-step"/>
      <text x="100" y="25" class="font-sans text-body text-step" text-anchor="middle">1. 抽象化 (Abstraction)</text>
      <text x="100" y="60" class="font-sans text-small" fill="#6B7280" text-anchor="middle">将功能封装为 Server</text>
    </g>

    <!-- Arrow -->
    <path d="M 370 40 L 400 40" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Step 2 -->
    <g transform="translate(420, 20)">
      <rect x="0" y="0" width="200" height="40" rx="20" class="path-step"/>
      <text x="100" y="25" class="font-sans text-body text-step" text-anchor="middle">2. 标准化 (Standardization)</text>
      <text x="100" y="60" class="font-sans text-small" fill="#6B7280" text-anchor="middle">统一 JSON-RPC 接口</text>
    </g>

    <!-- Arrow -->
    <path d="M 640 40 L 670 40" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Step 3 -->
    <g transform="translate(690, 20)">
      <rect x="0" y="0" width="180" height="40" rx="20" class="path-step"/>
      <text x="90" y="25" class="font-sans text-body text-step" text-anchor="middle">3. 生态化 (Ecosystem)</text>
      <text x="90" y="60" class="font-sans text-small" fill="#6B7280" text-anchor="middle">Client/Server 任意组合</text>
    </g>
  </g>

  <!-- License -->
  <text x="600" y="780" class="font-sans text-body" fill="#64748B" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
