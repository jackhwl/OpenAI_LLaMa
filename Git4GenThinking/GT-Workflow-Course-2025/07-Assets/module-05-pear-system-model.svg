<!--
  文件名：module-05-pear-system-model.svg
  图表名称：PEAR模型系统结构总览
  描述：展示 PEAR (Perceive-Evaluate-Act-Reflect) 智能体系统的核心架构、功能边界与闭环流向。

  核心模块：
  1. Perceive (感知): 负责多模态输入处理与上下文构建。
  2. Evaluate (评估): 负责任务规划、路径选择与可行性判断。
  3. Act (行动): 负责工具调用、内容生成与环境交互。
  4. Reflect (反思): 负责结果校验、错误归因与经验沉淀。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 28px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .phase-title { font-family: 'Noto Sans', sans-serif; font-size: 20px; font-weight: 800; text-anchor: middle; }
      .phase-desc { font-family: 'Noto Sans', sans-serif; font-size: 13px; font-weight: 400; fill: #4B5563; text-anchor: middle; }
      .component-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #374151; text-anchor: middle; }

      .center-text { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #1E40AF; text-anchor: middle; }

      /* 区域背景 */
      .bg-perceive { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .bg-evaluate { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; }
      .bg-act { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .bg-reflect { fill: #F3E8FF; stroke: #A855F7; stroke-width: 2px; }

      /* 组件框 */
      .box-component { fill: white; stroke-width: 1px; rx: 6; }
      .stroke-blue { stroke: #2563EB; }
      .stroke-yellow { stroke: #D97706; }
      .stroke-green { stroke: #059669; }
      .stroke-purple { stroke: #7C3AED; }

      /* 中心枢纽 */
      .center-hub { fill: white; stroke: #9CA3AF; stroke-width: 4px; rx: 50%; }

      /* 连接线 */
      .flow-arrow { fill: none; stroke-width: 2px; stroke-linecap: round; marker-end: url(#arrow-main); }
      .flow-blue { stroke: #2563EB; }
      .flow-yellow { stroke: #FACC15; }
      .flow-green { stroke: #34D399; }
      .flow-purple { stroke: #A855F7; }

      .feedback-loop { fill: none; stroke: #6B7280; stroke-width: 2px; stroke-dasharray: 6,4; marker-end: url(#arrow-gray); }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-main" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="none" stroke="context-stroke" stroke-width="2"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- 1. 标题 -->
  <text x="600" y="60" class="main-title">PEAR模型系统结构总览</text>
  <text x="600" y="90" class="sub-title">智能体认知闭环：感知 (P) → 评估 (E) → 行动 (A) → 反思 (R)</text>

  <!-- ================================================================================== -->
  <!-- 核心结构：四象限布局 (围绕中心) -->
  <!-- ================================================================================== -->

  <!-- 中心：Working Memory (工作记忆) -->
  <g transform="translate(600, 480)">
    <circle r="100" class="center-hub"/>
    <text x="0" y="-15" class="center-text">Working Memory</text>
    <text x="0" y="10" class="phase-desc">Context Window</text>
    <text x="0" y="30" class="phase-desc">State &amp;amp; History</text>
  </g>

  <!-- Quadrant 1: Perceive (Top-Left) -->
  <g transform="translate(250, 180)">
    <!-- Background -->
    <path d="M 0 20 Q 0 0 20 0 L 330 0 Q 350 0 350 20 L 350 230 Q 350 250 330 250 L 20 250 Q 0 250 0 230 Z" class="bg-perceive"/>

    <!-- Title -->
    <text x="175" y="40" class="phase-title" fill="#1E40AF">1. Perceive (感知)</text>
    <text x="175" y="65" class="phase-desc">输入处理与理解</text>

    <!-- Components -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-blue"/>
        <text x="60" y="30" class="component-text">多模态输入</text>

        <rect x="150" y="0" width="120" height="50" class="box-component stroke-blue"/>
        <text x="210" y="30" class="component-text">意图识别</text>

        <rect x="75" y="70" width="120" height="50" class="box-component stroke-blue"/>
        <text x="135" y="100" class="component-text">RAG 检索</text>
    </g>
  </g>

  <!-- Quadrant 2: Evaluate (Top-Right) -->
  <g transform="translate(650, 180)">
    <!-- Background -->
    <path d="M 0 20 Q 0 0 20 0 L 330 0 Q 350 0 350 20 L 350 230 Q 350 250 330 250 L 20 250 Q 0 250 0 230 Z" class="bg-evaluate"/>

    <!-- Title -->
    <text x="175" y="40" class="phase-title" fill="#B45309">2. Evaluate (评估)</text>
    <text x="175" y="65" class="phase-desc">决策与规划</text>

    <!-- Components -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-yellow"/>
        <text x="60" y="30" class="component-text">任务拆解</text>

        <rect x="150" y="0" width="120" height="50" class="box-component stroke-yellow"/>
        <text x="210" y="30" class="component-text">路径路由</text>

        <rect x="75" y="70" width="120" height="50" class="box-component stroke-yellow"/>
        <text x="135" y="100" class="component-text">可行性检查</text>
    </g>
  </g>

  <!-- Quadrant 3: Act (Bottom-Right) -->
  <g transform="translate(650, 530)">
    <!-- Background -->
    <path d="M 0 20 Q 0 0 20 0 L 330 0 Q 350 0 350 20 L 350 230 Q 350 250 330 250 L 20 250 Q 0 250 0 230 Z" class="bg-act"/>

    <!-- Title -->
    <text x="175" y="40" class="phase-title" fill="#047857">3. Act (行动)</text>
    <text x="175" y="65" class="phase-desc">执行与交互</text>

    <!-- Components -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-green"/>
        <text x="60" y="30" class="component-text">工具调用</text>

        <rect x="150" y="0" width="120" height="50" class="box-component stroke-green"/>
        <text x="210" y="30" class="component-text">代码执行</text>

        <rect x="75" y="70" width="120" height="50" class="box-component stroke-green"/>
        <text x="135" y="100" class="component-text">外部 API</text>
    </g>
  </g>

  <!-- Quadrant 4: Reflect (Bottom-Left) -->
  <g transform="translate(250, 530)">
    <!-- Background -->
    <path d="M 0 20 Q 0 0 20 0 L 330 0 Q 350 0 350 20 L 350 230 Q 350 250 330 250 L 20 250 Q 0 250 0 230 Z" class="bg-reflect"/>

    <!-- Title -->
    <text x="175" y="40" class="phase-title" fill="#6B21A8">4. Reflect (反思)</text>
    <text x="175" y="65" class="phase-desc">监控与修正</text>

    <!-- Components -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-purple"/>
        <text x="60" y="30" class="component-text">结果校验</text>

        <rect x="150" y="0" width="120" height="50" class="box-component stroke-purple"/>
        <text x="210" y="30" class="component-text">错误归因</text>

        <rect x="75" y="70" width="120" height="50" class="box-component stroke-purple"/>
        <text x="135" y="100" class="component-text">经验沉淀</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 核心流向 (Main Loop) -->
  <!-- ================================================================================== -->

  <!-- 1. Perceive -> Evaluate -->
  <path d="M 600 305 L 650 305" class="flow-arrow flow-blue" stroke="#2563EB"/>

  <!-- 2. Evaluate -> Act -->
  <path d="M 825 430 L 825 530" class="flow-arrow flow-yellow" stroke="#FACC15"/>

  <!-- 3. Act -> Reflect -->
  <path d="M 650 655 L 600 655" class="flow-arrow flow-green" stroke="#34D399"/>

  <!-- 4. Reflect -> Perceive -->
  <path d="M 425 530 L 425 430" class="flow-arrow flow-purple" stroke="#A855F7"/>

  <!-- ================================================================================== -->
  <!-- 外部交互 (Inputs & Outputs) -->
  <!-- ================================================================================== -->

  <!-- Input -->
  <g transform="translate(50, 305)">
    <rect x="0" y="-25" width="120" height="50" rx="25" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="60" y="5" class="component-text">User Query</text>
    <!-- Arrow to P -->
    <line x1="120" y1="0" x2="200" y2="0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-gray)"/>
  </g>

  <!-- Knowledge Base (Sidecar) -->
  <g transform="translate(100, 600)">
    <rect x="0" y="0" width="100" height="80" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="50" y="35" class="component-text" fill="#B45309">Knowledge</text>
    <text x="50" y="55" class="component-text" fill="#B45309">Base</text>

    <!-- Reflect -> KB -->
    <path d="M 150 50 L 100 50" class="feedback-loop"/>

    <!-- KB -> Perceive (Long Loop) -->
    <path d="M 50 0 L 50 -225 L 150 -225" class="feedback-loop"/>
  </g>

  <!-- Output -->
  <g transform="translate(1050, 655)">
    <rect x="0" y="-25" width="120" height="50" rx="25" fill="#DCFCE7" stroke="#059669" stroke-width="2"/>
    <text x="60" y="5" class="component-text">Final Result</text>
    <!-- Arrow from A -->
    <line x1="-50" y1="0" x2="0" y2="0" stroke="#059669" stroke-width="3" marker-end="url(#arrow-main)" class="flow-green"/>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="850" font-family="Noto Sans" font-size="12" fill="#9CA3AF" text-anchor="middle">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
