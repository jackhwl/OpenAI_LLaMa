<!--
  文件名：module-04-kas-architecture.svg
  图表名称：图4-7 知识即代码（Knowledge as Code）协作架构图
  描述：展示基于 Git 的知识协作工作流，集成人类创作、AI 自动化审查与人机回环（HITL）机制。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  修改记录：
-->
<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      /* 全局文本样式 */
      text { font-family: 'Noto Sans', sans-serif; pointer-events: none; }

      /* 标题样式 */
      .main-title-text { font-size: 22px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title-text { font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }
      .section-title { font-size: 16px; font-weight: 700; fill: #1E3A8A; } /* 蓝色系标题 */

      /* 卡片内文本 */
      .card-title { font-size: 16px; font-weight: 700; fill: #111827; }
      .body-text { font-size: 12px; font-weight: 400; fill: #374151; }
      .small-text { font-size: 11px; font-weight: 400; fill: #6B7280; }
      .tag-text { font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .vertical-label { font-size: 14px; font-weight: 700; fill: #1E40AF; text-anchor: middle; }

      /* 容器背景样式 */
      .frame-bg { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2px; rx: 18; }
      .rail-bg { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 18; }

      /* 标准 DaC 配色方案 */
      /* 蓝色系 (主概念) */
      .box-blue { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 12; }
      .bar-blue { fill: #2563EB; clip-path: inset(0 0 0 0 round 12px 0 0 12px); }

      /* 绿色系 (标准信息/AI) */
      .box-green { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; rx: 12; }
      .bar-green { fill: #34D399; clip-path: inset(0 0 0 0 round 12px 0 0 12px); }

      /* 黄色系 (高亮/系统) */
      .box-yellow { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; rx: 12; }
      .bar-yellow { fill: #FACC15; clip-path: inset(0 0 0 0 round 12px 0 0 12px); }

      /* 连接线 */
      .connector { fill: none; stroke: #94A3B8; stroke-width: 2px; marker-end: url(#arrow-gray); }
      .connector-dashed { fill: none; stroke: #94A3B8; stroke-width: 2px; stroke-dasharray: 5,5; marker-end: url(#arrow-gray); }

      /* Git 元素 */
      .repo-line { stroke: #374151; stroke-width: 4px; stroke-linecap: round; }
      .branch-line { stroke: #2563EB; stroke-width: 3px; stroke-linecap: round; }
      .merge-path { fill: none; stroke: #94A3B8; stroke-width: 2px; marker-end: url(#arrow-gray); }

      /* 底部许可 */
      .license-text { font-size: 12px; fill: #64748B; text-anchor: middle; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- 1. 标题与副标题 -->
  <text x="600" y="60" class="main-title-text">知识即代码Git工作流架构</text>
  <text x="600" y="90" class="sub-title-text">用 Git 的工程机制把知识生产变成可追溯、可协作、可持续演进的系统</text>

  <!-- 图例 (Centered) -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#2563EB"/>
    <text x="24" y="13" class="body-text">人类主导 (Human)</text>

    <rect x="160" y="0" width="16" height="16" rx="4" fill="#34D399"/>
    <text x="184" y="13" class="body-text">AI 辅助 (AI Assist)</text>

    <rect x="340" y="0" width="16" height="16" rx="4" fill="#FACC15"/>
    <text x="364" y="13" class="body-text">系统能力 (System)</text>
  </g>

  <!-- 2. 主框架背景 -->
  <rect x="50" y="160" width="1100" height="520" class="frame-bg"/>

  <!-- 左侧轨道标签 -->
  <rect x="50" y="160" width="50" height="520" class="rail-bg"/>
  <text x="75" y="240" transform="rotate(-90 75 240)" class="vertical-label">协作层</text>
  <text x="75" y="380" transform="rotate(-90 75 380)" class="vertical-label">版本层</text>
  <text x="75" y="520" transform="rotate(-90 75 520)" class="vertical-label">自动化层</text>

  <!-- ================================================================================== -->
  <!-- 协作层 (Top Layer) -->
  <!-- ================================================================================== -->
  <text x="130" y="200" class="section-title">① 协作入口（协作面板）</text>

  <!-- Issue (Blue - Human) -->
  <g transform="translate(130, 220)">
    <rect x="0" y="0" width="220" height="100" class="box-blue"/>
    <rect x="0" y="0" width="8" height="100" class="bar-blue"/>
    <text x="20" y="30" class="card-title">Issue</text>
    <text x="20" y="50" class="body-text">任务与讨论</text>
    <text x="20" y="80" class="small-text">产出: 决策记录</text>
  </g>

  <!-- Branch (Green - Experimental/AI Assist potential) -->
  <g transform="translate(390, 220)">
    <rect x="0" y="0" width="220" height="100" class="box-green"/>
    <rect x="0" y="0" width="8" height="100" class="bar-green"/>
    <text x="20" y="30" class="card-title">Branch</text>
    <text x="20" y="50" class="body-text">并行修改与隔离</text>
    <text x="20" y="80" class="small-text">产出: 知识演进</text>
  </g>

  <!-- PR (Blue - Human Decision) -->
  <g transform="translate(650, 220)">
    <rect x="0" y="0" width="220" height="100" class="box-blue"/>
    <rect x="0" y="0" width="8" height="100" class="bar-blue"/>
    <text x="20" y="30" class="card-title">Pull Request</text>
    <text x="20" y="50" class="body-text">提交与变更说明</text>
    <text x="20" y="80" class="small-text">产出: 发布单元</text>
  </g>

  <!-- Review (Yellow - Quality Gate) -->
  <g transform="translate(910, 220)">
    <rect x="0" y="0" width="200" height="100" class="box-yellow"/>
    <rect x="0" y="0" width="8" height="100" class="bar-yellow"/>
    <text x="20" y="30" class="card-title">Review</text>
    <text x="20" y="50" class="body-text">人评 + 机评</text>
    <text x="20" y="80" class="small-text">产出: 质量门槛</text>
  </g>

  <!-- 连接线 -->
  <path d="M 350 270 L 390 270" class="connector"/>
  <path d="M 610 270 L 650 270" class="connector"/>
  <path d="M 870 270 L 910 270" class="connector"/>

  <!-- ================================================================================== -->
  <!-- 版本层 (Middle Layer) -->
  <!-- ================================================================================== -->
  <text x="130" y="360" class="section-title">② 版本底座（知识仓库）</text>

  <!-- Repo Container covering Issue/Branch/PR width -->
  <g transform="translate(130, 380)">
    <rect x="0" y="0" width="740" height="140" rx="12" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <text x="20" y="30" class="card-title">Git Repository (知识资产库)</text>
    <text x="20" y="50" class="small-text">Markdown 笔记 · 数据集 · 图谱链接 · 提示词模板</text>

    <!-- Git Graph Visualization -->
    <g transform="translate(20, 90)">
        <!-- Main Branch -->
        <line x1="0" y1="0" x2="680" y2="0" class="repo-line"/>
        <text x="690" y="5" class="small-text" fill="#111827">main</text>

        <!-- Feature Branch -->
        <path d="M 50 0 C 80 0 80 30 110 30 L 300 30 C 330 30 330 0 360 0" fill="none" stroke="#2563EB" stroke-width="3"/>
        <text x="200" y="45" class="small-text" fill="#2563EB" text-anchor="middle">feat/branch</text>

        <!-- Draft Branch -->
        <path d="M 400 0 C 430 0 430 30 460 30 L 550 30" fill="none" stroke="#2563EB" stroke-width="3"/>
    </g>

    <!-- Traceability Badge -->
    <rect x="580" y="15" width="140" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="650" y="31" class="small-text" fill="#1E40AF" text-anchor="middle">Traceability: Commit/Diff</text>
  </g>

  <!-- PR -> Repo 连接 -->
  <path d="M 760 320 L 760 350 L 500 350 L 500 380" class="connector"/>

  <!-- ================================================================================== -->
  <!-- 自动化层 (Right Layer) -->
  <!-- ================================================================================== -->
  <text x="910" y="360" class="section-title">③ 自动化与质量门槛</text>

  <!-- CI (Yellow) -->
  <g transform="translate(910, 380)">
    <rect x="0" y="0" width="200" height="70" class="box-yellow"/>
    <rect x="0" y="0" width="8" height="70" class="bar-yellow"/>
    <text x="20" y="30" class="card-title">CI Pipeline</text>
    <text x="20" y="50" class="small-text">Lint / Check / Build</text>
  </g>

  <!-- AI Reviewer (Green) -->
  <g transform="translate(910, 470)">
    <rect x="0" y="0" width="200" height="100" class="box-green"/>
    <rect x="0" y="0" width="8" height="100" class="bar-green"/>
    <text x="20" y="30" class="card-title">AI Reviewer</text>
    <text x="20" y="50" class="body-text">一致性/引用/格式检查</text>
    <text x="20" y="80" class="small-text">自动化反馈</text>
  </g>

  <!-- Human-in-loop (Blue) -->
  <g transform="translate(910, 590)">
    <rect x="0" y="0" width="200" height="60" class="box-blue"/>
    <rect x="0" y="0" width="8" height="60" class="bar-blue"/>
    <text x="20" y="25" class="card-title" font-size="14">Human-in-loop</text>
    <text x="20" y="45" class="small-text">最终决策 / 合并</text>
  </g>

  <!-- 连接线 -->
  <path d="M 870 450 L 890 450 L 890 415 L 910 415" class="connector"/> <!-- Repo -> CI -->
  <path d="M 1010 450 L 1010 470" class="connector"/> <!-- CI -> AI -->
  <path d="M 1010 570 L 1010 590" class="connector"/> <!-- AI -> Human -->

  <!-- 反馈回环 -->
  <path d="M 910 620 L 80 620 L 80 270 L 130 270" class="connector-dashed"/>
  <rect x="350" y="610" width="400" height="20" rx="4" fill="white" stroke="none"/>
  <text x="550" y="624" class="small-text" text-anchor="middle">反馈回路：评审意见 / 质量问题 / 新证据 → 回到 Issue 进入下一轮迭代</text>

  <!-- 底部 Callout -->
  <g transform="translate(130, 560)">
    <rect x="0" y="0" width="740" height="30" rx="4" fill="#EEF2FF"/>
    <text x="370" y="20" class="small-text" fill="#1E40AF" text-anchor="middle">架构价值：可追溯 (Traceable) · 可审查 (Reviewable) · 可回滚 (Revertible) · 可持续 (Sustainable)</text>
  </g>

  <!-- 3. 底部许可 -->
  <text x="600" y="745" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
