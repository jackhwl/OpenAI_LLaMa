<!--
================================================================================
图表名称：课程理论框架总结：从信息到智能体
图表文件名：module08-course-theoretical-framework-summary.svg
描述：基于第八章讲义，展示从DIKW到DIKWA的价值链演变、I-S-I-G-E与SCORE核心方法论、
      以及智能体设计模式与未来演进的完整理论框架。
SPDX-License-Identifier: MIT AND CC-BY-4.0
设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
================================================================================
-->
<svg width="1200" height="1000" viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" style="background-color: white; font-family: 'Noto Sans', sans-serif, Arial;">
  <!-- 定义样式变量（通过内联样式应用，此处仅作参考） -->
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FACC15" />
    </marker>
  </defs>

  <!-- ==================== 1. 标题区域 ==================== -->
  <g id="header" transform="translate(600, 50)">
    <text x="0" y="0" text-anchor="middle" font-size="22" font-weight="800" fill="#111827" style="letter-spacing: 1px;">课程理论框架总结：从信息到智能体</text>
  </g>

  <!-- ==================== 2. 价值链重构层 (DIKW -> DIKWA) ==================== -->
  <g id="value-chain" transform="translate(100, 120)">
    <!-- 区域背景 -->
    <rect x="-20" y="-20" width="1040" height="180" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#111827">1. 价值链重构：从 DIKW 到 DIKWA</text>

    <!-- 流程图 -->
    <g transform="translate(50, 40)">
      <!-- Data -->
      <rect x="0" y="0" width="140" height="80" rx="4" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
      <text x="70" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Data</text>
      <text x="70" y="55" text-anchor="middle" font-size="11" fill="#374151">全域感知</text>

      <!-- Arrow -->
      <line x1="140" y1="40" x2="190" y2="40" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Information -->
      <rect x="200" y="0" width="140" height="80" rx="4" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
      <text x="270" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Information</text>
      <text x="270" y="55" text-anchor="middle" font-size="11" fill="#374151">动态合成</text>

      <!-- Arrow -->
      <line x1="340" y1="40" x2="390" y2="40" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Knowledge -->
      <rect x="400" y="0" width="140" height="80" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
      <text x="470" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Knowledge</text>
      <text x="470" y="55" text-anchor="middle" font-size="11" fill="#374151">外部化大脑</text>

      <!-- Arrow -->
      <line x1="540" y1="40" x2="590" y2="40" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <!-- Wisdom -->
      <rect x="600" y="0" width="140" height="80" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
      <text x="670" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Wisdom</text>
      <text x="670" y="55" text-anchor="middle" font-size="11" fill="#374151">概率推理</text>

      <!-- Arrow (Highlight) -->
      <line x1="740" y1="40" x2="790" y2="40" stroke="#FACC15" stroke-width="3" marker-end="url(#arrow-yellow)"/>

      <!-- Action (Highlight Box) -->
      <rect x="800" y="-10" width="150" height="100" rx="4" fill="#FEF9C3" stroke="#FACC15" stroke-width="3"/>
      <text x="875" y="35" text-anchor="middle" font-size="16" font-weight="800" fill="#111827">ACTION</text>
      <text x="875" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#B45309">闭环执行</text>
      <text x="875" y="75" text-anchor="middle" font-size="10" fill="#B45309">核心跃迁</text>
    </g>
  </g>

  <!-- ==================== 3. 核心方法论层 ==================== -->
  <g id="methodology" transform="translate(100, 330)">
    <!-- 区域背景 -->
    <rect x="-20" y="-20" width="1040" height="280" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#111827">2. 核心方法论：工程化思维与动态知识</text>

    <!-- 3.1 SCORE (Macro) -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="280" height="180" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E40AF">宏观策略：SCORE 模型</text>
      <text x="140" y="50" text-anchor="middle" font-size="11" fill="#1E40AF">定义正确的问题 (作战地图)</text>

      <g transform="translate(20, 70)">
        <text x="0" y="10" font-size="12" font-weight="bold" fill="#111827">S - Situation</text><text x="100" y="10" font-size="11" fill="#374151">背景信息</text>
        <text x="0" y="30" font-size="12" font-weight="bold" fill="#111827">C - Complication</text><text x="100" y="30" font-size="11" fill="#374151">痛点障碍</text>
        <text x="0" y="50" font-size="12" font-weight="bold" fill="#111827">O - Objective</text><text x="100" y="50" font-size="11" fill="#374151">最终目标</text>
        <text x="0" y="70" font-size="12" font-weight="bold" fill="#111827">R - Role</text><text x="100" y="70" font-size="11" fill="#374151">角色定位</text>
        <text x="0" y="90" font-size="12" font-weight="bold" fill="#111827">E - Expectation</text><text x="100" y="90" font-size="11" fill="#374151">交付标准</text>
      </g>
    </g>

    <!-- Connector -->
    <line x1="300" y1="140" x2="350" y2="140" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4"/>

    <!-- 3.2 I-S-I-G-E (Micro) -->
    <g transform="translate(350, 50)">
      <rect x="0" y="0" width="280" height="180" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <text x="140" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E40AF">微观结构：I-S-I-G-E 模型</text>
      <text x="140" y="50" text-anchor="middle" font-size="11" fill="#1E40AF">精准指令构建 (手术刀)</text>

      <g transform="translate(20, 70)">
        <text x="0" y="10" font-size="12" font-weight="bold" fill="#111827">I - Instruction</text><text x="100" y="10" font-size="11" fill="#374151">核心指令</text>
        <text x="0" y="30" font-size="12" font-weight="bold" fill="#111827">S - Style</text><text x="100" y="30" font-size="11" fill="#374151">风格设定</text>
        <text x="0" y="50" font-size="12" font-weight="bold" fill="#111827">I - Input</text><text x="100" y="50" font-size="11" fill="#374151">输入数据</text>
        <text x="0" y="70" font-size="12" font-weight="bold" fill="#111827">G - Guidelines</text><text x="100" y="70" font-size="11" fill="#374151">规则约束</text>
        <text x="0" y="90" font-size="12" font-weight="bold" fill="#111827">E - Example</text><text x="100" y="90" font-size="11" fill="#374151">示例样本</text>
      </g>
    </g>

    <!-- Connector -->
    <line x1="630" y1="140" x2="680" y2="140" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4"/>

    <!-- 3.3 Agentic RAG -->
    <g transform="translate(680, 50)">
      <rect x="0" y="0" width="300" height="180" rx="4" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
      <text x="150" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#065F46">Agentic RAG：动态知识</text>
      <text x="150" y="50" text-anchor="middle" font-size="11" fill="#065F46">Just-in-Time 知识激活</text>

      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="120" height="60" rx="4" fill="white" stroke="#34D399" stroke-width="1"/>
        <text x="60" y="25" text-anchor="middle" font-size="11" fill="#374151">静态文档</text>
        <text x="60" y="45" text-anchor="middle" font-size="10" fill="#6B7280">(Just-in-Case)</text>

        <line x1="120" y1="30" x2="140" y2="30" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

        <rect x="140" y="0" width="120" height="60" rx="4" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>
        <text x="200" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#B45309">动态审问</text>
        <text x="200" y="35" text-anchor="middle" font-size="9" fill="#B45309">反思与规划</text>
        <text x="200" y="50" text-anchor="middle" font-size="9" fill="#B45309">解决具体问题</text>
      </g>
    </g>
  </g>

  <!-- ==================== 4. 设计模式与演进层 ==================== -->
  <g id="patterns-future" transform="translate(100, 650)">
    <!-- 区域背景 -->
    <rect x="-20" y="-20" width="1040" height="260" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#111827">3. 设计模式与未来演进</text>

    <!-- 4.1 四大设计模式 -->
    <g transform="translate(20, 40)">
      <text x="0" y="20" font-size="14" font-weight="bold" fill="#111827">Agentic Design Patterns</text>

      <!-- Pattern 1: Reflection -->
      <g transform="translate(0, 40)">
        <rect x="0" y="0" width="220" height="60" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
        <text x="10" y="25" font-size="12" font-weight="bold" fill="#111827">1. 反思 (Reflection)</text>
        <text x="10" y="45" font-size="10" fill="#374151">生成者 vs 批评者循环，打破幻觉</text>
      </g>

      <!-- Pattern 2: Tool Use -->
      <g transform="translate(240, 40)">
        <rect x="0" y="0" width="220" height="60" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
        <text x="10" y="25" font-size="12" font-weight="bold" fill="#111827">2. 工具使用 (Tool Use)</text>
        <text x="10" y="45" font-size="10" fill="#374151">调用API/执行代码，从纸上谈兵到实干</text>
      </g>

      <!-- Pattern 3: Planning -->
      <g transform="translate(0, 110)">
        <rect x="0" y="0" width="220" height="60" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
        <text x="10" y="25" font-size="12" font-weight="bold" fill="#111827">3. 规划 (Planning)</text>
        <text x="10" y="45" font-size="10" fill="#374151">任务拆解与动态重规划，提升韧性</text>
      </g>

      <!-- Pattern 4: Multi-agent -->
      <g transform="translate(240, 110)">
        <rect x="0" y="0" width="220" height="60" rx="4" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
        <text x="10" y="25" font-size="12" font-weight="bold" fill="#111827">4. 多智能体 (Multi-agent)</text>
        <text x="10" y="45" font-size="10" fill="#374151">层级模式/蜂群模式，涌现智慧</text>
      </g>
    </g>

    <!-- 4.2 演进与角色 -->
    <g transform="translate(520, 40)">
      <text x="0" y="20" font-size="14" font-weight="bold" fill="#111827">协作生态演进</text>

      <!-- Timeline Base -->
      <line x1="20" y1="90" x2="440" y2="90" stroke="#E5E7EB" stroke-width="4"/>

      <!-- Phase 1: Tools -->
      <circle cx="50" cy="90" r="8" fill="#34D399"/>
      <text x="50" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Tools</text>
      <text x="50" y="115" text-anchor="middle" font-size="10" fill="#374151">工具 (意图导向)</text>

      <!-- Phase 2: Partners -->
      <circle cx="230" cy="90" r="8" fill="#34D399"/>
      <text x="230" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Partners</text>
      <text x="230" y="115" text-anchor="middle" font-size="10" fill="#374151">伙伴 (人机协作)</text>

      <!-- Phase 3: Teams -->
      <circle cx="410" cy="90" r="8" fill="#FACC15"/>
      <text x="410" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">Teams</text>
      <text x="410" y="115" text-anchor="middle" font-size="10" fill="#374151">团队 (目标导向)</text>

      <!-- Human Role Shift -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="460" height="50" rx="4" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>
        <text x="230" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#B45309">人类角色的终极转变</text>
        <text x="120" y="40" text-anchor="middle" font-size="12" fill="#111827">Operator (操作者)</text>
        <line x1="180" y1="35" x2="280" y2="35" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-yellow)"/>
        <text x="340" y="40" text-anchor="middle" font-size="12" font-weight="800" fill="#111827">Supervisor (监督者)</text>
      </g>
    </g>
  </g>

  <!-- ==================== 5. 许可声明 ==================== -->
  <text x="600" y="960" text-anchor="middle" class="license-text" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
