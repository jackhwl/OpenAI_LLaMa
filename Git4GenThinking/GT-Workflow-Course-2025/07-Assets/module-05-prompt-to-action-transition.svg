<!--
  文件名：module-05-prompt-to-action-transition.svg
  图表名称：Agent能力跃迁：Prompt → Action
  描述：展示从传统的 Prompt 交互范式向 Agent 行动范式的能力跃迁，强调 LLM 从“输出终点”向“系统组件”的职能转变。

  核心对比：
  1. Prompt 范式 (左): 线性生成，LLM 是终点，输出为文本。
  2. Action 范式 (右): 循环决策，LLM 是中枢，输出为行动指令 (Action)。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .panel-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .node-text { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .desc-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }

      /* 区域背景 */
      .bg-prompt { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 12; }
      .bg-action { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; rx: 12; }

      /* 节点样式 */
      .node-box { fill: white; stroke: #2563EB; stroke-width: 2px; rx: 6; }
      .node-core { fill: white; stroke: #059669; stroke-width: 2px; rx: 50%; }
      .node-tool { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; rx: 6; }

      /* 连接线 */
      .flow-line { fill: none; stroke: #94A3B8; stroke-width: 2px; marker-end: url(#arrow-gray); }
      .action-line { fill: none; stroke: #059669; stroke-width: 2px; marker-end: url(#arrow-green); }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#059669"/>
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">智能体从推理到行动的能力跃迁</text>
  <text x="600" y="80" class="sub-title">重定位 LLM：从“生成文本的作家”到“指挥系统的将军”</text>

  <!-- ================================================================================== -->
  <!-- 左侧：Prompt 范式 (The Writer) -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="400" height="400" class="bg-prompt"/>
    <text x="200" y="40" class="panel-title" fill="#1E40AF">Prompt 范式 (生成)</text>
    <text x="200" y="60" class="desc-text" fill="#1E40AF">Generate Text</text>

    <!-- 流程 -->
    <g transform="translate(50, 150)">
        <!-- Input -->
        <rect x="0" y="30" width="80" height="40" class="node-box"/>
        <text x="40" y="55" class="node-text" fill="#1E40AF">Input</text>

        <!-- LLM (End Point) -->
        <rect x="110" y="0" width="100" height="100" class="node-box" stroke-width="3"/>
        <text x="160" y="45" class="node-text" fill="#1E40AF" font-size="16">LLM</text>
        <text x="160" y="70" class="desc-text">(Black Box)</text>

        <!-- Output -->
        <rect x="240" y="30" width="80" height="40" class="node-box"/>
        <text x="280" y="55" class="node-text" fill="#1E40AF">Text</text>

        <!-- Arrows -->
        <line x1="80" y1="50" x2="110" y2="50" class="flow-line"/>
        <line x1="210" y1="50" x2="240" y2="50" class="flow-line"/>
    </g>

    <!-- 特征描述 -->
    <g transform="translate(200, 320)">
        <text x="0" y="0" class="node-text" fill="#4B5563">系统角色：终点 (Endpoint)</text>
        <text x="0" y="25" class="node-text" fill="#4B5563">输出形态：非结构化文本</text>
        <text x="0" y="50" class="node-text" fill="#4B5563">能力边界：知识问答</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 中间：跃迁箭头 -->
  <!-- ================================================================================== -->
  <g transform="translate(520, 300)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#9CA3AF" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <text x="80" y="-20" class="node-text" fill="#059669">Cognitive Shift</text>
    <text x="80" y="35" class="desc-text">引入推理与行动</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 右侧：Action 范式 (The Commander) -->
  <!-- ================================================================================== -->
  <g transform="translate(680, 150)">
    <rect x="0" y="0" width="420" height="400" class="bg-action"/>
    <text x="210" y="40" class="panel-title" fill="#065F46">Action 范式 (行动)</text>
    <text x="210" y="60" class="desc-text" fill="#065F46">Take Action</text>

    <!-- 流程 -->
    <g transform="translate(30, 120)">
        <!-- Input -->
        <rect x="-10" y="50" width="60" height="40" class="node-box" stroke="#059669"/>
        <text x="20" y="75" class="node-text" fill="#065F46">Goal</text>

        <!-- LLM (Core Component) -->
        <circle cx="120" cy="70" r="40" class="node-core"/>
        <text x="120" y="65" class="node-text" fill="#065F46">LLM</text>
        <text x="120" y="85" class="desc-text">Brain</text>

        <!-- Decision/Plan -->
        <rect x="190" y="50" width="80" height="40" class="node-box" stroke="#059669" stroke-dasharray="4,2"/>
        <text x="230" y="75" class="desc-text" fill="#065F46">Reasoning</text>

        <!-- Action (Tool) -->
        <rect x="300" y="40" width="80" height="60" class="node-tool"/>
        <text x="340" y="65" class="node-text" fill="#B45309">Action</text>
        <text x="340" y="85" class="desc-text">API Call</text>

        <!-- Environment Feedback -->
        <path d="M 340 100 L 340 130 L 120 130 L 120 110" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
        <text x="230" y="145" class="desc-text" fill="#059669">Observation (反馈)</text>

        <!-- Arrows -->
        <line x1="50" y1="70" x2="80" y2="70" class="action-line"/>
        <line x1="160" y1="70" x2="190" y2="70" class="action-line"/>
        <line x1="270" y1="70" x2="300" y2="70" class="action-line"/>
    </g>

    <!-- 特征描述 -->
    <g transform="translate(210, 320)">
        <text x="0" y="0" class="node-text" fill="#065F46">系统角色：组件 (Component)</text>
        <text x="0" y="25" class="node-text" fill="#065F46">输出形态：结构化指令 (JSON)</text>
        <text x="0" y="50" class="node-text" fill="#065F46">能力边界：任务执行</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部：核心观点 -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 600)">
    <line x1="0" y1="-10" x2="1000" y2="0" stroke="#E5E7EB" stroke-width="2"/>
    <text x="500" y="30" class="node-text" font-size="16" fill="#111827">
      “模型不是 Agent，正如 CPU 不是计算机。Agent 是围绕模型构建的行动系统。”
    </text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="680" class="desc-text" fill="#94A3B8">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
