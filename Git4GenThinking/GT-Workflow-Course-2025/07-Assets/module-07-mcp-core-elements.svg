<!--
  图表名称：MCP 核心三要素架构图
  图表名称：module-07-mcp-core-elements.
  描述：展示模型上下文协议（MCP）中 Context, Tool, Contract 的定义及其相互关系。
  设计决策：
  - 采用中心辐射结构，突出 Contract 作为连接 Context 与 Tool 的纽带作用。
  - 遵循 Gitconomy 调色板，确保视觉风格一致。
  - 添加详细的 <desc> 标签，增强文档的可访问性。
-->
<svg width="800" height="620" viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-title mcp-desc">
  <title id="mcp-title">MCP 核心要素：Context, Tool, Contract</title>
  <desc id="mcp-desc">图表展示了 MCP 协议的三大支柱：Context 提供背景，Tool 提供能力，Contract 定义标准。</desc>

  <defs>
    <style>
      :root {
        /* Gitconomy 规范配色 */
        --color-context-fill: #EFF6FF;
        --color-context-stroke: #3B82F6;
        --color-tool-fill: #F0FDF4;
        --color-tool-stroke: #10B981;
        --color-contract-fill: #FEF9C3;
        --color-contract-stroke: #EAB308;

        --text-main: #111827;
        --text-secondary: #4B5563;
        --font-main: 'Noto Sans SC', sans-serif;
      }

      text { font-family: var(--font-main); }
      .title { font-size: 28px; font-weight: 800; fill: var(--text-main); }
      .element-name { font-size: 20px; font-weight: 700; fill: var(--text-main); }
      .desc-text { font-size: 14px; font-weight: 400; fill: var(--text-secondary); line-height: 1.5; }
      .badge { font-size: 12px; font-weight: 700; fill: #FFF; }

      .box { stroke-width: 2; rx: 12; ry: 12; }
      .connector { stroke: #D1D5DB; stroke-width: 1.5; fill: none;}
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="#FFFFFF" />

  <!-- 页面标题 -->
  <text x="400" y="60" text-anchor="middle" class="title">MCP协议架构核心三要素</text>

  <!-- 中心枢纽：Contract (契约) -->
  <g transform="translate(250, 240)">
    <rect width="300" height="120" class="box" fill="var(--color-contract-fill)" stroke="var(--color-contract-stroke)" />
    <text x="150" y="45" text-anchor="middle" class="element-name">Contract (契约/标准)</text>
    <text x="150" y="75" text-anchor="middle" class="desc-text">定义数据交换格式与能力清单</text>
    <text x="150" y="95" text-anchor="middle" class="desc-text">JSON-RPC / Schema 规范</text>
    <!-- 装饰图标：文档 -->
    <rect x="20" y="20" width="24" height="30" rx="2" fill="#FDE047" stroke="var(--color-contract-stroke)" stroke-width="1" />
  </g>

  <!-- 上方：Context (上下文) -->
  <g transform="translate(100, 120)">
    <rect width="250" height="100" class="box" fill="var(--color-context-fill)" stroke="var(--color-context-stroke)" />
    <text x="125" y="40" text-anchor="middle" class="element-name">Context (上下文)</text>
    <text x="125" y="65" text-anchor="middle" class="desc-text">资源状态、环境变量、会话历史</text>
    <text x="125" y="85" text-anchor="middle" class="desc-text">“AI 应该知道什么？”</text>
  </g>

  <!-- 下方：Tool (工具) -->
  <g transform="translate(450, 380)">
    <rect width="250" height="100" class="box" fill="var(--color-tool-fill)" stroke="var(--color-tool-stroke)" />
    <text x="125" y="40" text-anchor="middle" class="element-name">Tool (工具/能力)</text>
    <text x="125" y="65" text-anchor="middle" class="desc-text">可调用的 API、函数、操作指令</text>
    <text x="125" y="85" text-anchor="middle" class="desc-text">“AI 能做什么？”</text>
  </g>

  <!-- 连接线 -->
  <!-- Context to Contract -->
  <path d="M225,220 L225,300 L250,300" class="connector" marker-end="url(#arrow)" />
  <text x="180" y="260" text-anchor="middle" class="desc-text" font-style="italic">资源挂载</text>

  <!-- Tool to Contract -->
  <path d="M575,380 L575,300 L550,300" class="connector" marker-end="url(#arrow)" />
  <text x="620" y="340" text-anchor="middle" class="desc-text" font-style="italic">能力注册</text>

  <!-- 说明性注解 -->
  <g transform="translate(50, 480)">
    <rect width="700" height="80" rx="8" fill="#F9FAFB" stroke="#E5E7EB" />
    <text x="20" y="35" class="label-bold" style="font-weight:700; fill:var(--text-main);">核心逻辑：</text>
    <text x="20" y="60" class="desc-text">通过 Contract 屏蔽底层差异，使 Context 能够自动化注入模型，Tool 能够标准化被调用。</text>
  </g>

  <!-- 页脚 -->
  <text x="400" y="600" text-anchor="middle" class="desc-text" style="font-size:10px;">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>
</svg>
