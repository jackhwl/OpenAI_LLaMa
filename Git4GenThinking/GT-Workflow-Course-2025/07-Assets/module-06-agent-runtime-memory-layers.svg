<!--
  文件名：module-06-agent-runtime-memory-layers.svg
  图表名称：Agent 运行时记忆分层示意图
  描述：展示 Agent 运行时的三层记忆结构（工作记忆、任务记忆、长期记忆），明确各自的时间尺度、工程载体及交互关系。

  核心分层：
  1. Working Memory (工作记忆): 瞬时上下文，直接参与推理 (Context Window)。
  2. Task Memory (任务记忆): 任务周期的状态保持 (State/Variables)。
  3. Long-term Memory (长期记忆): 永久存储的知识与经验 (Vector/Graph/Files)。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .layer-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .layer-subtitle { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 400; text-anchor: middle; fill: #4B5563; }
      .tech-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; fill: #374151; text-anchor: middle; }

      .axis-label { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #6B7280; text-anchor: start; }

      /* 区域背景 */
      .bg-working { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 8; }
      .bg-task { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; rx: 8; }
      .bg-longterm { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; rx: 8; }

      /* 模块框 */
      .box-component { fill: white; stroke-width: 1px; rx: 4; }
      .stroke-blue { stroke: #2563EB; }
      .stroke-yellow { stroke: #D97706; }
      .stroke-green { stroke: #059669; }

      /* 连接线 */
      .flow-arrow { fill: none; stroke: #94A3B8; stroke-width: 2px; marker-end: url(#arrow-gray); }
      .retrieve-arrow { fill: none; stroke: #2563EB; stroke-width: 2px; marker-end: url(#arrow-blue); stroke-dasharray: 4,4; }
      .save-arrow { fill: none; stroke: #059669; stroke-width: 2px; marker-end: url(#arrow-green); }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563EB"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#059669"/>
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">智能体运行时记忆分层示意图</text>
  <text x="600" y="80" class="sub-title">记忆是系统结构，不是简单的“缓存堆积”</text>

  <!-- 左侧：时间/容量轴 -->
  <g transform="translate(100, 150)">
    <line x1="0" y1="0" x2="0" y2="550" stroke="#E5E7EB" stroke-width="4" marker-end="url(#arrow-gray)"/>

    <text x="10" y="50" class="axis-label" fill="#1E40AF">快 / 小 (Fast/Small)</text>
    <text x="10" y="500" class="axis-label" fill="#065F46">慢 / 无限 (Slow/Infinite)</text>

    <text x="-20" y="275" class="axis-label" transform="rotate(-90, -20, 275)" text-anchor="middle">容量 &amp; 持久性 (Capacity &amp; Persistence)</text>
  </g>

  <!-- ================================================================================== -->
  <!-- Layer 1: Working Memory (Top) -->
  <!-- ================================================================================== -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="600" height="150" class="bg-working"/>
    <text x="300" y="35" class="layer-title" fill="#1E40AF">1. Working Memory (工作记忆)</text>
    <text x="300" y="55" class="layer-subtitle">当前注意力的焦点 (Attention)</text>

    <!-- Components -->
    <g transform="translate(100, 70)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-blue"/>
        <text x="60" y="20" class="tech-text" font-weight="bold">System Prompt</text>
        <text x="60" y="40" class="tech-text">角色/规则</text>
    </g>

    <g transform="translate(240, 70)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-blue"/>
        <text x="60" y="20" class="tech-text" font-weight="bold">User Query</text>
        <text x="60" y="40" class="tech-text">当前指令</text>
    </g>

    <g transform="translate(380, 70)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-blue"/>
        <text x="60" y="20" class="tech-text" font-weight="bold">Recent Chat</text>
        <text x="60" y="40" class="tech-text">短期对话历史</text>
    </g>

    <!-- 标签 -->
    <rect x="520" y="10" width="70" height="20" rx="4" fill="#DBEAFE"/>
    <text x="555" y="24" class="tech-text" font-weight="bold" fill="#1E40AF">Hot</text>
  </g>

  <!-- ================================================================================== -->
  <!-- Layer 2: Task Memory (Middle) -->
  <!-- ================================================================================== -->
  <g transform="translate(300, 300)">
    <rect x="0" y="0" width="600" height="150" class="bg-task"/>
    <text x="300" y="35" class="layer-title" fill="#854D0E">2. Task Memory (任务记忆)</text>
    <text x="300" y="55" class="layer-subtitle">任务生命周期内的状态维持 (State)</text>

    <!-- Components -->
    <g transform="translate(100, 70)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-yellow"/>
        <text x="60" y="20" class="tech-text" font-weight="bold">Plan / Todo</text>
        <text x="60" y="40" class="tech-text">任务清单</text>
    </g>

    <g transform="translate(240, 70)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-yellow"/>
        <text x="60" y="20" class="tech-text" font-weight="bold">Variables</text>
        <text x="60" y="40" class="tech-text">中间变量/草稿</text>
    </g>

    <g transform="translate(380, 70)">
        <rect x="0" y="0" width="120" height="50" class="box-component stroke-yellow"/>
        <text x="60" y="20" class="tech-text" font-weight="bold">Tool Output</text>
        <text x="60" y="40" class="tech-text">工具执行结果</text>
    </g>

    <!-- 标签 -->
    <rect x="520" y="10" width="70" height="20" rx="4" fill="#FEF3C7"/>
    <text x="555" y="24" class="tech-text" font-weight="bold" fill="#92400E">Warm</text>
  </g>

  <!-- ================================================================================== -->
  <!-- Layer 3: Long-term Memory (Bottom) -->
  <!-- ================================================================================== -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="600" height="200" class="bg-longterm"/>
    <text x="300" y="35" class="layer-title" fill="#047857">3. Long-term Memory (长期记忆)</text>
    <text x="300" y="55" class="layer-subtitle">持久化存储的知识与经验 (Storage)</text>

    <!-- Components -->
    <g transform="translate(50, 70)">
        <rect x="0" y="0" width="140" height="100" class="box-component stroke-green"/>
        <text x="70" y="25" class="tech-text" font-weight="bold" font-size="12">Episodic (情景)</text>
        <line x1="20" y1="35" x2="120" y2="35" stroke="#E5E7EB" stroke-width="1"/>
        <text x="70" y="55" class="tech-text">过往经历</text>
        <text x="70" y="75" class="tech-text">Case Study</text>
        <text x="70" y="90" class="tech-text" fill="#6B7280">(Vector DB)</text>
    </g>

    <g transform="translate(230, 70)">
        <rect x="0" y="0" width="140" height="100" class="box-component stroke-green"/>
        <text x="70" y="25" class="tech-text" font-weight="bold" font-size="12">Semantic (语义)</text>
        <line x1="20" y1="35" x2="120" y2="35" stroke="#E5E7EB" stroke-width="1"/>
        <text x="70" y="55" class="tech-text">事实知识</text>
        <text x="70" y="75" class="tech-text">World Model</text>
        <text x="70" y="90" class="tech-text" fill="#6B7280">(Graph/Docs)</text>
    </g>

    <g transform="translate(410, 70)">
        <rect x="0" y="0" width="140" height="100" class="box-component stroke-green"/>
        <text x="70" y="25" class="tech-text" font-weight="bold" font-size="12">Procedural (程序)</text>
        <line x1="20" y1="35" x2="120" y2="35" stroke="#E5E7EB" stroke-width="1"/>
        <text x="70" y="55" class="tech-text">SOP / 技能</text>
        <text x="70" y="75" class="tech-text">Few-Shot 库</text>
        <text x="70" y="90" class="tech-text" fill="#6B7280">(Code/Prompt)</text>
    </g>

    <!-- 标签 -->
    <rect x="520" y="10" width="70" height="20" rx="4" fill="#D1FAE5"/>
    <text x="555" y="24" class="tech-text" font-weight="bold" fill="#065F46">Cold</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 交互箭头 -->
  <!-- ================================================================================== -->

  <!-- Retrieval (Up) -->
  <g transform="translate(950, 400)">
    <line x1="0" y1="150" x2="0" y2="-100" class="retrieve-arrow"/>
    <text x="10" y="20" class="tech-text" fill="#2563EB" font-weight="bold" text-anchor="start">检索 (Retrieval)</text>
    <text x="10" y="40" class="tech-text" fill="#6B7280" text-anchor="start">按需加载到工作记忆</text>
  </g>

  <!-- Consolidation (Down) -->
  <g transform="translate(250, 400)">
    <line x1="0" y1="-100" x2="0" y2="150" class="save-arrow"/>
    <text x="-10" y="20" class="tech-text" fill="#059669" font-weight="bold" text-anchor="end">沉淀 (Consolidation)</text>
    <text x="-10" y="40" class="tech-text" fill="#6B7280" text-anchor="end">反思后写入长期记忆</text>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="750" font-family="Noto Sans" font-size="12" fill="#9CA3AF" text-anchor="middle">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
