<!--
  文件名：module-04-rag-to-agentic-workflow-evolution.svg
  图表名称：从 RAG 到 Agentic Workflow 的结构演化
  描述：对比传统 RAG 的线性增强模式与 Agentic Workflow 的循环自主模式，突出“行动”与“反思”带来的质变。

  核心对比：
  1. RAG (左侧): Linear Pipeline (Query -> Retrieve -> Generate). 静态、被动。
  2. Agent (右侧): Cognitive Loop (Plan -> Act -> Observe -> Reflect). 动态、主动。
  3. 质变点: Tool Use (工具使用) &amp; Reflection (反思闭环)。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;amp;display=swap');
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }
      .arch-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .node-text { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .desc-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }
      .tag-text { font-family: 'Noto Sans', sans-serif; font-size: 10px; font-weight: bold; fill: white; text-anchor: middle; }

      /* RAG 样式 (Blue) */
      .rag-bg { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; }
      .rag-node { fill: white; stroke: #2563EB; stroke-width: 2px; }

      /* Agent 样式 (Green/Purple) */
      .agent-bg { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; }
      .agent-core { fill: white; stroke: #059669; stroke-width: 2px; }
      .agent-action { fill: #F3E8FF; stroke: #A855F7; stroke-width: 2px; } /* Action - Purple */
      .agent-reflect { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; } /* Reflection - Yellow */
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D97706" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title">架构演进：从 RAG 到 Agentic Workflow</text>
  <text x="600" y="80" class="sub-title">Agent ≠ RAG + Prompt：行动与反思带来的系统质变</text>

  <!-- ================================================================================== -->
  <!-- 左侧：RAG 架构 (Retrieval-Augmented Generation) -->
  <!-- ================================================================================== -->
  <g transform="translate(50, 150)">
    <!-- 背景框 -->
    <rect x="0" y="0" width="450" height="400" rx="12" class="rag-bg"/>
    <text x="225" y="40" class="arch-title" fill="#1E40AF">RAG (检索增强生成)</text>
    <text x="225" y="60" class="desc-text">线性流水线 (Linear Pipeline)</text>

    <!-- 流程节点 -->

    <!-- 1. Query -->
    <g transform="translate(50, 150)">
        <rect x="0" y="0" width="80" height="60" rx="4" class="rag-node"/>
        <text x="40" y="35" class="node-text" fill="#1E40AF">Query</text>
        <text x="40" y="80" class="desc-text">用户提问</text>
    </g>

    <!-- 2. Retrieve -->
    <g transform="translate(180, 100)">
        <rect x="0" y="0" width="100" height="60" rx="4" class="rag-node"/>
        <text x="50" y="35" class="node-text" fill="#1E40AF">Retrieve</text>

        <!-- 数据库图标 -->
        <path d="M 80 -20 Q 90 -30 100 -20 L 100 20 Q 90 30 80 20 Z" fill="#BFDBFE" stroke="#2563EB"/>
        <path d="M 80 -20 Q 70 -10 80 0" fill="none" stroke="#2563EB"/>
        <text x="50" y="80" class="desc-text">查知识库</text>
    </g>

    <!-- 3. Prompt (Augment) -->
    <g transform="translate(180, 200)">
        <rect x="0" y="0" width="100" height="60" rx="4" class="rag-node" stroke-dasharray="4,2"/>
        <text x="50" y="35" class="node-text" fill="#1E40AF">Context</text>
        <text x="50" y="80" class="desc-text">拼接上下文</text>
    </g>

    <!-- 4. Generate -->
    <g transform="translate(330, 150)">
        <rect x="0" y="0" width="90" height="60" rx="4" class="rag-node"/>
        <text x="45" y="35" class="node-text" fill="#1E40AF">LLM</text>
        <text x="45" y="80" class="desc-text">一次生成</text>
    </g>

    <!-- 连接线 (单向) -->
    <!-- Query -> Retrieve -->
    <path d="M 90 150 L 130 130 L 180 130" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <!-- Query -> Context -->
    <path d="M 90 210 L 130 230 L 180 230" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <!-- Retrieve -> Context -->
    <path d="M 230 160 L 230 200" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <!-- Context -> LLM -->
    <path d="M 280 230 L 305 230 L 305 180 L 330 180" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- 痛点标签 -->
    <g transform="translate(225, 330)">
        <text x="0" y="0" font-weight="bold" fill="#DC2626" text-anchor="middle">❌ 局限性</text>
        <text x="0" y="20" class="desc-text" fill="#DC2626">• 只能“读”，不能“做”</text>
        <text x="0" y="40" class="desc-text" fill="#DC2626">• 一次定胜负，无纠错机会</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 中间：演进箭头 -->
  <!-- ================================================================================== -->
  <g transform="translate(530, 300)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#9CA3AF" stroke-width="4" marker-end="url(#arrow-gray)"/>
    <text x="50" y="-15" text-anchor="middle" font-weight="bold" fill="#4B5563">认知跃迁</text>
    <text x="50" y="20" class="desc-text">引入循环与工具</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 右侧：Agentic Workflow (自主智能体) -->
  <!-- ================================================================================== -->
  <g transform="translate(670, 150)">
    <!-- 背景框 -->
    <rect x="0" y="0" width="480" height="400" rx="12" class="agent-bg"/>
    <text x="240" y="40" class="arch-title" fill="#065F46">Agentic Workflow (智能体式工作流)</text>
    <text x="240" y="60" class="desc-text">认知循环 (Cognitive Loop)</text>

    <!-- 核心大脑 (Plan) -->
    <g transform="translate(190, 120)">
        <circle cx="50" cy="50" r="50" class="agent-core"/>
        <text x="50" y="45" class="node-text" fill="#065F46">LLM Core</text>
        <text x="50" y="65" class="desc-text">感知 &amp; 规划</text>
    </g>

    <!-- 行动模块 (Tools) - 质变点 1 -->
    <g transform="translate(350, 130)">
        <rect x="0" y="0" width="100" height="80" rx="8" class="agent-action"/>
        <text x="50" y="30" class="node-text" fill="#6B21A8">Tools/Act</text>
        <text x="50" y="50" class="desc-text">搜索/代码/API</text>

        <!-- 标签 -->
        <rect x="25" y="60" width="50" height="16" rx="4" fill="#8B5CF6"/>
        <text x="50" y="72" class="tag-text">手(Doing)</text>
    </g>

    <!-- 反思模块 (Reflect) - 质变点 2 -->
    <g transform="translate(30, 130)">
        <rect x="0" y="0" width="100" height="80" rx="8" class="agent-reflect"/>
        <text x="50" y="30" class="node-text" fill="#B45309">Reflect</text>
        <text x="50" y="50" class="desc-text">评价/修正</text>

        <!-- 标签 -->
        <rect x="15" y="60" width="70" height="16" rx="4" fill="#F59E0B"/>
        <text x="50" y="72" class="tag-text">元认知(Meta)</text>
    </g>

    <!-- 循环路径 -->
    <!-- Plan -> Act -->
    <path d="M 290 170 L 350 170" fill="none" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text x="320" y="160" font-size="10" fill="#8B5CF6" text-anchor="middle">调用</text>

    <!-- Act -> Plan (Observe) -->
    <path d="M 400 210 Q 400 260 240 260 Q 240 240 240 220" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
    <text x="320" y="250" font-size="10" fill="#8B5CF6" text-anchor="middle">观察结果</text>

    <!-- Plan -> Reflect -->
    <path d="M 190 170 L 130 170" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#arrow-yellow)"/>
    <text x="160" y="160" font-size="10" fill="#D97706" text-anchor="middle">自检</text>

    <!-- Reflect -> Plan (Iterate) -->
    <path d="M 80 130 Q 80 80 190 80 Q 220 80 230 110" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-yellow)"/>
    <text x="140" y="95" font-size="10" fill="#D97706" text-anchor="middle">优化策略</text>

    <!-- 优势标签 -->
    <g transform="translate(240, 330)">
        <text x="0" y="0" font-weight="bold" fill="#059669" text-anchor="middle">✅ 核心突破</text>
        <text x="0" y="20" class="desc-text" fill="#064E3B">• **行动力**：不仅回答问题，还能解决问题</text>
        <text x="0" y="40" class="desc-text" fill="#064E3B">• **反脆弱**：在错误中通过循环自我修正</text>
    </g>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="650" text-anchor="middle" font-family="Noto Sans" font-size="12" fill="#64748B">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
