<!--
  文件名：module-06-agent-runtime-core-elements.svg
  图表名称：智能体运行环境的四个核心要素
  描述：展示 Agent Runtime 由 Profiling（角色）、Memory（记忆）、Planning（规划）和 Action（行动）四大核心模块构成。

  核心逻辑：
  1. Profiling: 定义智能体的身份、目标与约束 (Static).
  2. Memory: 管理短期上下文与长期知识检索 (Dynamic State).
  3. Planning: 负责任务拆解、推理与反思 (Reasoning).
  4. Action: 负责工具调用与环境交互 (Execution).

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
-->
<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .module-title { font-family: 'Noto Sans', sans-serif; font-size: 18px; font-weight: 800; text-anchor: middle; }
      .module-desc { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 400; fill: #4B5563; text-anchor: middle; }
      .tech-item { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: 700; fill: white; text-anchor: middle; }

      /* 区域背景 */
      .bg-profile { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 12; }
      .bg-memory { fill: #F3E8FF; stroke: #A855F7; stroke-width: 2px; rx: 12; }
      .bg-planning { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; rx: 12; }
      .bg-action { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; rx: 12; }

      /* 中心 */
      .center-circle { fill: white; stroke: #374151; stroke-width: 3px; }

      /* 连接线 */
      .connector { fill: none; stroke: #9CA3AF; stroke-width: 2px; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="500" y="50" class="main-title">智能体运行环境 (Runtime) 的四个核心要素</text>
  <text x="500" y="80" class="sub-title">Profile + Memory + Planning + Action</text>

  <!-- ================================================================================== -->
  <!-- 核心结构 -->
  <!-- ================================================================================== -->

  <!-- 中心枢纽：Runtime Loop -->
  <g transform="translate(500, 400)">
    <circle r="80" class="center-circle"/>
    <text x="0" y="-15" class="module-title" fill="#111827">Runtime</text>
    <text x="0" y="10" class="module-desc">控制流 &amp; 状态机</text>
    <text x="0" y="25" class="module-desc">(The Loop)</text>
  </g>

  <!-- 连接线 -->
  <line x1="300" y1="250" x2="440" y2="350" class="connector"/>
  <line x1="700" y1="250" x2="560" y2="350" class="connector"/>
  <line x1="300" y1="550" x2="440" y2="450" class="connector"/>
  <line x1="700" y1="550" x2="560" y2="450" class="connector"/>

  <!-- ================================================================================== -->
  <!-- 1. Profiling (角色) - 左上 -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="320" height="200" class="bg-profile"/>
    <text x="160" y="40" class="module-title" fill="#1E40AF">1. Profiling (角色设定)</text>
    <text x="160" y="65" class="module-desc">定义智能体的身份、目标与边界</text>

    <!-- 技术栈 -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="100" height="30" rx="4" fill="#60A5FA"/>
        <text x="50" y="20" class="tech-item">System Prompt</text>

        <rect x="140" y="0" width="100" height="30" rx="4" fill="#60A5FA"/>
        <text x="190" y="20" class="tech-item">Persona</text>

        <rect x="0" y="45" width="240" height="30" rx="4" fill="#3B82F6"/>
        <text x="120" y="65" class="tech-item">Goals &amp; Constraints</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 2. Memory (记忆) - 右上 -->
  <!-- ================================================================================== -->
  <g transform="translate(580, 120)">
    <rect x="0" y="0" width="320" height="200" class="bg-memory"/>
    <text x="160" y="40" class="module-title" fill="#6B21A8">2. Memory (记忆系统)</text>
    <text x="160" y="65" class="module-desc">存储历史交互与领域知识</text>

    <!-- 技术栈 -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="100" height="30" rx="4" fill="#A855F7"/>
        <text x="50" y="20" class="tech-item">Context Window</text>

        <rect x="140" y="0" width="100" height="30" rx="4" fill="#A855F7"/>
        <text x="190" y="20" class="tech-item">Vector DB</text>

        <rect x="0" y="45" width="240" height="30" rx="4" fill="#7C3AED"/>
        <text x="120" y="65" class="tech-item">Reflection / Summary</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 3. Planning (规划) - 左下 -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="320" height="200" class="bg-planning"/>
    <text x="160" y="40" class="module-title" fill="#B45309">3. Planning (规划引擎)</text>
    <text x="160" y="65" class="module-desc">任务拆解、推理与自我修正</text>

    <!-- 技术栈 -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="100" height="30" rx="4" fill="#FACC15"/>
        <text x="50" y="20" class="tech-item" fill="#78350F">CoT / ReAct</text>

        <rect x="140" y="0" width="100" height="30" rx="4" fill="#FACC15"/>
        <text x="190" y="20" class="tech-item" fill="#78350F">Sub-goals</text>

        <rect x="0" y="45" width="240" height="30" rx="4" fill="#EAB308"/>
        <text x="120" y="65" class="tech-item" fill="#78350F">Self-Criticism</text>
    </g>
  </g>

  <!-- ================================================================================== -->
  <!-- 4. Action (行动) - 右下 -->
  <!-- ================================================================================== -->
  <g transform="translate(580, 480)">
    <rect x="0" y="0" width="320" height="200" class="bg-action"/>
    <text x="160" y="40" class="module-title" fill="#047857">4. Action (行动接口)</text>
    <text x="160" y="65" class="module-desc">将抽象决策转化为具体操作</text>

    <!-- 技术栈 -->
    <g transform="translate(40, 90)">
        <rect x="0" y="0" width="100" height="30" rx="4" fill="#34D399"/>
        <text x="50" y="20" class="tech-item">Tool Use</text>

        <rect x="140" y="0" width="100" height="30" rx="4" fill="#34D399"/>
        <text x="190" y="20" class="tech-item">API Calls</text>

        <rect x="0" y="45" width="240" height="30" rx="4" fill="#059669"/>
        <text x="120" y="65" class="tech-item">Output Parsers</text>
    </g>
  </g>

  <!-- 底部许可 -->
  <text x="500" y="750" font-family="Noto Sans" font-size="12" fill="#9CA3AF" text-anchor="middle">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
