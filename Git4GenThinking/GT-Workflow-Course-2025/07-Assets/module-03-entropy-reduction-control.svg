<!--
  文件名：module-03-entropy-reduction-control.svg
  图表名称：熵减与生成控制逻辑示意图
  描述：展示了结构化提示工程如何将大语言模型从“高熵”的随机状态，通过层层约束，引导至“低熵”的确定性输出状态。

  核心概念：
  - 左侧：最大熵状态 (Maximum Entropy)，代表零上下文时的随机游走。
  - 中间：熵减过程 (Entropy Reduction)，通过角色、少样本、CoT、Schema等手段施加约束。
  - 右侧：最小熵状态 (Minimum Entropy)，代表可执行的机器协议。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  配色：
  - 主概念：Blue (#EFF6FF, #60A5FA)
  - 过程/高亮：Yellow (#FEF9C3, #FACC15)
  - 结果/标准：Green (#F0FDF4, #34D399)
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义箭头和滤镜 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB" />
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      .main-title-text { font-family: 'Noto Sans', sans-serif; font-size: 22px; font-weight: 800; fill: #111827; }
      .title-text { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: 700; fill: #111827; }
      .body-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 400; fill: #374151; }
      .highlight-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #374151; }
      .small-text { font-family: 'Noto Sans', sans-serif; font-size: 11px; font-weight: 400; fill: #6B7280; }
      .license-text { font-family: 'Noto Sans', sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }

      /* 盒子样式 */
      .main-box { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 2px; rx: 8; }
      .highlight-box { fill: #FEF9C3; stroke: #FACC15; stroke-width: 2px; rx: 8; }
      .success-box { fill: #F0FDF4; stroke: #34D399; stroke-width: 2px; rx: 8; }

      /* 连接线 */
      .connector { fill: none; stroke: #2563EB; stroke-width: 2px; marker-end: url(#arrowhead); }
      .dashed-line { fill: none; stroke: #94A3B8; stroke-width: 1px; stroke-dasharray: 5,5; }

      /* 粒子效果 */
      .particle { fill: #60A5FA; opacity: 0.6; }
    </style>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="50" class="main-title-text" text-anchor="middle">熵减与生成控制：从“概率”到“协议”</text>
  <text x="600" y="80" class="body-text" text-anchor="middle">通过结构化提示工程（Structured Prompt Engineering）对模型生成空间进行约束与收敛</text>

  <!-- 2. 背景网格与轴 (暗示概率空间) -->
  <line x1="50" y1="700" x2="1150" y2="700" stroke="#E2E8F0" stroke-width="2" />
  <text x="1050" y="720" class="small-text">处理时间 / 提示深度</text>

  <line x1="50" y1="700" x2="50" y2="150" stroke="#E2E8F0" stroke-width="2" />
  <text x="-100" y="140" class="small-text" transform="rotate(-90, 40, 140)">不确定性 / 熵值 (Entropy)</text>

  <!-- ========================================== -->
  <!-- 区域 1: 高熵状态 (High Entropy) - 左侧 -->
  <!-- ========================================== -->
  <g transform="translate(100, 200)">
    <!-- 容器背景 -->
    <rect x="0" y="0" width="280" height="400" class="main-box" opacity="0.5" stroke-dasharray="5,5"/>

    <!-- 标题 -->
    <text x="140" y="30" class="title-text" text-anchor="middle">高熵状态 (Max Entropy)</text>
    <text x="140" y="55" class="small-text" text-anchor="middle">零上下文 / 随机生成</text>

    <!-- 混乱的粒子 (表示Token的随机分布) -->
    <g id="chaos-particles">
       <circle cx="40" cy="100" r="4" class="particle" />
       <circle cx="200" cy="120" r="6" class="particle" />
       <circle cx="100" cy="150" r="3" class="particle" />
       <circle cx="240" cy="180" r="5" class="particle" />
       <circle cx="60" cy="220" r="4" class="particle" />
       <circle cx="150" cy="250" r="7" class="particle" />
       <circle cx="220" cy="300" r="3" class="particle" />
       <circle cx="80" cy="350" r="5" class="particle" />
       <text x="50" y="115" class="small-text" fill="#93C5FD">幻觉</text>
       <text x="160" y="260" class="small-text" fill="#93C5FD">发散</text>
       <text x="90" y="360" class="small-text" fill="#93C5FD">模糊意图</text>
    </g>

    <!-- 状态描述 -->
    <text x="140" y="380" class="body-text" text-anchor="middle" font-style="italic">"P(next_token) ≈ Uniform"</text>
  </g>

  <!-- ========================================== -->
  <!-- 区域 2: 结构化提示漏斗 (Constraint Funnel) - 中间 -->
  <!-- ========================================== -->
  <!-- 漏斗形状 -->
  <path d="M 400 200 L 800 320 L 800 480 L 400 600 Z" fill="#FEF9C3" stroke="#FACC15" stroke-width="2" opacity="0.8"/>

  <g transform="translate(420, 250)">
    <text x="0" y="-20" class="title-text" fill="#B45309">结构化提示 (Constraints)</text>

    <!-- 约束层级 1: 角色与背景 -->
    <rect x="20" y="30" width="20" height="280" rx="4" fill="#FDE68A" stroke="#D97706" />
    <text x="30" y="20" class="small-text" text-anchor="middle">1</text>
    <text x="50" y="50" class="body-text">角色锚定 (Persona)</text>
    <text x="50" y="70" class="small-text">限定知识域与语气</text>

    <!-- 约束层级 2: 少样本 -->
    <rect x="120" y="60" width="20" height="220" rx="4" fill="#FDE68A" stroke="#D97706" />
    <text x="130" y="50" class="small-text" text-anchor="middle">2</text>
    <text x="150" y="80" class="body-text">少样本 (Few-Shot)</text>
    <text x="150" y="100" class="small-text">提供模式映射锚点</text>

    <!-- 约束层级 3: 逻辑控制 -->
    <rect x="220" y="90" width="20" height="160" rx="4" fill="#FDE68A" stroke="#D97706" />
    <text x="230" y="80" class="small-text" text-anchor="middle">3</text>
    <text x="250" y="110" class="body-text">思维链 (CoT)</text>
    <text x="250" y="130" class="small-text">展开推理步骤</text>

    <!-- 约束层级 4: 格式硬化 -->
    <rect x="320" y="110" width="20" height="120" rx="4" fill="#F59E0B" stroke="#B45309" stroke-width="3"/>
    <text x="330" y="100" class="small-text" text-anchor="middle">4</text>
    <text x="350" y="140" class="highlight-text">格式契约 (Schema)</text>
    <text x="350" y="160" class="small-text">JSON / Markdown</text>
  </g>

  <!-- 流程箭头穿过漏斗 -->
  <path d="M 380 300 L 450 350" class="connector" stroke-dasharray="5,5" opacity="0.5"/>
  <path d="M 380 400 L 450 400" class="connector" stroke-dasharray="5,5" opacity="0.5"/>
  <path d="M 380 500 L 450 450" class="connector" stroke-dasharray="5,5" opacity="0.5"/>

  <!-- ========================================== -->
  <!-- 区域 3: 低熵状态 (Low Entropy) - 右侧 -->
  <!-- ========================================== -->
  <g transform="translate(850, 320)">
    <!-- 容器 -->
    <rect x="0" y="0" width="280" height="160" class="success-box" />

    <!-- 标题 -->
    <text x="140" y="-15" class="title-text" text-anchor="middle">最小熵 (Min Entropy)</text>

    <!-- 内容：结构化数据块 -->
    <g transform="translate(40, 30)">
        <rect x="0" y="0" width="200" height="100" fill="white" stroke="#34D399" rx="4" />
        <text x="10" y="20" font-family="monospace" font-size="10" fill="#047857">{</text>
        <text x="20" y="35" font-family="monospace" font-size="10" fill="#047857">"intent": "execute",</text>
        <text x="20" y="50" font-family="monospace" font-size="10" fill="#047857">"data": [ ... ],</text>
        <text x="20" y="65" font-family="monospace" font-size="10" fill="#047857">"status": "valid"</text>
        <text x="10" y="80" font-family="monospace" font-size="10" fill="#047857">}</text>
    </g>

    <text x="140" y="145" class="body-text" text-anchor="middle">可执行协议 / 确定性输出</text>
  </g>

  <!-- ========================================== -->
  <!-- 连接线与动态流 -->
  <!-- ========================================== -->
  <!-- 从漏斗输出到结果 -->
  <path d="M 800 400 L 840 400" class="connector" stroke-width="3"/>

  <!-- 顶部说明注释 -->
  <g transform="translate(500, 150)">
      <text x="0" y="0" class="highlight-text" fill="#B45309" text-anchor="middle">概率塌缩过程 (Collapse)</text>
      <path d="M -100 20 Q 0 40 100 20" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>

  <!-- 底部关键对比 -->
  <g transform="translate(100, 650)">
      <text x="140" y="0" class="body-text" text-anchor="middle">自然语言 (模糊)</text>
      <text x="140" y="20" class="small-text" text-anchor="middle">Human Language</text>
  </g>

  <g transform="translate(850, 650)">
      <text x="140" y="0" class="body-text" text-anchor="middle">机器协议 (精确)</text>
      <text x="140" y="20" class="small-text" text-anchor="middle">Machine Protocol</text>
  </g>

  <path d="M 300 650 L 800 650" class="connector" stroke-dasharray="4,4" />
  <text x="550" y="640" class="small-text" text-anchor="middle">熵减方向 (Direction of Entropy Reduction)</text>

  <!-- 8. 许可声明 (Standard Footer) -->
  <text x="600" y="760" class="license-text">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>
</svg>
