<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      :root {
        --color-main-fill: #EFF6FF;
        --color-main-stroke: #60A5FA;
        --color-std-fill: #F0FDF4;
        --color-std-stroke: #34D399;
        --color-highlight-fill: #FEF9C3;
        --color-highlight-stroke: #FACC15;
        --color-connector: #2563EB;
        --color-text-main: #111827;
        --color-text-body: #374151;
        --color-text-small: #6B7280;
      }

      text { font-family: 'Noto Sans', sans-serif; }

      /* Container Boxes */
      .box { fill: var(--color-std-fill); stroke: var(--color-std-stroke); stroke-width: 2px; }
      .main-box { fill: var(--color-main-fill); stroke: var(--color-main-stroke); stroke-width: 2px; }
      .highlight-box { fill: var(--color-highlight-fill); stroke: var(--color-highlight-stroke); stroke-width: 2px; }

      /* Inner Scenario Cards */
      .scenario-card { fill: white; stroke: #E5E7EB; stroke-width: 1px; }

      /* Text Styles */
      .main-title-text { font-size: 24px; font-weight: 800; fill: var(--color-text-main); }
      .title-text { font-size: 16px; font-weight: 700; fill: var(--color-text-main); }
      .subtitle-text { font-size: 14px; font-weight: 700; fill: #4B5563; }
      .body-text { font-size: 12px; font-weight: 400; fill: var(--color-text-body); }
      .role-label { font-size: 11px; font-weight: 700; fill: #6B7280; letter-spacing: 0.05em; }
      .license-text { font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }

      /* Graphic Elements */
      .icon-human { fill: #4B5563; }
      .icon-ai { fill: #2563EB; }
      .arrow-line { stroke: #9CA3AF; stroke-width: 2px; marker-end: url(#arrow); }
    </style>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9CA3AF" />
    </marker>

    <symbol id="icon-human-symbol" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8" />
    </symbol>

    <symbol id="icon-ai-symbol" viewBox="0 0 24 24">
      <path d="M12 2L15 9L22 12L15 15L12 22L9 15L2 12L9 9Z" /> </symbol>
  </defs>

  <text x="500" y="50" class="main-title-text" text-anchor="middle">人机协作四阶段光谱图</text>
  <text x="500" y="80" class="body-text" text-anchor="middle">Human-AI Collaboration Spectrum: From Tool to Orchestration</text>

  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="210" height="380" rx="8" class="box" />

    <text x="105" y="40" class="title-text" text-anchor="middle">1. 指令执行</text>
    <text x="105" y="60" class="role-label" text-anchor="middle">COMMAND-CONTROL</text>

    <g transform="translate(85, 90)">
      <use href="#icon-human-symbol" width="40" height="40" class="icon-human" />
    </g>
    <text x="105" y="145" class="subtitle-text" text-anchor="middle">操作者 (Operator)</text>
    <text x="105" y="165" class="body-text" text-anchor="middle">输入明确指令</text>

    <g transform="translate(85, 200)">
      <use href="#icon-ai-symbol" width="40" height="40" class="icon-ai" style="fill:#34D399"/>
    </g>
    <text x="105" y="255" class="subtitle-text" text-anchor="middle">工具 (Tool)</text>
    <text x="105" y="275" class="body-text" text-anchor="middle">执行单一操作</text>

    <rect x="20" y="300" width="170" height="60" rx="4" class="scenario-card" />
    <text x="105" y="325" class="body-text" text-anchor="middle" font-weight="bold">典型场景</text>
    <text x="105" y="345" class="body-text" text-anchor="middle" fill="#6B7280">Excel公式 / CLI命令</text>
  </g>

  <g transform="translate(280, 120)">
    <rect x="0" y="0" width="210" height="380" rx="8" class="main-box" />

    <text x="105" y="40" class="title-text" text-anchor="middle">2. 辅助增强</text>
    <text x="105" y="60" class="role-label" text-anchor="middle">AUGMENTATION</text>

    <g transform="translate(85, 90)">
      <use href="#icon-human-symbol" width="40" height="40" class="icon-human" />
    </g>
    <text x="105" y="145" class="subtitle-text" text-anchor="middle">驾驶员 (Pilot)</text>
    <text x="105" y="165" class="body-text" text-anchor="middle">主导工作流</text>

    <g transform="translate(85, 200)">
      <use href="#icon-ai-symbol" width="40" height="40" class="icon-ai" />
    </g>
    <text x="105" y="255" class="subtitle-text" text-anchor="middle">副驾驶 (Co-pilot)</text>
    <text x="105" y="275" class="body-text" text-anchor="middle">补全 / 建议 / 润色</text>

    <rect x="20" y="300" width="170" height="60" rx="4" class="scenario-card" />
    <text x="105" y="325" class="body-text" text-anchor="middle" font-weight="bold">典型场景</text>
    <text x="105" y="345" class="body-text" text-anchor="middle" fill="#6B7280">代码补全 / 语法检查</text>
  </g>

  <g transform="translate(510, 120)">
    <rect x="0" y="0" width="210" height="380" rx="8" class="main-box" />

    <text x="105" y="40" class="title-text" text-anchor="middle">3. 协作共创</text>
    <text x="105" y="60" class="role-label" text-anchor="middle">COLLABORATION</text>

    <g transform="translate(85, 90)">
      <use href="#icon-human-symbol" width="40" height="40" class="icon-human" />
    </g>
    <text x="105" y="145" class="subtitle-text" text-anchor="middle">导演 (Director)</text>
    <text x="105" y="165" class="body-text" text-anchor="middle">定义标准 / 审核</text>

    <g transform="translate(85, 200)">
      <use href="#icon-ai-symbol" width="40" height="40" class="icon-ai" />
    </g>
    <text x="105" y="255" class="subtitle-text" text-anchor="middle">演员 (Actor)</text>
    <text x="105" y="275" class="body-text" text-anchor="middle">多轮对话 / 创意生成</text>

    <rect x="20" y="300" width="170" height="60" rx="4" class="scenario-card" />
    <text x="105" y="325" class="body-text" text-anchor="middle" font-weight="bold">典型场景</text>
    <text x="105" y="345" class="body-text" text-anchor="middle" fill="#6B7280">头脑风暴 / 方案迭代</text>
  </g>

  <g transform="translate(740, 120)">
    <rect x="0" y="0" width="210" height="380" rx="8" class="highlight-box" />

    <text x="105" y="40" class="title-text" text-anchor="middle">4. 智能编排</text>
    <text x="105" y="60" class="role-label" text-anchor="middle" fill="#B45309">ORCHESTRATION</text>

    <g transform="translate(85, 90)">
      <use href="#icon-human-symbol" width="40" height="40" class="icon-human" />
    </g>
    <text x="105" y="145" class="subtitle-text" text-anchor="middle">指挥官 (Orchestrator)</text>
    <text x="105" y="165" class="body-text" text-anchor="middle">设定目标 / 验收结果</text>

    <g transform="translate(85, 200)">
      <use href="#icon-ai-symbol" width="40" height="40" class="icon-ai" style="fill:#FACC15; stroke:#B45309; stroke-width:1px;" />
    </g>
    <text x="105" y="255" class="subtitle-text" text-anchor="middle">智能体 (Agent)</text>
    <text x="105" y="275" class="body-text" text-anchor="middle">自主规划 / 工具调用</text>

    <rect x="20" y="300" width="170" height="60" rx="4" class="scenario-card" style="stroke:#FACC15; stroke-width:2px;" />
    <text x="105" y="325" class="body-text" text-anchor="middle" font-weight="bold">典型场景</text>
    <text x="105" y="345" class="body-text" text-anchor="middle" fill="#6B7280">自动研报 / 全自动客服</text>
  </g>

  <line x1="155" y1="530" x2="845" y2="530" class="arrow-line" />
  <text x="500" y="550" class="role-label" text-anchor="middle">AI 自主性 (AUTONOMY) 提升 / 人类认知带宽 (BANDWIDTH) 释放</text>

  <text x="500" y="585" class="license-text">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>
</svg>
