<!--
  文件名：costar-structured-prompt-framework.svg
  图表名称：CO-STAR 结构化提示框架示意图
  描述：展示 CO-STAR 模型的六大核心要素（Context, Objective, Style, Tone, Audience, Response），及其在提示词构建中的逻辑关系。

  核心逻辑：
  1. 基础层 (Blue): Context (背景) + Objective (目标) -> 确立核心意图。
  2. 约束层 (Green): Style (风格) + Tone (语调) + Audience (受众) -> 规范表达方式。
  3. 输出层 (Yellow): Response (响应) -> 定义交付格式。

  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  修改记录：
  - 箭头 Size 减半 (5x5)。
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 定义样式与标记 -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&amp;display=swap');

      /* 文本样式 */
      .main-title { font-family: 'Noto Sans', sans-serif; font-size: 28px; font-weight: 800; fill: #111827; text-anchor: middle; }
      .sub-title { font-family: 'Noto Sans', sans-serif; font-size: 16px; font-weight: normal; fill: #6B7280; text-anchor: middle; }

      .card-header { font-family: 'Noto Sans', sans-serif; font-size: 24px; font-weight: 800; text-anchor: start; }
      .card-sub { font-family: 'Noto Sans', sans-serif; font-size: 14px; font-weight: 700; text-anchor: start; opacity: 0.8; }
      .card-desc { font-family: 'Noto Sans', sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
      .code-snippet { font-family: 'Courier New', monospace; font-size: 12px; fill: #4B5563; }

      /* 卡片样式 */
      .card-bg { stroke-width: 2px; rx: 12; }

      /* 蓝色系 (C, O) */
      .blue-fill { fill: #EFF6FF; stroke: #60A5FA; }
      .blue-text { fill: #1E40AF; }
      .blue-bar { fill: #2563EB; }

      /* 绿色系 (S, T, A) */
      .green-fill { fill: #F0FDF4; stroke: #34D399; }
      .green-text { fill: #065F46; }
      .green-bar { fill: #059669; }

      /* 黄色系 (R) */
      .yellow-fill { fill: #FEF9C3; stroke: #FACC15; }
      .yellow-text { fill: #854D0E; }
      .yellow-bar { fill: #D97706; }

      /* 装饰 */
      .connector { fill: none; stroke: #E5E7EB; stroke-width: 4px; stroke-dasharray: 8,4; }
      .arrow-head { fill: #9CA3AF; }
    </style>

    <!-- Arrow Marker Definition (Reduced Size) -->
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5" fill="#9CA3AF" />
    </marker>
  </defs>

  <!-- 1. 标题区域 -->
  <text x="600" y="60" class="main-title">CO-STAR 结构化提示框架</text>
  <text x="600" y="90" class="sub-title">将模糊意图转化为机器可执行协议的六大要素</text>

  <!-- ================================================================================== -->
  <!-- 左列：基础层 (Context & Objective) - Blue -->
  <!-- ================================================================================== -->

  <!-- Context (C) -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="320" height="180" class="card-bg blue-fill"/>

    <text x="30" y="40" class="card-header blue-text">C</text>
    <text x="60" y="38" class="card-sub blue-text">Context (背景信息)</text>
    <line x1="30" y1="55" x2="290" y2="55" stroke="#BFDBFE" stroke-width="2"/>

    <text x="30" y="80" class="card-desc">为模型提供任务发生的背景、</text>
    <text x="30" y="100" class="card-desc">角色设定及相关前置条件。</text>

    <!-- Code Snippet -->
    <rect x="25" y="120" width="270" height="40" rx="4" fill="white" stroke="#BFDBFE"/>
    <text x="35" y="145" class="code-snippet"># Role: Senior Python Developer</text>
  </g>

  <!-- Objective (O) -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="320" height="180" class="card-bg blue-fill"/>

    <text x="30" y="40" class="card-header blue-text">O</text>
    <text x="60" y="38" class="card-sub blue-text">Objective (核心目标)</text>
    <line x1="30" y1="55" x2="290" y2="55" stroke="#BFDBFE" stroke-width="2"/>

    <text x="30" y="80" class="card-desc">明确定义你希望模型执行的任务。</text>
    <text x="30" y="100" class="card-desc">这是提示词的指令核心。</text>

    <!-- Code Snippet -->
    <rect x="25" y="120" width="270" height="40" rx="4" fill="white" stroke="#BFDBFE"/>
    <text x="35" y="145" class="code-snippet"># Task: Refactor the code below</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 中列：连接与流向 -->
  <!-- ================================================================================== -->
  <g transform="translate(450, 0)">
    <!-- Arrows connecting Left to Right -->
    <path d="M -30 240 L 70 240" class="connector" marker-end="url(#arrow)"/>
    <path d="M -30 450 L 70 450" class="connector" marker-end="url(#arrow)"/>

    <!-- Central Process Label -->
    <circle cx="20" cy="345" r="40" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
    <text x="20" y="350" text-anchor="middle" font-size="20">⚙️</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 右列：约束层 (Style, Tone, Audience) - Green -->
  <!-- ================================================================================== -->

  <!-- Style (S) -->
  <g transform="translate(520, 150)">
    <rect x="0" y="0" width="280" height="120" class="card-bg green-fill"/>
    <text x="25" y="35" class="card-header green-text">S</text>
    <text x="50" y="33" class="card-sub green-text">Style (写作风格)</text>

    <text x="25" y="65" class="card-desc">如：学术、新闻、代码规范 (PEP8)。</text>
    <text x="25" y="95" class="code-snippet" fill="#065F46"># Style: PEP8 Standard</text>
  </g>

  <!-- Tone (T) -->
  <g transform="translate(520, 290)">
    <rect x="0" y="0" width="280" height="120" class="card-bg green-fill"/>

    <text x="25" y="35" class="card-header green-text">T</text>
    <text x="50" y="33" class="card-sub green-text">Tone (语调/情感)</text>

    <text x="25" y="65" class="card-desc">如：专业、幽默、严厉、同理心。</text>
    <text x="25" y="95" class="code-snippet" fill="#065F46"># Tone: Professional &amp; Concise</text>
  </g>

  <!-- Audience (A) -->
  <g transform="translate(520, 430)">
    <rect x="0" y="0" width="280" height="120" class="card-bg green-fill"/>

    <text x="25" y="35" class="card-header green-text">A</text>
    <text x="50" y="33" class="card-sub green-text">Audience (受众)</text>

    <text x="25" y="65" class="card-desc">内容是写给谁看的？决定了复杂度。</text>
    <text x="25" y="95" class="code-snippet" fill="#065F46"># Audience: Junior Developers</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 右侧：输出层 (Response) - Yellow -->
  <!-- ================================================================================== -->

  <g transform="translate(850, 150)">
    <!-- 连接线 -->
    <path d="M -50 210 L 0 210" class="connector"/>
    <path d="M -50 350 L 0 350" class="connector"/>
    <path d="M -50 490 L 0 490" class="connector"/>

    <!-- Response (R) - Big Box -->
    <rect x="0" y="0" width="250" height="400" class="card-bg yellow-fill"/>
    <text x="30" y="50" class="card-header yellow-text">R</text>
    <text x="60" y="48" class="card-sub yellow-text">Response</text>
    <text x="60" y="70" class="card-sub yellow-text">(输出格式)</text>

    <line x1="30" y1="90" x2="220" y2="90" stroke="#FDE68A" stroke-width="2"/>

    <text x="30" y="120" class="card-desc">定义输出的结构、</text>
    <text x="30" y="140" class="card-desc">格式（JSON/Markdown）</text>
    <text x="30" y="160" class="card-desc">以及具体的字段要求。</text>

    <!-- Code Snippet Block -->
    <rect x="20" y="190" width="210" height="180" rx="4" fill="white" stroke="#FDE68A"/>
    <text x="30" y="220" class="code-snippet" font-weight="bold"># Output Format:</text>
    <text x="30" y="245" class="code-snippet">```json</text>
    <text x="30" y="265" class="code-snippet">{</text>
    <text x="40" y="285" class="code-snippet">"code": "...",</text>
    <text x="40" y="305" class="code-snippet">"explanation": "..."</text>
    <text x="30" y="325" class="code-snippet">}</text>
    <text x="30" y="345" class="code-snippet">```</text>
  </g>

  <!-- ================================================================================== -->
  <!-- 底部：总结 -->
  <!-- ================================================================================== -->
  <g transform="translate(100, 600)">
    <rect x="0" y="0" width="1000" height="100" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>

    <text x="500" y="35" text-anchor="middle" font-weight="bold" fill="#374151" font-size="16">为什么使用 CO-STAR？</text>

    <g transform="translate(150, 65)">
        <text x="0" y="0" font-size="13" fill="#4B5563">1. <tspan font-weight="bold" fill="#2563EB">熵减</tspan>: 减少模型猜测空间</text>
        <text x="250" y="0" font-size="13" fill="#4B5563">2. <tspan font-weight="bold" fill="#059669">复用</tspan>: 模块化便于维护</text>
        <text x="500" y="0" font-size="13" fill="#4B5563">3. <tspan font-weight="bold" fill="#D97706">对齐</tspan>: 确保机器理解人类意图</text>
    </g>
  </g>

  <!-- 底部许可 -->
  <text x="600" y="750" font-family="Noto Sans" font-size="12" fill="#9CA3AF" text-anchor="middle">
    本作品采用CC-BY-SA 4.0国际许可协议进行许可，© 2025 Gitconomy Research社区
  </text>

</svg>
