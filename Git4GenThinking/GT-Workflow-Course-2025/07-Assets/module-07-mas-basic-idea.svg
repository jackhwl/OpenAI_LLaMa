<!--
  ================================================================================
  图表名称：多智能体系统 (MAS) 基本思想示意图
  文件命名：module-07-mas-basic-idea.svg
  描述：
    展示 MAS 的核心工作流：
    1. Input: 复杂任务输入
    2. Dispatch: 任务拆解 (Decomposition)
    3. Execute: 角色专精 (Specialization)
    4. Integrate: 结果集成 (Integration)
  SPDX-License-Identifier: MIT AND CC-BY-4.0
  设计规范参考：Gitconomy社区图形即代码设计规范 v1.0
  ================================================================================
-->
<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">

  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="600" fill="#FFFFFF"/>

  <!-- ========================================================================= -->
  <!-- Header -->
  <!-- ========================================================================= -->
  <text x="600" y="50" font-family="'Noto Sans', sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="middle">
    多智能体系统 (MAS) 的基本思想
  </text>
  <text x="600" y="80" font-family="'Noto Sans', sans-serif" font-size="16" font-weight="400" fill="#6B7280" text-anchor="middle">
    核心逻辑：复杂任务拆解 -> 角色专精执行 -> 协议化协作
  </text>

  <!-- ========================================================================= -->
  <!-- STEP 1: INPUT (Complex Task) -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 250)">
    <!-- Node -->
    <circle cx="60" cy="60" r="50" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
    <text x="60" y="55" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">User</text>
    <text x="60" y="75" font-family="'Noto Sans', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Input</text>

    <!-- Label -->
    <text x="60" y="130" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">
      复杂模糊需求
    </text>
  </g>

  <!-- Arrow: Input -> Dispatcher -->
  <path d="M 170 310 L 250 310" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- ========================================================================= -->
  <!-- STEP 2: DISPATCHER (The Brain/Router) -->
  <!-- ========================================================================= -->
  <g transform="translate(260, 230)">
    <!-- Diamond Shape for Decision/Router -->
    <polygon points="80,0 160,80 80,160 0,80" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
    <text x="80" y="75" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">调度器</text>
    <text x="80" y="95" font-family="'Noto Sans', sans-serif" font-size="12" fill="#60A5FA" text-anchor="middle">(Dispatcher)</text>

    <!-- Label -->
    <text x="80" y="190" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">
      任务拆解
    </text>
    <text x="80" y="210" font-family="'Noto Sans', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Decomposition</text>
  </g>

  <!-- Distribution Arrows (Splitting) -->
  <!-- Top Path -->
  <path d="M 420 310 C 460 310 460 150 500 150" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
  <!-- Middle Path -->
  <path d="M 420 310 L 500 310" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
  <!-- Bottom Path -->
  <path d="M 420 310 C 460 310 460 470 500 470" fill="none" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>

  <!-- ========================================================================= -->
  <!-- STEP 3: EXECUTION (Specialized Agents) -->
  <!-- ========================================================================= -->
  <g transform="translate(520, 0)">

    <!-- Top Agent: Planner (Blue - Brain) -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="30" cy="40" r="15" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <text x="30" y="45" font-family="'Noto Sans', sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">A</text>

      <text x="60" y="30" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">规划专家 (Planner)</text>
      <text x="60" y="55" font-family="'Noto Sans', sans-serif" font-size="12" fill="#4B5563">拆解步骤，制定SOP</text>
    </g>

    <!-- Middle Agent: Coder (Green - Execution) -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#F0FDF4" stroke="#34D399" stroke-width="2"/>
      <circle cx="30" cy="40" r="15" fill="#DCFCE7" stroke="#34D399" stroke-width="2"/>
      <text x="30" y="45" font-family="'Noto Sans', sans-serif" font-size="12" fill="#065F46" text-anchor="middle">B</text>

      <text x="60" y="30" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#065F46">代码专家 (Coder)</text>
      <text x="60" y="55" font-family="'Noto Sans', sans-serif" font-size="12" fill="#4B5563">生成具体代码实现</text>
    </g>

    <!-- Bottom Agent: Reviewer (Yellow - Quality) -->
    <g transform="translate(0, 430)">
      <rect x="0" y="0" width="220" height="80" rx="8" fill="#FEF9C3" stroke="#FACC15" stroke-width="2"/>
      <circle cx="30" cy="40" r="15" fill="#FEF3C7" stroke="#FACC15" stroke-width="2"/>
      <text x="30" y="45" font-family="'Noto Sans', sans-serif" font-size="12" fill="#92400E" text-anchor="middle">C</text>

      <text x="60" y="30" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#92400E">审查专家 (Reviewer)</text>
      <text x="60" y="55" font-family="'Noto Sans', sans-serif" font-size="12" fill="#4B5563">安全检查与优化</text>
    </g>

    <!-- Phase Label -->
    <text x="110" y="550" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">
      角色专精 (Specialization)
    </text>
  </g>

  <!-- Integration Arrows (Converging) -->
  <path d="M 740 150 C 780 150 780 310 820 310" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 740 310 L 820 310" stroke="#34D399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 740 470 C 780 470 780 310 820 310" fill="none" stroke="#FACC15" stroke-width="2" marker-end="url(#arrow-yellow)"/>

  <!-- ========================================================================= -->
  <!-- STEP 4: INTEGRATION (Result) -->
  <!-- ========================================================================= -->
  <g transform="translate(840, 230)">
    <!-- Box -->
    <rect x="0" y="0" width="160" height="160" rx="12" fill="#F9FAFB" stroke="#4B5563" stroke-width="2"/>
    <text x="80" y="40" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">集成结果</text>

    <!-- Artifact Icons -->
    <rect x="40" y="60" width="80" height="10" rx="2" fill="#E5E7EB"/>
    <rect x="40" y="80" width="60" height="10" rx="2" fill="#E5E7EB"/>
    <rect x="40" y="100" width="70" height="10" rx="2" fill="#E5E7EB"/>

    <!-- Label -->
    <text x="80" y="190" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#4B5563" text-anchor="middle">
      协作集成
    </text>
    <text x="80" y="210" font-family="'Noto Sans', sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Integration</text>
  </g>

  <!-- Final Output Arrow -->
  <path d="M 1000 310 L 1080 310" stroke="#111827" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Output -->
  <g transform="translate(1090, 280)">
    <text x="0" y="20" font-family="'Noto Sans', sans-serif" font-size="14" font-weight="700" fill="#111827">Solution</text>
    <text x="0" y="40" font-family="'Noto Sans', sans-serif" font-size="12" fill="#6B7280">可交付成果</text>
  </g>

  <!-- ========================================================================= -->
  <!-- Definitions -->
  <!-- ========================================================================= -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#9CA3AF" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#34D399" />
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FACC15" />
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>

  <!-- License -->
  <text x="600" y="600" font-family="'Noto Sans', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
    本作品采用 CC-BY-SA 4.0 国际许可协议进行许可，© 2025 Gitconomy Research 社区
  </text>

</svg>
