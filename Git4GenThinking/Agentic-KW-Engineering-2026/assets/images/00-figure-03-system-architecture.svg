<svg viewBox="0 0 1000 850" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：实验环境系统架构图
文件命名：00-figure-03-system-architecture.svg
用途：展示“本地优先”的存算分离无GPU智能体实验环境架构
版本：v2.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-01-30
更新日期：2026-02-20（版本2.0，根据讲义更新的内容重新设计课程实验的系统架构图）
================================================================================
-->
  <!--
  ===========================================================================
       背景声明：纯白背景 (Solid White) - 免疫 Git 平台深色模式干扰
  ===========================================================================
  -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <!-- CSS 变量与基础样式 -->
    <style>
      :root {
        --c-cloud-blue: #0052CC;
        --c-cloud-blue-light: rgba(0, 82, 204, 0.04);
        --c-local-green: #00875A;
        --c-local-green-light: rgba(0, 135, 90, 0.04);
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --font-sans: "Noto Sans SC", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
      }

      text { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); }
      .text-title { font-weight: bold; }

      .box-local { stroke: var(--c-local-green); fill: var(--c-local-green-light); stroke-dasharray: 8 8; stroke-width: 2px; }
      .box-cloud { stroke: var(--c-cloud-blue); fill: var(--c-cloud-blue-light); stroke-dasharray: 8 8; stroke-width: 2px; }

      .node-client { fill: #FFFFFF; stroke: var(--c-local-green); stroke-width: 2px; }
      .node-body { fill: #E3FCEF; stroke: var(--c-local-green); stroke-width: 2px; }
      .node-nerves { fill: #FFFFFF; stroke: var(--c-local-green); stroke-width: 1.5px; }
      .node-protocol { fill: #FFFFFF; stroke: var(--c-neutral-gray); stroke-width: 2px; }
      .node-brain { fill: #FFFFFF; stroke: var(--c-cloud-blue); stroke-width: 2.5px; }
      .node-store-bg { fill: #F8FAFC; }

      .line-async-blue { stroke: var(--c-cloud-blue); stroke-dasharray: 5 4; fill: none; stroke-width: 2px; }
      .line-async-amber { stroke: var(--c-risk-amber); stroke-dasharray: 5 4; fill: none; stroke-width: 2px; }
      .line-sync-green { stroke: var(--c-local-green); fill: none; stroke-width: 2px; }
      .line-sync-gray { stroke: var(--c-neutral-gray); fill: none; stroke-width: 2px; }
    </style>

    <!-- 箭头标记定义 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

  <!--
  ===========================================================================
       1. 标题块 (Title Block)
  ===========================================================================
  -->
  <g id="title-block" transform="translate(500, 40)">
    <text y="20" text-anchor="middle" class="text-title" font-size="24" fill="#000000">课程实验环境系统架构示意图</text>
    <text y="45" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">课程导论 > 实验环境</text>
    <line x1="-40" y1="60" x2="40" y2="60" stroke="var(--c-local-green)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!--
  ===========================================================================
       2. 架构边界与容器 (Architecture Boundaries)
  ===========================================================================
  -->
  <g id="diagram-content" transform="translate(0, 120)">

    <!-- Local Region (本地边界) -->
    <rect x="40" y="20" width="600" height="540" rx="16" class="box-local" />
    <rect x="60" y="0" width="310" height="30" fill="#FFFFFF" />
    <text x="70" y="20" class="text-mono" font-size="14" fill="var(--c-local-green)" font-weight="bold">
      [Local] 存算分离本地环境 (无GPU)
    </text>

    <!-- Cloud Region (云端边界) -->
    <rect x="680" y="20" width="280" height="540" rx="16" class="box-cloud" />
    <rect x="700" y="0" width="230" height="30" fill="#FFFFFF" />
    <text x="710" y="20" class="text-mono" font-size="14" fill="var(--c-cloud-blue)" font-weight="bold">
      [Cloud] 远程算力
    </text>


    <!--
    ===========================================================================
         3. 数据流连线 (底层绘制防止遮挡)
    ===========================================================================
    -->
    <!-- 客户端 -> 云端大脑 (Async) -->
    <path d="M 560,120 C 650,120 650,260 740,260" class="line-async-amber" marker-end="url(#arrow-amber)"/>
    <rect x="610" y="160" width="85" height="20" fill="#FFFFFF" rx="4"/>
    <text x="652" y="174" text-anchor="middle" class="text-mono" font-size="11" fill="var(--c-risk-amber)">await /v1/chat</text>

    <!-- 神经插件 -> 云端大脑 (Async) -->
    <path d="M 320,310 C 500,310 600,290 740,290" class="line-async-blue" marker-end="url(#arrow-blue)"/>
    <rect x="450" y="285" width="90" height="20" fill="#FFFFFF" rx="4"/>
    <text x="495" y="299" text-anchor="middle" class="text-mono" font-size="11" fill="var(--c-cloud-blue)">LLM API Call</text>

    <!-- 客户端 -> MCP协议 (Sync) -->
    <path d="M 470,160 L 470,210" class="line-sync-green" marker-end="url(#arrow-green)"/>
    <rect x="425" y="175" width="90" height="20" fill="#FFFFFF" rx="4"/>
    <text x="470" y="189" text-anchor="middle" class="text-mono" font-size="11" fill="var(--c-local-green)">stdio / SSE</text>

    <!-- 本地身体 -> 存储层 (Sync) -->
    <path d="M 210,360 L 210,420" class="line-sync-gray" marker-end="url(#arrow-gray)"/>
    <rect x="165" y="380" width="90" height="20" fill="#FFFFFF" rx="4"/>
    <text x="210" y="394" text-anchor="middle" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">File I/O</text>

    <!-- MCP协议 -> 存储层/工具执行 (Sync) -->
    <path d="M 470,360 L 470,420" class="line-sync-gray" marker-end="url(#arrow-gray)"/>
    <rect x="425" y="380" width="90" height="20" fill="#FFFFFF" rx="4"/>
    <text x="470" y="394" text-anchor="middle" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">Tool Execute</text>


    <!--
    ===========================================================================
         4. 实体节点绘制 (Nodes)
    ===========================================================================
    -->

    <!-- 【节点 5】客户端 (Client) -->
    <g transform="translate(80, 80)">
      <rect width="480" height="80" rx="8" class="node-client" />
      <text x="240" y="30" text-anchor="middle" class="text-title" font-size="16" fill="var(--c-local-green)">5. 客户端 (Client UI)</text>
      <text x="240" y="55" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">Cherry Studio / Cursor / Claude Desktop (用于调试与编排)</text>
    </g>

    <!-- 【节点 2 & 3】身体 (Body) 与 神经 (Nerves) -->
    <g transform="translate(80, 220)">
      <rect width="260" height="140" rx="8" class="node-body" />
      <text x="130" y="30" text-anchor="middle" class="text-title" font-size="16" fill="var(--c-local-green)">2. 身体 (Body)</text>
      <text x="130" y="50" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">Obsidian 知识主控台</text>

      <!-- 内部子节点：神经 -->
      <g transform="translate(20, 65)">
        <rect width="220" height="55" rx="6" class="node-nerves" />
        <text x="110" y="22" text-anchor="middle" font-weight="bold" font-size="13" fill="var(--c-local-green)">3. 神经 (Nerves)</text>
        <text x="110" y="42" text-anchor="middle" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">Text Generator / Tars 插件</text>
      </g>
    </g>

    <!-- 【节点 4】协议 (Protocol) -->
    <g transform="translate(380, 220)">
      <rect width="180" height="140" rx="8" class="node-protocol" />
      <text x="90" y="40" text-anchor="middle" class="text-title" font-size="16" fill="var(--c-neutral-gray)">4. 协议 (Protocol)</text>
      <text x="90" y="65" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-local-green)">MCP Servers</text>
      <line x1="20" y1="85" x2="160" y2="85" stroke="var(--c-neutral-gray)" stroke-dasharray="2 2" stroke-width="1"/>
      <text x="90" y="105" text-anchor="middle" font-size="11" fill="var(--c-neutral-gray)">连接本地文件与 Python 工具</text>
    </g>

    <!-- 本地存储引擎 (Storage Cylinder) -->
    <g transform="translate(180, 430)">
      <ellipse cx="160" cy="15" rx="160" ry="15" class="node-store-bg" stroke="var(--c-neutral-gray)" stroke-width="2"/>
      <rect x="0" y="15" width="320" height="70" class="node-store-bg" />
      <path d="M 0,85 A 160 15 0 0 0 320 85" fill="none" stroke="var(--c-neutral-gray)" stroke-width="2"/>
      <line x1="0" y1="15" x2="0" y2="85" stroke="var(--c-neutral-gray)" stroke-width="2"/>
      <line x1="320" y1="15" x2="320" y2="85" stroke="var(--c-neutral-gray)" stroke-width="2"/>

      <text x="160" y="55" text-anchor="middle" class="text-title" font-size="14" fill="var(--c-neutral-gray)">本地持久化数据 (Data &amp; Memory)</text>
      <text x="160" y="75" text-anchor="middle" class="text-mono" font-size="12" fill="#94A3B8">Markdown 结构化文件 / FAISS 向量库</text>
    </g>

    <!-- 【节点 1】云端大脑 (Remote Brain) - 六边形 -->
    <g transform="translate(820, 275)">
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" class="node-brain" />
      <text y="-15" text-anchor="middle" class="text-title" font-size="16" fill="var(--c-cloud-blue)">1. 大脑 (Brain)</text>
      <text y="5" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">DeepSeek / Qwen</text>
      <text y="25" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">Claude (via API)</text>

      <!-- 发光核心装饰 -->
      <circle cx="0" cy="-45" r="4" fill="var(--c-cloud-blue)" />
    </g>

  </g>

  <!--
  ===========================================================================
       5. 图例说明 (Legend & Key Block)
  ===========================================================================
  -->
  <g id="legend-block" transform="translate(100, 720)">
    <rect x="0" y="0" width="780" height="50" rx="6" fill="rgba(255,255,255,0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>
    <g transform="translate(20, 30)">

      <text x="0" y="0" class="text-title" font-size="12" fill="var(--c-neutral-gray)">图例：</text>

      <!-- 图例 1: Cloud Brain -->
      <g transform="translate(50, -8)">
        <polygon points="0,-6 7,-2 7,4 0,8 -7,4 -7,-2" fill="var(--c-cloud-blue)" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#334155">Remote Brain (API)</text>
      </g>

      <!-- 图例 2: Local Body -->
      <g transform="translate(200, -8)">
        <rect x="-6" y="-6" width="12" height="12" rx="3" fill="var(--c-local-green)" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#334155">Local Body (CPU)</text>
      </g>

      <!-- 图例 3: Storage -->
      <g transform="translate(340, -8)">
        <path d="M-6, -2 A6,2 0 1,1 6,-2 A6,2 0 1,1 -6,-2 Z" fill="#94A3B8" />
        <rect x="-6" y="-2" width="12" height="6" fill="#94A3B8" />
        <path d="M-6, 4 A6,2 0 0,0 6,4" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
        <text x="12" y="4" class="text-mono" font-size="11" fill="#334155">Storage / Memory</text>
      </g>

      <!-- 图例 4: Async I/O -->
      <g transform="translate(480, -8)">
        <line x1="-8" y1="0" x2="8" y2="0" class="line-async-amber" stroke-width="2" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#334155">Network I/O (Async)</text>
      </g>

      <!-- 图例 5: Sync I/O -->
      <g transform="translate(620, -8)">
        <line x1="-8" y1="0" x2="8" y2="0" class="line-sync-green" stroke-width="2" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#334155">Local I/O (Sync)</text>
      </g>

    </g>
  </g>

  <!--
  ===========================================================================
       6. 底部许可注释 (Footer License)
  ===========================================================================
  -->
  <text x="500" y="810" text-anchor="middle" font-size="11" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
