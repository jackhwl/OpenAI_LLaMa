<svg viewBox="0 0 1000 850" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：人机协同 (HITL) 工作流程示意图
文件命名：12-figure-02-hitl-workflow.svg
用途：说明智能体在执行不同风险等级的任务时，如何通过拦截网关和 HITL 机制与人类进行权限交互。
版本：v1.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: CC-BY-SA-4.0
创建日期：2026-02-21
================================================================================
-->
  <!-- Background: Solid White (强兼容模式) -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;
        --c-gray-light: #F8FAFC;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-weight: 700; font-size: 26px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      .text-region { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
      .text-node-title { font-weight: 700; font-size: 14px; fill: #000; }
      .text-node-sub { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }
      .text-link { font-size: 12px; font-weight: 700; }
      .text-legend { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); }

      /* Specific Block Fonts */
      .font-mono { font-family: var(--font-mono); }
      .font-sans { font-family: var(--font-sans); }

      /* Connectors */
      .connector-async { fill: none; stroke: var(--c-cloud-blue); stroke-width: 2.5; stroke-dasharray: 6 4; }
      .connector-sync { fill: none; stroke: var(--c-local-green); stroke-width: 2.5; }
      .connector-amber { fill: none; stroke: var(--c-risk-amber); stroke-width: 2.5; }
      .connector-gray { fill: none; stroke: var(--c-neutral-gray); stroke-width: 2.5; }
    </style>

    <!-- Node Drop Shadow -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 500
===========================================================================
-->
  <g id="title-block" transform="translate(500, 40)">
    <!-- Main Title -->
    <text y="20" text-anchor="middle" class="text-title-main">人机协同 (HITL) 决策与执行工作流
    </text>

    <!-- Breadcrumbs -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">第 12 天 > 基础原理</text>

    <!-- Context Indicator (Absolute Y = 100) -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 150 (Ensures exactly 50px Gap from Title Block Indicator)
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- ===================================================================
         边界容器 (Boundary Regions)
    ==================================================================== -->
    <!-- Cloud Region -->
    <rect x="340" y="60" width="320" height="90" rx="12" fill="var(--c-cloud-blue-light)" fill-opacity="0.15" stroke="var(--c-cloud-blue)" stroke-width="1.5" stroke-dasharray="6 4" />
    <text x="500" y="80" text-anchor="middle" class="font-mono text-node-title" fill="var(--c-cloud-blue)">Remote Cloud (云端)</text>

    <!-- Local Region -->
    <rect x="40" y="180" width="920" height="400" rx="12" fill="var(--c-local-green-light)" fill-opacity="0.2" stroke="var(--c-local-green)" stroke-width="1.5" />
    <text x="500" y="205" text-anchor="middle" class="font-mono text-node-title" fill="var(--c-local-green)">Localhost (本地客户端与环境)</text>


    <!-- ===================================================================
         1. 客户端输入 (Local User Input)
         Center X = 500, Y = 20
    ==================================================================== -->
    <g id="node-input" transform="translate(500, 20)" filter="url(#drop-shadow)">
      <rect x="-120" y="-20" width="240" height="40" rx="8" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="2" />
      <text y="5" text-anchor="middle" class="text-node-title">💻 客户端: 用户下发修改指令</text>
    </g>

    <!-- Flow 1: Input to Brain -->
    <path d="M 500 40 L 500 95" class="connector-async" marker-end="url(#arrow-blue)" />


    <!-- ===================================================================
         2. AI 大脑推理 (Cloud Brain)
         Center X = 500, Y = 115
    ==================================================================== -->
    <g id="node-brain" transform="translate(500, 115)" filter="url(#drop-shadow)">
      <polygon points="-80,-20 80,-20 100,0 80,20 -80,20 -100,0" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2.5" />
      <text y="5" text-anchor="middle" class="text-node-title">🧠 LLM 大脑 (生成工具载荷)</text>
    </g>

    <!-- Flow 2: Brain to Router -->
    <path d="M 500 135 L 500 235" class="connector-async" marker-end="url(#arrow-blue)" />
    <text x="510" y="180" text-anchor="start" class="text-link" fill="var(--c-cloud-blue)">JSON Payload</text>


    <!-- ===================================================================
         3. MCP 路由器 (Tool Router)
         Center X = 500, Y = 255
    ==================================================================== -->
    <g id="node-router" transform="translate(500, 255)" filter="url(#drop-shadow)">
      <rect x="-100" y="-20" width="200" height="40" rx="8" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="2" />
      <text y="5" text-anchor="middle" class="text-node-title">🔀 MCP 工具路由器</text>
    </g>

    <!-- Flow 3: Router to Risk Filter -->
    <path d="M 500 275 L 500 305" class="connector-sync" marker-end="url(#arrow-green)" />


    <!-- ===================================================================
         4. 风险过滤器 (Risk Filter Decision)
         Center X = 500, Y = 345
    ==================================================================== -->
    <g id="node-filter" transform="translate(500, 345)" filter="url(#drop-shadow)">
      <!-- Diamond Shape -->
      <polygon points="0,-40 80,0 0,40 -80,0" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="2.5" />
      <text y="-5" text-anchor="middle" class="font-sans text-node-title" fill="var(--c-risk-amber)">🛡️ 风险过滤</text>
      <text y="10" text-anchor="middle" class="font-mono text-xs" fill="var(--c-risk-amber)">(Risk Assess)</text>
    </g>


    <!-- ===================================================================
         分支 A: L1/L2 低风险自动放行 (Auto-Approve)
    ==================================================================== -->
    <!-- Path A: Filter -> Auto Execute -->
    <path d="M 420 345 L 200 345 L 200 495" class="connector-sync" marker-end="url(#arrow-green)" />
    <text x="310" y="335" text-anchor="middle" class="text-link" fill="var(--c-local-green)">[L1/L2] 读写/沙箱操作</text>

    <g id="node-auto-execute" transform="translate(200, 525)" filter="url(#drop-shadow)">
      <rect x="-90" y="-30" width="180" height="60" rx="8" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-width="2" />
      <text y="-5" text-anchor="middle" class="text-node-title" fill="var(--c-local-green)">✅ 自动放行</text>
      <text y="15" text-anchor="middle" class="font-mono text-xs" fill="var(--c-local-green)">(自动同意并执行)</text>
    </g>


    <!-- ===================================================================
         分支 B: L3 高风险人机协同 (HITL Confirmation)
    ==================================================================== -->
    <!-- Path B: Filter -> HITL Box -->
    <path d="M 580 345 L 700 345 L 700 380" class="connector-amber" marker-end="url(#arrow-amber)" />
    <text x="640" y="335" text-anchor="middle" class="text-link" fill="var(--c-risk-amber)">[L3] 破坏性操作</text>

    <!-- HITL Confirmation Box -->
    <g id="node-hitl" transform="translate(700, 425)" filter="url(#drop-shadow)">
      <rect x="-100" y="-45" width="200" height="90" rx="8" fill="var(--c-risk-amber-light)" stroke="var(--c-risk-amber)" stroke-width="2.5" />
      <text y="-18" text-anchor="middle" class="text-node-title" fill="var(--c-risk-amber)">🛑 人机协同 (HITL)</text>
      <text y="2" text-anchor="middle" class="font-sans text-xs text-bold" fill="var(--c-neutral-gray)">进程挂起，弹出系统警告</text>
      <text y="20" text-anchor="middle" class="font-sans text-xs text-bold" fill="var(--c-neutral-gray)">等待用户明确授权</text>
    </g>


    <!-- ===================================================================
         人机决策结果 (User Decision: Y/N)
    ==================================================================== -->
    <!-- 决策 Y: Execute -->
    <path d="M 700 470 L 700 500 L 550 500 L 550 515" class="connector-sync" marker-end="url(#arrow-green)" />
    <text x="625" y="490" text-anchor="middle" class="text-link" fill="var(--c-local-green)">用户授权: [ Y ]</text>

    <g id="node-execute" transform="translate(550, 545)" filter="url(#drop-shadow)">
      <rect x="-90" y="-30" width="180" height="60" rx="8" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="2" />
      <text y="-5" text-anchor="middle" class="text-node-title" fill="var(--c-local-green)">✅ 执行指令</text>
      <text y="15" text-anchor="middle" class="font-sans text-xs" fill="var(--c-neutral-gray)">物理落盘，完成修改</text>
    </g>

    <!-- 决策 N: Cancel -->
    <path d="M 700 470 L 700 500 L 850 500 L 850 515" class="connector-gray" marker-end="url(#arrow-gray)" />
    <text x="775" y="490" text-anchor="middle" class="text-link" fill="var(--c-neutral-gray)">用户拒绝: [ N ]</text>

    <g id="node-cancel" transform="translate(850, 545)" filter="url(#drop-shadow)">
      <rect x="-90" y="-30" width="180" height="60" rx="8" fill="var(--c-gray-light)" stroke="var(--c-neutral-gray)" stroke-width="2" />
      <text y="-5" text-anchor="middle" class="text-node-title" fill="var(--c-neutral-gray)">🚫 拦截并取消</text>
      <text y="15" text-anchor="middle" class="font-sans text-xs" fill="var(--c-neutral-gray)">放弃操作，文件安全</text>
    </g>

  </g>

<!--
===========================================================================
     底部图例与注释块 (Legend & Key Block)
===========================================================================
-->
  <g id="legend" transform="translate(500, 770)">
    <rect x="-400" y="-16" width="800" height="32" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-380, 0)">
      <text x="0" y="4" class="font-sans text-xs text-bold" fill="var(--c-neutral-gray)">图例说明:</text>

      <!-- Legend 1 -->
      <g transform="translate(100, 0)">
        <polygon points="-6,-5 0,-10 6,-5 6,5 0,10 -6,5" fill="var(--c-cloud-blue)" />
        <text x="12" y="4" class="text-legend">云端大模型 (Cloud Brain)</text>
      </g>

      <!-- Legend 2 -->
      <g transform="translate(290, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
        <text x="12" y="4" class="text-legend">本地执行 (Local Execution)</text>
      </g>

      <!-- Legend 3 -->
      <g transform="translate(480, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-risk-amber)" />
        <text x="12" y="4" class="text-legend">安全拦截与挂起 (Safety Intercept)</text>
      </g>
    </g>
  </g>

<!--
===========================================================================
     底部许可注释 (License)
===========================================================================
-->
  <text x="500" y="810" text-anchor="middle" class="font-sans text-xs" fill="#94A3B8">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
