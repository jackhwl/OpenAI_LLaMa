<!--
================================================================================
图表名称：S.C.O.R.E. 熵减收敛模型示意图 (纯中文图例版)
文件命名：02-figure-02-score-funnel-model.svg
用途：可视化展示从“高熵混沌意图”到“低熵结构协议”的转化过程
版本：v2.6.0
作者：Gitconomy 图形工程师
SPDX-License-Identifier: CC-BY-SA-4.0
创建日期：2026-01-31
================================================================================
-->
<svg width="800" height="850" viewBox="0 0 800 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <style>
      :root {
        /* 语义色系统 [2] */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-brand-purple: #8B5CF6;
        --c-funnel-fill: rgba(0, 82, 204, 0.03);

        /* 字体规范 [3.2] */
        --font-sans: "Noto Sans SC", "Inter", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", monospace;
      }

      text { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); font-size: 14px; }
      .text-title { font-family: var(--font-sans); font-weight: bold; fill: #000000; font-size: 24px; }
      .text-step-title { font-family: var(--font-sans); font-weight: bold; font-size: 16px; fill: #1E293B; }
      .text-step-desc { font-family: var(--font-sans); font-size: 12px; fill: #64748B; }
      .text-num { font-family: var(--font-mono); font-weight: bold; fill: var(--c-brand-purple); font-size: 18px; }

      .funnel-body { fill: var(--c-funnel-fill); stroke: var(--c-cloud-blue); stroke-width: 2; }
      .layer-divider { stroke: var(--c-cloud-blue); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.2; }
      .connector { stroke: var(--c-neutral-gray); stroke-width: 1; opacity: 0.5; fill: none; }
      .protocol-card { fill: #FFFFFF; stroke: var(--c-local-green); stroke-width: 2; rx: 4; }
    </style>

    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

  <!-- 1. 标题块 -->
  <g id="title-block" transform="translate(400, 40)">
    <text y="20" text-anchor="middle" class="text-title">S.C.O.R.E. 熵减收敛模型示意图</text>
    <text y="45" text-anchor="middle" class="text-mono" fill="var(--c-neutral-gray)">第二天 > 基础原理</text>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. 架构图主体 -->
  <g id="diagram-content" transform="translate(0, 120)">

    <!-- 顶部状态标注 -->
    <g transform="translate(320, 30)">
      <text text-anchor="middle" font-weight="bold" font-size="15" fill="#B45309">用户原始意图 (高熵 / 混沌)</text>
    </g>

    <!-- 物理收敛漏斗 -->
    <g transform="translate(320, 60)">
      <path d="M-200,0 L200,0 L70,400 L-70,400 Z" class="funnel-body" />

      <!-- 语义分层 -->
      <line x1="-168" y1="80" x2="168" y2="80" class="layer-divider" />
      <line x1="-135" y1="160" x2="135" y2="160" class="layer-divider" />
      <line x1="-103" y1="240" x2="103" y2="240" class="layer-divider" />
      <line x1="-85" y1="320" x2="85" y2="320" class="layer-divider" />

      <!-- 粒子云分布 -->
      <g opacity="0.6">
        <circle cx="-160" cy="20" r="4" fill="var(--c-risk-amber)" />
        <circle cx="-130" cy="45" r="6" fill="var(--c-risk-amber)" opacity="0.4" />
        <circle cx="-100" cy="15" r="3" fill="var(--c-risk-amber)" />
        <circle cx="-70" cy="55" r="5" fill="var(--c-risk-amber)" opacity="0.7" />
        <circle cx="-40" cy="30" r="4" fill="var(--c-risk-amber)" />
        <circle cx="-10" cy="60" r="6" fill="var(--c-risk-amber)" opacity="0.3" />
        <circle cx="20" cy="25" r="3" fill="var(--c-risk-amber)" />
        <circle cx="50" cy="50" r="5" fill="var(--c-risk-amber)" opacity="0.6" />
        <circle cx="85" cy="15" r="4" fill="var(--c-risk-amber)" />
        <circle cx="120" cy="55" r="7" fill="var(--c-risk-amber)" opacity="0.4" />
        <circle cx="155" cy="30" r="3" fill="var(--c-risk-amber)" />
        <circle cx="180" cy="10" r="5" fill="var(--c-risk-amber)" opacity="0.5" />
        <circle cx="-120" cy="65" r="2.5" fill="var(--c-risk-amber)" />
        <circle cx="35" cy="10" r="4" fill="var(--c-risk-amber)" />
        <circle cx="140" cy="40" r="5" fill="var(--c-risk-amber)" />
      </g>

      <!-- 中间收敛粒子云 (蓝色) -->
      <g transform="translate(0, 100)" opacity="0.7">
        <circle cx="-80" cy="20" r="4" fill="var(--c-cloud-blue)" />
        <circle cx="-40" cy="45" r="3" fill="var(--c-cloud-blue)" />
        <circle cx="10" cy="30" r="5" fill="var(--c-cloud-blue)" />
        <circle cx="60" cy="55" r="3" fill="var(--c-cloud-blue)" />
        <circle cx="-20" cy="90" r="4" fill="var(--c-cloud-blue)" />
        <circle cx="30" cy="110" r="3" fill="var(--c-cloud-blue)" />
        <circle cx="-50" cy="140" r="3.5" fill="var(--c-cloud-blue)" />
        <circle cx="45" cy="160" r="3" fill="var(--c-cloud-blue)" />
        <circle cx="0" cy="190" r="4" fill="var(--c-cloud-blue)" />
      </g>

      <!-- 底部有序粒子云 -->
      <g transform="translate(0, 300)">
        <circle cx="-25" cy="30" r="3" fill="var(--c-cloud-blue)" />
        <circle cx="25" cy="35" r="3" fill="var(--c-cloud-blue)" />
        <circle cx="-12" cy="70" r="3.5" fill="var(--c-cloud-blue)" />
        <circle cx="12" cy="70" r="3.5" fill="var(--c-cloud-blue)" />
        <circle cx="-8" cy="110" r="3" fill="var(--c-cloud-blue)" />
        <circle cx="8" cy="110" r="3" fill="var(--c-cloud-blue)" />
      </g>
    </g>

    <!-- 右侧逻辑描述区 -->
    <g transform="translate(540, 60)">
      <g transform="translate(0, 40)">
        <line x1="-110" y1="0" x2="-20" y2="0" class="connector" marker-end="url(#arrow-gray)" />
        <text class="text-num">S</text><text x="18" class="text-step-title">etting (角色设定)</text>
        <text y="22" class="text-step-desc">锚定潜空间权重，屏蔽噪声</text>
      </g>
      <g transform="translate(0, 120)">
        <line x1="-130" y1="0" x2="-20" y2="0" class="connector" marker-end="url(#arrow-gray)" />
        <text class="text-num">C</text><text x="18" class="text-step-title">ontext (背景信息)</text>
        <text y="22" class="text-step-desc">界定语义边界，提供基准数据</text>
      </g>
      <g transform="translate(0, 200)">
        <line x1="-150" y1="0" x2="-20" y2="0" class="connector" marker-end="url(#arrow-gray)" />
        <text class="text-num">O</text><text x="18" class="text-step-title">bjective (任务目标)</text>
        <text y="22" class="text-step-desc">明确意图，驱动概率链条收敛</text>
      </g>
      <g transform="translate(0, 280)">
        <line x1="-170" y1="0" x2="-20" y2="0" class="connector" marker-end="url(#arrow-gray)" />
        <text class="text-num">R</text><text x="18" class="text-step-title">equirement (输出要求)</text>
        <text y="22" class="text-step-desc">工程约束，强制输出模式规范</text>
      </g>
      <g transform="translate(0, 360)">
        <line x1="-190" y1="0" x2="-20" y2="0" class="connector" marker-end="url(#arrow-gray)" />
        <text class="text-num">E</text><text x="18" class="text-step-title">valuation (评估标准)</text>
        <text y="22" class="text-step-desc">建立反馈闭环，验证输出合规</text>
      </g>
    </g>

    <!-- 3. 底部低熵区 -->
    <g transform="translate(320, 485)">
      <path d="M 0,-25 L 0,25" class="connector" stroke-dasharray="4 4" marker-end="url(#arrow-gray)" />
      <rect x="-50" y="30" width="100" height="70" class="protocol-card" />
      <g transform="translate(-35, 50)">
        <line x1="0" y1="0" x2="70" y2="0" stroke="var(--c-local-green)" stroke-width="2" />
        <line x1="0" y1="12" x2="50" y2="12" stroke="var(--c-local-green)" stroke-width="2" opacity="0.6" />
        <line x1="0" y1="24" x2="60" y2="24" stroke="var(--c-local-green)" stroke-width="2" />
        <line x1="0" y1="36" x2="30" y2="36" stroke="var(--c-local-green)" stroke-width="2" opacity="0.4" />
      </g>
      <text y="130" text-anchor="middle" font-weight="bold" font-size="15" fill="#1B5E20">结构化软协议 (低熵 / 有序)</text>
    </g>
  </g>

  <!-- 4. 图例与注释块 -->
  <g id="legend-block" transform="translate(400, 750)">
    <rect x="-260" y="0" width="520" height="40" rx="20" fill="rgba(255, 255, 255, 0.9)" stroke="#E2E8F0" stroke-width="0.5"/>
    <g transform="translate(-240, 25)">
      <text x="0" y="0" font-weight="bold" font-size="10" fill="#64748B">图例说明</text>

      <!-- 高熵输入 -->
      <g transform="translate(80, -10)">
        <circle cx="5" cy="5" r="5" fill="var(--c-risk-amber)" />
        <text x="15" y="9" class="text-mono" font-size="10" fill="#334155">高熵输入</text>
      </g>

      <!-- 收敛过滤 -->
      <g transform="translate(180, -10)">
        <circle cx="5" cy="5" r="5" fill="var(--c-cloud-blue)" />
        <text x="15" y="9" class="text-mono" font-size="10" fill="#334155">收敛过滤</text>
      </g>

      <!-- 工程心法 -->
      <g transform="translate(280, -10)">
        <rect width="10" height="10" rx="2" fill="var(--c-brand-purple)" />
        <text x="15" y="9" class="text-mono" font-size="10" fill="#334155">工程心法</text>
      </g>

      <!-- 描述 -->
      <text x="380" y="-1" class="text-step-desc" font-size="10" font-style="italic">熵减过程：无序 -> 有序</text>
    </g>
  </g>

  <!-- 5. 底部许可注释 -->
  <text x="400" y="820" text-anchor="middle" class="text-step-desc">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>
</svg>
