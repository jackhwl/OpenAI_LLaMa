<svg viewBox="0 0 800 800" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：学员阶梯式学习之旅路线图
文件命名：00-figure-02-learning-user-journey.svg
用途：展示课程三个核心阶段（控制嘴、构建脑、打造手）的进阶路径与技术目标
版本：v2.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-01-30
更新日期：2026-02-20（版本2.0，更新示意图背景和优化图像布局）
================================================================================
-->
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;
        --c-gray-light: #F1F5F9;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-family: var(--font-sans); font-weight: 700; font-size: 24px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      /* Card Typography */
      .card-title { font-family: var(--font-sans); font-weight: 700; font-size: 16px; fill: #000; }
      .card-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
      .card-bullet { font-family: var(--font-sans); font-size: 11px; fill: #334155; }

      .text-legend { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }

      /* Connectors */
      .path-connector { fill: none; stroke: var(--c-neutral-gray); stroke-width: 2; stroke-dasharray: 4 2; }
      .path-bg-ramp { fill: var(--c-cloud-blue-light); opacity: 0.15; }
    </style>

    <!-- Drop Shadow Filter for Cards -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>

    <!-- Arrow Marker for Connectors -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 400
===========================================================================
-->
  <g id="title-block" transform="translate(400, 40)">
    <!-- Main Title (Baseline y=20) -->
    <text y="20" text-anchor="middle" class="text-title-main">学员阶梯式学习之旅路线图</text>

    <!-- Breadcrumbs (25px below title baseline) -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">课前导论 > 学习路径</text>

    <!-- Context Indicator (15px below breadcrumbs, y=60) -->
    <!-- Absolute Canvas Y for Indicator = 40 + 60 = 100 -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 150 (Ensures exactly 50px Gap from Title Block Indicator)
     Absolute Y start = 150. Indicator absolute Y = 100. Gap = 50px.
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- Background Ascending Ramp (Visual Metaphor) -->
    <!-- Top-right vertex is at y=0, ensuring no overlap with the 50px safe zone -->
    <path d="M 10 440 L 790 170 L 790 0 L 10 270 Z" class="path-bg-ramp" />

    <!-- ================= CONNECTOR PATHS (Drawn beneath cards) ================= -->
    <g id="connectors">
      <!-- Card 1 to Card 2 -->
      <path d="M 250 420 C 270 420, 270 280, 290 280" class="path-connector" marker-end="url(#arrow-gray)" />
      <!-- Card 2 to Card 3 -->
      <path d="M 510 280 C 530 280, 530 140, 550 140" class="path-connector" marker-end="url(#arrow-gray)" />
    </g>


    <!-- ================= CARD 1: 驯服大语言模型的嘴 (Cloud/Protocol Focus) ================= -->
    <g id="stage-1" transform="translate(30, 340)">
      <rect x="0" y="0" width="220" height="160" rx="8" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Stage Badge -->
      <rect x="15" y="15" width="135" height="24" rx="12" fill="var(--c-cloud-blue-light)" />
      <text x="82" y="31" text-anchor="middle" class="card-badge" fill="var(--c-cloud-blue)">第一阶段 (Day 1-3)</text>

      <!-- Title -->
      <text x="15" y="65" class="card-title">驯服大语言模型的嘴</text>
      <line x1="15" y1="78" x2="205" y2="78" stroke="#F1F5F9" stroke-width="2"/>

      <!-- Details -->
      <text x="15" y="100" class="card-bullet">🎯 核心：结构化交互与协议握手</text>
      <text x="15" y="122" class="card-bullet">⚙️ 技术：S.C.O.R.E. / JSON 输出</text>
      <text x="15" y="144" class="card-bullet">📦 产出：低熵数据载体与存算分离</text>
    </g>


    <!-- ================= CARD 2: 构建智能体的脑 (Local Storage/Memory Focus) ================= -->
    <g id="stage-2" transform="translate(290, 200)">
      <rect x="0" y="0" width="220" height="160" rx="8" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Stage Badge -->
      <rect x="15" y="15" width="135" height="24" rx="12" fill="var(--c-gray-light)" />
      <text x="82" y="31" text-anchor="middle" class="card-badge" fill="var(--c-neutral-gray)">第二阶段 (Day 4-7)</text>

      <!-- Title -->
      <text x="15" y="65" class="card-title">构建智能体的脑</text>
      <line x1="15" y1="78" x2="205" y2="78" stroke="#F1F5F9" stroke-width="2"/>

      <!-- Details -->
      <text x="15" y="100" class="card-bullet">🎯 核心：知识切片与 RAG 记忆库</text>
      <text x="15" y="122" class="card-bullet">⚙️ 技术：Few-Shot / 双向链接</text>
      <text x="15" y="144" class="card-bullet">📦 产出：Obsidian 知识图谱检索</text>
    </g>


    <!-- ================= CARD 3: 打造自动化的手 (Local Tool/Action Focus) ================= -->
    <g id="stage-3" transform="translate(550, 60)">
      <rect x="0" y="0" width="220" height="160" rx="8" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

      <!-- Stage Badge -->
      <rect x="15" y="15" width="145" height="24" rx="12" fill="var(--c-local-green-light)" />
      <text x="87" y="31" text-anchor="middle" class="card-badge" fill="var(--c-local-green)">第三阶段 (Day 8-14)</text>

      <!-- Title -->
      <text x="15" y="65" class="card-title">打造自动化的手</text>
      <line x1="15" y1="78" x2="205" y2="78" stroke="#F1F5F9" stroke-width="2"/>

      <!-- Details -->
      <text x="15" y="100" class="card-bullet">🎯 核心：MCP 工具调用与自动化</text>
      <text x="15" y="122" class="card-bullet">⚙️ 技术：PEAR 闭环 / ReAct 范式</text>
      <text x="15" y="144" class="card-bullet">📦 产出：多智能体协同 (Multi-Agent)</text>
    </g>


    <!-- ================= EXTRA METAPHORS / DECORATIONS ================= -->
    <!-- Start Label -->
    <text x="140" y="530" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="var(--c-neutral-gray)" font-weight="bold">
      🚀 起点：AI 游客模式
    </text>

    <!-- End Label -->
    <text x="660" y="40" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="var(--c-local-green)" font-weight="bold">
      🏆 终点：系统架构师
    </text>

  </g>

<!--
===========================================================================
     LEGEND BLOCK (Horizontal Layout)
     Center X = 400, strictly at the bottom
===========================================================================
-->
  <g id="legend-block" transform="translate(300, 720)" text-anchor="middle">
    <!-- 图例背景：半透明白色容器，统一圆角边框 -->
    <rect x="-300" y="-20" width="750" height="40" rx="4" fill="rgba(255,255,255,0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <!-- Item 1: 云端/协议 -->
    <g transform="translate(-210, 0)">
      <rect x="-12" y="-6" width="12" height="12" rx="2" fill="var(--c-cloud-blue)" />
      <text x="6" y="4" class="text-legend" text-anchor="start">云端交互 (Prompt as Protocol)</text>
    </g>

    <!-- Item 2: 存储/记忆 -->
    <g transform="translate(-5, 0)">
      <rect x="-12" y="-6" width="12" height="12" rx="2" fill="var(--c-neutral-gray)" />
      <text x="6" y="4" class="text-legend" text-anchor="start">本地记忆 (Note as Database)</text>
    </g>

    <!-- Item 3: 执行/智能 -->
    <g transform="translate(190, 0)">
      <rect x="-12" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
      <text x="6" y="4" class="text-legend" text-anchor="start">自动执行 (System as Intelligence)</text>
    </g>
  </g>

<!--
===========================================================================
     LICENSE FOOTER
===========================================================================
-->
  <text x="400" y="760" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
