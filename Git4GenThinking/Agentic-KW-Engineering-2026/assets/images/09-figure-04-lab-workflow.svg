<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <!--
  ================================================================================
  图表名称：第九天 Inbound 实战演练流程图 (Day 09 Inbound Experiment Flow)
  文件命名：09-figure-04-lab-workflow.svg
  用途：展示第09天课程实验中，从环境准备、配置注入到协议握手验证的完整实战步骤。
  版本：v1.0.0
  作者：Gitconomy Research-Gemini
  SPDX-License-Identifier: MIT & CC-BY-SA-4.0
  创建日期：2026-02-22
  ================================================================================
  -->

  <!-- 背景：纯白背景模式 [3.5.1] -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <style>
    :root {
      --c-cloud-blue: #0099FF;
      --c-local-green: #009900;
      --c-risk-amber: #FF991F;
      --c-neutral-gray: #666666;
      --font-sans: 'Noto Sans SC', 'Noto Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .text-title { font-family: var(--font-sans); font-weight: bold; }
    .text-mono { font-family: var(--font-mono); font-size: 11px; }
    .text-body { font-family: var(--font-sans); font-size: 13px; fill: #333; }
    .text-step { font-family: var(--font-mono); font-size: 12px; font-weight: bold; fill: white; }
    .text-legend { font-family: var(--font-sans); font-size: 11px; fill: var(--c-neutral-gray); }

    .node-prep { stroke: var(--c-neutral-gray); fill: #f8fafc; stroke-width: 2; }
    .node-config { stroke: var(--c-local-green); fill: rgba(0, 153, 0, 0.05); stroke-width: 2; }
    .node-handshake { stroke: var(--c-risk-amber); fill: rgba(255, 153, 31, 0.05); stroke-width: 2; }
    .node-verify { stroke: var(--c-cloud-blue); fill: rgba(0, 153, 255, 0.05); stroke-width: 2; }

    .line-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }
    .line-async { stroke: var(--c-risk-amber); stroke-dasharray: 4 2; stroke-width: 2; fill: none; }
    .marker-arrow { fill: var(--c-neutral-gray); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="marker-arrow" />
    </marker>
  </defs>

  <!-- 3.3 标题块 (Title Block) -->
  <g id="title-block" transform="translate(400, 40)">
    <text y="20" text-anchor="middle" class="text-title" font-size="24">实战演练：Inbound 协议握手实战流程图</text>
    <text y="45" text-anchor="middle" class="text-mono" fill="var(--c-neutral-gray)">第 9 天 > 实战演练</text>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-local-green)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 流程主体内容 -->
  <g id="diagram-content" transform="translate(400, 140)">

    <!-- Step 1: 环境准备 -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="0" width="280" height="70" rx="8" class="node-prep" />
      <circle cx="-140" cy="0" r="14" fill="var(--c-neutral-gray)" />
      <text x="-140" y="5" text-anchor="middle" class="text-step">01</text>
      <text y="25" text-anchor="middle" class="text-title" font-size="16">第一步：基础环境准备</text>
      <text y="48" text-anchor="middle" class="text-body">安装 Node.js &amp; 确认 Obsidian 库路径</text>
    </g>

    <line x1="0" y1="70" x2="0" y2="110" class="line-sync" marker-end="url(#arrow)" />

    <!-- Step 2: 配置注入 -->
    <g transform="translate(0, 110)">
      <rect x="-140" y="0" width="280" height="90" rx="8" class="node-config" />
      <circle cx="-140" cy="0" r="14" fill="var(--c-local-green)" />
      <text x="-140" y="5" text-anchor="middle" class="text-step">02</text>
      <text y="25" text-anchor="middle" class="text-title" font-size="16">第二步：注入 MCP 配置</text>
      <text y="48" text-anchor="middle" class="text-body">修改 claude_desktop_config.json</text>
      <text y="68" text-anchor="middle" class="text-mono" fill="var(--c-local-green)">npx @modelcontextprotocol/server-obsidian</text>
    </g>

    <line x1="0" y1="200" x2="0" y2="240" class="line-sync" marker-end="url(#arrow)" />

    <!-- Step 3: 协议握手 -->
    <g transform="translate(0, 240)">
      <rect x="-140" y="0" width="280" height="80" rx="8" class="node-handshake" />
      <circle cx="-140" cy="0" r="14" fill="var(--c-risk-amber)" />
      <text x="-140" y="5" text-anchor="middle" class="text-step">03</text>
      <text y="30" text-anchor="middle" class="text-title" font-size="16">第三步：重启并建立连接</text>
      <text y="55" text-anchor="middle" class="text-body">重启客户端，确认 🔌 图标变为绿色</text>
    </g>

    <line x1="0" y1="320" x2="0" y2="360" class="line-async" marker-end="url(#arrow)" />
    <text x="10" y="345" text-anchor="start" class="text-mono" fill="var(--c-risk-amber)">异步握手 (JSON-RPC)</text>

    <!-- Step 4: 指令验证 -->
    <g transform="translate(0, 360)">
      <path d="M-100,0 L100,0 L120,40 L100,80 L-100,80 L-120,40 Z" class="node-verify" />
      <circle cx="-120" cy="40" r="14" fill="var(--c-cloud-blue)" />
      <text x="-120" y="45" text-anchor="middle" class="text-step">04</text>
      <text x="0" y="30" text-anchor="middle" class="text-title" font-size="16">第四步：发起 ReAct 指令</text>
      <text x="0" y="55" text-anchor="middle" class="text-body">"请总结我的 Inbox 笔记"</text>
    </g>

    <line x1="0" y1="440" x2="0" y2="480" class="line-sync" marker-end="url(#arrow)" />

    <!-- Step 5: 循环观测 -->
    <g transform="translate(0, 480)">
      <rect x="-140" y="0" width="280" height="70" rx="8" class="node-prep" stroke="var(--c-cloud-blue)" stroke-dasharray="4 2" />
      <circle cx="-140" cy="0" r="14" fill="var(--c-cloud-blue)" />
      <text x="-140" y="5" text-anchor="middle" class="text-step">05</text>
      <text y="25" text-anchor="middle" class="text-title" font-size="16">第五步：观测 PEAR 闭环</text>
      <text y="48" text-anchor="middle" class="text-body">检查 Tool Logs 中的资源读取过程</text>
    </g>

  </g>

  <!-- 图例说明块 [3.4] -->
  <g id="legend" transform="translate(400, 780)">
    <rect x="-360" y="-20" width="720" height="40" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>
    <text x="-345" y="4" class="text-title" font-size="11" fill="var(--c-neutral-gray)">图例说明:</text>

    <!-- Step Node -->
    <g transform="translate(-240, 0)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
      <text x="12" y="4" class="text-legend">本地配置 (Local)</text>
    </g>

    <!-- Brain Node -->
    <g transform="translate(-100, 0)">
      <path d="M-6,-4 L0,-8 L6,-4 L6,4 L0,8 L-6,4 Z" fill="var(--c-cloud-blue)" />
      <text x="12" y="4" class="text-legend">大脑决策 (Cloud)</text>
    </g>

    <!-- Handshake Node -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="0" r="6" fill="var(--c-risk-amber)" />
      <text x="12" y="4" class="text-legend">协议握手 (Handshake)</text>
    </g>

    <!-- Line -->
    <g transform="translate(180, 0)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-local-green)" stroke-width="2" />
      <text x="12" y="4" class="text-legend">同步步骤</text>
    </g>
    <g transform="translate(280, 0)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="3 2" />
      <text x="12" y="4" class="text-legend">异步调用</text>
    </g>
  </g>

  <!-- 底部许可注释 -->
  <text x="400" y="835" text-anchor="middle" class="text-legend">本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research社区</text>

</svg>
