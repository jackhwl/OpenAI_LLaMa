<!--
================================================================================
图表名称：实验流程：自动化知识切片
文件命名：05-figure-02-lab-workflow.svg
用途：展示利用 S.C.O.R.E. 模型将长文本转化为原子笔记的完整实验路径（水平布局版）
版本：v1.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-02-02
================================================================================
-->
<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <style>
      :root {
        /* 语义色系统 */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-bg-code: #F8FAFC;

        /* 字体规范 */
        --font-sans: "Noto Sans SC", "Inter", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", monospace;
      }

      text { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); font-size: 11px; }

      /* 架构组件 */
      .region-container { fill: none; stroke-width: 2; }
      .node-body { fill: #fff; stroke: var(--c-local-green); stroke-width: 2; rx: 6; }
      .node-gray { fill: #fff; stroke: var(--c-neutral-gray); stroke-width: 2; rx: 6; }
      .node-brain { fill: #fff; stroke: var(--c-cloud-blue); stroke-width: 2.5; }
      .node-score { fill: rgba(0, 135, 90, 0.03); stroke: var(--c-local-green); stroke-width: 1.5; stroke-dasharray: 4 4; }

      /* 连接线 */
      .line-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }
      .line-async { stroke: var(--c-risk-amber); stroke-width: 2; stroke-dasharray: 4 2; fill: none; }

      .label-region { font-family: var(--font-mono); font-weight: bold; font-size: 12px; text-transform: uppercase; }
      .label-step { font-weight: bold; font-size: 15px; fill: #1E293B; }
      .label-desc { font-size: 11px; fill: var(--c-neutral-gray); }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
  </defs>

  <!-- 1. 标题块规范 -->
  <g id="title-block" transform="translate(450, 40)">
    <text y="20" text-anchor="middle" font-weight="bold" font-size="24" fill="black">实验流程：自动化知识切片</text>
    <text y="45" text-anchor="middle" font-size="14" fill="var(--c-neutral-gray)">第五天 > 实战演练</text>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. 图形主体 -->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- B. 远程云端区域 -->
    <g id="cloud-region">
      <rect x="300" y="0" width="300" height="220" rx="12" class="region-container" stroke="var(--c-cloud-blue)" stroke-dasharray="8 4" />
      <text x="315" y="25" class="label-region" fill="var(--c-cloud-blue)">Remote Brain (LLM API)</text>

      <!-- Brain Node (Hexagon) -->
      <g transform="translate(450, 110)">
        <polygon points="70,0 35,60.6 -35,60.6 -70,0 -35,-60.6 35,-60.6" class="node-brain" />
        <text y="5" text-anchor="middle" font-weight="bold" font-size="13">DeepSeek-V3</text>
        <text y="22" text-anchor="middle" class="text-mono" font-size="9" fill="var(--c-neutral-gray)">Reasoning Engine</text>
        <text y="40" text-anchor="middle" font-size="10" fill="var(--c-cloud-blue)" font-weight="bold">语义解构进行中</text>
      </g>
    </g>

    <!-- A. 本地实验环境 -->
    <g id="local-region" transform="translate(0, 380)">
      <rect x="40" y="0" width="820" height="320" rx="12" class="region-container" stroke="var(--c-local-green)" />
      <text x="55" y="25" class="label-region" fill="var(--c-local-green)">Localhost (Obsidian)</text>

      <!-- Step 1: 原始素材 (Left) -->
      <g transform="translate(70, 80)">
        <rect width="180" height="160" class="node-gray" fill="var(--c-bg-code)" />
        <text x="90" y="30" text-anchor="middle" class="label-step">1. 准备原始报告</text>
        <text x="90" y="55" text-anchor="middle" class="label-desc">高熵技术报告原文</text>
        <g transform="translate(25, 80)" opacity="0.3">
            <line x1="0" y1="0" x2="130" y2="0" stroke="var(--c-neutral-gray)" stroke-width="2" />
            <line x1="0" y1="15" x2="110" y2="15" stroke="var(--c-neutral-gray)" stroke-width="2" />
            <line x1="0" y1="30" x2="120" y2="30" stroke="var(--c-neutral-gray)" stroke-width="2" />
            <line x1="0" y1="45" x2="90" y2="45" stroke="var(--c-neutral-gray)" stroke-width="2" />
        </g>
        <text x="90" y="145" text-anchor="middle" class="text-mono" font-size="9" fill="var(--c-neutral-gray)">Source-Report.md</text>
      </g>

      <!-- Step 2: SCORE 切片模具 (Middle) -->
      <g transform="translate(340, 80)">
        <rect width="220" height="160" rx="8" class="node-score" />
        <text x="110" y="30" text-anchor="middle" class="label-step" fill="var(--c-local-green)">2. S.C.O.R.E. 模具</text>
        <g transform="translate(20, 60)" class="text-mono" font-size="10">
          <text y="0" fill="#334155">[S] 知识架构师</text>
          <text y="20" fill="#334155">[C] 技术报告原文</text>
          <text y="40" fill="#334155">[O] 识别核心命题</text>
          <text y="60" fill="#334155">[R] 去语境化重写</text>
          <text y="80" fill="#334155">[E] 评估原子性</text>
        </g>
      </g>

      <!-- Step 3: 产出物 (Right) -->
      <g transform="translate(650, 80)">
        <rect width="160" height="160" class="node-body" />
        <text x="80" y="30" text-anchor="middle" class="label-step" fill="var(--c-local-green)">3. 原子化卡片</text>
        <g transform="translate(30, 60)">
            <rect x="10" y="10" width="100" height="70" class="node-body" opacity="0.3" />
            <rect x="5" y="5" width="100" height="70" class="node-body" opacity="0.6" />
            <rect width="100" height="70" class="node-body" />
            <text x="50" y="35" text-anchor="middle" font-size="11" font-weight="bold">Atomic #1</text>
            <text x="50" y="52" text-anchor="middle" class="text-mono" font-size="8">type: chunk</text>
        </g>
        <text x="80" y="148" text-anchor="middle" class="label-desc">低熵、解耦、互联</text>
      </g>

      <!-- 本地内部同步流 -->
      <path d="M 250,160 L 330,160" class="line-sync" marker-end="url(#arrow-green)" />
    </g>

    <!-- C. 异步网络流转描述 -->

    <!-- 请求流 (Upward) -->
    <path d="M 450,450 L 450,230" class="line-async" marker-end="url(#arrow-amber)" />
    <!-- 描述文字置于垂直连线右侧 -->
    <text x="460" y="335" font-size="11" font-weight="bold" fill="#B45309">
       提示词发送 (SCORE封装)
    </text>

    <!-- 响应流 (Downstream Elbow) -->
    <path d="M 520,225 L 520,310 L 730,310 L 730,450" class="line-async" marker-end="url(#arrow-amber)" />
    <text x="625" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#B45309">
       返回结构化片段 (Atomic Chunks)
    </text>

  </g>

  <!-- 3. 图例说明 -->
  <g id="legend-block" transform="translate(450, 800)">
    <rect x="-320" y="0" width="640" height="45" rx="22.5" fill="rgba(255, 255, 255, 0.9)" stroke="#E2E8F0" stroke-width="0.5"/>
    <g transform="translate(-290, 28)">
      <text x="0" y="0" font-weight="bold" font-size="11" fill="#64748B">图例说明</text>

      <g transform="translate(80, -10)">
        <rect width="12" height="12" rx="2" fill="var(--c-local-green)" />
        <text x="18" y="10" class="text-mono" font-size="10" fill="#334155">本地执行 (Obsidian)</text>
      </g>

      <g transform="translate(240, -10)">
        <path d="M6,0 L12,3.5 L12,10.5 L6,14 L0,10.5 L0,3.5 Z" fill="var(--c-cloud-blue)" opacity="0.3" stroke="var(--c-cloud-blue)" stroke-width="1"/>
        <text x="20" y="10" class="text-mono" font-size="10" fill="#334155">云端大脑 (Reasoning)</text>
      </g>

      <g transform="translate(410, -10)">
        <line x1="0" y1="6" x2="15" y2="6" class="line-async" stroke="var(--c-risk-amber)"/>
        <text x="22" y="10" class="text-mono" font-size="10" fill="#334155">异步交互 (Await/Delay)</text>
      </g>
    </g>
  </g>

  <!-- 4. 底部许可注释 -->
  <g id="footer" transform="translate(450, 870)">
    <text text-anchor="middle" font-size="11" fill="var(--c-neutral-gray)">
      本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
    </text>
  </g>
</svg>
