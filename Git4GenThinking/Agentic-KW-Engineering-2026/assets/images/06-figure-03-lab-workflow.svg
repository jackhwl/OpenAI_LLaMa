<svg viewBox="0 0 800 800" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：M06 知识切片实验流程图
文件命名：06-figure-03-lab-workflow.svg
用途：展示使用 S.C.O.R.E. 模型驱动 LLM 进行长文本自动化知识切片与白盒化校验的完整流
版本：v1.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-02-20
================================================================================
-->
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>

      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-family: var(--font-sans); font-weight: 700; font-size: 24px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      .text-region { font-family: var(--font-sans); font-weight: 700; font-size: 12px; letter-spacing: 0.5px; }
      .text-node-title { font-family: var(--font-sans); font-weight: 700; font-size: 14px; fill: #000; }
      .text-node-sub { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }
      .text-node-desc { font-family: var(--font-sans); font-size: 10px; font-weight: 700; }
      .text-link { font-family: var(--font-sans); font-size: 11px; font-weight: 700; }
      .text-legend { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }

      /* Boundary Boxes */
      .boundary-cloud { fill: var(--c-cloud-blue-light); fill-opacity: 0.15; stroke: var(--c-cloud-blue); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .boundary-local { fill: var(--c-local-green-light); fill-opacity: 0.3; stroke: var(--c-local-green); stroke-width: 1.5; }

      /* Node Shapes */
      .node-brain { fill: #FFF; stroke: var(--c-cloud-blue); stroke-width: 2.5; }
      .node-body { fill: #FFF; stroke: var(--c-local-green); stroke-width: 2.5; }
      .node-interface { fill: #FFF; stroke: var(--c-risk-amber); stroke-width: 2.5; }
      .node-file { fill: #FFF; stroke: var(--c-neutral-gray); stroke-width: 2; }

      /* Connectors */
      .connector-async { fill: none; stroke: var(--c-cloud-blue); stroke-width: 2; stroke-dasharray: 4 2; }
      .connector-sync { fill: none; stroke: var(--c-local-green); stroke-width: 2; }
      .connector-neutral { fill: none; stroke: var(--c-neutral-gray); stroke-width: 1.5; stroke-dasharray: 3 3; }
    </style>

    <!-- Node Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 400
===========================================================================
-->
  <g id="title-block" transform="translate(400, 40)">

    <!-- Main Title (Baseline y=20) -->
    <text y="20" text-anchor="middle" class="text-title-main">实战演练：自动化知识切片工作流</text>

    <!-- Breadcrumbs (25px below title baseline) -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">第 6 天 > 实战演练 ></text>

    <!-- Context Indicator (15px below breadcrumbs, y=60) -->
    <!-- Absolute Canvas Y for Indicator = 40 + 60 = 100 -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-local-green)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 150 (Ensures exactly 50px Gap from Title Block Indicator)
     Absolute Y start = 150. Indicator absolute Y = 100. Gap = 50px.
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- ================= 1. CLOUD REGION (Remote Brain) ================= -->
    <g id="cloud-region">
      <rect x="220" y="0" width="360" height="150" rx="12" class="boundary-cloud" />
      <text x="400" y="25" text-anchor="middle" class="text-region" fill="var(--c-cloud-blue)">云端大语言模型 (Remote LLM API)</text>

      <!-- Node: Brain (Chunking Engine) -->
      <g transform="translate(400, 90)" filter="url(#shadow)">
        <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" class="node-brain" />
        <text y="-8" text-anchor="middle" class="text-node-title">3. 代理式切片</text>
        <text y="8" text-anchor="middle" class="text-node-sub">Agentic Chunking</text>
        <text y="24" text-anchor="middle" class="text-node-desc" fill="var(--c-cloud-blue)">语义识别与重构</text>
      </g>
    </g>

    <!-- ================= 2. LOCAL REGION (Obsidian Workspace) ================= -->
    <g id="local-region">
      <rect x="40" y="200" width="720" height="300" rx="12" class="boundary-local" />
      <text x="400" y="480" text-anchor="middle" class="text-region" fill="var(--c-local-green)">本地 Obsidian 私有知识库 (Local Workspace)</text>

      <!-- Node 1: Raw Document -->
      <g transform="translate(110, 310)" filter="url(#shadow)">
        <rect x="-60" y="-45" width="120" height="90" rx="4" class="node-file" />
        <path d="M 40 -45 L 60 -25 L 60 45" fill="none" stroke="var(--c-neutral-gray)" stroke-width="2" />
        <path d="M 40 -45 L 40 -25 L 60 -25" fill="none" stroke="var(--c-neutral-gray)" stroke-width="2" />

        <text y="-10" text-anchor="middle" class="text-node-title">1. 准备“原石”</text>
        <text y="8" text-anchor="middle" class="text-node-sub">Report-2025.md</text>
        <text y="26" text-anchor="middle" class="text-node-desc" fill="var(--c-neutral-gray)">高熵 / 长文本信息</text>
      </g>

      <!-- Node 2: Prompt Designer -->
      <g transform="translate(290, 310)" filter="url(#shadow)">
        <rect x="-65" y="-45" width="130" height="90" rx="8" class="node-body" />
        <text y="-10" text-anchor="middle" class="text-node-title">2. 设计切片刀</text>
        <text y="8" text-anchor="middle" class="text-node-sub">S.C.O.R.E. Prompt</text>
        <text y="26" text-anchor="middle" class="text-node-desc" fill="var(--c-local-green)">设定结构与原子规则</text>
      </g>

      <!-- Node 4: Atomic Notes Chunks -->
      <g transform="translate(510, 310)" filter="url(#shadow)">
        <!-- Stacked files metaphor to show chunking output -->
        <rect x="-50" y="-55" width="120" height="90" rx="4" fill="#E2E8F0" stroke="var(--c-neutral-gray)" stroke-width="1.5" />
        <rect x="-55" y="-50" width="120" height="90" rx="4" fill="#F8FAFC" stroke="var(--c-neutral-gray)" stroke-width="1.5" />
        <rect x="-60" y="-45" width="120" height="90" rx="4" class="node-file" stroke="var(--c-cloud-blue)"/>

        <text y="-10" text-anchor="middle" class="text-node-title">4. 切片输出</text>
        <text y="8" text-anchor="middle" class="text-node-sub">N x Atomic Notes</text>
        <text y="26" text-anchor="middle" class="text-node-desc" fill="var(--c-cloud-blue)">去语境化半结构数据</text>
      </g>

      <!-- Node 5: Fact Checking -->
      <g transform="translate(680, 310)" filter="url(#shadow)">
        <rect x="-60" y="-45" width="120" height="90" rx="8" class="node-interface" />
        <text y="-10" text-anchor="middle" class="text-node-title">5. 白盒化检查</text>
        <text y="8" text-anchor="middle" class="text-node-sub">Fact Checking</text>
        <text y="26" text-anchor="middle" class="text-node-desc" fill="var(--c-risk-amber)">自洽性与幻觉剔除</text>
      </g>
    </g>

    <!-- ================= 3. CONNECTORS & DATA FLOW ================= -->

    <!-- Local Flow: Raw -> Prompt -->
    <path d="M 170,310 L 215,310" class="connector-sync" marker-end="url(#arrow-green)" />
    <text x="195" y="295" text-anchor="middle" class="text-link" fill="var(--c-local-green)">组装</text>

    <!-- Async Flow: Prompt -> LLM -->
    <path d="M 290,265 C 290,170 350,110 370,100" class="connector-async" marker-end="url(#arrow-blue)" />
    <text x="270" y="180" text-anchor="end" class="text-link" fill="var(--c-cloud-blue)">发起 Text Generator 推理 (Async)</text>

    <!-- Async Flow: LLM -> Chunks -->
    <path d="M 430,100 C 450,110 510,170 510,245" class="connector-async" marker-end="url(#arrow-blue)" />
    <text x="525" y="180" text-anchor="start" class="text-link" fill="var(--c-cloud-blue)">返回结构化 JSON/Markdown</text>

    <!-- Local Flow: Chunks -> Check -->
    <path d="M 570,310 L 610,310" class="connector-sync" marker-end="url(#arrow-green)" />
    <text x="590" y="295" text-anchor="middle" class="text-link" fill="var(--c-local-green)">校验</text>

  </g>

<!--
===========================================================================
     LEGEND BLOCK (Horizontal Layout)
     Center X = 400, strictly at the bottom
===========================================================================
-->
  <g id="legend-block" transform="translate(380, 720)" text-anchor="middle">
    <!-- 图例背景：半透明白色容器，统一圆角边框 -->
    <rect x="-350" y="-20" width="730" height="40" rx="4" fill="rgba(255,255,255,0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <text x="-330" y="5" class="text-legend" text-anchor="start">图例：</text>

    <!-- Item 1: 云端大脑 -->
    <g transform="translate(-280, 0)">
      <polygon points="-6,-5 0,-10 6,-5 6,5 0,10 -6,5" fill="var(--c-cloud-blue)" />
      <text x="12" y="4" class="text-legend" text-anchor="start">云端推理 (LLM Logic)</text>
    </g>

    <!-- Item 2: 本地节点 -->
    <g transform="translate(-120, 0)">
      <rect x="-8" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
      <text x="10" y="4" class="text-legend" text-anchor="start">本地执行 (Local Tool)</text>
    </g>

    <!-- Item 3: 人工审核 -->
    <g transform="translate(40, 0)">
      <rect x="-8" y="-6" width="12" height="12" rx="2" fill="var(--c-risk-amber)" />
      <text x="10" y="4" class="text-legend" text-anchor="start">人工校验/高优 (Human-in-loop)</text>
    </g>

    <!-- Item 4: 连接线 -->
    <g transform="translate(250, 0)">
      <line x1="-10" y1="-4" x2="6" y2="-4" class="connector-async" stroke-width="1.5" />
      <line x1="-10" y1="4" x2="6" y2="4" class="connector-sync" stroke-width="1.5" />
      <text x="12" y="4" class="text-legend" text-anchor="start">网络/本地流转 (I/O)</text>
    </g>
  </g>

<!--
===========================================================================
     LICENSE FOOTER
===========================================================================
-->
  <text x="400" y="760" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
