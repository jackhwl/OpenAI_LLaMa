<svg viewBox="0 0 800 800" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：从层级文件夹到网状知识图谱的演进示意图
文件命名：07-figure-01-hierarchical-to-graph.svg
用途：展示传统线性文件系统与基于双向链接的网状知识图谱的结构差异与推理优势
版本：v1.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-02-20
================================================================================
-->
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;
        --c-gray-light: #F8FAFC;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-family: var(--font-sans); font-weight: 700; font-size: 24px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      .text-region-title { font-family: var(--font-sans); font-weight: 700; font-size: 16px; fill: #000; }
      .text-region-sub { font-family: var(--font-mono); font-size: 12px; }

      .text-node-title { font-family: var(--font-sans); font-weight: 700; font-size: 12px; fill: #000; }
      .text-node-sub { font-family: var(--font-mono); font-size: 10px; fill: var(--c-neutral-gray); }
      .text-link { font-family: var(--font-mono); font-size: 10px; font-weight: 700; }
      .text-legend { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }

      /* Boundary Boxes */
      .boundary-before { fill: var(--c-risk-amber-light); fill-opacity: 0.3; stroke: var(--c-risk-amber); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .boundary-after { fill: var(--c-cloud-blue-light); fill-opacity: 0.3; stroke: var(--c-cloud-blue); stroke-width: 2; }

      /* Node Shapes */
      .node-folder { fill: #FFF; stroke: var(--c-neutral-gray); stroke-width: 2; rx: 4; }
      .node-file-isolated { fill: #FFF; stroke: var(--c-risk-amber); stroke-width: 1.5; rx: 2; }
      .node-graph-entity { fill: #FFF; stroke: var(--c-cloud-blue); stroke-width: 2.5; rx: 8; }
      .node-graph-hub { fill: var(--c-cloud-blue); stroke: var(--c-cloud-blue); stroke-width: 2.5; rx: 8; }

      /* Connectors */
      .tree-line { fill: none; stroke: var(--c-neutral-gray); stroke-width: 1.5; }
      .graph-edge { fill: none; stroke: var(--c-cloud-blue); stroke-width: 1.5; opacity: 0.6; }
      .graph-edge-hop { fill: none; stroke: var(--c-local-green); stroke-width: 2.5; }
    </style>

    <!-- Node Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.05"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 400
===========================================================================
-->
  <g id="title-block" transform="translate(400, 40)">

    <!-- Main Title (Baseline y=20) -->
    <text y="20" text-anchor="middle" class="text-title-main">文件的存储结构：从层级文件夹到网状图谱</text>

    <!-- Breadcrumbs (25px below title baseline) -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">第 7 天 > 基础原理</text>

    <!-- Context Indicator (15px below breadcrumbs, y=60) -->
    <!-- Absolute Canvas Y for Indicator = 40 + 60 = 100 -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 150 (Ensures exactly 50px Gap from Title Block Indicator)
     Absolute Y start = 150. Indicator absolute Y = 100. Gap = 50px.
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- ===================================================================
         LEFT REGION: 层级文件系统 (Hierarchical Folders)
         Center X = 190
    ==================================================================== -->
    <g id="region-before">
      <rect x="30" y="0" width="320" height="520" rx="12" class="boundary-before" />
      <text x="190" y="30" text-anchor="middle" class="text-region-title">层级文件系统 (Hierarchical)</text>
      <text x="190" y="50" text-anchor="middle" class="text-region-sub" fill="var(--c-risk-amber)">孤岛式存储 / 线性检索 (Vector RAG 困境)</text>

      <!-- Folder Tree Structure -->
      <g transform="translate(60, 100)">

        <!-- Root Folder -->
        <g transform="translate(0, 0)">
          <path d="M 0 0 L 15 0 L 20 5 L 40 5 L 40 25 L 0 25 Z" fill="var(--c-neutral-gray)"/>
          <text x="50" y="17" class="text-node-title">Obsidian Vault (Root)</text>
        </g>

        <!-- Vertical tree line main -->
        <line x1="10" y1="25" x2="10" y2="350" class="tree-line" />

        <!-- Subfolder 1 -->
        <g transform="translate(0, 50)">
          <line x1="10" y1="15" x2="30" y2="15" class="tree-line" />
          <path d="M 30 5 L 40 5 L 45 10 L 60 10 L 60 25 L 30 25 Z" fill="var(--c-neutral-gray)"/>
          <text x="70" y="20" class="text-node-title">1. Concepts (概念)</text>

          <line x1="40" y1="25" x2="40" y2="120" class="tree-line" stroke-dasharray="2 2"/>

          <!-- File A -->
          <line x1="40" y1="60" x2="60" y2="60" class="tree-line" stroke-dasharray="2 2"/>
          <rect x="60" y="45" width="160" height="30" class="node-file-isolated" />
          <text x="70" y="64" class="text-node-sub">📄 lost-in-the-middle.md</text>

          <!-- File B -->
          <line x1="40" y1="100" x2="60" y2="100" class="tree-line" stroke-dasharray="2 2"/>
          <rect x="60" y="85" width="160" height="30" class="node-file-isolated" />
          <text x="70" y="104" class="text-node-sub">📄 vector-search.md</text>
        </g>

        <!-- Subfolder 2 -->
        <g transform="translate(0, 200)">
          <line x1="10" y1="15" x2="30" y2="15" class="tree-line" />
          <path d="M 30 5 L 40 5 L 45 10 L 60 10 L 60 25 L 30 25 Z" fill="var(--c-neutral-gray)"/>
          <text x="70" y="20" class="text-node-title">2. Solutions (方案)</text>

          <line x1="40" y1="25" x2="40" y2="120" class="tree-line" stroke-dasharray="2 2"/>

          <!-- File C -->
          <line x1="40" y1="60" x2="60" y2="60" class="tree-line" stroke-dasharray="2 2"/>
          <rect x="60" y="45" width="160" height="30" class="node-file-isolated" />
          <text x="70" y="64" class="text-node-sub">📄 graph-rag.md</text>

          <!-- File D -->
          <line x1="40" y1="100" x2="60" y2="100" class="tree-line" stroke-dasharray="2 2"/>
          <rect x="60" y="85" width="160" height="30" class="node-file-isolated" />
          <text x="70" y="104" class="text-node-sub">📄 recursive-chunking.md</text>
        </g>

      </g>

      <!-- Limitation Callout -->
      <g transform="translate(190, 430)">
        <rect x="-130" y="0" width="260" height="60" rx="4" fill="var(--c-risk-amber-light)" stroke="var(--c-risk-amber)" stroke-dasharray="2 2" stroke-width="1"/>
        <text x="0" y="20" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="bold" fill="var(--c-risk-amber)">🚨 信息盲区 (Siloed Data)</text>
        <text x="0" y="40" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">"GraphRAG" 与 "Lost in the Middle"</text>
        <text x="0" y="52" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">物理隔离，AI 无法进行跨文件联想</text>
      </g>
    </g>


    <!-- ===================================================================
         RIGHT REGION: 网状知识图谱 (Knowledge Graph)
         Center X = 610
    ==================================================================== -->
    <g id="region-after">
      <rect x="450" y="0" width="320" height="520" rx="12" class="boundary-after" />
      <text x="610" y="30" text-anchor="middle" class="text-region-title">网状知识图谱 (Knowledge Graph)</text>
      <text x="610" y="50" text-anchor="middle" class="text-region-sub" fill="var(--c-cloud-blue)">互联神经元 / 多跳推理 (Multi-hop Reasoning)</text>

      <!-- Graph Network Structure -->
      <g transform="translate(610, 240)">

        <!-- EDGES (Drawn first so they are under nodes) -->
        <!-- Normal Edges -->
        <path d="M 0,-100 L 90,-20" class="graph-edge" />
        <path d="M 90,-20 L 50,80" class="graph-edge" />
        <path d="M 50,80 L -70,120" class="graph-edge" />
        <path d="M -100,20 L 0,-100" class="graph-edge" />

        <!-- Highlighted Multi-hop Reasoning Edges -->
        <path d="M -100,20 L -30,-40" class="graph-edge-hop" marker-end="url(#arrow-green)" />
        <path d="M -30,-40 L 90,-20" class="graph-edge-hop" marker-end="url(#arrow-green)" />

        <!-- Labels for Hop Edges -->
        <text x="-55" y="-10" text-anchor="end" class="text-link" fill="var(--c-local-green)">1. Hop (发现问题)</text>
        <text x="70" y="-45" text-anchor="middle" class="text-link" fill="var(--c-local-green)">2. Hop (推导方案)</text>

        <!-- NODES -->
        <!-- Hub Node (MOC) -->
        <g transform="translate(-30, -40)" filter="url(#shadow)">
          <rect x="-45" y="-15" width="90" height="30" class="node-graph-hub" />
          <text x="0" y="4" text-anchor="middle" class="text-node-title" fill="#FFF">长文本瓶颈</text>
        </g>

        <!-- Concept A -->
        <g transform="translate(-100, 20)" filter="url(#shadow)">
          <rect x="-55" y="-20" width="110" height="40" class="node-graph-entity" />
          <text x="0" y="-3" text-anchor="middle" class="text-node-title">中间迷失</text>
          <text x="0" y="12" text-anchor="middle" class="text-node-sub">(Lost in Middle)</text>
        </g>

        <!-- Concept B -->
        <g transform="translate(90, -20)" filter="url(#shadow)">
          <rect x="-45" y="-20" width="90" height="40" class="node-graph-entity" />
          <text x="0" y="-3" text-anchor="middle" class="text-node-title">GraphRAG</text>
          <text x="0" y="12" text-anchor="middle" class="text-node-sub">(图谱检索)</text>
        </g>

        <!-- Concept C -->
        <g transform="translate(0, -100)" filter="url(#shadow)">
          <rect x="-45" y="-15" width="90" height="30" class="node-graph-entity" />
          <text x="0" y="4" text-anchor="middle" class="text-node-title">上下文窗口</text>
        </g>

        <!-- Concept D -->
        <g transform="translate(50, 80)" filter="url(#shadow)">
          <rect x="-45" y="-15" width="90" height="30" class="node-graph-entity" />
          <text x="0" y="4" text-anchor="middle" class="text-node-title">多跳推理</text>
        </g>

        <!-- Concept E -->
        <g transform="translate(-70, 120)" filter="url(#shadow)">
          <rect x="-45" y="-15" width="90" height="30" class="node-graph-entity" />
          <text x="0" y="4" text-anchor="middle" class="text-node-title">向量检索</text>
        </g>
      </g>

      <!-- Advantage Callout -->
      <g transform="translate(610, 430)">
        <rect x="-130" y="0" width="260" height="60" rx="4" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-dasharray="2 2" stroke-width="1"/>
        <text x="0" y="20" text-anchor="middle" font-family="var(--font-sans)" font-size="11" font-weight="bold" fill="var(--c-local-green)">✨ 逻辑穿透 (Relational Search)</text>
        <text x="0" y="40" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">通过 "双向链接" 编织突触关系网络</text>
        <text x="0" y="52" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">Agent 沿边遍历，解决跨文档推理难题</text>
      </g>
    </g>

    <!-- ===================================================================
         CENTER: 转化桥梁 (Evolution Arrow)
         Center X = 385
    ==================================================================== -->
    <g transform="translate(355, 250)">
      <!-- Large Evolution Arrow -->
      <path d="M 0 -20 L 60 -20 L 60 -40 L 90 0 L 60 40 L 60 20 L 0 20 Z" fill="var(--c-cloud-blue-light)" stroke="var(--c-cloud-blue)" stroke-width="2" opacity="0.9" />
      <text x="45" y="-5" text-anchor="middle" font-family="var(--font-sans)" font-size="12" font-weight="bold" fill="var(--c-cloud-blue)">构建神经突触</text>
      <text x="45" y="12" text-anchor="middle" font-family="var(--font-mono)" font-size="11" font-weight="bold" fill="var(--c-cloud-blue)">[[双向链接]]</text>
    </g>

  </g>

<!--
===========================================================================
     LEGEND BLOCK (Horizontal Structured Layout)
     Center X = 400, strictly at the bottom
===========================================================================
-->
  <g id="legend-block" transform="translate(400, 720)">
    <!-- 图例背景：半透明白色容器，统一圆角边框 -->
    <rect x="-380" y="-20" width="760" height="40" rx="4" fill="rgba(255,255,255,0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-360, 0)">
      <!-- 图例标题 -->
      <text x="0" y="4" font-family="var(--font-sans)" font-weight="700" font-size="12" fill="#64748B">图例说明:</text>

      <!-- Item 1: 孤岛笔记 -->
      <g transform="translate(110, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-risk-amber)" />
        <text x="12" y="4" class="text-legend">孤立的文件节点 (Isolated/Siloed)</text>
      </g>

      <!-- Item 2: 原子节点 -->
      <g transform="translate(340, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="6" fill="var(--c-cloud-blue)" />
        <text x="12" y="4" class="text-legend">知识原子节点 (Graph Node/MOC)</text>
      </g>

      <!-- Item 3: 多跳推理 -->
      <g transform="translate(560, 0)">
        <line x1="-10" y1="0" x2="6" y2="0" stroke="var(--c-local-green)" stroke-width="2.5" />
        <path d="M 6 0 L 2 -3 L 2 3 Z" fill="var(--c-local-green)" />
        <text x="12" y="4" class="text-legend">多跳推理连线 (Multi-hop Edge)</text>
      </g>
    </g>
  </g>

<!--
===========================================================================
     LICENSE FOOTER
===========================================================================
-->
  <text x="400" y="760" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
