<svg viewBox="0 0 800 650" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：课程价值定位：从 AI 游客到系统架构师
文件命名：00-figure-01-course-value-proposition.svg
用途：展示课程核心理念，对比“高熵聊天模式”与“低熵智能体架构模式”
版本：v1.1.0
作者：Gitconomy Research
SPDX-License-Identifier: CC-BY-SA-4.0
创建日期：2026-02-19
================================================================================
-->
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-family: var(--font-sans); font-weight: 700; font-size: 24px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      .text-card-title { font-family: var(--font-sans); font-weight: 700; font-size: 16px; fill: #000; }
      .text-card-sub { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); }
      .text-feature { font-family: var(--font-sans); font-size: 12px; fill: #334155; }
      .text-pillar { font-family: var(--font-sans); font-weight: 700; font-size: 14px; fill: #000; }
      .text-pillar-sub { font-family: var(--font-mono); font-size: 11px; fill: var(--c-cloud-blue); }

      .text-legend { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }

      /* Visual Elements */
      .card-before { fill: var(--c-risk-amber-light); stroke: var(--c-risk-amber); stroke-dasharray: 6 4; stroke-width: 2; }
      .card-after { fill: var(--c-local-green-light); stroke: var(--c-local-green); stroke-width: 2; }
      .pillar-box { fill: #FFF; stroke: var(--c-cloud-blue); stroke-width: 1.5; rx: 4; }

      /* Abstract Icons */
      .icon-brain { fill: #fff; stroke: var(--c-cloud-blue); stroke-width: 2; }
      .icon-tool { fill: #fff; stroke: var(--c-local-green); stroke-width: 2; }
      .icon-chat { fill: none; stroke: var(--c-risk-amber); stroke-width: 2; }
    </style>

    <!-- Marker Definitions -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 400
===========================================================================
-->
  <g id="title-block" transform="translate(400, 40)">
    <!-- Main Title (Baseline y=20) -->
    <text y="20" text-anchor="middle" class="text-title-main">课程价值定位：零代码构建个人知识助手智能体系统</text>

    <!-- Breadcrumbs (25px below title baseline) -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">课前导论 > 核心理念</text>

    <!-- Context Indicator (15px below breadcrumbs) -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 140 (Ensures >60px Safe Zone from Title Block)
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 140)">

    <!-- ================= LEFT: 现状 (Before) ================= -->
    <g id="state-before" transform="translate(40, 40)">
      <rect x="0" y="0" width="230" height="260" rx="12" class="card-before" />

      <!-- Header -->
      <text x="115" y="30" text-anchor="middle" class="text-card-title">AI 游客 (User)</text>
      <text x="115" y="50" text-anchor="middle" class="text-card-sub" fill="var(--c-risk-amber)">高熵交互 / 无记忆 (High Entropy)</text>

      <!-- Graphic Metaphor: Chat Bubbles & Messy Data -->
      <g transform="translate(65, 80)">
        <path d="M 10 10 Q 50 10 50 40 Q 50 70 10 70 Q -10 70 -20 80 Q -10 60 -10 40 Q -10 10 10 10 Z" class="icon-chat" />
        <path d="M 90 20 Q 50 20 50 50 Q 50 80 90 80 Q 110 80 120 90 Q 110 70 110 50 Q 110 20 90 20 Z" class="icon-chat" stroke-dasharray="2 2" />
        <!-- Chaos dots -->
        <circle cx="15" cy="40" r="3" fill="var(--c-risk-amber)" />
        <circle cx="35" cy="30" r="2" fill="var(--c-risk-amber)" />
        <circle cx="25" cy="55" r="4" fill="var(--c-risk-amber)" />
        <circle cx="75" cy="45" r="3" fill="var(--c-neutral-gray)" />
        <circle cx="85" cy="60" r="2" fill="var(--c-neutral-gray)" />
      </g>

      <!-- Features List -->
      <g transform="translate(25, 180)">
        <text x="0" y="0" class="text-feature">❌ 纯文本聊天问答 (One-off Chat)</text>
        <text x="0" y="25" class="text-feature">❌ 数据无沉淀 (No Memory)</text>
        <text x="0" y="50" class="text-feature">❌ 依赖人工重复复制粘贴</text>
      </g>
    </g>

    <!-- ================= CENTER: 演进桥梁 (The Bridge) ================= -->
    <g id="evolution-bridge" transform="translate(290, 50)">

      <!-- Big Directional Background Arrow -->
      <path d="M 0 30 L 220 30 L 220 0 L 260 120 L 220 240 L 220 210 L 0 210 Z" fill="var(--c-cloud-blue-light)" opacity="0.4" />

      <text x="130" y="-10" text-anchor="middle" class="text-title-main" font-size="14" fill="var(--c-cloud-blue)">认知重构 (三大工程基石)</text>

      <!-- Pillar 1: Protocol -->
      <g transform="translate(20, 40)">
        <rect x="0" y="0" width="200" height="42" class="pillar-box" />
        <text x="100" y="18" text-anchor="middle" class="text-pillar">重构交互协议</text>
        <text x="100" y="34" text-anchor="middle" class="text-pillar-sub">Prompt as Protocol</text>
      </g>

      <!-- Pillar 2: Database -->
      <g transform="translate(30, 100)">
        <rect x="0" y="0" width="200" height="42" class="pillar-box" />
        <text x="100" y="18" text-anchor="middle" class="text-pillar">沉淀持久数据</text>
        <text x="100" y="34" text-anchor="middle" class="text-pillar-sub">Note as Database</text>
      </g>

      <!-- Pillar 3: Intelligence -->
      <g transform="translate(40, 160)">
        <rect x="0" y="0" width="200" height="42" class="pillar-box" />
        <text x="100" y="18" text-anchor="middle" class="text-pillar">闭环系统智能</text>
        <text x="100" y="34" text-anchor="middle" class="text-pillar-sub">System as Intelligence</text>
      </g>

    </g>

    <!-- ================= RIGHT: 目标 (After) ================= -->
    <g id="state-after" transform="translate(570, 40)">
      <rect x="0" y="0" width="210" height="260" rx="12" class="card-after" />

      <!-- Header -->
      <text x="105" y="30" text-anchor="middle" class="text-card-title">系统架构师 (Architect)</text>
      <text x="105" y="50" text-anchor="middle" class="text-card-sub" fill="var(--c-local-green)">低熵系统 / 自动化 (Agentic)</text>

      <!-- Graphic Metaphor: ReAct Loop & Structured Nodes -->
      <g transform="translate(55, 60)">
        <!-- Cloud LLM Node (Brain) -->
        <polygon points="50,10 65,20 65,40 50,50 35,40 35,20" class="icon-brain" />
        <!-- Local Tool Node (MCP Tool) -->
        <rect x="35" y="80" width="30" height="20" rx="4" class="icon-tool" />
        <!-- Vector Database (Obsidian Memory) Node -->
        <path d="M 85 80 C 85 75 115 75 115 80 L 115 100 C 115 105 85 105 85 100 Z" class="icon-tool" fill="var(--c-local-green-light)"/>
        <path d="M 85 80 C 85 85 115 85 115 80" class="icon-tool" fill="none" />

        <!-- Loop Arrows (Perceive -> Think -> Act) -->
        <!-- Brain to Tool -->
        <path d="M 40 55 L 40 70" fill="none" stroke="var(--c-cloud-blue)" stroke-width="2" marker-end="url(#arrow-blue)" />
        <!-- Tool to Brain -->
        <path d="M 60 70 L 60 55" fill="none" stroke="var(--c-local-green)" stroke-width="2" marker-end="url(#arrow-green)" />
        <!-- Brain to Memory -->
        <path d="M 70 45 L 90 70" fill="none" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="2 2" marker-end="url(#arrow-blue)"/>
      </g>

      <!-- Features List -->
      <g transform="translate(20, 180)">
        <text x="0" y="0" class="text-feature">✅ S.C.O.R.E 确定性交互</text>
        <text x="0" y="25" class="text-feature">✅ Obsidian 沉淀私有记忆</text>
        <text x="0" y="50" class="text-feature">✅ MCP 驱动感知与行动闭环</text>
      </g>
    </g>

  </g>

<!--
===========================================================================
     LEGEND BLOCK (Horizontal Layout)
     Center X = 400
===========================================================================
-->
  <g id="legend-block" transform="translate(400, 560)" text-anchor="middle">
    <!-- 图例背景：半透明白色容器，统一圆角边框 -->
    <rect x="-320" y="-20" width="640" height="40" rx="4" fill="rgba(255,255,255,0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <!-- Item 1: 高熵/无状态 -->
    <g transform="translate(-230, 0)">
      <circle cx="-10" cy="0" r="5" fill="var(--c-risk-amber)" />
      <text x="0" y="4" class="text-legend" text-anchor="start">高熵无状态 (Chat)</text>
    </g>

    <!-- Item 2: 云端推理 -->
    <g transform="translate(-60, 0)">
      <polygon points="-12,-5 -6,-10 0,-5 0,5 -6,10 -12,5" fill="var(--c-cloud-blue)" />
      <text x="6" y="4" class="text-legend" text-anchor="start">云端大脑 (LLM Core)</text>
    </g>

    <!-- Item 3: 本地/记忆 -->
    <g transform="translate(130, 0)">
      <rect x="-12" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
      <text x="6" y="4" class="text-legend" text-anchor="start">本地身体/记忆 (Obsidian/Tool)</text>
    </g>
  </g>

<!--
===========================================================================
     LICENSE FOOTER
===========================================================================
-->
  <text x="400" y="620" text-anchor="middle" font-family="var(--font-sans)" font-size="10" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
