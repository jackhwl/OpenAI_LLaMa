<svg viewBox="0 0 1200 900" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：自动化工作流的操作流程示意图 (PEAR & ReAct Loop)
文件命名：08-figure-01-pear-loop-framework.svg
用途：展示智能体如何通过 PEAR 架构与 ReAct 范式实现感知、决策、行动与反思的自动化闭环。
版本：v1.1.0
作者：Gitconomy Research
SPDX-License-Identifier: CC-BY-SA-4.0
创建日期：2026-02-20
================================================================================
-->
  <!-- Background: Solid White (强兼容模式) -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;
        --c-gray-light: #F8FAFC;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-weight: 700; font-size: 26px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      .text-region { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
      .text-node-title { font-weight: 700; font-size: 15px; fill: #000; }
      .text-node-sub { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); }
      .text-node-desc { font-size: 12px; font-weight: bold; }
      .text-link { font-size: 13px; font-weight: 700; }
      .text-legend { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); }

      /* Additional Helpers */
      .font-mono { font-family: var(--font-mono); }
      .font-sans { font-family: var(--font-sans); }
      .text-xs { font-size: 11px; }
      .text-sm { font-size: 13px; }

      /* Connectors */
      .connector-async { fill: none; stroke: var(--c-cloud-blue); stroke-width: 2.5; stroke-dasharray: 6 4; }
      .connector-sync { fill: none; stroke: var(--c-local-green); stroke-width: 2.5; }
      .connector-feedback { fill: none; stroke: var(--c-risk-amber); stroke-width: 2.5; stroke-dasharray: 6 4; }
    </style>

    <!-- Node Drop Shadow -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 600
===========================================================================
-->
  <g id="title-block" transform="translate(600, 40)">
    <!-- Main Title -->
    <text y="20" text-anchor="middle" class="text-title-main">智能体 PEAR 架构与 ReAct 执行闭环 </text>

    <!-- Breadcrumbs -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">第 8 天 > 基础原理</text>

    <!-- Context Indicator (Absolute Y = 100) -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 150 (Ensures exactly 50px Gap from Title Block Indicator)
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- ===================================================================
         架构边界隔离带 (Cloud vs Local Boundary)
    ==================================================================== -->

    <!-- Local Environment Boundary (Center X = 320) -->
    <rect x="50" y="10" width="540" height="600" fill="none" stroke="var(--c-local-green)" stroke-width="2" stroke-dasharray="8 4" rx="16"/>
    <rect x="200" y="-5" width="240" height="30" fill="#FFFFFF"/>
    <text x="320" y="15" text-anchor="middle" class="font-mono text-node-title" fill="var(--c-local-green)">Localhost (Agent Runtime)</text>

    <!-- Cloud LLM Boundary (Center X = 880) -->
    <rect x="610" y="10" width="540" height="600" fill="none" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="8 4" rx="16"/>
    <rect x="760" y="-5" width="240" height="30" fill="#FFFFFF"/>
    <text x="880" y="15" text-anchor="middle" class="font-mono text-node-title" fill="var(--c-cloud-blue)">Remote Cloud (LLM Engine)</text>


    <!-- ===================================================================
         阶段 1: 感知模块 (Perception) [👁] - Local
    ==================================================================== -->
    <g id="stage-perception" transform="translate(320, 70)">
      <rect x="-120" y="0" width="240" height="140" rx="8" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="2" filter="url(#drop-shadow)"/>
      <rect x="-120" y="0" width="240" height="35" rx="8" fill="var(--c-local-green)"/>
      <!-- 遮盖下圆角 -->
      <rect x="-120" y="20" width="240" height="15" fill="var(--c-local-green)"/>
      <text x="0" y="22" text-anchor="middle" class="text-node-title" fill="#FFFFFF">[👁] 1. 感知 (Perception)</text>

      <text x="-100" y="60" class="font-mono text-xs text-bold" fill="var(--c-neutral-gray)">触发器 (Triggers):</text>

      <rect x="-100" y="70" width="200" height="22" rx="4" fill="var(--c-local-green-light)"/>
      <text x="-90" y="85" class="font-mono text-xs" fill="var(--c-local-green)">🕒 Cron: 每天 09:00 扫描</text>

      <rect x="-100" y="100" width="200" height="22" rx="4" fill="var(--c-local-green-light)"/>
      <text x="-90" y="115" class="font-mono text-xs" fill="var(--c-local-green)">📄 FS Event: 文件新增/修改</text>
    </g>


    <!-- ===================================================================
         阶段 2: 编码与 ReAct 推理 (Encoding & Reasoning) [🧠] - Cloud
    ==================================================================== -->
    <g id="stage-encoding" transform="translate(880, 70)">
      <!-- LLM Brain Node -->
      <g transform="translate(0, 10)">
        <path d="M 0 -35 L 30 -17 L 30 17 L 0 35 L -30 17 L -30 -17 Z" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2.5" filter="url(#drop-shadow)"/>
        <text x="0" y="4" text-anchor="middle" class="font-mono text-sm text-bold" fill="var(--c-cloud-blue)">LLM</text>
      </g>

      <!-- Encoding Module Box -->
      <rect x="-200" y="40" width="400" height="260" rx="8" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2" filter="url(#drop-shadow)"/>
      <rect x="-200" y="40" width="400" height="35" rx="8" fill="var(--c-cloud-blue)"/>
      <rect x="-200" y="60" width="400" height="15" fill="var(--c-cloud-blue)"/>
      <text x="0" y="62" text-anchor="middle" class="text-node-title" fill="#FFFFFF">[🧠] 2. 编码与决策 (Encoding &amp; ReAct)</text>

      <!-- ReAct 循环分解 -->
      <g transform="translate(-180, 95)">
        <text x="0" y="0" class="font-mono text-xs text-bold" fill="var(--c-neutral-gray)">Prompt Protocol:</text>

        <!-- Thought -->
        <g transform="translate(0, 15)">
          <rect x="0" y="0" width="360" height="40" rx="4" fill="var(--c-cloud-blue-light)" stroke="var(--c-cloud-blue)" stroke-dasharray="2 2" stroke-width="1"/>
          <text x="10" y="15" class="font-sans text-sm text-bold" fill="var(--c-cloud-blue)">思考 (Thought):</text>
          <text x="10" y="32" class="font-sans text-xs" fill="var(--c-neutral-gray)">"分析文件内容，发现缺失 status 字段，需更新 YAML..."</text>
        </g>

        <path d="M 20 60 L 20 68" fill="none" stroke="var(--c-cloud-blue)" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

        <!-- Action -->
        <g transform="translate(0, 75)">
          <rect x="0" y="0" width="360" height="40" rx="4" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-dasharray="2 2" stroke-width="1"/>
          <text x="10" y="15" class="font-sans text-sm text-bold" fill="var(--c-local-green)">行动 (Action):</text>
          <text x="10" y="32" class="font-mono text-xs" fill="var(--c-neutral-gray)">{ "action": "update_yaml", "file": "note.md", ... }</text>
        </g>

        <path d="M 20 120 L 20 128" fill="none" stroke="var(--c-cloud-blue)" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

        <!-- Observation -->
        <g transform="translate(0, 135)">
          <rect x="0" y="0" width="360" height="40" rx="4" fill="var(--c-risk-amber-light)" stroke="var(--c-risk-amber)" stroke-dasharray="2 2" stroke-width="1"/>
          <text x="10" y="15" class="font-sans text-sm text-bold" fill="var(--c-risk-amber)">观察 (Observation):</text>
          <text x="10" y="32" class="font-mono text-xs" fill="var(--c-neutral-gray)">[Wait for tool execution feedback from Local Environment]</text>
        </g>
      </g>
    </g>


    <!-- ===================================================================
         阶段 3: 行动模块 (Action) [🦾] - Local Tools
    ==================================================================== -->
    <g id="stage-action" transform="translate(880, 430)">
      <rect x="-180" y="0" width="360" height="150" rx="8" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="2" filter="url(#drop-shadow)"/>
      <rect x="-180" y="0" width="360" height="35" rx="8" fill="var(--c-local-green)"/>
      <rect x="-180" y="20" width="360" height="15" fill="var(--c-local-green)"/>
      <text x="0" y="22" text-anchor="middle" class="text-node-title" fill="#FFFFFF">[🦾] 3. 行动 (Action / MCP Tools)</text>

      <text x="-160" y="60" class="font-mono text-xs text-bold" fill="var(--c-neutral-gray)">工具集执行 (Tool Execution):</text>

      <!-- Tool 1 -->
      <rect x="-160" y="70" width="150" height="60" rx="6" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-width="1.5"/>
      <text x="-85" y="90" text-anchor="middle" class="font-mono text-xs text-bold" fill="var(--c-local-green)">update_yaml()</text>
      <text x="-85" y="110" text-anchor="middle" class="font-sans text-xs" fill="var(--c-neutral-gray)">更新元数据属性</text>

      <!-- Tool 2 -->
      <rect x="10" y="70" width="150" height="60" rx="6" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-width="1.5"/>
      <text x="85" y="90" text-anchor="middle" class="font-mono text-xs text-bold" fill="var(--c-local-green)">search_kb()</text>
      <text x="85" y="110" text-anchor="middle" class="font-sans text-xs" fill="var(--c-neutral-gray)">检索双向链接关联</text>
    </g>


    <!-- ===================================================================
         阶段 4: 反思模块 (Reflection) [🪞] - Local Monitor
    ==================================================================== -->
    <g id="stage-reflection" transform="translate(320, 430)">
      <rect x="-120" y="0" width="240" height="150" rx="8" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="2" filter="url(#drop-shadow)"/>
      <rect x="-120" y="0" width="240" height="35" rx="8" fill="var(--c-risk-amber)"/>
      <rect x="-120" y="20" width="240" height="15" fill="var(--c-risk-amber)"/>
      <text x="0" y="22" text-anchor="middle" class="text-node-title" fill="#FFFFFF">[🪞] 4. 反思与纠错 (Reflection)</text>

      <!-- Logic Path -->
      <text x="-100" y="60" class="font-mono text-xs text-bold" fill="var(--c-neutral-gray)">执行结果校验:</text>

      <g transform="translate(-100, 75)">
        <circle cx="5" cy="-3" r="4" fill="var(--c-local-green)"/>
        <text x="15" y="0" class="font-sans text-xs" fill="var(--c-neutral-gray)">成功: 闭环完成，存入环境</text>
      </g>

      <g transform="translate(-100, 105)">
        <circle cx="5" cy="-3" r="4" fill="var(--c-risk-amber)"/>
        <text x="15" y="0" class="font-sans text-xs" fill="var(--c-neutral-gray)">失败: 格式错误或文件锁定</text>
        <text x="15" y="16" class="font-mono text-xs text-bold" fill="var(--c-risk-amber)">-> 触发重试 (Retry)</text>
      </g>
    </g>


    <!-- ===================================================================
         核心环境库 (Environment Node)
    ==================================================================== -->
    <g id="environment" transform="translate(320, 280)">
      <!-- 存储桶圆柱体表示数据库/文件夹 -->
      <path d="M -60 -15 A 60 15 0 0 1 60 -15 L 60 30 A 60 15 0 0 1 -60 30 Z" fill="var(--c-gray-light)" stroke="var(--c-neutral-gray)" stroke-width="1.5"/>
      <ellipse cx="0" cy="-15" rx="60" ry="15" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1.5"/>

      <text x="0" y="5" text-anchor="middle" class="font-sans text-sm text-bold" fill="#333">Obsidian 知识库</text>
      <text x="0" y="20" text-anchor="middle" class="font-mono text-xs" fill="var(--c-neutral-gray)">/Books/ Vault</text>
    </g>


    <!-- ===================================================================
         网络与连接线 (Network & Flow Edges)
    ==================================================================== -->

    <!-- 1. Environment -> Perception (Local Sync) -->
    <path d="M 320 250 L 320 215" class="connector-sync" marker-end="url(#arrow-green)"/>
    <text x="330" y="235" text-anchor="start" class="text-link" fill="var(--c-local-green)">1. 状态变更感知</text>

    <!-- 2. Perception -> Encoding (Async Network Request to LLM) -->
    <path d="M 440 140 L 675 140" class="connector-async" marker-end="url(#arrow-blue)"/>
    <text x="560" y="130" text-anchor="middle" class="text-link" fill="var(--c-cloud-blue)">2. 原始数据 -> Prompt (请求)</text>
    <rect x="520" y="145" width="80" height="18" rx="9" fill="var(--c-cloud-blue-light)"/>
    <text x="560" y="158" text-anchor="middle" class="font-mono text-xs text-bold" fill="var(--c-cloud-blue)">Async I/O</text>

    <!-- 3. Encoding -> Action (Async Network Response with Actions) -->
    <path d="M 880 330 L 880 425" class="connector-async" marker-end="url(#arrow-blue)"/>
    <text x="890" y="390" text-anchor="start" class="text-link" fill="var(--c-cloud-blue)">3. JSON 行动载荷</text>
    <text x="890" y="405" text-anchor="start" class="font-mono text-xs" fill="var(--c-neutral-gray)">(Action payload)</text>

    <!-- 4. Action -> Reflection (Local Sync Tool Result) -->
    <path d="M 700 505 L 445 505" class="connector-sync" marker-end="url(#arrow-green)"/>
    <text x="572" y="495" text-anchor="middle" class="text-link" fill="var(--c-local-green)">4. 工具执行结果 (Observation)</text>

    <!-- 5. Reflection -> Environment (State Mutation) -->
    <path d="M 320 430 L 320 315" class="connector-sync" marker-end="url(#arrow-green)"/>
    <text x="330" y="375" text-anchor="start" class="text-link" fill="var(--c-local-green)">5. 持久化变更</text>

    <!-- 6. Reflection -> Encoding (Feedback Loop / Retry via Async) -->
    <!-- Curved path for retry feedback loop -->
    <path d="M 440 450 C 560 450, 560 250, 675 250" class="connector-feedback" marker-end="url(#arrow-amber)"/>
    <text x="570" y="355" text-anchor="middle" class="text-link" fill="var(--c-risk-amber)">6. 纠错重试 (Feedback Retry)</text>

    <!-- 中心循环装饰符 (The Goal-Driven Loop) -->
    <g transform="translate(560, 310)">
      <path d="M -30 -20 A 40 40 0 1 1 -30 20" fill="none" stroke="rgba(0, 0, 0, 0.05)" stroke-width="12" stroke-linecap="round"/>
      <polygon points="-25,25 -40,15 -20,10" fill="rgba(0, 0, 0, 0.05)"/>
      <text x="0" y="0" text-anchor="middle" class="text-node-desc" fill="var(--c-neutral-gray)" opacity="0.4">持续自动化闭环</text>
    </g>

  </g>

<!--
===========================================================================
     底部图例与注释块 (Legend & Key Block) - 遵循规范
===========================================================================
-->
  <g id="legend" transform="translate(600, 800)">
    <!-- 图例容器背景 -->
    <rect x="-420" y="-16" width="860" height="32" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-400, 0)">
      <text x="0" y="4" class="text-node-desc" fill="var(--c-neutral-gray)">图例说明:</text>

      <!-- Item 1: Local Exec -->
      <g transform="translate(120, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
        <text x="12" y="4" class="text-legend">Local Service (本地模块)</text>
      </g>

      <!-- Item 2: Cloud Brain -->
      <g transform="translate(320, 0)">
        <path d="M-6,-4 L0,-8 L6,-4 L6,4 L0,8 L-6,4 Z" fill="var(--c-cloud-blue)" />
        <text x="12" y="4" class="text-legend">Remote LLM (云端推理)</text>
      </g>

      <!-- Item 3: Sync I/O -->
      <g transform="translate(510, 0)">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-local-green)" stroke-width="2.5" />
        <text x="12" y="4" class="text-legend">Sync I/O (本地调用)</text>
      </g>

      <!-- Item 4: Async I/O / Network -->
      <g transform="translate(680, 0)">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-cloud-blue)" stroke-width="2.5" stroke-dasharray="4 2" />
        <text x="12" y="4" class="text-legend">Async I/O (网络请求)</text>
      </g>
    </g>
  </g>

<!--
===========================================================================
     底部许可注释 (License)
===========================================================================
-->
  <text x="600" y="860" text-anchor="middle" class="font-sans text-xs" fill="#94A3B8">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
