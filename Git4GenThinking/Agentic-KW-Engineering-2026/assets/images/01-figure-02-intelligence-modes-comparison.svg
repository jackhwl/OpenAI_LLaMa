<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：智力模式对比示意图
文件命名：01-figure-02-intelligence-modes-comparison.svg
用途：展示“智力租赁”（网页端 AI）与“智力拥有”（本地智能体架构）的对比
版本：v1.1.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-01-31
修改日期：2026-02-20（版本1.1.0，添加示意图背景为白色的语义）
================================================================================
  -->
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <style>
      :root {
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      text { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); font-size: 11px; }
      .text-title { font-family: var(--font-sans); font-weight: bold; }

      .box-leasing { stroke: var(--c-cloud-blue); fill: var(--c-cloud-blue-light); fill-opacity: 0.1; stroke-dasharray: 4 4; }
      .box-ownership { stroke: var(--c-local-green); fill: var(--c-local-green-light); fill-opacity: 0.1; }

      .node-brain { fill: #fff; stroke: var(--c-cloud-blue); stroke-width: 2; }
      .node-body { fill: #fff; stroke: var(--c-local-green); stroke-width: 2; }
      .node-store { fill: #f8fafc; stroke: var(--c-neutral-gray); stroke-width: 1.5; }

      .line-async { stroke: var(--c-cloud-blue); stroke-dasharray: 3 3; fill: none; }
      .line-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }

      .diff-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 0.5; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
  </defs>

  <!-- 1. 标题块 -->
  <g id="title-block" transform="translate(400, 40)">
    <text y="20" text-anchor="middle" class="text-title" font-size="24" fill="black">智力租赁 vs. 智力拥有</text>
    <text y="45" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">第一天 > 基础理论</text>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. 图形主体 -->
  <g id="diagram-content" transform="translate(0, 140)">

    <!-- 左侧：智力租赁 (模式 A) -->
    <g transform="translate(0, 20)">
      <rect width="320" height="480" rx="12" class="box-leasing" />
      <text x="160" y="30" text-anchor="middle" class="text-title" fill="var(--c-cloud-blue)" font-size="16">模式 A：智力租赁 (Leasing)</text>

      <!-- 用户侧 -->
      <g transform="translate(160, 100)">
        <circle cx="0" cy="0" r="25" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
        <text y="40" text-anchor="middle" font-size="12">AI 游客 (游客模式)</text>
      </g>

      <!-- 网页 UI -->
      <rect x="80" y="160" width="160" height="40" rx="4" fill="white" stroke="#cbd5e1" />
      <text x="160" y="185" text-anchor="middle" font-size="11">网页聊天框 (Chat UI)</text>

      <!-- 远程大脑 -->
      <g transform="translate(160, 280)">
        <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" class="node-brain" />
        <text y="5" text-anchor="middle" font-weight="bold" font-size="12">云端大脑</text>
      </g>

      <!-- 结果表现 -->
      <path d="M 160,325 L 160,380" class="line-async" marker-end="url(#arrow-blue)" />
      <text x="160" y="415" text-anchor="middle" font-size="12" fill="var(--c-neutral-gray)">× 线性对话，关闭即失</text>
      <text x="160" y="440" text-anchor="middle" font-size="12" fill="var(--c-neutral-gray)">× 数据主权归服务商</text>
    </g>

    <!-- 中间对比标签 -->
    <g transform="translate(400, 160)">
      <rect x="-50" y="-100" width="100" height="420" rx="8" class="diff-bg" fill-opacity="0.5" />
      <text y="-80" text-anchor="middle" font-size="12" fill="var(--c-risk-amber)" font-weight="bold">核心差异</text>
      <line y1="-70" y2="300" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4" />

      <rect x="-40" y="20" width="80" height="24" rx="12" fill="white" stroke="#e2e8f0" />
      <text y="36" text-anchor="middle" font-size="10">记忆力</text>

      <rect x="-40" y="100" width="80" height="24" rx="12" fill="white" stroke="#e2e8f0" />
      <text x="0" y="116" text-anchor="middle" font-size="10">数据权</text>

      <rect x="-40" y="180" width="80" height="24" rx="12" fill="white" stroke="#e2e8f0" />
      <text x="0" y="196" text-anchor="middle" font-size="10">扩展性</text>
    </g>

    <!-- 右侧：智力拥有 (模式 B) -->
    <g transform="translate(480, 20)">
      <rect width="320" height="480" rx="12" class="box-ownership" />
      <text x="160" y="30" text-anchor="middle" class="text-title" fill="var(--c-local-green)" font-size="16">模式 B：智力拥有 (Ownership)</text>

      <!-- 用户侧 -->
      <g transform="translate(160, 100)">
        <circle cx="0" cy="0" r="25" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-width="1.5" />
        <text y="40" text-anchor="middle" font-size="12" font-weight="bold">智能体设计师</text>
      </g>

      <!-- 本地架构 -->
      <g transform="translate(80, 160)">
        <rect width="160" height="80" rx="8" class="node-body" />
        <text x="80" y="35" text-anchor="middle" font-weight="bold" font-size="12">Obsidian (本地身体)</text>
        <text x="80" y="55" text-anchor="middle" class="text-mono" font-size="9" fill="var(--c-neutral-gray)">Markdown / Local Memory</text>
      </g>

      <!-- 云端工具 -->
      <g transform="translate(260, 290)">
        <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" class="node-brain" />
        <text y="5" text-anchor="middle" font-size="9">LLM API</text>
      </g>

      <!-- 存储 -->
      <g transform="translate(130, 260)">
        <path d="M0,8 A30,8 0 1,1 60,8 A30,8 0 1,1 0,8 Z" fill="#fff" stroke="var(--c-neutral-gray)" />
        <rect y="8" width="60" height="40" fill="#fff" />
        <path d="M0,48 A30,8 0 0,0 60,48" fill="none" stroke="var(--c-neutral-gray)" />
        <line x1="0" y1="8" x2="0" y2="48" stroke="var(--c-neutral-gray)" />
        <line x1="60" y1="8" x2="60" y2="48" stroke="var(--c-neutral-gray)" />
        <text x="30" y="32" text-anchor="middle" font-size="10">私有资产</text>
      </g>

      <!-- 连接线 -->
      <path d="M 160,240 L 160,255" class="line-sync" marker-end="url(#arrow-green)" />
      <path d="M 240,200 L 260,260" class="line-async" />

      <!-- 结果表现 -->
      <text x="160" y="415" text-anchor="middle" font-size="12" fill="var(--c-local-green)">√ 结构化知识网络</text>
      <text x="160" y="440" text-anchor="middle" font-size="12" fill="var(--c-local-green)">√ 100% 数据掌控</text>
    </g>
  </g>

  <!-- 3. 图例 -->
  <g id="legend-block" transform="translate(40, 660)">
    <rect x="0" y="0" width="720" height="40" rx="4" fill="rgba(255,255,255,0.9)" stroke="#E2E8F0" stroke-width="0.5"/>
    <g transform="translate(15, 24)">
      <!-- 图例标题 (水平左侧) -->
      <text x="0" y="0" class="text-title" font-size="10" fill="#64748B">图例说明：</text>

      <!-- 图例项 1 -->
      <g transform="translate(70, -5)">
        <polygon points="5,0 10,3 10,8 5,11 0,8 0,3" fill="var(--c-cloud-blue)" />
        <text x="18" y="8" font-size="10" fill="#334155">云端模型</text>
      </g>

      <!-- 图例项 2 -->
      <g transform="translate(180, -5)">
        <rect width="10" height="10" rx="2" fill="var(--c-local-green)" />
        <text x="18" y="8" font-size="10" fill="#334155">本地资产</text>
      </g>

      <!-- 图例项 3 -->
      <g transform="translate(300, -5)">
        <line x1="0" y1="5" x2="15" y2="5" class="line-async" />
        <text x="22" y="8" font-size="10" fill="#334155">智力租赁流 (不稳定)</text>
      </g>

      <!-- 图例项 4 -->
      <g transform="translate(480, -5)">
        <line x1="0" y1="5" x2="15" y2="5" class="line-sync" />
        <text x="22" y="8" font-size="10" fill="#334155">智力拥有流 (持久化)</text>
      </g>
    </g>
  </g>

  <!-- 4. 底部许可注释 -->
  <text x="400" y="735" text-anchor="middle" font-size="10" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
