<svg viewBox="0 0 1150 840" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：实战演练：四步状态机与物理拦截工作流
文件命名：12-figure-04-lab-4-step-workflow.svg
用途：展示实验中通过 S.C.O.R.E. 提示词建立的四步状态机模型，以及在执行 L3 级操作时如何触发底层硬围栏 (Hard Rails) 的完整流程。
版本：v1.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: CC-BY-SA-4.0
创建日期：2026-02-22
================================================================================
-->
  <!-- Background: Solid White (强兼容模式) -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;
        --c-gray-light: #F8FAFC;
        --c-red-alert: #EF4444;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-weight: 700; font-size: 26px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      .text-pillar-title { font-weight: 700; font-size: 16px; fill: #000; }
      .text-pillar-sub { font-family: var(--font-mono); font-size: 12px; }

      .text-node-title { font-weight: 700; font-size: 13px; fill: #000; }
      .text-node-sub { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }
      .text-desc { font-size: 12px; }
      .text-link { font-size: 12px; font-weight: 700; }
      .text-legend { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); }

      /* Specific Block Fonts */
      .font-mono { font-family: var(--font-mono); }
      .font-sans { font-family: var(--font-sans); }

      /* Connectors */
      .connector-async { fill: none; stroke: var(--c-cloud-blue); stroke-width: 2.5; stroke-dasharray: 6 4; }
      .connector-sync { fill: none; stroke: var(--c-local-green); stroke-width: 2.5; }
      .connector-amber { fill: none; stroke: var(--c-risk-amber); stroke-width: 2.5; }
      .connector-gray { fill: none; stroke: var(--c-neutral-gray); stroke-width: 2.5; }
    </style>

    <!-- Node Drop Shadow -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 575
===========================================================================
-->
  <g id="title-block" transform="translate(575, 40)">
    <!-- Main Title -->
    <text y="20" text-anchor="middle" class="text-title-main">实战演练：四步状态机与物理拦截工作流</text>

    <!-- Breadcrumbs -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">第 8 天 > 实战演练</text>

    <!-- Context Indicator (Absolute Y = 100) -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 150 (Ensures exactly 50px Gap from Title Block Indicator)
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- Background Blueprint Container -->
    <rect x="40" y="0" width="1070" height="540" rx="16" fill="var(--c-gray-light)" stroke="var(--c-neutral-gray)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
    <text x="60" y="25" class="font-mono text-node-title" fill="var(--c-neutral-gray)">S.C.O.R.E. 契约执行流 (Execution Pipeline)</text>

    <!-- Pillar Separators -->
    <line x1="290" y1="50" x2="290" y2="520" stroke="var(--c-neutral-gray)" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
    <line x1="560" y1="50" x2="560" y2="520" stroke="var(--c-neutral-gray)" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
    <line x1="830" y1="50" x2="830" y2="520" stroke="var(--c-neutral-gray)" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>


    <!-- ===================================================================
         PILLAR 1: 第一步 - 目录扫描 (L1)
         Center X = 170
    ==================================================================== -->
    <g id="step-1" transform="translate(170, 60)">
      <text y="0" text-anchor="middle" class="text-pillar-title" fill="var(--c-local-green)">第一步：目录扫描</text>
      <text y="20" text-anchor="middle" class="text-pillar-sub" fill="var(--c-local-green)">[L1 自动放行]</text>

      <!-- User Input -->
      <g transform="translate(0, 70)" filter="url(#drop-shadow)">
        <rect x="-100" y="-25" width="200" height="50" rx="6" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1.5" />
        <text y="-5" text-anchor="middle" class="font-sans text-desc" font-weight="bold">🧑‍💻 用户下发指令</text>
        <text y="12" text-anchor="middle" class="font-mono" font-size="10" fill="var(--c-neutral-gray)">"扫描 Inbox 目录"</text>
      </g>

      <path d="M 0 95 L 0 140" class="connector-async" marker-end="url(#arrow-blue)" />

      <!-- Agent Action -->
      <g transform="translate(0, 175)" filter="url(#drop-shadow)">
        <rect x="-100" y="-35" width="200" height="70" rx="8" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-width="2" />
        <text y="-10" text-anchor="middle" class="text-node-title" fill="var(--c-local-green)">调用只读工具</text>
        <rect x="-80" y="2" width="160" height="20" rx="4" fill="#FFFFFF" />
        <text y="16" text-anchor="middle" class="font-mono text-node-sub" fill="var(--c-local-green)">list_directory()</text>
      </g>

      <path d="M 0 210 L 0 260" class="connector-sync" marker-end="url(#arrow-green)" />

      <!-- Observation Output -->
      <g transform="translate(0, 290)" filter="url(#drop-shadow)">
        <rect x="-100" y="-30" width="200" height="60" rx="4" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1" />
        <text y="-8" text-anchor="middle" class="font-sans text-desc">输出文件列表</text>
        <text y="10" text-anchor="middle" class="font-mono" font-size="10" fill="var(--c-neutral-gray)">会议记录.md, 草稿.md...</text>
      </g>
    </g>


    <!-- ===================================================================
         PILLAR 2: 第二/三步 - 读取与预览
         Center X = 425
    ==================================================================== -->
    <g id="step-2-3" transform="translate(425, 60)">
      <text y="0" text-anchor="middle" class="text-pillar-title" fill="var(--c-cloud-blue)">第二/三步：读取与预览</text>
      <text y="20" text-anchor="middle" class="text-pillar-sub" fill="var(--c-cloud-blue)">[内存修改 &amp; 状态保持]</text>

      <!-- Flow from Pillar 1 -->
      <path d="M -155 290 L -100 290 L -100 70 L -40 70" class="connector-gray" marker-end="url(#arrow-gray)" stroke-dasharray="4 2"/>

      <!-- User Input -->
      <g transform="translate(60, 70)" filter="url(#drop-shadow)">
        <rect x="-100" y="-25" width="200" height="50" rx="6" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1.5" />
        <text y="-5" text-anchor="middle" class="font-sans text-desc" font-weight="bold">🧑‍💻 明确修改需求</text>
        <text y="12" text-anchor="middle" class="font-mono" font-size="10" fill="var(--c-neutral-gray)">"把日期改为 2026年2月16日"</text>
      </g>

      <path d="M 60 95 L 60 140" class="connector-async" marker-end="url(#arrow-blue)" />

      <!-- Agent Action (Read) -->
      <g transform="translate(60, 175)" filter="url(#drop-shadow)">
        <rect x="-110" y="-35" width="220" height="70" rx="8" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2" />
        <text y="-10" text-anchor="middle" class="text-node-title" fill="var(--c-cloud-blue)">读取并在内存中修改</text>
        <rect x="-90" y="2" width="180" height="20" rx="4" fill="var(--c-cloud-blue-light)" />
        <text y="16" text-anchor="middle" class="font-mono text-node-sub" fill="var(--c-cloud-blue)">read_file() -> Memory Ops</text>
      </g>

      <path d="M 60 210 L 60 260" class="connector-async" marker-end="url(#arrow-blue)" />

      <!-- Preview & Suspend -->
      <g transform="translate(60, 310)" filter="url(#drop-shadow)">
        <rect x="-110" y="-50" width="220" height="100" rx="8" fill="var(--c-risk-amber-light)" stroke="var(--c-risk-amber)" stroke-width="2" />
        <text y="-25" text-anchor="middle" class="text-node-title" fill="var(--c-risk-amber)">🛑 聊天框挂起 (Suspend)</text>
        <text y="-5" text-anchor="middle" class="font-sans text-desc" fill="var(--c-neutral-gray)">输出修改后的全文预览</text>
        <text y="15" text-anchor="middle" class="font-sans text-desc" font-weight="bold" fill="var(--c-risk-amber)">"是否确认保存？[Y/N]"</text>
      </g>
    </g>


    <!-- ===================================================================
         PILLAR 3: 第四步 - 物理拦截 (L3)
         Center X = 695
    ==================================================================== -->
    <g id="step-4-intercept" transform="translate(695, 60)">
      <text y="0" text-anchor="middle" class="text-pillar-title" fill="var(--c-risk-amber)">第四步：物理拦截 (L3)</text>
      <text y="20" text-anchor="middle" class="text-pillar-sub" fill="var(--c-risk-amber)">[FastMCP Hard Rails]</text>

      <!-- User Auth Flow -->
      <path d="M -120 310 L -60 310" class="connector-amber" marker-end="url(#arrow-amber)" />
      <text x="-90" y="300" text-anchor="middle" class="text-link" fill="var(--c-risk-amber)">输入 Y</text>

      <!-- HITL Tool Call -->
      <g transform="translate(50, 310)" filter="url(#drop-shadow)">
        <rect x="-110" y="-45" width="220" height="90" rx="8" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="2.5" />
        <rect x="-110" y="-45" width="220" height="30" rx="8" fill="var(--c-risk-amber)" />
        <!-- hide bottom corners of header -->
        <rect x="-110" y="-25" width="220" height="10" fill="var(--c-risk-amber)" />
        <text y="-25" text-anchor="middle" class="font-sans text-desc" font-weight="bold" fill="#FFFFFF">触发底层安全拦截工具</text>

        <rect x="-95" y="-5" width="190" height="24" rx="4" fill="var(--c-risk-amber-light)" />
        <text y="11" text-anchor="middle" class="font-mono text-xs" fill="var(--c-risk-amber)">safe_modify_or_delete()</text>
        <text y="32" text-anchor="middle" class="font-sans" font-size="10" fill="var(--c-neutral-gray)">携带 file_path 与 new_content</text>
      </g>

      <path d="M 50 355 L 50 395" class="connector-amber" marker-end="url(#arrow-amber)" />

      <!-- OS Tkinter Popup -->
      <g transform="translate(50, 445)" filter="url(#drop-shadow)">
        <rect x="-110" y="-45" width="220" height="90" rx="4" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="2" />
        <rect x="-110" y="-45" width="220" height="20" rx="4" fill="var(--c-neutral-gray)" />
        <text x="0" y="-31" text-anchor="middle" class="font-sans" font-size="10" fill="#FFFFFF">系统原生警告弹窗 (Tkinter)</text>

        <text y="0" text-anchor="middle" class="font-sans text-desc" font-weight="bold" fill="var(--c-red-alert)">⚠️ 物理授权网关挂起</text>
        <text y="18" text-anchor="middle" class="font-sans" font-size="10" fill="var(--c-neutral-gray)">等待人类鼠标物理点击确认</text>
      </g>
    </g>


    <!-- ===================================================================
         PILLAR 4: 最终裁决与落盘
         Center X = 965
    ==================================================================== -->
    <g id="step-5-execution" transform="translate(965, 60)">
      <text y="0" text-anchor="middle" class="text-pillar-title" fill="var(--c-neutral-gray)">裁决执行 (Execution)</text>
      <text y="20" text-anchor="middle" class="text-pillar-sub" fill="var(--c-neutral-gray)">[I/O 落盘处理]</text>

      <!-- Path: Yes -->
      <path d="M -160 425 C -120 425 -100 375 -50 375" class="connector-sync" marker-end="url(#arrow-green)" />
      <text x="-105" y="385" text-anchor="middle" class="text-link" fill="var(--c-local-green)">点击 [Yes]</text>

      <!-- Action: Write -->
      <g transform="translate(40, 375)" filter="url(#drop-shadow)">
        <rect x="-90" y="-35" width="180" height="70" rx="8" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-width="2" />
        <text y="-10" text-anchor="middle" class="text-node-title" fill="var(--c-local-green)">✅ 物理落盘</text>
        <rect x="-70" y="2" width="140" height="20" rx="4" fill="#FFFFFF" />
        <text y="16" text-anchor="middle" class="font-mono" font-size="10" fill="var(--c-local-green)">open().write()</text>
      </g>

      <!-- Path: No -->
      <path d="M -160 465 C -120 465 -100 500 -50 500" class="connector-gray" marker-end="url(#arrow-gray)" />
      <text x="-105" y="495" text-anchor="middle" class="text-link" fill="var(--c-neutral-gray)">点击 [No]</text>

      <!-- Action: Cancel -->
      <g transform="translate(40, 500)" filter="url(#drop-shadow)">
        <rect x="-90" y="-30" width="180" height="60" rx="8" fill="var(--c-gray-light)" stroke="var(--c-neutral-gray)" stroke-width="2" />
        <text y="-5" text-anchor="middle" class="text-node-title" fill="var(--c-neutral-gray)">🚫 物理阻断</text>
        <text y="15" text-anchor="middle" class="font-sans text-desc" fill="var(--c-neutral-gray)">取消操作，文件安全</text>
      </g>

    </g>

  </g>

<!--
===========================================================================
     底部图例与注释块 (Legend & Key Block)
===========================================================================
-->
  <g id="legend" transform="translate(575, 775)">
    <rect x="-400" y="-16" width="800" height="32" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-380, 0)">
      <text x="0" y="4" class="font-sans text-desc" font-weight="bold" fill="var(--c-neutral-gray)">图例说明:</text>

      <g transform="translate(100, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
        <text x="12" y="4" class="text-legend">L1 自动放行 (Auto/Safe)</text>
      </g>

      <g transform="translate(300, 0)">
        <path d="M-6,-4 L0,-8 L6,-4 L6,4 L0,8 L-6,4 Z" fill="var(--c-cloud-blue)" />
        <text x="12" y="4" class="text-legend">云端大模型内存操作 (Cloud LLM)</text>
      </g>

      <g transform="translate(520, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-risk-amber)" />
        <text x="12" y="4" class="text-legend">L3 物理拦截与授权网关 (HITL/Risk)</text>
      </g>
    </g>
  </g>

<!--
===========================================================================
     底部许可注释 (License)
===========================================================================
-->
  <text x="575" y="820" text-anchor="middle" class="font-sans text-desc" fill="#94A3B8">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
