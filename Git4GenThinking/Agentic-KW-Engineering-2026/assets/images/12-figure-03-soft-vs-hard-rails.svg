<svg viewBox="0 0 1000 820" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：安全围栏对比：软围栏 vs 硬围栏 (Soft Rails vs. Hard Rails)
文件命名：12-figure-03-soft-vs-hard-rails.svg
用途：对比智能体工程中基于认知的软围栏与基于代码的硬围栏在风险控制机制、应用场景及安全性上的差异。
版本：v1.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-02-22
================================================================================
-->
  <!-- Background: Solid White (强兼容模式) -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors */
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --c-risk-amber-light: #FFFBEB;
        --c-gray-light: #F8FAFC;
        --c-red-alert: #EF4444;

        /* Typography */
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      /* Text Styles */
      text { font-family: var(--font-sans); }
      .text-title-main { font-weight: 700; font-size: 26px; fill: #000; }
      .text-breadcrumbs { font-family: var(--font-mono); font-size: 14px; fill: var(--c-neutral-gray); }
      .text-fig-id { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); letter-spacing: 1px; }

      .text-region-title { font-weight: 700; font-size: 18px; fill: #000; }
      .text-region-sub { font-family: var(--font-mono); font-size: 12px; }

      .text-node-title { font-weight: 700; font-size: 14px; fill: #000; }
      .text-node-sub { font-family: var(--font-mono); font-size: 11px; fill: var(--c-neutral-gray); }
      .text-desc { font-size: 12px; }
      .text-link { font-size: 12px; font-weight: 700; }
      .text-legend { font-family: var(--font-mono); font-size: 12px; fill: var(--c-neutral-gray); }

      /* Specific Block Fonts */
      .font-mono { font-family: var(--font-mono); }
      .font-sans { font-family: var(--font-sans); }

      /* Connectors */
      .connector-async { fill: none; stroke: var(--c-cloud-blue); stroke-width: 2.5; stroke-dasharray: 6 4; }
      .connector-sync { fill: none; stroke: var(--c-local-green); stroke-width: 2.5; }
      .connector-amber { fill: none; stroke: var(--c-risk-amber); stroke-width: 2.5; }
      .connector-alert { fill: none; stroke: var(--c-red-alert); stroke-width: 2.5; stroke-dasharray: 4 2; }
    </style>

    <!-- Node Drop Shadow -->
    <filter id="drop-shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-red-alert)" />
    </marker>
  </defs>

<!--
===========================================================================
     TITLE BLOCK (Standardized Layout)
     Center X = 500
===========================================================================
-->
  <g id="title-block" transform="translate(500, 40)">
    <!-- Main Title -->
    <text y="20" text-anchor="middle" class="text-title-main">智能体Prompt安全围栏对比：软围栏 vs 硬围栏</text>

    <!-- Breadcrumbs -->
    <text y="45" text-anchor="middle" class="text-breadcrumbs">第 12 天 > 基础原理</text>

    <!-- Context Indicator (Absolute Y = 100) -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

<!--
===========================================================================
     DIAGRAM CONTENT
     Start Y = 150 (Ensures exactly 50px Gap from Title Block Indicator)
===========================================================================
-->
  <g id="diagram-content" transform="translate(0, 150)">

    <!-- ===================================================================
         LEFT COLUMN: Soft Rails (软围栏)
         Center X = 260
    ==================================================================== -->
    <g id="region-soft-rails" transform="translate(40, 0)">
      <!-- Boundary Box -->
      <rect x="0" y="0" width="440" height="560" rx="12" fill="var(--c-cloud-blue-light)" fill-opacity="0.15" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="8 4" />

      <!-- Header -->
      <text x="220" y="35" text-anchor="middle" class="text-region-title" fill="var(--c-cloud-blue)">Soft Rails (认知层软围栏)</text>
      <text x="220" y="55" text-anchor="middle" class="text-region-sub" fill="var(--c-neutral-gray)">基于 Prompt Engineering 的逻辑防线</text>

      <!-- Step 1: Prompt Contract -->
      <g transform="translate(220, 110)" filter="url(#drop-shadow)">
        <rect x="-160" y="-30" width="320" height="60" rx="8" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2" />
        <text y="-5" text-anchor="middle" class="text-node-title" fill="var(--c-cloud-blue)">1. 设定 S.C.O.R.E 规则</text>
        <text y="15" text-anchor="middle" class="text-node-sub">"若要修改文件，必须先输出预览并询问我"</text>
      </g>
      <path d="M 220 140 L 220 180" class="connector-async" marker-end="url(#arrow-blue)" />

      <!-- Step 2: Chat-based HITL -->
      <g transform="translate(220, 240)" filter="url(#drop-shadow)">
        <rect x="-160" y="-60" width="320" height="120" rx="8" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1.5" />
        <rect x="-160" y="-60" width="320" height="30" rx="8" fill="var(--c-gray-light)" />
        <text x="-140" y="-40" class="font-sans text-desc" font-weight="bold">💬 纯对话式拦截 (Chat-based HITL)</text>

        <!-- LLM Bubble -->
        <path d="M -140 -15 L -20 -15 L -20 20 L -130 20 L -140 30 Z" fill="var(--c-cloud-blue-light)" />
        <text x="-130" y="0" class="font-sans" font-size="10" fill="var(--c-cloud-blue)">AI: 这是修改预览... 是否确认写入？</text>

        <!-- User Bubble -->
        <path d="M 140 25 L 20 25 L 20 50 L 130 50 L 140 60 Z" fill="var(--c-local-green-light)" />
        <text x="130" y="40" text-anchor="end" class="font-sans" font-size="10" fill="var(--c-local-green)">User: Y</text>
      </g>
      <path d="M 220 300 L 220 340" class="connector-async" marker-end="url(#arrow-blue)" />

      <!-- Step 3: Tool Execution -->
      <g transform="translate(220, 380)" filter="url(#drop-shadow)">
        <rect x="-160" y="-40" width="320" height="80" rx="8" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2" />
        <text y="-15" text-anchor="middle" class="text-node-title">3. 执行常规写入工具</text>
        <rect x="-100" y="0" width="200" height="24" rx="4" fill="var(--c-cloud-blue-light)" />
        <text y="16" text-anchor="middle" class="font-mono text-desc" fill="var(--c-cloud-blue)">write_file(path, content)</text>
      </g>

      <!-- Warning Box -->
      <g transform="translate(220, 490)">
        <rect x="-180" y="-40" width="360" height="80" rx="6" fill="var(--c-risk-amber-light)" stroke="var(--c-risk-amber)" stroke-dasharray="4 2" />
        <text y="-18" text-anchor="middle" class="font-sans text-desc" font-weight="bold" fill="var(--c-risk-amber)">⚠️ 安全隐患：容易被绕过</text>
        <text y="2" text-anchor="middle" class="font-sans" font-size="11" fill="var(--c-neutral-gray)">完全依赖大模型的“自觉性”</text>
        <text y="18" text-anchor="middle" class="font-sans" font-size="11" fill="var(--c-neutral-gray)">可能遭受越狱 (Jailbreak) 或因幻觉直接跳步写入</text>
      </g>

      <!-- Attack Vector Arrow -->
      <path d="M 380 110 C 440 110, 440 380, 380 380" class="connector-alert" marker-end="url(#arrow-red)" />
      <text x="420" y="240" text-anchor="middle" font-size="10" fill="var(--c-red-alert)">越狱跳步</text>
    </g>


    <!-- ===================================================================
         RIGHT COLUMN: Hard Rails (硬围栏)
         Center X = 740
    ==================================================================== -->
    <g id="region-hard-rails" transform="translate(520, 0)">
      <!-- Boundary Box -->
      <rect x="0" y="0" width="440" height="560" rx="12" fill="var(--c-local-green-light)" fill-opacity="0.15" stroke="var(--c-local-green)" stroke-width="2" />

      <!-- Header -->
      <text x="220" y="35" text-anchor="middle" class="text-region-title" fill="var(--c-local-green)">Hard Rails (代码级硬围栏)</text>
      <text x="220" y="55" text-anchor="middle" class="text-region-sub" fill="var(--c-neutral-gray)">基于 OS 底层网关的物理拦截</text>

      <!-- Step 1: Intercept Gateway -->
      <g transform="translate(220, 110)" filter="url(#drop-shadow)">
        <rect x="-160" y="-30" width="320" height="60" rx="8" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="2" />
        <text y="-5" text-anchor="middle" class="text-node-title" fill="var(--c-local-green)">1. 专用高危拦截工具</text>
        <text y="15" text-anchor="middle" class="font-mono text-xs" fill="var(--c-neutral-gray)">safe_modify_or_delete()</text>
      </g>
      <path d="M 220 140 L 220 180" class="connector-sync" marker-end="url(#arrow-green)" />

      <!-- Step 2: Physical OS Popup -->
      <g transform="translate(220, 240)" filter="url(#drop-shadow)">
        <!-- OS Window Representation -->
        <rect x="-160" y="-60" width="320" height="120" rx="4" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="2" />
        <rect x="-160" y="-60" width="320" height="24" rx="4" fill="var(--c-neutral-gray)" />
        <circle cx="-145" cy="-48" r="4" fill="#EF4444" />
        <circle cx="-130" cy="-48" r="4" fill="#FBBF24" />
        <circle cx="-115" cy="-48" r="4" fill="#10B981" />
        <text x="0" y="-44" text-anchor="middle" class="font-sans" font-size="10" fill="#FFFFFF">Tkinter / 系统级授权</text>

        <text y="-15" text-anchor="middle" class="font-sans text-desc" font-weight="bold" fill="var(--c-risk-amber)">⚠️ 警告：智能体请求修改文件</text>
        <text y="5" text-anchor="middle" class="font-sans" font-size="10" fill="var(--c-neutral-gray)">/Books/Vault/会议记录.md</text>

        <!-- OS Buttons -->
        <rect x="-70" y="20" width="60" height="24" rx="4" fill="var(--c-gray-light)" stroke="var(--c-neutral-gray)" stroke-width="1"/>
        <text x="-40" y="36" text-anchor="middle" class="font-sans" font-size="11">No (拒绝)</text>
        <rect x="10" y="20" width="60" height="24" rx="4" fill="var(--c-local-green)" />
        <text x="40" y="36" text-anchor="middle" class="font-sans" font-size="11" fill="#FFFFFF">Yes (物理授权)</text>

        <!-- Mouse Pointer -->
        <path d="M 40 45 L 40 60 L 45 55 L 50 65 L 53 63 L 48 53 L 55 53 Z" fill="#000" stroke="#FFF" stroke-width="1" />
      </g>
      <path d="M 220 300 L 220 340" class="connector-sync" marker-end="url(#arrow-green)" />

      <!-- Step 3: Physical I/O -->
      <g transform="translate(220, 380)" filter="url(#drop-shadow)">
        <rect x="-160" y="-40" width="320" height="80" rx="8" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="2" />
        <text y="-15" text-anchor="middle" class="text-node-title">3. 底层脚本执行真实落盘</text>
        <rect x="-100" y="0" width="200" height="24" rx="4" fill="var(--c-local-green-light)" />
        <text y="16" text-anchor="middle" class="font-mono text-desc" fill="var(--c-local-green)">open(file, 'w').write()</text>
      </g>

      <!-- Shield Box -->
      <g transform="translate(220, 490)">
        <rect x="-180" y="-40" width="360" height="80" rx="6" fill="var(--c-local-green-light)" stroke="var(--c-local-green)" stroke-width="1.5" />
        <text y="-18" text-anchor="middle" class="font-sans text-desc" font-weight="bold" fill="var(--c-local-green)">🛡️ 绝对安全：物理级阻断</text>
        <text y="2" text-anchor="middle" class="font-sans" font-size="11" fill="var(--c-neutral-gray)">接管大模型的执行流并强制挂起进程</text>
        <text y="18" text-anchor="middle" class="font-sans" font-size="11" fill="var(--c-neutral-gray)">若无人类鼠标物理点击，危险代码绝对无法执行</text>
      </g>
    </g>

  </g>

<!--
===========================================================================
     底部图例与注释块 (Legend & Key Block)
===========================================================================
-->
  <g id="legend" transform="translate(500, 735)">
    <rect x="-350" y="-16" width="700" height="32" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-330, 0)">
      <text x="0" y="4" class="font-sans text-xs text-bold" fill="var(--c-neutral-gray)">图例说明:</text>

      <g transform="translate(100, 0)">
        <line x1="-10" y1="0" x2="10" y2="0" stroke="var(--c-cloud-blue)" stroke-width="2.5" stroke-dasharray="4 2" />
        <text x="16" y="4" class="text-legend">大模型逻辑控制 (认知层)</text>
      </g>

      <g transform="translate(320, 0)">
        <line x1="-10" y1="0" x2="10" y2="0" stroke="var(--c-local-green)" stroke-width="2.5" />
        <text x="16" y="4" class="text-legend">OS 脚本底层控制 (物理层)</text>
      </g>

      <g transform="translate(520, 0)">
        <line x1="-10" y1="0" x2="10" y2="0" stroke="var(--c-red-alert)" stroke-width="2.5" stroke-dasharray="4 2" />
        <text x="16" y="4" class="text-legend">越狱/攻击路径 (风险)</text>
      </g>
    </g>
  </g>

<!--
===========================================================================
     底部许可注释 (License)
===========================================================================
-->
  <text x="500" y="790" text-anchor="middle" class="font-sans text-xs" fill="#94A3B8">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
