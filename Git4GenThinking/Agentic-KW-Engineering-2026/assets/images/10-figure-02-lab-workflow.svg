<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <!--
  ================================================================================
  图表名称：智能体 Outbound 实战演练流程图 (Agent Outbound Practice Workflow)
  文件命名：10-figure-02-lab-workflow.svg
  用途：展示第10天课程实战环节中，从启动 Python 脚本到最终文件验证的人工中继闭环流程。
  版本：v1.0.0
  作者：Gitconomy Research-郭晧
  SPDX-License-Identifier: MIT & CC-BY-SA-4.0
  创建日期：2025-05-22
  ================================================================================
  -->

  <!-- 背景：纯白背景模式 [3.5.1] -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <style>
    :root {
      --c-cloud-blue: #0099FF;
      --c-local-green: #009900;
      --c-risk-amber: #FF991F;
      --c-neutral-gray: #666666;
      --font-sans: 'Noto Sans SC', 'Noto Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .text-title { font-family: var(--font-sans); font-weight: bold; }
    .text-mono { font-family: var(--font-mono); font-size: 12px; }
    .text-body { font-family: var(--font-sans); font-size: 14px; fill: #333; }
    .text-step { font-family: var(--font-mono); font-size: 11px; font-weight: bold; fill: white; }
    .text-legend { font-family: var(--font-sans); font-size: 11px; fill: var(--c-neutral-gray); }

    /* 流程节点样式 */
    .node-brain { stroke: var(--c-cloud-blue); fill: white; stroke-width: 2; }
    .node-tool { stroke: var(--c-local-green); fill: rgba(0, 153, 0, 0.05); stroke-width: 2; }
    .node-manual { stroke: var(--c-risk-amber); fill: rgba(255, 153, 31, 0.05); stroke-width: 2; }
    .node-store { stroke: var(--c-neutral-gray); fill: white; stroke-width: 2; }

    /* 连线样式 */
    .line-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }
    .line-async { stroke: var(--c-risk-amber); stroke-dasharray: 4 2; stroke-width: 2; fill: none; }

    .marker-arrow { fill: var(--c-neutral-gray); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="marker-arrow" />
    </marker>
  </defs>

  <!-- 3.3 标题块 (Title Block) -->
  <g id="title-block" transform="translate(400, 40)">
    <text y="20" text-anchor="middle" class="text-title" font-size="24">Outbound 模式实战演练全流程</text>
    <text y="45" text-anchor="middle" class="text-mono" fill="var(--c-neutral-gray)">第 10 天 > 实战演练</text>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 流程图主体 -->
  <g id="diagram-content" transform="translate(400, 140)">

    <!-- Step 1: 环境启动 (Local) -->
    <g transform="translate(0, 0)">
      <rect x="-120" y="0" width="240" height="60" rx="8" class="node-tool" />
      <circle cx="-120" cy="0" r="12" fill="var(--c-local-green)" />
      <text x="-120" y="4" text-anchor="middle" class="text-step">01</text>
      <text y="25" text-anchor="middle" class="text-title" font-size="16">启动 Python Server</text>
      <text y="45" text-anchor="middle" class="text-mono">server_obsidian_io.py</text>
    </g>

    <!-- 连接线 1 -> 2 -->
    <line x1="0" y1="60" x2="0" y2="100" class="line-sync" marker-end="url(#arrow)" />

    <!-- Step 2: 触发决策 (Cloud) -->
    <g transform="translate(0, 100)">
      <path d="M-60,0 L0,-30 L60,0 L60,60 L0,90 L-60,60 Z" class="node-brain" />
      <circle cx="-60" cy="0" r="12" fill="var(--c-cloud-blue)" />
      <text x="-60" y="4" text-anchor="middle" class="text-step">02</text>
      <text y="25" text-anchor="middle" class="text-title" font-size="16">生成 JSON 指令</text>
      <text y="45" text-anchor="middle" class="text-mono">Text Generator (Ctrl+J)</text>
      <text y="65" text-anchor="middle" class="text-body" font-size="12">在大脑中将意图编译为 JSON</text>
    </g>

    <!-- 连接线 2 -> 3 (Amber 线代表等待人工干预) -->
    <line x1="0" y1="190" x2="0" y2="240" class="line-async" marker-end="url(#arrow)" />
    <text x="10" y="220" text-anchor="start" class="text-mono" fill="var(--c-risk-amber)">人工消息总线 (Copy-Paste)</text>

    <!-- Step 3: 人工中继 (Manual Relay) -->
    <g transform="translate(0, 240)">
      <rect x="-120" y="0" width="240" height="80" rx="8" class="node-manual" />
      <circle cx="-120" cy="0" r="12" fill="var(--c-risk-amber)" />
      <text x="-120" y="4" text-anchor="middle" class="text-step">03</text>
      <text y="30" text-anchor="middle" class="text-title" font-size="16">传递信号 (人工中继)</text>
      <text y="50" text-anchor="middle" class="text-body" font-size="12">将 Obsidian 生成的 JSON 粘贴至</text>
      <text y="68" text-anchor="middle" class="text-mono" fill="var(--c-risk-amber)">Terminal 标准输入 (input)</text>
    </g>

    <!-- 连接线 3 -> 4 -->
    <line x1="0" y1="320" x2="0" y2="360" class="line-sync" marker-end="url(#arrow)" />

    <!-- Step 4: 物理执行 (Local) -->
    <g transform="translate(0, 360)">
      <rect x="-120" y="0" width="240" height="60" rx="8" class="node-tool" />
      <circle cx="-120" cy="0" r="12" fill="var(--c-local-green)" />
      <text x="-120" y="4" text-anchor="middle" class="text-step">04</text>
      <text y="25" text-anchor="middle" class="text-title" font-size="16">Python 解析与写入</text>
      <text y="45" text-anchor="middle" class="text-mono">append_to_note()</text>
    </g>

    <!-- 连接线 4 -> 5 -->
    <line x1="0" y1="420" x2="0" y2="460" class="line-sync" marker-end="url(#arrow)" />

    <!-- Step 5: 结果验证 (Storage) -->
    <g transform="translate(0, 460)">
      <path d="M-60,0 C-60,-15 60,-15 60,0 L60,40 C60,55 -60,55 -60,40 Z" class="node-store" />
      <path d="M-60,0 C-60,10 60,10 60,0" fill="none" stroke="var(--c-neutral-gray)" stroke-width="2" />
      <circle cx="-60" cy="0" r="12" fill="var(--c-neutral-gray)" />
      <text x="-60" y="4" text-anchor="middle" class="text-step">05</text>
      <text y="30" text-anchor="middle" class="text-title" font-size="16">最终文件校验</text>
      <text y="65" text-anchor="middle" class="text-mono">Check Inbox.md</text>
    </g>

  </g>

  <!-- 图例说明块 [3.4] -->
  <g id="legend" transform="translate(400, 780)">
    <rect x="-360" y="-20" width="720" height="40" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>
    <text x="-345" y="4" class="text-title" font-size="11" fill="var(--c-neutral-gray)">图例说明:</text>

    <!-- Brain Node -->
    <g transform="translate(-240, 0)">
      <path d="M-6,-4 L0,-8 L6,-4 L6,4 L0,8 L-6,4 Z" fill="var(--c-cloud-blue)" />
      <text x="12" y="4" class="text-legend">云端生成 (Brain)</text>
    </g>

    <!-- Tool Node -->
    <g transform="translate(-100, 0)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
      <text x="12" y="4" class="text-legend">本地执行 (Body)</text>
    </g>

    <!-- Manual Node -->
    <g transform="translate(40, 0)">
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-risk-amber)" />
      <text x="12" y="4" class="text-legend">人工干预 (Wait)</text>
    </g>

    <!-- Lines -->
    <g transform="translate(180, 0)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-local-green)" stroke-width="2" />
      <text x="12" y="4" class="text-legend">自动流程</text>
    </g>
    <g transform="translate(280, 0)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="3 2" />
      <text x="12" y="4" class="text-legend">人工/异步</text>
    </g>
  </g>

  <!-- 底部许可注释 -->
  <text x="400" y="835" text-anchor="middle" class="text-legend">本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research社区</text>

</svg>
