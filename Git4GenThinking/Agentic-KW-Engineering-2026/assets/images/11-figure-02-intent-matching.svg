<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%">
  <!--
  ================================================================================
  图表名称：智能工具路由：意图识别与语义匹配 (Intent Recognition & Semantic Matching)
  文件命名：11-figure-02-intent-matching.svg
  用途：展示大语言模型 (LLM) 在面对多个 MCP 工具时，如何提取用户意图，并完全依赖工具的 Description 字段进行语义相似度计算，最终完成高概率路由决策的过程。
  版本：v1.0.0
  作者：Gitconomy Research-郭晧
  SPDX-License-Identifier: MIT & CC-BY-SA-4.0
  创建日期：2026-02-21
  ================================================================================
  -->

  <!-- Background: Solid White (遵循规范 3.5.1) -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors 语义色系统 */
        --c-cloud-blue: #0066CC;   /* Brain Blue: 云端算力/逻辑推理 */
        --c-local-green: #00875A;  /* Body Green: 匹配成功/精准执行 */
        --c-risk-amber: #FF991F;   /* State Amber: 模糊匹配/幻觉风险 */
        --c-neutral-gray: #475569; /* Meta Gray: 背景/不匹配项/辅助线 */
        --c-danger-red: #DE350B;   /* Danger Red: 负向约束/强排斥 */

        /* 浅色背景辅助变量 */
        --c-bg-light-blue: #EBF3FA;
        --c-bg-light-green: #E6F3EE;
        --c-bg-light-amber: #FFF4E5;
        --c-bg-light-gray: #F1F5F9;

        /* Font Stacks (遵循兼容性规范) */
        --font-sans: 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      }

      .text-sans { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); }
      .text-bold { font-weight: bold; }
    </style>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
  </defs>

  <!--
  ===========================================================================
       标题块 (Title Block) - 严格遵循 3.3.4 SVG 实现范式
  ===========================================================================
  -->
  <g id="title-block" transform="translate(500, 40)">
    <!-- A. Main Title -->
    <text y="20" text-anchor="middle" class="text-sans text-bold" font-size="24" fill="#000000">智能工具路由：意图识别与语义匹配</text>

    <!-- B. Breadcrumbs -->
    <text y="45" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">第 11 天 > 基础原理</text>

    <!-- C. Context Indicator -->
    <line x1="-40" y1="60" x2="40" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!--
  ===========================================================================
       架构主视图区 (Diagram Content - Safe Zone Starts at Y=140)
  ===========================================================================
  -->
  <g id="diagram-content" transform="translate(0, 140)">

    <!-- 1. LLM Context Window Boundary -->
    <rect x="60" y="20" width="880" height="620" rx="16" fill="var(--c-bg-light-blue)" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="6 4" />
    <text x="80" y="45" class="text-sans text-bold" font-size="14" fill="var(--c-cloud-blue)">
      LLM Context Window (决策大脑上下文窗口)
    </text>
    <text x="760" y="45" class="text-mono" font-size="12" fill="var(--c-cloud-blue)">System Prompt</text>

    <!-- 2. 用户输入 (User Intent) - Left Side -->
    <g transform="translate(100, 250)">
      <rect width="240" height="90" rx="8" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2" />
      <text x="120" y="25" text-anchor="middle" class="text-sans text-bold" font-size="14" fill="var(--c-cloud-blue)">用户自然语言输入</text>
      <text x="120" y="45" text-anchor="middle" class="text-sans" font-size="13" fill="#333333">“帮我查一下关于”</text>
      <text x="120" y="65" text-anchor="middle" class="text-sans text-bold" font-size="13" fill="var(--c-local-green)">2025年大模型架构</text>
      <text x="120" y="85" text-anchor="middle" class="text-sans" font-size="13" fill="#333333">的最新学术论文。”</text>
    </g>

    <!-- Intent Extraction Arrow to Center -->
    <path d="M 340 295 L 430 295" fill="none" stroke="var(--c-cloud-blue)" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="385" y="285" text-anchor="middle" class="text-sans" font-size="11" fill="var(--c-cloud-blue)">意图向量化</text>


    <!-- 3. 上下文注入的工具库 (Context Injected Schemas) - Right Side -->
    <g transform="translate(620, 90)">
      <text x="140" y="0" text-anchor="middle" class="text-sans text-bold" font-size="14" fill="#333333">已挂载的 MCP 工具 (Schema 注入)</text>

      <!-- Tool A: Vague Description (Risk Amber) -->
      <g transform="translate(0, 20)">
        <rect width="280" height="100" rx="6" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="2" />
        <rect x="0" y="0" width="280" height="25" rx="6" fill="var(--c-bg-light-amber)" />
        <text x="10" y="17" class="text-mono text-bold" font-size="12" fill="var(--c-risk-amber)">Tool A: web_search</text>
        <text x="10" y="40" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">"description":</text>
        <text x="20" y="55" class="text-sans" font-size="12" fill="#333333">"用于在网络上搜索信息。"</text>
        <rect x="10" y="65" width="60" height="20" rx="4" fill="var(--c-bg-light-amber)"/>
        <text x="40" y="79" text-anchor="middle" class="text-sans text-bold" font-size="10" fill="var(--c-risk-amber)">描述模糊</text>
      </g>

      <!-- Tool B: Precise Description (Success Green) -->
      <g transform="translate(0, 140)">
        <rect width="280" height="120" rx="6" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="3" />
        <rect x="0" y="0" width="280" height="25" rx="6" fill="var(--c-bg-light-green)" />
        <text x="10" y="17" class="text-mono text-bold" font-size="12" fill="var(--c-local-green)">Tool B: arxiv_academic_search</text>
        <text x="10" y="40" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">"description":</text>
        <text x="20" y="55" class="text-sans text-bold" font-size="12" fill="var(--c-local-green)">"专门用于搜索学术论文与文献。</text>
        <text x="20" y="70" class="text-sans" font-size="11" fill="#666666">当用户询问技术原理、研究报告等</text>
        <text x="20" y="85" class="text-sans" font-size="11" fill="#666666">场景时，请优先调用此工具。"</text>
        <rect x="10" y="95" width="60" height="20" rx="4" fill="var(--c-bg-light-green)"/>
        <text x="40" y="109" text-anchor="middle" class="text-sans text-bold" font-size="10" fill="var(--c-local-green)">场景化描述</text>
      </g>

      <!-- Tool C: Irrelevant / Exclusive (Gray) -->
      <g transform="translate(0, 280)">
        <rect width="280" height="100" rx="6" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1" />
        <rect x="0" y="0" width="280" height="25" rx="6" fill="var(--c-bg-light-gray)" />
        <text x="10" y="17" class="text-mono text-bold" font-size="12" fill="#666666">Tool C: filesystem</text>
        <text x="10" y="40" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">"description":</text>
        <text x="20" y="55" class="text-sans" font-size="12" fill="#333333">"读取和写入本地物理磁盘文件。</text>
        <text x="20" y="70" class="text-sans text-bold" font-size="11" fill="var(--c-danger-red)">注意：不支持进行任何联网搜索。"</text>
        <rect x="10" y="80" width="60" height="20" rx="4" fill="#FEE2E2"/>
        <text x="40" y="94" text-anchor="middle" class="text-sans text-bold" font-size="10" fill="var(--c-danger-red)">排他性约束</text>
      </g>
    </g>


    <!-- 4. 中央匹配引擎 (Semantic Matching Core) -->
    <g transform="translate(490, 295)">
      <!-- Hexagon Node -->
      <polygon points="0,-60 55,-30 55,30 0,60 -55,30 -55,-30" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="3" />
      <circle cx="0" cy="-25" r="14" fill="var(--c-cloud-blue)"/>
      <text x="0" y="-20" text-anchor="middle" class="text-sans text-bold" font-size="14" fill="#FFFFFF">f</text>

      <text x="0" y="10" text-anchor="middle" class="text-sans text-bold" font-size="12" fill="var(--c-cloud-blue)">语义相似度</text>
      <text x="0" y="25" text-anchor="middle" class="text-sans text-bold" font-size="12" fill="var(--c-cloud-blue)">匹配计算</text>

      <!-- Connecting Lines from Tools to Matching Engine -->
      <!-- Tool A Match Line -->
      <path d="M 130 -135 L 50 -35" fill="none" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="4 2" />
      <rect x="65" y="-105" width="45" height="20" rx="4" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="1"/>
      <text x="87" y="-91" text-anchor="middle" class="text-mono text-bold" font-size="12" fill="var(--c-risk-amber)">45%</text>

      <!-- Tool B Match Line -->
      <path d="M 130 5 L 60 5" fill="none" stroke="var(--c-local-green)" stroke-width="3" />
      <rect x="75" y="-5" width="45" height="20" rx="4" fill="var(--c-local-green)" />
      <text x="97" y="9" text-anchor="middle" class="text-mono text-bold" font-size="12" fill="#FFFFFF">98%</text>

      <!-- Tool C Match Line -->
      <path d="M 130 145 L 50 45" fill="none" stroke="var(--c-neutral-gray)" stroke-width="1" stroke-dasharray="2 2" />
      <rect x="65" y="95" width="45" height="20" rx="4" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1"/>
      <text x="87" y="109" text-anchor="middle" class="text-mono text-bold" font-size="12" fill="var(--c-neutral-gray)">5%</text>

      <!-- Arrow out to Dispatch -->
      <path d="M 0 60 L 0 195" fill="none" stroke="var(--c-cloud-blue)" stroke-width="3" marker-end="url(#arrow-blue)" />
    </g>

    <!-- 描述工程提示框 (Description Engineering Callout) -->
    <g transform="translate(100, 380)">
      <rect width="240" height="90" rx="6" fill="#FFFBEB" stroke="var(--c-risk-amber)" stroke-width="1" />
      <text x="15" y="25" class="text-sans text-bold" font-size="12" fill="var(--c-risk-amber)">💡 架构师注脚：描述工程</text>
      <text x="15" y="45" class="text-sans" font-size="11" fill="#4B5563">LLM 不会阅读工具的底层代码，</text>
      <text x="15" y="60" class="text-sans" font-size="11" fill="#4B5563">路由的唯一依据是工具 Schema</text>
      <text x="15" y="75" class="text-sans" font-size="11" fill="#4B5563">中的 <tspan class="text-mono text-bold" fill="var(--c-cloud-blue)">description</tspan> 字段映射。</text>
    </g>


    <!-- 5. 最终决策与指令分发 (Routing Dispatch / Output) -->
    <g transform="translate(340, 500)">
      <rect width="300" height="110" rx="8" fill="var(--c-bg-light-green)" stroke="var(--c-local-green)" stroke-width="2" />
      <text x="150" y="25" text-anchor="middle" class="text-sans text-bold" font-size="15" fill="var(--c-local-green)">生成最终决策指令 (Dispatch)</text>

      <!-- JSON Code Block -->
      <rect x="20" y="40" width="260" height="55" rx="4" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1" />
      <text x="30" y="60" class="text-mono text-bold" font-size="12" fill="var(--c-local-green)">{"name": "arxiv_academic_search",</text>
      <text x="30" y="75" class="text-mono" font-size="12" fill="#333333"> "args": {"query": "2025 AI 架构"}}</text>
    </g>

  </g>

  <!--
  ===========================================================================
       底部图例与注释块 (Legend & Key Block - 遵循 3.4 & 7.3)
  ===========================================================================
  -->
  <g id="legend" transform="translate(500, 815)">
    <!-- 统一的半透明背景容器 -->
    <rect x="-420" y="-16" width="840" height="32" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-400, 0)">
      <text x="0" y="4" class="text-sans text-bold" font-size="12" fill="var(--c-neutral-gray)">图例说明:</text>

      <!-- Connection 1: Success Match -->
      <g transform="translate(80, 0)">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-local-green)" stroke-width="3" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">高概率精准匹配 (场景化约束)</text>
      </g>

      <!-- Connection 2: Risk / Vague Match -->
      <g transform="translate(290, 0)">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="4 2" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">低概率模糊匹配 (易产生幻觉)</text>
      </g>

      <!-- Connection 3: Danger / Rejection -->
      <g transform="translate(500, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#FEE2E2" stroke="var(--c-danger-red)" stroke-width="1"/>
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">负向约束/强排斥 (防止越权调用)</text>
      </g>
    </g>
  </g>

  <!--
  ===========================================================================
       底部许可注释规范 (Footer License - 遵循 7.4)
  ===========================================================================
  -->
  <text x="500" y="865" text-anchor="middle" class="text-sans" font-size="12" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research社区
  </text>

</svg>
