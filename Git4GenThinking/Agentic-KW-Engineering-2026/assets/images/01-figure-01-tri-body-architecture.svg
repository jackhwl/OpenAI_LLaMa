<svg viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg">
<!--
================================================================================
图表名称：智能体工坊“三体架构”示意图（三角形布局版）
文件命名：01-figure-01-tri-body-architecture.svg
用途：展示云端大脑、本地身体与神经接口的三角形协作关系
版本：v1.1.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-01-31
修改日期：2026-02-20（版本1.1.0，添加示意图背景为白色的语义）
================================================================================
  -->
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        --c-cloud-blue: #0052CC;
        --c-local-green: #00875A;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-local-green-light: #E3FCEF;
        --c-cloud-blue-light: #DEEBFF;
        --font-sans: "Noto Sans SC", "Noto Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      text { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); font-size: 12px; }
      .text-title { font-family: var(--font-sans); font-weight: bold; }

      /* 容器边界样式 */
      .boundary-cloud { stroke: var(--c-cloud-blue); stroke-dasharray: 6 4; fill: var(--c-cloud-blue-light); fill-opacity: 0.1; stroke-width: 1.5; }
      .boundary-local { stroke: var(--c-local-green); fill: var(--c-local-green-light); fill-opacity: 0.1; stroke-width: 1.5; }

      /* 节点样式 */
      .node-brain { fill: #fff; stroke: var(--c-cloud-blue); stroke-width: 2.5; }
      .node-body { fill: #fff; stroke: var(--c-local-green); stroke-width: 2.5; }
      .node-interface { fill: #fff; stroke: var(--c-risk-amber); stroke-width: 2.5; }

      /* 连线样式 */
      .connector-async { stroke: var(--c-cloud-blue); stroke-dasharray: 4 2; stroke-width: 2; fill: none; }
      .connector-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }
      .connector-neutral { stroke: var(--c-neutral-gray); stroke-width: 1.5; stroke-dasharray: 2 2; fill: none; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
  </defs>

  <!-- 1. 标题块  -->
  <g id="title-block" transform="translate(400, 40)">
    <text y="20" text-anchor="middle" class="text-title" font-size="24" fill="black">智能体工坊：三体架构</text>
    <text y="45" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">第一天 > 基础理论</text>
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. 图形主体 -->
  <g id="diagram-content" transform="translate(0, 140)">

    <!-- 云端区域 (顶部) -->
    <g id="cloud-region">
      <rect x="250" y="0" width="300" height="180" rx="12" class="boundary-cloud" />
      <text x="400" y="25" text-anchor="middle" class="text-title" fill="var(--c-cloud-blue)" font-size="12">云端算力 (Remote Reasoning)</text>

      <!-- 顶点：云端大脑 -->
      <g transform="translate(400, 100)">
        <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22" class="node-brain" />
        <text y="0" text-anchor="middle" font-weight="bold" font-size="14">云端大脑</text>
        <text y="18" text-anchor="middle" class="text-mono" font-size="9" fill="var(--c-neutral-gray)">LLM Core</text>
      </g>
    </g>

    <!-- 本地环境区域 (底部) -->
    <g id="local-region">
      <rect x="50" y="240" width="700" height="260" rx="12" class="boundary-local" />
      <text x="400" y="480" text-anchor="middle" class="text-title" fill="var(--c-local-green)" font-size="12">本地私有环境 (Local Body Platform)</text>

      <!-- 左底点：本地身体 (Obsidian) -->
      <g transform="translate(200, 360)">
        <rect x="-70" y="-45" width="140" height="90" rx="8" class="node-body" />
        <text y="-5" text-anchor="middle" font-weight="bold" font-size="14">本地身体</text>
        <text y="15" text-anchor="middle" class="text-mono" font-size="10" fill="var(--c-neutral-gray)">Obsidian Vault</text>
        <text y="30" text-anchor="middle" font-size="9" fill="var(--c-local-green)">存储、记忆、隐私</text>
      </g>

      <!-- 右底点：神经接口 (Text Generator) -->
      <g transform="translate(600, 360)">
        <rect x="-70" y="-45" width="140" height="90" rx="20" class="node-interface" />
        <text y="-5" text-anchor="middle" font-weight="bold" font-size="14">神经接口</text>
        <text y="15" text-anchor="middle" class="text-mono" font-size="10" fill="var(--c-neutral-gray)">Plugin Layer</text>
        <text y="30" text-anchor="middle" font-size="9" fill="var(--c-risk-amber)">协议转换、数据注入</text>
      </g>

      <!-- 底边连接：身体 <-> 接口 (同步) -->
      <path d="M 270,360 L 530,360" class="connector-sync" marker-end="url(#arrow-green)" />
      <text x="400" y="350" text-anchor="middle" font-size="10" fill="var(--c-local-green)">内部读取/写入</text>
    </g>

    <!-- 斜边连接：三角形的另外两条边 -->

    <!-- 接口 -> 大脑 (请求边) -->
    <path d="M 600,315 C 600,250 500,160 450,130" class="connector-async" marker-end="url(#arrow-blue)" />
    <text x="500" y="200" text-anchor="start" class="text-mono" font-size="10" fill="var(--c-cloud-blue)">1. 提示词</text>

    <!-- 大脑 -> 接口 (反馈边) -->
    <path d="M 420,150 C 480,200 550,250 550,315" class="connector-async" marker-end="url(#arrow-blue)" />
    <text x="440" y="230" text-anchor="start" class="text-mono" font-size="10" fill="var(--c-cloud-blue)">2. 推理回传</text>

    <!-- 身体 -> 大脑 (逻辑边 - 虚线表示间接关系) -->
    <path d="M 200,315 L 360,140" class="connector-neutral" />
    <text x="240" y="210" text-anchor="end" font-size="10" fill="var(--c-neutral-gray)">提供上下文 (Context)</text>

  </g>

  <!-- 3. 图例 -->
  <g id="legend-block" transform="translate(40, 650)">
    <rect x="0" y="0" width="720" height="50" rx="4" fill="rgba(255,255,255,0.9)" stroke="#E2E8F0" stroke-width="0.5"/>
    <g transform="translate(15, 10)">
      <text x="0" y="25" class="text-title" font-size="10" fill="#64748B">图例说明</text>
      <g transform="translate(100, 10)">
        <g transform="translate(0, 5)">
          <polygon points="5,0 10,3 10,8 5,11 0,8 0,3" fill="var(--c-cloud-blue)" />
          <text x="18" y="8" font-size="10" fill="#334155">云端大脑</text>
        </g>
        <g transform="translate(130, 5)">
          <rect width="10" height="10" rx="2" fill="var(--c-local-green)" />
          <text x="18" y="8" font-size="10" fill="#334155">本地身体</text>
        </g>
        <g transform="translate(260, 5)">
          <rect width="10" height="10" rx="4" fill="var(--c-risk-amber)" />
          <text x="18" y="8" font-size="10" fill="#334155">神经接口</text>
        </g>
        <g transform="translate(390, 5)">
          <line x1="0" y1="5" x2="15" y2="5" class="connector-async" />
          <text x="22" y="8" font-size="10" fill="#334155">异步网络</text>
        </g>
        <g transform="translate(520, 5)">
          <line x1="0" y1="5" x2="15" y2="5" class="connector-sync" />
          <text x="22" y="8" font-size="10" fill="#334155">同步内存</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 4. 底部许可注释 -->
  <text x="400" y="730" text-anchor="middle" font-size="10" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
