<!--
================================================================================
图表名称：强制输出：Schema 契约流程 (FIG-03-02)
文件命名：03-figure-03-structured-output-ex0.svg
用途：展示 Markdown 内容与 JSON Schema 契约如何共同驱动 LLM 产生结构化结果
版本：v1.1.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-02-01
================================================================================
-->
<svg width="900" height="650" viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <style>
      :root {
        /* 语义色系统 [规范 2] */
        --c-cloud-blue: #2472c8;
        --c-local-green: #0d9d57;
        --c-risk-amber: #d97706;
        --c-neutral-gray: #5f6368;
        --c-bg-code: #f1f3f4;

        /* 字体规范 [规范 3.2] */
        --font-sans: "Noto Sans", "Noto Sans SC", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      text { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); }

      /* 架构组件样式 [规范 4] */
      .region-container { fill: none; stroke-width: 2; stroke-dasharray: 8 4; }
      .node-card { fill: #fff; stroke-width: 1.5; stroke: var(--c-local-green); }
      .node-brain { fill: #fff; stroke: var(--c-cloud-blue); stroke-width: 2.5; }

      /* 连接线 [规范 3.1] */
      .line-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }
      .line-async { stroke-width: 2; stroke-dasharray: 4 2; fill: none; }

      .label-region { font-family: var(--font-mono); font-weight: bold; font-size: 12px; text-transform: uppercase; }
      .label-meta { font-size: 11px; fill: var(--c-neutral-gray); }
      .code-text { font-family: var(--font-mono); font-size: 10px; fill: #1a1a1a; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
  </defs>

  <!-- 1. 标题块规范 [规范 3.3] -->
  <g id="title-block" transform="translate(450, 40)">
    <text y="30" text-anchor="middle" font-weight="bold" font-size="24" fill="black">从 Markdown 到 JSON：非结构化文本的清洗与重构</text>
    <text y="55" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">第三天 > 实战演练</text>
    <line x1="-30" y1="70" x2="30" y2="70" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. 架构主体 -->
  <g id="diagram-content" transform="translate(0, 140)">

    <!-- A. 本地环境 (Obsidian) -->
    <g id="local-region">
      <rect x="40" y="0" width="380" height="380" rx="12" class="region-container" stroke="var(--c-local-green)" />
      <text x="55" y="25" class="label-region" fill="var(--c-local-green)">本地环境 (Obsidian)</text>

      <!-- 卡片 1: Markdown 笔记 -->
      <g transform="translate(80, 50)">
        <rect x="0" y="0" width="180" height="70" rx="4" class="node-card" fill="var(--c-bg-code)" />
        <text x="10" y="20" font-weight="bold" font-size="12">Markdown 笔记 (内容)</text>
        <text x="10" y="45" class="code-text" opacity="0.7">"我叫韩梅梅，今年28岁，</text>
        <text x="10" y="58" class="code-text" opacity="0.7">目前在上海..."</text>
      </g>

      <!-- 卡片 2: JSON Schema -->
      <g transform="translate(80, 145)">
        <rect x="0" y="0" width="180" height="70" rx="4" class="node-card" />
        <text x="10" y="20" font-weight="bold" font-size="12">JSON Schema (契约)</text>
        <text x="10" y="45" class="code-text">{"type": "object",</text>
        <text x="10" y="58" class="code-text"> "required": ["age"]}</text>
      </g>

      <!-- 汇聚点 -->
      <circle cx="340" cy="135" r="4" fill="var(--c-local-green)" />
      <path d="M 260,85 C 310,85 310,135 340,135" class="line-sync" />
      <path d="M 260,180 C 310,180 310,135 340,135" class="line-sync" />

      <!-- 卡片 3: Frontmatter 结果 -->
      <g transform="translate(80, 270)">
        <rect x="0" y="0" width="180" height="70" rx="4" class="node-card" fill="rgba(13, 157, 87, 0.05)" />
        <text x="10" y="20" font-weight="bold" font-size="12">Frontmatter 属性 (结果)</text>
        <text x="10" y="48" class="code-text" fill="var(--c-local-green)" font-weight="bold">age: 28</text>
        <text x="10" y="60" class="code-text" fill="var(--c-local-green)" opacity="0.6">status: verified</text>
      </g>
    </g>

    <!-- B. 云端区域 (Brain) -->
    <g id="cloud-region">
      <rect x="580" y="0" width="280" height="380" rx="12" class="region-container" stroke="var(--c-cloud-blue)" />
      <text x="595" y="25" class="label-region" fill="var(--c-cloud-blue)">云端算力 (Model API)</text>

      <!-- Brain Node: DeepSeek-V3 (Hexagon) -->
      <g transform="translate(720, 160)">
        <polygon points="60,0 30,52 -30,52 -60,0 -30,-52 30,-52" class="node-brain" />
        <text y="5" text-anchor="middle" font-weight="bold" font-size="13">DeepSeek-V3</text>
        <text y="22" text-anchor="middle" class="text-mono label-meta">云端大脑</text>
      </g>
    </g>

    <!-- C. 网络交互 (异步) -->
    <!-- 请求线：绿色 -->
    <path d="M 345,135 L 660,135" class="line-async" stroke="var(--c-local-green)" marker-end="url(#arrow-green)" />
    <text x="500" y="125" text-anchor="middle" font-size="11" fill="var(--c-local-green)" font-weight="bold">S.C.O.R.E. 提示词 (带契约)</text>

    <!-- 响应线：保持琥珀色代表数据回流的延迟 -->
    <path d="M 660,200 C 500,200 450,305 260,305" class="line-async" stroke="var(--c-risk-amber)" marker-end="url(#arrow-amber)" />
    <text x="500" y="255" text-anchor="middle" font-size="11" fill="var(--c-risk-amber)" font-weight="bold">结构化 JSON (低熵)</text>
  </g>

  <!-- 3. 图例说明 (底部水平布局) [规范 3.4] -->
  <g id="legend-block" transform="translate(450, 560)">
    <rect x="-240" y="0" width="480" height="40" rx="20" fill="rgba(255,255,255,0.9)" stroke="#E2E8F0" stroke-width="0.5"/>
    <g transform="translate(-215, 25)">
      <text x="0" y="0" font-weight="bold" font-size="10" fill="#64748B">图例说明</text>

      <!-- 本地环境 -->
      <g transform="translate(60, -10)">
        <rect x="0" y="0" width="10" height="10" rx="2" fill="var(--c-local-green)" />
        <text x="18" y="9" font-size="10" fill="#334155">本地环境</text>
      </g>

      <!-- 云端大脑 -->
      <g transform="translate(160, -10)">
        <path d="M5,0 L10,3 L10,8 L5,11 L0,8 L0,3 Z" fill="var(--c-cloud-blue)" />
        <text x="18" y="9" font-size="10" fill="#334155">云端大脑</text>
      </g>

      <!-- 网络延迟 -->
      <g transform="translate(260, -10)">
        <line x1="0" y1="5" x2="12" y2="5" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="2 2"/>
        <text x="18" y="9" font-size="10" fill="#334155">反馈输出</text>
      </g>
    </g>
  </g>

  <!-- 4. 底部许可声明 [规范 7.3] -->
  <g id="footer" transform="translate(450, 620)">
    <text text-anchor="middle" font-size="11" fill="var(--c-neutral-gray)">
      本作品采用 CC BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
    </text>
  </g>
</svg>
