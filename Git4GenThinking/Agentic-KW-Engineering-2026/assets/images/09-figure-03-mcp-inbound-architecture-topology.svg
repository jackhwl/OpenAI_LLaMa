<!--
================================================================================
图表名称：MCP Inbound 模式架构拓扑图 (中文版)
文件命名：09-figure-03-mcp-inbound-0.svg
用途：展示外部 AI 客户端如何通过 MCP 协议读取本地 Obsidian 数据
版本：v1.0.0
作者：Gitconomy Research-郭晧
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-02-09
================================================================================
-->

<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <!-- 引入字体：优先使用 Noto Sans SC 显示中文 -->
    <style>
      :root {
        /* 语义色定义 - 遵循指南 2.0 */
        --c-cloud-blue: #0052CC;
        --c-cloud-bg: #F0F7FF;
        --c-local-green: #00875A;
        --c-local-bg: #F0FFF4;
        --c-risk-amber: #FF991F;
        --c-neutral-gray: #64748B;
        --c-text-dark: #1E293B;
      }

      /* 文本样式 - 遵循指南 3.2 */
      text {
        font-family: "Noto Sans SC", "Noto Sans", sans-serif;
      }

      .font-sans { font-family: "Noto Sans SC", "Noto Sans", sans-serif; }
      .font-mono { font-family: "JetBrains Mono", monospace; }

      .text-title { font-weight: 700; font-size: 24px; fill: var(--c-text-dark); }
      .text-subtitle { font-size: 14px; fill: var(--c-neutral-gray); }
      .text-label-bold { font-weight: 700; font-size: 14px; fill: var(--c-text-dark); }
      .text-label { font-size: 12px; fill: var(--c-neutral-gray); }
      .text-code { font-size: 11px; fill: var(--c-local-green); }
      .text-white { fill: #FFFFFF; font-weight: 500; }

      /* 容器与节点样式 - 遵循指南 3.1 */
      /* 云端容器：虚线 + 蓝色 */
      .region-cloud { fill: var(--c-cloud-bg); stroke: var(--c-cloud-blue); stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
      /* 本地容器：实线 + 绿色 */
      .region-local { fill: #FFFFFF; stroke: var(--c-local-green); stroke-width: 2; rx: 12; }

      /* 节点形状 Token */
      .node-brain { fill: var(--c-cloud-blue); } /* 六边形 */
      .node-tool { fill: #FFFFFF; stroke: var(--c-local-green); stroke-width: 2; rx: 8; } /* 圆角矩形 */
      .node-app { fill: #FFFFFF; stroke: var(--c-cloud-blue); stroke-width: 2; rx: 8; } /* 客户端特殊标记 */
      .node-store { fill: #F1F5F9; stroke: var(--c-neutral-gray); stroke-width: 2; } /* 圆柱体 */

      /* 连接线样式 - 遵循指南 3.1 */
      .conn-async { stroke: var(--c-risk-amber); stroke-width: 2; stroke-dasharray: 4 4; fill: none; animation: flow-async 2s linear infinite; }
      .conn-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }
      .conn-label-bg { fill: #FFFFFF; opacity: 0.95; }

      @keyframes flow-async {
        from { stroke-dashoffset: 8; }
        to { stroke-dashoffset: 0; }
      }
    </style>

    <!-- 箭头标记定义 -->
    <marker id="arrow-sync" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-async" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--c-risk-amber)" />
    </marker>
    <marker id="arrow-sync-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="var(--c-local-green)" />
    </marker>
  </defs>

  <!--
  ===========================================================================
       1. Title Block (Header) - 遵循指南 3.3
  ===========================================================================
  -->
  <g transform="translate(400, 50)">
    <!-- Main Title -->
    <text y="15" text-anchor="middle" class="font-sans text-title">MCP Inbound 架构拓扑图</text>
    <!-- Breadcrumbs -->
    <text y="40" text-anchor="middle" class="font-mono text-subtitle">第九天 > 基础理论</text>
    <!-- Context Indicator: Green for Local/Inbound focus -->
    <line x1="-40" y1="55" x2="40" y2="55" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!--
  ===========================================================================
       2. Cloud Region (云端大脑)
  ===========================================================================
  -->
  <g transform="translate(100, 130)">
    <!-- Container -->
    <rect x="0" y="0" width="600" height="110" class="region-cloud" />
    <text x="20" y="25" class="font-mono" font-size="11" fill="var(--c-cloud-blue)" font-weight="bold">CLOUD REGION (云端算力)</text>

    <!-- Brain Node (Hexagon) -->
    <g transform="translate(300, 60)">
      <!-- 六边形路径 -->
      <path d="M-35,-20 L0,-40 L35,-20 L35,20 L0,40 L-35,20 Z" class="node-brain" />
      <text x="0" y="5" text-anchor="middle" class="font-sans text-white" font-size="14" font-weight="bold">LLM</text>

      <!-- Labels -->
      <text x="0" y="65" text-anchor="middle" class="font-sans text-label-bold" fill="var(--c-cloud-blue)">远程推理核心</text>
      <text x="100" y="0" text-anchor="middle" class="font-sans text-label">DeepSeek V3</text>
    </g>
  </g>

  <!--
  ===========================================================================
       3. Local Host Region (本地宿主)
  ===========================================================================
  -->
  <g transform="translate(50, 270)">
    <!-- Container -->
    <rect x="0" y="0" width="700" height="240" class="region-local" />
    <text x="20" y="30" class="font-sans text-label-bold" font-size="14" fill="var(--c-local-green)">LOCAL HOST (本地环境)</text>

    <!--
       3.1 Client App (AI 客户端) - Left
       角色：外交官/网关
    -->
    <g transform="translate(60, 70)">
      <rect x="0" y="0" width="160" height="100" class="node-app" />
      <!-- Icon representation -->
      <text x="80" y="30" text-anchor="middle" class="font-sans text-label-bold">AI 客户端</text>
      <text x="80" y="48" text-anchor="middle" class="font-sans text-label">(Claude Desktop / Cursor)</text>

      <!-- Badge -->
      <rect x="40" y="65" width="80" height="20" rx="4" fill="#F1F5F9" />
      <text x="80" y="79" text-anchor="middle" class="font-mono" font-size="10" fill="#64748B">MCP Client</text>
    </g>

    <!--
       3.2 MCP Server (服务端/适配器) - Center
       角色：翻译官
    -->
    <g transform="translate(290, 70)">
      <rect x="0" y="0" width="140" height="100" class="node-tool" />
      <text x="70" y="30" text-anchor="middle" class="font-sans text-label-bold">MCP 服务端</text>
      <text x="70" y="48" text-anchor="middle" class="font-sans text-label">Node.js 进程</text>

      <!-- Package Name -->
      <text x="70" y="75" text-anchor="middle" class="font-mono" font-size="10" fill="#047857">@mcp-obsidian</text>
    </g>

    <!--
       3.3 Storage (数据存储) - Right
       角色：海马体
    -->
    <g transform="translate(500, 65)">
      <!-- Cylinder Shape -->
      <path d="M0,20 Q40,0 80,20 L80,100 Q40,120 0,100 Z" class="node-store" />
      <ellipse cx="40" cy="20" rx="40" ry="10" fill="#E2E8F0" stroke="var(--c-neutral-gray)" stroke-width="2"/>

      <text x="40" y="65" text-anchor="middle" class="font-sans text-label-bold">Obsidian</text>
      <text x="40" y="85" text-anchor="middle" class="font-sans text-label">Vault (Markdown)</text>
    </g>

    <!--
       3.4 Local Connections (同步管道)
    -->
    <!-- Client <-> Server (JSON-RPC) -->
    <line x1="220" y1="120" x2="290" y2="120" class="conn-sync" marker-end="url(#arrow-sync)" marker-start="url(#arrow-sync-start)"/>
    <g transform="translate(255, 110)">
      <text x="0" y="3" text-anchor="middle" class="font-mono text-code">JSON-RPC</text>
    </g>
    <text x="255" y="140" text-anchor="middle" class="font-mono" font-size="10" fill="var(--c-neutral-gray)">stdio 标准输入输出</text>

    <!-- Server <-> Storage (File Read) -->
    <line x1="430" y1="120" x2="500" y2="120" class="conn-sync" marker-end="url(#arrow-sync)"/>
    <g transform="translate(465, 110)">
       <text x="0" y="3" text-anchor="middle" class="font-mono text-code">fs.read()</text>
    </g>

  </g>

  <!--
  ===========================================================================
       4. Cross-Boundary Connections (网络连接)
  ===========================================================================
  -->
  <!-- Connection: Cloud to Client -->
  <path d="M400,210 L400,305 L220,305 L220,340" class="conn-async" stroke-linejoin="round" marker-end="url(#arrow-async)" />

  <!-- Label Badge on Wire -->
  <g transform="translate(360, 245)">
    <rect x="-150" y="-12" width="140" height="24" rx="12" fill="#FFF7ED" stroke="var(--c-risk-amber)" stroke-width="1"/>
    <text x="-80" y="4" text-anchor="middle" class="font-mono" font-size="11" fill="#B45309">HTTPS / SSE (Delay)</text>
  </g>

  <!--
  ===========================================================================
       5. Legend Block (Bottom Horizontal) - 底部水平图例
  ===========================================================================
  -->
  <g transform="translate(100, 520)">
    <!-- Background -->
    <rect x="0" y="0" width="600" height="40" rx="20" fill="white" stroke="#E2E8F0" stroke-width="1"/>

    <g transform="translate(30, 20)">
      <text x="0" y="4" class="font-sans" font-weight="bold" font-size="11" fill="#64748B">图例 (LEGEND):</text>

      <!-- Item 1: Cloud -->
      <g transform="translate(100, 0)">
        <path d="M-6,0 L0,-4 L6,0 L6,6 L0,10 L-6,6 Z" fill="var(--c-cloud-blue)" transform="translate(0, -3) scale(0.8)"/>
        <text x="15" y="4" class="font-sans text-label">云端/推理 (Brain)</text>
      </g>

      <!-- Item 2: Local -->
      <g transform="translate(230, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="white" stroke="var(--c-local-green)" stroke-width="2"/>
        <text x="15" y="4" class="font-sans text-label">本地/执行 (Body)</text>
      </g>

      <!-- Item 3: Network -->
      <g transform="translate(350, 0)">
        <line x1="-10" y1="0" x2="10" y2="0" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="3 2"/>
        <text x="20" y="4" class="font-sans text-label">网络延迟 (Async)</text>
      </g>

       <!-- Item 4: Sync -->
      <g transform="translate(470, 0)">
        <line x1="-10" y1="0" x2="10" y2="0" stroke="var(--c-local-green)" stroke-width="2"/>
        <text x="20" y="4" class="font-sans text-label">本地直连 (Sync)</text>
      </g>
    </g>
  </g>

  <!--
  ===========================================================================
       6. Footer (License)
  ===========================================================================
  -->
  <text x="400" y="585" text-anchor="middle" class="font-mono" font-size="10" fill="#94A3B8">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
  </text>

</svg>
