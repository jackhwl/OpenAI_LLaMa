<!--
================================================================================
图表名称：实战演练：风格克隆工作流 (FIG-04-03)
文件命名：04-figure-02-lab-workflow.svg
用途：展示从本地数据准备到云端风格克隆的完整实验路径，强调推理过程
版本：v1.4.0 (云端在上/本地在下/肘型连线)
作者：Gitconomy 系统架构师
SPDX-License-Identifier: MIT & CC-BY-SA-4.0
创建日期：2026-02-02
================================================================================
-->
<svg width="900" height="1020" viewBox="0 0 900 1020" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <defs>
    <style>
      :root {
        /* 语义色系统 */
        --c-cloud-blue: #2472c8;
        --c-local-green: #0d9d57;
        --c-risk-amber: #d97706;
        --c-neutral-gray: #5f6368;
        --c-bg-code: #f8f9fa;

        /* 字体规范 */
        --font-sans: "Noto Sans SC", "Inter", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", "Fira Code", monospace;
      }

      text { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); font-size: 11px; }

      /* 架构组件样式 */
      .region-container { fill: none; stroke-width: 2; }
      .node-body { fill: #fff; stroke: var(--c-local-green); stroke-width: 2; rx: 6; }
      .node-meta { fill: #fff; stroke: var(--c-neutral-gray); stroke-width: 2; rx: 6; }
      .node-brain { fill: #fff; stroke: var(--c-cloud-blue); stroke-width: 2.5; }

      /* 连接线 */
      .line-sync { stroke: var(--c-local-green); stroke-width: 2; fill: none; }
      .line-async { stroke: var(--c-risk-amber); stroke-width: 2; stroke-dasharray: 4 2; fill: none; }

      .label-region { font-family: var(--font-mono); font-weight: bold; font-size: 12px; text-transform: uppercase; }
      .label-step { font-weight: bold; font-size: 15px; fill: #1a1a1a; }
      .label-body { font-size: 12px; fill: var(--c-neutral-gray); }

      /* 推理动态效果 */
      .inference-dot { fill: var(--c-cloud-blue); }
      .latent-cloud { fill: var(--c-cloud-blue); opacity: 0.05; }
    </style>

    <!-- 箭头定义 -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
  </defs>

  <!-- 1. 标题块规范 -->
  <g id="title-block" transform="translate(450, 40)">
    <text y="20" text-anchor="middle" font-weight="bold" font-size="26" fill="black">从说明书到种草文：基于少样本的风格注入实验</text>
    <text y="45" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">第四天 > 实验演练</text>
    <line x1="-30" y1="65" x2="30" y2="65" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 2. 图形主体 -->
  <g id="diagram-content" transform="translate(0, 160)">

    <!-- B. 云端环境 (Top)  -->
    <g id="cloud-region">
      <rect x="250" y="0" width="400" height="280" rx="12" class="region-container" stroke="var(--c-cloud-blue)" stroke-dasharray="8 4" />
      <text x="265" y="25" class="label-region" fill="var(--c-cloud-blue)">远程 (LLM)</text>

      <!-- Brain Node (Hexagon) -->
      <g transform="translate(450, 140)">
        <polygon points="80,0 40,69.2 -40,69.2 -80,0 -40,-69.2 40,-69.2" class="node-brain" />
        <text y="5" text-anchor="middle" font-weight="bold" font-size="14">DeepSeek-V3</text>
        <text y="22" text-anchor="middle" class="text-mono" fill="var(--c-neutral-gray)">Reasoning Engine</text>

        <!-- 推理动态细节 -->
        <g id="inference-visual">
          <circle r="45" class="latent-cloud" />
          <circle cx="-30" cy="-10" r="3" class="inference-dot" />
          <circle cx="30" cy="20" r="3" class="inference-dot" />
          <circle cx="0" cy="-30" r="3" class="inference-dot" />
          <path d="M -20,20 Q 0,0 20,-10" fill="none" stroke="var(--c-cloud-blue)" stroke-width="1.5" stroke-dasharray="2" />
          <text y="55" text-anchor="middle" font-size="10" fill="var(--c-cloud-blue)" font-weight="bold">In-Context Anchoring</text>
        </g>
      </g>

      <text x="450" y="260" text-anchor="middle" class="label-body" fill="var(--c-cloud-blue)" font-weight="bold">云端少样本推理 (ICL)</text>
    </g>

    <!-- A. 本地环境 (Bottom) -->
    <g id="local-region" transform="translate(0, 420)">
      <rect x="40" y="0" width="820" height="320" rx="12" class="region-container" stroke="var(--c-local-green)" />
      <text x="55" y="25" class="label-region" fill="var(--c-local-green)">本地 (Obsidian)</text>

      <!-- Step 1: 准备原料 -->
      <g transform="translate(80, 60)">
        <rect width="200" height="90" class="node-meta" fill="var(--c-bg-code)" />
        <text x="15" y="25" class="label-step">1. 准备原始素材</text>
        <text x="15" y="50" class="label-body">输入高熵说明书内容</text>
        <text x="15" y="68" class="label-body" font-style="italic">"产品安装需注意..."</text>
      </g>

      <!-- Step 2: 提取风格锚点 -->
      <g transform="translate(80, 200)">
        <rect x="6" y="-6" width="200" height="90" class="node-body" opacity="0.3" />
        <rect x="3" y="-3" width="200" height="90" class="node-body" opacity="0.6" />
        <rect width="200" height="90" class="node-body" />
        <text x="15" y="25" class="label-step">2. 锁定风格锚点</text>
        <text x="15" y="50" class="label-body">准备 3 个风格示例</text>
        <text x="15" y="68" class="label-body" fill="var(--c-local-green)" font-weight="bold">✨ 情绪化/Emoji/口语化</text>
      </g>

      <!-- Step 3: S.C.O.R.E. 封装层 -->
      <g transform="translate(360, 60)">
        <rect width="240" height="230" rx="8" fill="rgba(13, 157, 87, 0.03)" stroke="var(--c-local-green)" stroke-width="1.5" stroke-dasharray="4 4" />
        <text x="120" y="30" text-anchor="middle" class="label-step" fill="var(--c-local-green)">3. 提示词组装 (SCORE)</text>

        <g transform="translate(20, 60)">
          <text y="0" class="text-mono" fill="#333">[S] 设定：资深种草博主</text>
          <text y="25" class="text-mono" fill="#333">[C] 背景：上述说明书原文</text>
          <text y="50" class="text-mono" fill="#333">[O] 目标：改写为吸引人的贴文</text>
          <text y="75" class="text-mono" fill="#333">[R] 要求：模仿下方风格样本</text>
          <text y="100" class="text-mono" fill="#333">[E] 样本：{Example 1,2,3}</text>
        </g>
        <text x="120" y="210" text-anchor="middle" class="label-body" font-weight="bold">构造“逻辑模具”</text>
      </g>

      <!-- 本地流向 -->
      <path d="M 280,105 L 360,105" class="line-sync" marker-end="url(#arrow-green)" />
      <path d="M 280,245 L 320,245 L 320,180 L 360,180" class="line-sync" marker-end="url(#arrow-green)" />

      <!-- Step 4: 结果验收 -->
      <g transform="translate(640, 140)">
        <rect width="200" height="150" class="node-body" fill="rgba(13, 157, 87, 0.05)" />
        <text x="15" y="25" class="label-step">4. 风格化输出</text>
        <text x="15" y="55" class="label-body" fill="var(--c-local-green)" font-weight="bold">✨ 绝绝子！这款好物</text>
        <text x="15" y="75" class="label-body" fill="var(--c-local-green)" font-weight="bold">谁还没用上我不依！🚀</text>
        <line x1="15" y1="100" x2="185" y2="100" stroke="#eef0f2" stroke-width="1" />
        <text x="100" y="130" text-anchor="middle" class="label-body" font-weight="bold">低熵资产 / 验收通过</text>
      </g>
    </g>

    <!-- C. 网络流转 (Flipped) -->

    <!-- 发送请求 -->
    <path d="M 450,480 L 450,290" class="line-async" stroke="var(--c-risk-amber)" marker-end="url(#arrow-amber)" />
    <text x="450" y="390" font-size="11" font-weight="bold" text-anchor="middle" fill="#d97706">网络请求 </text>
    <text x="450" y="405" font-size="11" font-weight="bold" text-anchor="middle" fill="#d97706">(带有 Schema 契约的提示词)</text>

    <!-- 返回响应 -->
    <path d="M 520,280 L 520,340 L 740,340 L 740,555" class="line-async" stroke="var(--c-risk-amber)" marker-end="url(#arrow-amber)" />
    <text x="630" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">
       返回风格化响应 (Response)
    </text>

  </g>

  <!-- 3. 图例规范 -->
  <g id="legend-block" transform="translate(450, 920)">
    <rect x="-320" y="0" width="640" height="45" rx="22.5" fill="rgba(255, 255, 255, 0.9)" stroke="#E2E8F0" stroke-width="0.5"/>
    <g transform="translate(-290, 28)">
      <text x="0" y="0" font-weight="bold" font-size="11" fill="#64748B">图例说明</text>

      <g transform="translate(80, -10)">
        <rect width="12" height="12" rx="2" fill="var(--c-local-green)" />
        <text x="20" y="10" class="text-mono" font-size="10" fill="#334155">Obsidian执行</text>
      </g>

      <g transform="translate(230, -10)">
        <path d="M6,0 L12,3.5 L12,10.5 L6,14 L0,10.5 L0,3.5 Z" fill="var(--c-cloud-blue)" opacity="0.3" stroke="var(--c-cloud-blue)" stroke-width="1"/>
        <text x="20" y="10" class="text-mono" font-size="10" fill="#334155">远程LLM逻辑推理</text>
      </g>

      <g transform="translate(410, -10)">
        <line x1="0" y1="6" x2="15" y2="6" class="line-async" stroke="var(--c-risk-amber)"/>
        <text x="22" y="10" class="text-mono" font-size="10" fill="#334155">网络延迟/结果反馈</text>
      </g>
    </g>
  </g>

  <!-- 4. 底部许可注释 -->
  <g id="footer" transform="translate(450, 1000)">
    <text text-anchor="middle" font-size="11" fill="var(--c-neutral-gray)">
      本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research 社区
    </text>
  </g>

</svg>
