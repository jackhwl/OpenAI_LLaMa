<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <!--
  ================================================================================
  图表名称：Outbound 主动调用 PEAR 闭环 (Outbound PEAR Loop)
  文件命名：10-figure-01-outbound-topology.svg
  用途：展示智能体工程第10天实战中，由决策大脑(Model)、神经中枢(Client)与行动中枢(Server)构成的控制流和数据流闭环。
  版本：v1.0.0
  作者：Gitconomy Research-郭晧
  SPDX-License-Identifier: MIT & CC-BY-SA-4.0
  创建日期：2026-02-21
  ================================================================================
  -->

  <!-- Background: Solid White (遵循规范 3.5.1) -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors 语义色系统 */
        --c-cloud-blue: #0066CC;   /* Brain Blue: 云端算力/逻辑推理 */
        --c-local-green: #00875A;  /* Body Green: 本地执行/隐私数据 */
        --c-risk-amber: #FF991F;   /* State Amber: 异步等待/熔断/人工风险 */
        --c-neutral-gray: #475569; /* Meta Gray: 存储/背景/辅助线 */

        /* 浅色背景辅助变量 */
        --c-bg-light-blue: #EBF3FA;
        --c-bg-light-green: #E6F3EE;
        --c-bg-light-amber: #FFF4E5;

        /* Font Stacks (遵循兼容性规范) */
        --font-sans: 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      }

      .text-sans { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); }
      .text-bold { font-weight: bold; }
    </style>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-risk-amber)" />
    </marker>
  </defs>

  <!--
  ===========================================================================
       标题块 (Title Block) - 严格遵循 3.3.4 SVG 实现范式
  ===========================================================================
  -->
  <g id="title-block" transform="translate(600, 40)">
    <!-- A. Figure ID -->
    <text y="-10" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)" letter-spacing="1">
      FIG-10.1
    </text>

    <!-- B. Main Title -->
    <text y="20" text-anchor="middle" class="text-sans text-bold" font-size="24" fill="#000000">
      Outbound 主动调用与 PEAR 闭环架构
    </text>

    <!-- C. Breadcrumbs -->
    <text y="45" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">
      Day 10 > Outbound Mode > Tool Call &amp; Handshake
    </text>

    <!-- D. Context Indicator -->
    <line x1="-30" y1="60" x2="30" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!--
  ===========================================================================
       架构主视图区 (Diagram Content - Safe Zone Starts at Y=140)
  ===========================================================================
  -->
  <g id="diagram-content" transform="translate(0, 140)">

    <!-- 1. 物理边界容器 (Container Boundaries) -->
    <!-- Local Body Boundary -->
    <rect x="80" y="20" width="600" height="480" rx="12" fill="none" stroke="var(--c-local-green)" stroke-width="2" stroke-dasharray="8 4" />
    <text x="100" y="45" class="text-sans text-bold" font-size="14" fill="var(--c-local-green)">
      Local Environment (本地物理设备 / No GPU)
    </text>

    <!-- Remote Brain Boundary -->
    <rect x="740" y="20" width="380" height="480" rx="12" fill="none" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="8 4" />
    <text x="760" y="45" class="text-sans text-bold" font-size="14" fill="var(--c-cloud-blue)">
      Public Internet (云端服务)
    </text>


    <!-- 2. 数据与指令流向连接线 (Data Flow Connections) -->

    <!-- Client -> Brain (Async API Request) -->
    <path d="M 380 140 C 550 140, 650 220, 830 220" fill="none" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-blue)" />

    <!-- Brain -> Client (Async JSON Response) -->
    <path d="M 830 280 C 650 280, 550 200, 380 200" fill="none" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-blue)" />

    <!-- Client -> Server (Manual Handshake - Amber Risk) -->
    <path d="M 270 240 L 270 340" fill="none" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-amber)" />

    <!-- Server -> Storage (Sync Write) -->
    <path d="M 400 390 L 490 390" fill="none" stroke="var(--c-local-green)" stroke-width="2" marker-end="url(#arrow-green)" />


    <!-- 3. 本地执行节点 (Local Nodes) -->

    <!-- Node: MCP Client (Obsidian) -->
    <g transform="translate(140, 100)">
      <rect width="240" height="140" rx="8" fill="var(--c-bg-light-green)" stroke="var(--c-local-green)" stroke-width="2" />
      <text x="120" y="25" text-anchor="middle" class="text-sans text-bold" font-size="16" fill="var(--c-local-green)">神经中枢 (MCP Client)</text>
      <text x="120" y="45" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">Obsidian + Text Generator</text>

      <rect x="15" y="60" width="210" height="65" rx="4" fill="#FFFFFF" stroke="var(--c-neutral-gray)" stroke-width="1" />
      <text x="25" y="80" class="text-mono" font-size="11" fill="#333333">1. 捕获意图 (Natural Language)</text>
      <text x="25" y="100" class="text-mono" font-size="11" fill="#333333">2. 加载 Schema: agent_tool_writer.md</text>
      <text x="25" y="115" class="text-mono" font-size="11" fill="#333333">3. 接收并展示 JSON</text>
    </g>

    <!-- Node: MCP Server (Python Script) -->
    <g transform="translate(140, 340)">
      <rect width="260" height="130" rx="8" fill="var(--c-bg-light-green)" stroke="var(--c-local-green)" stroke-width="2" />
      <text x="130" y="25" text-anchor="middle" class="text-sans text-bold" font-size="16" fill="var(--c-local-green)">行动中枢 (MCP Server)</text>
      <text x="130" y="45" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">Python: server_obsidian_io.py</text>

      <rect x="15" y="60" width="230" height="55" rx="4" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="1" />
      <text x="25" y="80" class="text-mono text-bold" font-size="12" fill="var(--c-risk-amber)">🛡️ 安全沙箱 (Sandbox)</text>
      <text x="25" y="100" class="text-mono" font-size="11" fill="#333333">if file not in ALLOWED_FILES: block()</text>
    </g>

    <!-- Node: Storage (Obsidian Vault) -->
    <g transform="translate(500, 330)">
      <!-- Cylinder Base Path -->
      <path d="M 0 30 L 0 110 A 70 15 0 0 0 140 110 L 140 30 Z" fill="#F1F5F9" stroke="var(--c-neutral-gray)" stroke-width="2"/>
      <!-- Cylinder Top Ellipse -->
      <ellipse cx="70" cy="30" rx="70" ry="15" fill="#E2E8F0" stroke="var(--c-neutral-gray)" stroke-width="2"/>

      <text x="70" y="70" text-anchor="middle" class="text-sans text-bold" font-size="14" fill="#333333">Obsidian Vault</text>
      <text x="70" y="90" text-anchor="middle" class="text-mono" font-size="13" fill="var(--c-local-green)">📄 Inbox.md</text>
    </g>


    <!-- 4. 云端算力节点 (Remote Nodes) -->

    <!-- Node: Remote Brain (Hexagon) -->
    <g transform="translate(930, 250)">
      <!-- Hexagon path for Brain -->
      <polygon points="0,-80 80,-35 80,55 0,100 -80,55 -80,-35" fill="var(--c-bg-light-blue)" stroke="var(--c-cloud-blue)" stroke-width="2" />

      <circle cx="0" cy="-45" r="16" fill="var(--c-cloud-blue)"/>
      <text x="0" y="-40" text-anchor="middle" class="text-sans text-bold" font-size="16" fill="#FFFFFF">🧠</text>

      <text x="0" y="-5" text-anchor="middle" class="text-sans text-bold" font-size="18" fill="var(--c-cloud-blue)">决策大脑</text>
      <text x="0" y="15" text-anchor="middle" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">DeepSeek / Qwen</text>
      <text x="0" y="45" text-anchor="middle" class="text-mono text-bold" font-size="12" fill="#333333">Role: 规划与翻译</text>
      <text x="0" y="65" text-anchor="middle" class="text-sans" font-size="12" fill="#333333">Prompt -> JSON-RPC</text>
    </g>


    <!-- 5. 数据与控制流文本标注 (Labels on Lines) -->

    <!-- Label 1: API Request -->
    <g transform="translate(560, 125)">
      <rect x="-10" y="-12" width="220" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
      <text x="0" y="4" class="text-mono text-bold" font-size="12" fill="var(--c-cloud-blue)">[1] 意图 + Schema (提示即协议)</text>
    </g>

    <!-- Label 2: API Response -->
    <g transform="translate(480, 275)">
      <rect x="-10" y="-30" width="280" height="46" rx="4" fill="#FFFFFF" fill-opacity="0.9" stroke="var(--c-cloud-blue)" stroke-width="0.5"/>
      <text x="0" y="-15" class="text-mono text-bold" font-size="12" fill="var(--c-cloud-blue)">[2] 输出标准机器指令 (Tool Call)</text>
      <text x="0" y="5" class="text-mono" font-size="11" fill="#333333">{"tool_name": "append_to_note", ...}</text>
    </g>

    <!-- Label 3: Manual Handshake -->
    <g transform="translate(285, 290)">
      <rect x="0" y="-20" width="180" height="40" rx="4" fill="var(--c-bg-light-amber)" stroke="var(--c-risk-amber)" stroke-width="1"/>
      <text x="10" y="-3" class="text-sans text-bold" font-size="12" fill="var(--c-risk-amber)">[3] 人工中继 (Handshake)</text>
      <text x="10" y="12" class="text-sans" font-size="11" fill="#333333">手动复制终端粘贴，触发工具</text>
    </g>
    <circle cx="270" cy="290" r="10" fill="var(--c-risk-amber)"/>
    <text x="270" y="294" text-anchor="middle" class="text-sans text-bold" font-size="12" fill="#FFFFFF">!</text>

    <!-- Label 4: Sync Execute -->
    <g transform="translate(405, 375)">
      <rect x="-5" y="-14" width="85" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.9" />
      <text x="0" y="0" class="text-mono text-bold" font-size="12" fill="var(--c-local-green)">[4] f.write()</text>
    </g>

  </g>

  <!--
  ===========================================================================
       底部图例与注释块 (Legend & Key Block - 遵循 3.4 & 7.3)
  ===========================================================================
  -->
  <g id="legend" transform="translate(600, 680)">
    <!-- 统一的半透明背景容器 -->
    <rect x="-420" y="-16" width="840" height="32" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-400, 0)">
      <text x="0" y="4" class="text-sans text-bold" font-size="12" fill="var(--c-neutral-gray)">图例说明:</text>

      <!-- Entity 1: Brain -->
      <g transform="translate(80, 0)">
        <polygon points="0,-6 6,-3 6,3 0,6 -6,3 -6,-3" fill="var(--c-cloud-blue)" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">Remote Brain (推理引擎)</text>
      </g>

      <!-- Entity 2: Tool -->
      <g transform="translate(260, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="var(--c-local-green)" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">Local Body (本地节点)</text>
      </g>

      <!-- Connection 1: Async/Network -->
      <g transform="translate(430, 0)">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-cloud-blue)" stroke-width="2" stroke-dasharray="4 2" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">Async I/O (网络调用)</text>
      </g>

      <!-- Connection 2: Amber Risk/Manual -->
      <g transform="translate(580, 0)">
        <line x1="-8" y1="0" x2="8" y2="0" stroke="var(--c-risk-amber)" stroke-width="2" stroke-dasharray="4 2" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">Latency / Manual (人工握手等待)</text>
      </g>
    </g>
  </g>

  <!--
  ===========================================================================
       底部许可注释规范 (Footer License - 遵循 7.4)
  ===========================================================================
  -->
  <text x="600" y="750" text-anchor="middle" class="text-sans" font-size="12" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research社区
  </text>

</svg>
