<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="100%" height="100%">
  <!--
  ================================================================================
  图表名称：MCP 工具与功能描述映射关系 (Description Engineering & Schema Mapping)
  文件命名：11-figure-03-mcp-prompt-description-engineering.svg
  用途：展示“代码即黑盒，描述即接口”的设计哲学，对比解释工具描述中的“排他性原则”与“场景化原则”对 LLM 路由决策的决定性影响。
  版本：v1.0.0
  作者：Gitconomy Research-郭晧
  SPDX-License-Identifier: MIT & CC-BY-SA-4.0
  创建日期：2026-02-21
  ================================================================================
  -->

  <!-- Background: Solid White -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <defs>
    <style>
      :root {
        /* Semantic Colors 语义色系统 */
        --c-cloud-blue: #0066CC;   /* Brain Blue: 云端算力/逻辑推理 */
        --c-local-green: #00875A;  /* Body Green: 最佳实践/精准匹配 */
        --c-risk-amber: #FF991F;   /* State Amber: 模糊描述/幻觉风险 */
        --c-danger-red: #DE350B;   /* Danger Red: 排他性边界/负向约束 */
        --c-neutral-gray: #475569; /* Meta Gray: 背景/物理黑盒/辅助线 */

        /* 浅色背景辅助变量 */
        --c-bg-light-blue: #EBF3FA;
        --c-bg-light-green: #E6F3EE;
        --c-bg-light-amber: #FFF4E5;
        --c-bg-light-gray: #F1F5F9;
        --c-bg-light-red: #FEE2E2;

        /* Font Stacks */
        --font-sans: 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
        --font-mono: 'JetBrains Mono', Consolas, 'Courier New', monospace;
      }

      .text-sans { font-family: var(--font-sans); }
      .text-mono { font-family: var(--font-mono); }
      .text-bold { font-weight: bold; }
    </style>

    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-cloud-blue)" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-local-green)" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--c-neutral-gray)" />
    </marker>
    <marker id="cross-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 2 2 L 8 8 M 8 2 L 2 8" stroke="var(--c-danger-red)" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!--
  ===========================================================================
       标题块 (Title Block)
  ===========================================================================
  -->
  <g id="title-block" transform="translate(500, 40)">
    <!-- A. Main Title -->
    <text y="20" text-anchor="middle" class="text-sans text-bold" font-size="24" fill="#000000">MCP 工具与功能描述：描述即路由协议</text>

    <!-- B. Breadcrumbs -->
    <text y="45" text-anchor="middle" class="text-mono" font-size="14" fill="var(--c-neutral-gray)">第 11 天 > 基础原理</text>

    <!-- C. Context Indicator -->
    <line x1="-50" y1="60" x2="50" y2="60" stroke="var(--c-cloud-blue)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!--
  ===========================================================================
       架构主视图区 (Diagram Content Starts at Y=140)
  ===========================================================================
  -->
  <g id="diagram-content" transform="translate(0, 140)">

    <!-- SECTION 1: 原理呈现：代码即黑盒，描述即接口 -->
    <rect x="60" y="20" width="880" height="260" rx="12" fill="var(--c-bg-light-gray)" stroke="var(--c-neutral-gray)" stroke-width="1" stroke-dasharray="4 2" />
    <text x="80" y="45" class="text-sans text-bold" font-size="14" fill="var(--c-neutral-gray)">
      核心心智模型 (Core Mental Model)
    </text>

    <!-- 1.1 LLM Brain (Observer) -->
    <g transform="translate(150, 140)">
      <polygon points="0,-45 40,-20 40,20 0,45 -40,20 -40,-20" fill="var(--c-bg-light-blue)" stroke="var(--c-cloud-blue)" stroke-width="2" />
      <text x="0" y="5" text-anchor="middle" class="text-sans text-bold" font-size="20" fill="var(--c-cloud-blue)">🧠</text>
      <text x="0" y="70" text-anchor="middle" class="text-sans text-bold" font-size="14" fill="var(--c-cloud-blue)">决策大脑</text>
      <text x="0" y="85" text-anchor="middle" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">"我该用哪个工具？"</text>
    </g>

    <!-- 1.2 Schema Interface (The Bridge) -->
    <g transform="translate(480, 80)">
      <rect x="-100" y="0" width="200" height="120" rx="8" fill="#FFFFFF" stroke="var(--c-cloud-blue)" stroke-width="2" />
      <rect x="-100" y="0" width="200" height="25" rx="8" fill="var(--c-bg-light-blue)" />
      <text x="0" y="17" text-anchor="middle" class="text-mono text-bold" font-size="12" fill="var(--c-cloud-blue)">JSON Schema</text>

      <text x="-85" y="45" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">"name": "read_file"</text>
      <rect x="-90" y="55" width="180" height="35" rx="4" fill="#FEF3C7" stroke="var(--c-risk-amber)" stroke-width="1"/>
      <text x="-80" y="68" class="text-mono text-bold" font-size="11" fill="var(--c-risk-amber)">"description":</text>
      <text x="-80" y="82" class="text-sans" font-size="11" fill="#333333">"LLM 只能看到这段文本"</text>

      <text x="-85" y="105" class="text-mono" font-size="11" fill="var(--c-neutral-gray)">"inputSchema": {...}</text>
    </g>

    <!-- 1.3 Physical Code (The Black Box) -->
    <g transform="translate(820, 90)">
      <rect x="-70" y="0" width="140" height="100" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="2" />
      <text x="0" y="25" text-anchor="middle" class="text-sans text-bold" font-size="12" fill="#94A3B8">物理源代码</text>
      <text x="0" y="45" text-anchor="middle" class="text-mono" font-size="10" fill="#38BDF8">def read_file(path):</text>
      <text x="0" y="60" text-anchor="middle" class="text-mono" font-size="10" fill="#38BDF8">  with open(...) as f:</text>
      <text x="0" y="75" text-anchor="middle" class="text-mono" font-size="10" fill="#38BDF8">    return f.read()</text>

      <rect x="-80" y="30" width="160" height="30" fill="rgba(222, 53, 11, 0.1)" transform="rotate(-15)"/>
      <text x="0" y="50" text-anchor="middle" class="text-sans text-bold" font-size="14" fill="var(--c-danger-red)" transform="rotate(-15)">对 LLM 隐身 (黑盒)</text>
    </g>

    <!-- Lines for Section 1 -->
    <!-- LLM to Schema (Allowed) -->
    <path d="M 210 140 L 370 140" fill="none" stroke="var(--c-cloud-blue)" stroke-width="3" marker-end="url(#arrow-blue)" />
    <text x="290" y="130" text-anchor="middle" class="text-sans text-bold" font-size="12" fill="var(--c-cloud-blue)">只读解析</text>

    <!-- LLM to Code (Blocked) -->
    <path d="M 200 160 C 300 240, 600 240, 740 160" fill="none" stroke="var(--c-danger-red)" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#cross-red)" />
    <text x="480" y="225" text-anchor="middle" class="text-sans text-bold" font-size="11" fill="var(--c-danger-red)">无法读取物理实现逻辑</text>

    <!-- Schema to Code (Execution Mapping) -->
    <path d="M 580 140 L 740 140" fill="none" stroke="var(--c-neutral-gray)" stroke-width="3" marker-end="url(#arrow-gray)" />
    <text x="660" y="130" text-anchor="middle" class="text-sans text-bold" font-size="12" fill="var(--c-neutral-gray)">Client 路由分发</text>


    <!-- SECTION 2: 描述工程对比 (Description Engineering Principles) -->
    <text x="500" y="330" text-anchor="middle" class="text-sans text-bold" font-size="18" fill="#000000">
      描述工程 (Description Engineering) 策略对比
    </text>
    <line x1="60" y1="350" x2="940" y2="350" stroke="var(--c-neutral-gray)" stroke-width="1" stroke-dasharray="2 2" />

    <!-- 2.1 传统反例 (Anti-Pattern) -->
    <g transform="translate(60, 380)">
      <rect width="420" height="230" rx="8" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="2" />
      <rect x="0" y="0" width="420" height="30" rx="8" fill="var(--c-bg-light-amber)" />
      <text x="20" y="20" class="text-sans text-bold" font-size="14" fill="var(--c-risk-amber)">⚠️ 反例：模糊与宽泛描述 (Anti-Pattern)</text>

      <text x="20" y="55" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">"name": "read_document"</text>
      <rect x="20" y="65" width="380" height="40" rx="4" fill="#FFFFFF" stroke="var(--c-risk-amber)" stroke-width="1"/>
      <text x="30" y="80" class="text-mono text-bold" font-size="11" fill="#333333">"description":</text>
      <text x="30" y="95" class="text-sans" font-size="13" fill="#333333">"读取文件内容。"</text>

      <!-- Consequences -->
      <line x1="20" y1="120" x2="400" y2="120" stroke="var(--c-risk-amber)" stroke-width="1" stroke-dasharray="2 2" />
      <text x="20" y="140" class="text-sans text-bold" font-size="12" fill="var(--c-risk-amber)">引发的问题 (Routing Collapse):</text>

      <circle cx="25" cy="160" r="4" fill="var(--c-risk-amber)"/>
      <text x="40" y="164" class="text-sans" font-size="12" fill="#333333">用户让 AI“看一篇 PDF”，AI 调用此工具后报错（该工</text>
      <text x="40" y="180" class="text-sans" font-size="12" fill="#333333">具实际上只支持纯文本 .txt）。</text>

      <circle cx="25" cy="200" r="4" fill="var(--c-risk-amber)"/>
      <text x="40" y="204" class="text-sans" font-size="12" fill="#333333">缺乏边界，导致模型尝试用它读取系统隐藏文件。</text>
    </g>

    <!-- 2.2 最佳实践 (Best Practice) -->
    <g transform="translate(520, 380)">
      <rect width="420" height="230" rx="8" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="2" />
      <rect x="0" y="0" width="420" height="30" rx="8" fill="var(--c-bg-light-green)" />
      <text x="20" y="20" class="text-sans text-bold" font-size="14" fill="var(--c-local-green)">✅ 正例：引入排他性与场景化约束</text>

      <text x="20" y="55" class="text-mono" font-size="12" fill="var(--c-neutral-gray)">"name": "read_document"</text>
      <rect x="20" y="65" width="380" height="75" rx="4" fill="#FFFFFF" stroke="var(--c-local-green)" stroke-width="1"/>
      <text x="30" y="80" class="text-mono text-bold" font-size="11" fill="#333333">"description":</text>
      <text x="30" y="95" class="text-sans" font-size="13" fill="#333333">"读取本地磁盘中的纯文本文件 (.txt/.md)。"</text>
      <!-- 排他性 -->
      <rect x="28" y="103" width="36" height="18" rx="2" fill="var(--c-bg-light-red)"/>
      <text x="30" y="115" class="text-sans text-bold" font-size="11" fill="var(--c-danger-red)">[排他]</text>
      <text x="70" y="115" class="text-sans" font-size="12" fill="var(--c-danger-red)">注意：不支持读取 PDF/Word。请勿用于系统文件。</text>
      <!-- 场景化 -->
      <rect x="28" y="120" width="36" height="18" rx="2" fill="var(--c-bg-light-green)"/>
      <text x="30" y="132" class="text-sans text-bold" font-size="11" fill="var(--c-local-green)">[场景]</text>
      <text x="70" y="132" class="text-sans" font-size="12" fill="var(--c-local-green)">当用户需要你提取本地代码、笔记摘要时优先调用。</text>

      <!-- Benefits -->
      <line x1="20" y1="155" x2="400" y2="155" stroke="var(--c-local-green)" stroke-width="1" stroke-dasharray="2 2" />
      <text x="20" y="175" class="text-sans text-bold" font-size="12" fill="var(--c-local-green)">工程收益 (Routing Precision):</text>

      <circle cx="25" cy="195" r="4" fill="var(--c-local-green)"/>
      <text x="40" y="199" class="text-sans" font-size="12" fill="#333333">明确失效边界，LLM 会主动放弃无效调用。</text>

      <circle cx="25" cy="215" r="4" fill="var(--c-local-green)"/>
      <text x="40" y="219" class="text-sans" font-size="12" fill="#333333">场景联想词增加该工具在特定任务中的权重得分。</text>
    </g>

  </g>

  <!--
  ===========================================================================
       底部图例与注释块 (Legend & Key Block - 遵循 3.4 & 7.3)
  ===========================================================================
  -->
  <g id="legend" transform="translate(500, 780)">
    <!-- 统一的半透明背景容器 -->
    <rect x="-420" y="-16" width="840" height="32" rx="4" fill="rgba(255, 255, 255, 0.9)" stroke="var(--c-neutral-gray)" stroke-width="0.5"/>

    <g transform="translate(-400, 0)">
      <text x="0" y="4" class="text-sans text-bold" font-size="12" fill="var(--c-neutral-gray)">图例说明:</text>

      <!-- Connection 1: Visual Match -->
      <g transform="translate(80, 0)">
        <polygon points="0,-6 6,-3 6,3 0,6 -6,3 -6,-3" fill="var(--c-cloud-blue)" />
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">LLM 视野可见 (Schema层)</text>
      </g>

      <!-- Connection 2: Blackbox -->
      <g transform="translate(290, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#1E293B" stroke="#0F172A" stroke-width="1"/>
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">LLM 视野盲区 (物理代码层)</text>
      </g>

      <!-- Connection 3: Danger / Rejection -->
      <g transform="translate(510, 0)">
        <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#FEE2E2" stroke="var(--c-danger-red)" stroke-width="1"/>
        <text x="12" y="4" class="text-mono" font-size="11" fill="#333333">负向约束 (排他性原则阻止幻觉)</text>
      </g>
    </g>
  </g>

  <!--
  ===========================================================================
       底部许可注释规范 (Footer License - 遵循 7.4)
  ===========================================================================
  -->
  <text x="500" y="830" text-anchor="middle" class="text-sans" font-size="12" fill="var(--c-neutral-gray)">
    本作品采用 CC-BY-SA 4.0 进行许可，© 2025-2026 Gitconomy Research社区
  </text>

</svg>
