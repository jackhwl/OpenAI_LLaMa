<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Board — Stock Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #0B1220;
    --panel:    #141D30;
    --panel-2:  #1B2740;
    --hairline: #33456b;
    --ivory:    #EFE8D8;
    --ivory-dim:#c9c2ae;
    --brass:    #C9A24D;
    --brass-dim:#8f7638;
    --emerald:  #24A06B;
    --brick:    #C0503A;
    --font-display: "Big Shoulders Display", sans-serif;
    --font-body: "IBM Plex Sans", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--ink);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201,162,77,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(36,160,107,0.06), transparent 60%);
    color: var(--ivory);
    margin: 0;
    padding: 0 0 60px;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  /* ===== Ticker tape ===== */
  .ticker-wrap {
    position: relative;
    background: #070B14;
    border-bottom: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .ticker-toggle {
    flex: 0 0 auto;
    background: var(--panel);
    color: var(--brass);
    border: none;
    border-right: 1px solid var(--brass-dim);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 10px 14px;
    cursor: pointer;
    z-index: 2;
  }
  .ticker-toggle:hover { color: var(--ivory); }

  .ticker-viewport {
    overflow: hidden;
    flex: 1 1 auto;
    mask-image: linear-gradient(90deg, transparent, black 4%, black 96%, transparent);
  }

  .ticker-track {
    display: flex;
    white-space: nowrap;
    width: max-content;
    animation: ticker-scroll 32s linear infinite;
  }

  .ticker-wrap.paused .ticker-track { animation-play-state: paused; }

  .ticker-item {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 10px 26px;
    display: inline-flex;
    gap: 10px;
    align-items: baseline;
    border-right: 1px solid var(--hairline);
    font-variant-numeric: tabular-nums;
  }
  .ticker-item .sym { color: var(--ivory); font-weight: 600; }
  .ticker-item .px { color: var(--ivory-dim); }
  .ticker-item .chg.up { color: var(--emerald); }
  .ticker-item .chg.down { color: var(--brick); }

  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ===== Header ===== */
  .board-header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 44px 28px 20px;
  }

  .board-header__top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 2px solid var(--brass);
    padding-bottom: 14px;
  }

  .board-header h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(34px, 5vw, 54px);
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ivory);
    text-transform: uppercase;
  }

  .board-date {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--brass);
    letter-spacing: 0.08em;
  }

  .board-sub {
    margin: 12px 0 0;
    color: var(--ivory-dim);
    font-size: 14px;
  }

  /* ===== Stat blocks / flap tiles ===== */
  .stats {
    max-width: 1100px;
    margin: 28px auto 0;
    padding: 0 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .stat-block {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 18px 20px 20px;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 12px;
  }

  .flap-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .flap-tile {
    position: relative;
    width: 30px;
    height: 44px;
    background: var(--ivory);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.4);
    flex: 0 0 auto;
  }
  .flap-tile.wide { width: 16px; }

  .flap-tile::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 1px;
    background: rgba(11,18,32,0.35);
    z-index: 3;
  }

  .flap-reel {
    display: flex;
    flex-direction: column;
    transition: transform 0.55s cubic-bezier(.22,.9,.24,1);
  }

  .flap-char {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .stat-sub {
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--ivory-dim);
  }
  .stat-sub.up { color: var(--emerald); }
  .stat-sub.down { color: var(--brick); }

  @media (prefers-reduced-motion: reduce) {
    .flap-reel { transition: none; }
    .ticker-track { animation: none; }
  }

  /* ===== Positions board ===== */
  .positions {
    max-width: 1100px;
    margin: 34px auto 0;
    padding: 0 28px;
  }

  .positions h2, .chart-section h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 12px;
  }

  .positions__head {
    display: grid;
    grid-template-columns: 90px 1fr 120px 160px;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ivory-dim);
    padding: 0 16px 8px;
    border-bottom: 1px solid var(--hairline);
  }

  .position-row {
    display: grid;
    grid-template-columns: 90px 1fr 120px 160px;
    gap: 12px;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--hairline);
    transition: background 0.2s ease;
  }
  .position-row:hover { background: var(--panel); }

  .position-row .symbol {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--ivory);
  }

  .position-row .name {
    font-size: 13px;
    color: var(--ivory-dim);
  }

  .position-row .price {
    font-family: var(--font-mono);
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  .position-row .change {
    font-family: var(--font-mono);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    text-align: right;
    font-weight: 500;
  }
  .change.up { color: var(--emerald); }
  .change.down { color: var(--brick); }

  /* ===== Chart ===== */
  .chart-section {
    max-width: 1100px;
    margin: 34px auto 0;
    padding: 0 28px;
  }

  .chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    height: 240px;
    padding: 20px 12px 0;
    border-bottom: 2px solid var(--brass);
    position: relative;
  }

  .bar-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    flex: 1 1 0;
    min-width: 0;
  }

  .bar-value {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bar-value.up { color: var(--emerald); }
  .bar-value.down { color: var(--brick); }

  .bar {
    width: 100%;
    max-width: 44px;
    border-radius: 3px 3px 0 0;
    height: 0;
    transition: height 0.9s cubic-bezier(.16,.9,.2,1);
  }
  .bar.up { background: linear-gradient(180deg, #35c489, var(--emerald)); }
  .bar.down { background: linear-gradient(180deg, #d97155, var(--brick)); }

  .bar-label {
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 8px;
    color: var(--ivory-dim);
    letter-spacing: 0.03em;
  }

  @media (prefers-reduced-motion: reduce) {
    .bar { transition: none; }
  }

  footer {
    max-width: 1100px;
    margin: 40px auto 0;
    padding: 16px 28px 0;
    font-size: 12px;
    color: var(--ivory-dim);
    border-top: 1px solid var(--hairline);
  }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    .stats { grid-template-columns: 1fr; }

    .positions__head { display: none; }

    .position-row {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "sym price"
        "name change";
      row-gap: 4px;
    }
    .position-row .symbol { grid-area: sym; }
    .position-row .price { grid-area: price; }
    .position-row .name { grid-area: name; }
    .position-row .change { grid-area: change; }

    .flap-tile { width: 22px; height: 34px; }
    .flap-char { height: 34px; font-size: 17px; }

    .chart { gap: 4px; }
    .bar-value { font-size: 10px; }
    .bar-label { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="ticker-wrap" id="tickerWrap">
  <button class="ticker-toggle" id="tickerToggle" aria-pressed="false">
    ⏸ <span class="sr-only">Pause ticker</span>
  </button>
  <div class="ticker-viewport">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>
</div>

<header class="board-header">
  <div class="board-header__top">
    <h1>Portfolio Board</h1>
    <div class="board-date" id="boardDate"></div>
  </div>
  <p class="board-sub">Six-position equity ledger · 1 share held per position · prices from stock_data.csv</p>
</header>

<section class="stats">
  <div class="stat-block">
    <div class="stat-label">Total Portfolio Value</div>
    <div class="flap-row" id="flapTotalValue"></div>
  </div>
  <div class="stat-block">
    <div class="stat-label">Overall Daily Change</div>
    <div class="flap-row" id="flapTotalChange"></div>
    <div class="stat-sub" id="totalChangePct"></div>
  </div>
</section>

<section class="positions" aria-label="Stock positions">
  <h2>Positions</h2>
  <div class="positions__head">
    <span>Symbol</span><span>Name</span><span>Price</span><span>Change</span>
  </div>
  <div id="positionsBody"></div>
</section>

<section class="chart-section">
  <h2>Daily % Change</h2>
  <div class="chart" id="chart"></div>
</section>

<footer>Data source: stock_data.csv. For illustrative purposes only — not investment advice.</footer>

<script>
  // Data embedded from stock_data.csv
  const stocks = [
    { symbol: "AAPL", name: "Apple Inc.", price: 333.02, change: 11.92, change_pct: 3.71 },
    { symbol: "MSFT", name: "Microsoft Corporation", price: 381.70, change: -0.73, change_pct: -0.19 },
    { symbol: "GOOGL", name: "Alphabet Inc.", price: 319.74, change: 0.50, change_pct: 0.16 },
    { symbol: "AMZN", name: "Amazon.com, Inc.", price: 232.11, change: -2.22, change_pct: -0.95 },
    { symbol: "NVDA", name: "NVIDIA Corporation", price: 206.84, change: -1.15, change_pct: -0.55 },
    { symbol: "JPM", name: "JP Morgan Chase & Co.", price: 353.21, change: 3.69, change_pct: 1.05 }
  ];

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function formatMoney(n) {
    const sign = n < 0 ? "-" : "";
    return sign + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatSigned(n, suffix) {
    const sign = n >= 0 ? "+" : "";
    return sign + n.toFixed(2) + suffix;
  }

  // ---- Date ----
  document.getElementById("boardDate").textContent =
    new Date().toLocaleDateString("en-US", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();

  // ---- Split-flap tiles ----
  const FILLER = "0123456789$,.+-".split("");

  function buildFlapRow(containerId, text) {
    const row = document.getElementById(containerId);
    row.innerHTML = "";
    text.split("").forEach(function (ch, i) {
      row.appendChild(buildFlapTile(ch, i));
    });
  }

  function buildFlapTile(finalChar, index) {
    const tile = document.createElement("div");
    tile.className = "flap-tile";

    const reel = document.createElement("div");
    reel.className = "flap-reel";

    const sequence = reduceMotion
      ? [finalChar]
      : [randomFiller(), randomFiller(), finalChar];

    sequence.forEach(function (ch) {
      const span = document.createElement("div");
      span.className = "flap-char";
      span.textContent = ch;
      reel.appendChild(span);
    });

    tile.appendChild(reel);

    if (!reduceMotion) {
      const steps = sequence.length;
      requestAnimationFrame(function () {
        setTimeout(function () {
          reel.style.transform = "translateY(-" + ((steps - 1) * 100) + "%)";
        }, 80 + index * 55);
      });
    }

    return tile;
  }

  function randomFiller() {
    return FILLER[Math.floor(Math.random() * FILLER.length)];
  }

  // ---- Totals ----
  const totalValue = stocks.reduce((sum, s) => sum + s.price, 0);
  const totalChange = stocks.reduce((sum, s) => sum + s.change, 0);
  const prevTotalValue = totalValue - totalChange;
  const totalChangePct = (totalChange / prevTotalValue) * 100;

  buildFlapRow("flapTotalValue", formatMoney(totalValue));
  buildFlapRow("flapTotalChange", formatSigned(totalChange, ""));

  const pctEl = document.getElementById("totalChangePct");
  pctEl.textContent = "(" + formatSigned(totalChangePct, "%") + " today)";
  pctEl.classList.add(totalChange >= 0 ? "up" : "down");

  // ---- Positions ----
  const positionsBody = document.getElementById("positionsBody");
  stocks.forEach(function (s) {
    const isUp = s.change >= 0;
    const row = document.createElement("div");
    row.className = "position-row";
    row.innerHTML =
      '<div class="symbol">' + s.symbol + '</div>' +
      '<div class="name">' + s.name + '</div>' +
      '<div class="price">' + formatMoney(s.price) + '</div>' +
      '<div class="change ' + (isUp ? "up" : "down") + '">' +
        (isUp ? "▲ " : "▼ ") + formatSigned(s.change, "") + " (" + formatSigned(s.change_pct, "%") + ")" +
      '</div>';
    positionsBody.appendChild(row);
  });

  // ---- Bar chart ----
  const chartEl = document.getElementById("chart");
  const maxAbsPct = Math.max.apply(null, stocks.map(function (s) { return Math.abs(s.change_pct); }));
  const scale = maxAbsPct === 0 ? 1 : 180 / maxAbsPct;

  const bars = [];
  stocks.forEach(function (s) {
    const isUp = s.change_pct >= 0;
    const barHeight = Math.max(Math.abs(s.change_pct) * scale, 2);

    const container = document.createElement("div");
    container.className = "bar-container";

    const valueLabel = document.createElement("div");
    valueLabel.className = "bar-value " + (isUp ? "up" : "down");
    valueLabel.textContent = formatSigned(s.change_pct, "%");

    const bar = document.createElement("div");
    bar.className = "bar " + (isUp ? "up" : "down");

    const label = document.createElement("div");
    label.className = "bar-label";
    label.textContent = s.symbol;

    container.appendChild(valueLabel);
    container.appendChild(bar);
    container.appendChild(label);
    chartEl.appendChild(container);

    bars.push({ el: bar, height: barHeight });
  });

  requestAnimationFrame(function () {
    bars.forEach(function (b, i) {
      setTimeout(function () {
        b.el.style.height = b.height + "px";
      }, reduceMotion ? 0 : 120 + i * 70);
    });
  });

  // ---- Ticker tape ----
  const tickerTrack = document.getElementById("tickerTrack");
  function tickerItemsHTML() {
    return stocks.map(function (s) {
      const isUp = s.change_pct >= 0;
      return '<div class="ticker-item">' +
        '<span class="sym">' + s.symbol + '</span>' +
        '<span class="px">' + formatMoney(s.price) + '</span>' +
        '<span class="chg ' + (isUp ? "up" : "down") + '">' + (isUp ? "▲" : "▼") + " " + formatSigned(s.change_pct, "%") + '</span>' +
      '</div>';
    }).join("");
  }
  tickerTrack.innerHTML = tickerItemsHTML() + tickerItemsHTML();

  const tickerWrap = document.getElementById("tickerWrap");
  const tickerToggle = document.getElementById("tickerToggle");
  let tickerPaused = reduceMotion;
  if (tickerPaused) {
    tickerWrap.classList.add("paused");
    tickerToggle.textContent = "▶";
    tickerToggle.setAttribute("aria-pressed", "true");
  }
  tickerToggle.addEventListener("click", function () {
    tickerPaused = !tickerPaused;
    tickerWrap.classList.toggle("paused", tickerPaused);
    tickerToggle.textContent = tickerPaused ? "▶" : "⏸";
    tickerToggle.setAttribute("aria-pressed", String(tickerPaused));
  });
</script>

</body>
</html>
