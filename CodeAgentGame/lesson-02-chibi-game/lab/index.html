<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赤壁 · 风起 —— 一个可以改写的冬天</title>
<style>
:root{
  --paper:#f2ece0; --paper2:#fdfaf3; --paper3:#e9e1d1;
  --ink:#1b1e24; --ink2:#5c6068; --ink3:#928b7c;
  --rule:#d8cfbc; --rule2:#e8e0cf;
  --wu:#2b7a67;      /* 吴 · 青 */
  --wei:#9c3b39;     /* 魏 · 朱 */
  --shu:#a8761f;     /* 蜀 · 赭 */
  --seal:#b3342e;
  --gold:#b08a3e;
  --serif:"Songti SC","SimSun","Noto Serif SC",Georgia,serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --sh:0 1px 2px rgba(40,35,25,.05),0 8px 26px -14px rgba(40,35,25,.2);
  --sh-lg:0 3px 8px rgba(40,35,25,.08),0 34px 70px -28px rgba(40,35,25,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  /* 宣纸纤维：两组极淡的交叉斜纹 */
  background-color:var(--paper);
  background-image:
    repeating-linear-gradient(118deg,rgba(150,130,95,.028) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(28deg,rgba(150,130,95,.019) 0 1px,transparent 1px 4px);
  color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(circle at 25% 35%,rgba(150,130,95,.06) 0 1px,transparent 1px),
                   radial-gradient(circle at 70% 65%,rgba(150,130,95,.05) 0 1px,transparent 1px);
  background-size:36px 36px,54px 54px;
}
/* 水墨晕染：五团低饱和色气 + 一道对角光，让纸面有深浅 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 46% 32% at 3% -3%,rgba(43,122,103,.14),transparent 62%),
    radial-gradient(ellipse 40% 28% at 101% 5%,rgba(156,59,57,.115),transparent 62%),
    radial-gradient(ellipse 62% 44% at 44% 109%,rgba(43,122,103,.125),transparent 68%),
    radial-gradient(ellipse 32% 24% at 87% 56%,rgba(176,138,62,.115),transparent 66%),
    radial-gradient(ellipse 28% 20% at 12% 73%,rgba(156,59,57,.09),transparent 66%),
    linear-gradient(162deg,rgba(176,138,62,.06),transparent 44%,rgba(43,122,103,.055));
}
.wrap{max-width:1080px;margin:0 auto;padding:0 26px;position:relative;z-index:1}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:60;background:rgba(242,236,224,.9);
  backdrop-filter:blur(14px)
}
.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;letter-spacing:.1em;font-size:15px;white-space:nowrap}
.brand .mk{
  width:26px;height:26px;background:var(--seal);color:#fff;border-radius:2px;display:grid;
  place-items:center;font-size:14px;box-shadow:0 2px 8px -3px rgba(179,52,46,.7)
}
/* 江波纹分隔 */
.wave{
  position:absolute;left:0;right:0;bottom:-1px;height:8px;pointer-events:none;opacity:.55;
  background-repeat:repeat-x;background-size:64px 8px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='8'><path d='M0 6c8 0 8-4 16-4s8 4 16 4 8-4 16-4 8 4 16 4' fill='none' stroke='%23c9bda3' stroke-width='1.3' stroke-linecap='round'/></svg>")
}
.progress{margin-left:auto;display:flex;gap:7px;align-items:center}
.pdot{width:9px;height:9px;border-radius:50%;background:var(--rule);transition:.3s}
.pdot.done{background:var(--ink3)}
.pdot.now{background:var(--seal);transform:scale(1.35);box-shadow:0 0 0 4px rgba(179,52,46,.15)}
.mstat{font-size:12px;color:var(--ink3);letter-spacing:.1em}

/* ---------- 状态条 ---------- */
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px 0;border-bottom:1px solid var(--rule2)}
.stat{font-size:12px}
.stat .lb{display:flex;justify-content:space-between;color:var(--ink3);letter-spacing:.1em;margin-bottom:5px}
.stat .lb b{color:var(--ink);font-family:var(--serif);font-size:13px}
.track{height:6px;background:var(--paper3);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.7,.3,1)}
.f-morale{background:var(--wu)} .f-naval{background:#3f6f9c}
.f-fortune{background:var(--gold)} .f-cao{background:var(--wei)}
.delta{font-size:11px;margin-left:6px;font-family:var(--serif)}
.delta.up{color:var(--wu)} .delta.dn{color:var(--wei)}

/* ---------- 通用 ---------- */
.hd{margin:30px 0 20px}
.kicker{font-family:var(--serif);font-size:12px;letter-spacing:.3em;color:var(--seal);display:block;margin-bottom:9px}
h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);letter-spacing:.06em;line-height:1.22;font-weight:700}
h2{font-family:var(--serif);font-size:clamp(22px,3.2vw,30px);letter-spacing:.05em;line-height:1.35;font-weight:700}
.lede{color:var(--ink2);font-size:15.5px;max-width:680px;margin-top:12px}
.card{background:var(--paper2);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--sh)}
.btn{
  font-family:var(--sans);font-size:13.5px;padding:9px 18px;border-radius:3px;
  border:1px solid var(--rule);background:var(--paper2);color:var(--ink2);
  cursor:pointer;transition:.18s;letter-spacing:.04em
}
.btn:hover{border-color:var(--ink3);color:var(--ink);background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fdfbf5;font-weight:600}
.btn.primary:hover{background:#000;border-color:#000;color:#fff}
.btn.ghost{padding:7px 14px;font-size:12.5px}
.btn.wei{border-color:rgba(156,59,57,.4);color:var(--wei)}
.btn.wei:hover{background:rgba(156,59,57,.07);border-color:var(--wei)}

/* ---------- 开始页 ---------- */
.start{padding:56px 0 70px}
.start-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:start;margin-top:8px}
.poem{font-family:var(--serif);font-size:17px;letter-spacing:.14em;line-height:2.1;color:var(--ink2);border-left:2px solid var(--seal);padding-left:18px;margin:22px 0}
.brief{padding:24px 26px}
.brief h3{font-family:var(--serif);font-size:16px;letter-spacing:.14em;margin-bottom:14px;color:var(--ink3)}
.brief .row{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:9px 0;border-bottom:1px dashed var(--rule2);font-size:14px;align-items:baseline}
.brief .row:last-of-type{border-bottom:0}
.brief .k{font-family:var(--serif);color:var(--ink3);font-size:12.5px;letter-spacing:.1em}
.brief .v{color:var(--ink2);line-height:1.7}
.brief .v em{font-style:normal;color:var(--seal);font-weight:600}
.tagline{display:inline-block;font-size:11.5px;letter-spacing:.14em;padding:3px 10px;border-radius:99px;border:1px solid rgba(179,52,46,.3);color:var(--seal);background:rgba(255,253,247,.7)}

/* 五决之序 */
.five{margin-top:34px}
.frow{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.fc{
  position:relative;overflow:hidden;padding:14px 10px 13px;text-align:center;
  border:1px solid var(--rule);border-radius:3px;background:var(--paper2);
  box-shadow:var(--sh);transition:.24s
}
.fc::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 70% 80%,rgba(176,138,62,.14),transparent 64%)
}
.fc:hover{border-color:var(--wei);transform:translateY(-3px);box-shadow:var(--sh-lg)}
.fc:hover::before{background:radial-gradient(circle at 70% 80%,rgba(156,59,57,.16),transparent 64%)}
.fc b{
  position:relative;display:grid;place-items:center;width:28px;height:28px;margin:0 auto 8px;
  font-family:var(--serif);font-size:14px;font-weight:400;color:#fff;background:var(--seal);
  border-radius:2px;box-shadow:0 2px 7px -3px rgba(179,52,46,.7)
}
.fc span{position:relative;display:block;font-size:11.5px;color:var(--ink3);line-height:1.45;letter-spacing:.02em}

/* ---------- 场景 ---------- */
.scene{padding-bottom:60px;position:relative}
/* 右上角放大场景号水印 */
.bignum{
  position:absolute;right:-10px;top:-24px;font-family:var(--serif);font-size:158px;line-height:1;
  color:var(--ink);opacity:.032;pointer-events:none;user-select:none;z-index:0
}
.scene-body{padding:26px 30px 26px 34px;font-size:16px;line-height:1.92;color:var(--ink);position:relative;overflow:hidden}
/* 左缘朱砂竖线 */
.scene-body::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--seal),rgba(179,52,46,.12))
}
/* 右下角云气 */
.scene-body::after{
  content:"";position:absolute;right:-30px;bottom:-30px;width:170px;height:170px;pointer-events:none;
  background:radial-gradient(circle at 70% 70%,rgba(43,122,103,.07),transparent 62%);
  border-radius:50%
}
.scene-body .hl{color:var(--seal);font-weight:600}
/* 每景气韵：同底色纸，不同微色温 */
.scene.s1 .scene-body{background:linear-gradient(160deg,var(--paper2),#f8f3e8)}
.scene.s2 .scene-body{background:linear-gradient(160deg,var(--paper2),#fbf1ee)}
.scene.s3 .scene-body{background:linear-gradient(160deg,var(--paper2),#f0f4f1)}
.scene.s4 .scene-body{background:linear-gradient(160deg,var(--paper2),#eef2f7)}
.scene.s5 .scene-body{background:linear-gradient(160deg,var(--paper2),#faf0ea)}
/* 标题前的方形小印 */
h2 .sn{
  display:inline-grid;place-items:center;width:30px;height:30px;font-size:15px;font-weight:400;
  background:var(--seal);color:#fff;border-radius:2px;margin-right:12px;vertical-align:-4px;
  box-shadow:0 2px 7px -2px rgba(179,52,46,.55);letter-spacing:0
}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 0}
.visual{margin-top:18px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper3);position:relative;min-height:150px;display:none}
.visual.on{display:block}
.visual img{width:100%;display:block}
.visual .ph{padding:44px 20px;text-align:center;color:var(--ink3);font-size:13px}

.opts{display:grid;gap:14px;margin-top:24px}
.opt{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:200px 1fr 112px;gap:18px;align-items:center;
  padding:14px 20px;background:var(--paper2);border:1px solid var(--rule);
  border-radius:4px;cursor:pointer;transition:.2s;text-align:left;box-shadow:var(--sh);
  /* 显式指定：否则 button:disabled 会套用系统灰色文字，选中的那张反而变淡 */
  color:var(--ink)
}
/* 左缘朱砂竖线，hover 时自上而下展开 */
.opt::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;z-index:2;
  background:var(--wei);transform:scaleY(0);transform-origin:top;
  transition:transform .3s cubic-bezier(.2,.7,.3,1)
}
/* 右下角水墨云晕（纯 CSS radial，可控、不会显脏） */
.opt::after{
  content:"";position:absolute;right:-48px;bottom:-48px;width:162px;height:162px;border-radius:50%;
  pointer-events:none;z-index:0;transition:.4s;
  background:radial-gradient(circle at 58% 58%,rgba(176,138,62,.14),transparent 62%)
}
.opt:hover{border-color:var(--wei);transform:translateX(4px);box-shadow:var(--sh-lg)}
.opt:hover::before{transform:scaleY(1)}
.opt:hover::after{background:radial-gradient(circle at 58% 58%,rgba(156,59,57,.17),transparent 62%)}
/* 选定后：未选中的淡下去，被选中的保持满色 */
.opt:disabled{cursor:default;opacity:.46;transition:opacity .4s}
.opt.picked:disabled{opacity:1}
.opt:disabled:hover{transform:none;box-shadow:var(--sh)}

/* 徽记：汉风线描小图 + 右下角选项字 */
.opt .k{
  position:relative;width:58px;height:58px;display:grid;place-items:center;z-index:1;
  border:1px solid var(--rule);border-radius:3px;
  background:linear-gradient(150deg,#f5efe3,#e7dec9);
  color:var(--ink2);transition:.26s cubic-bezier(.2,.7,.3,1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 1px 3px rgba(40,35,25,.07)
}
.opt .k svg{width:34px;height:34px;display:block;transition:.26s}
.opt .k .kx{
  position:absolute;right:0;bottom:0;font-family:var(--serif);font-style:normal;
  font-size:10px;line-height:1;padding:3px 5px;background:var(--paper2);color:var(--ink3);
  border-left:1px solid var(--rule);border-top:1px solid var(--rule);border-radius:0 0 2px 0;transition:.26s
}
.opt:hover .k{border-color:var(--wei);color:var(--wei);background:linear-gradient(150deg,#fdf6f3,#f9e6e2)}
.opt:hover .k svg{transform:scale(1.08) rotate(-3deg)}
.opt:hover .k .kx{background:var(--wei);color:#fff;border-color:var(--wei)}
.opt.picked .k{
  background:linear-gradient(150deg,var(--wei),#8c2f2d);border-color:var(--wei);color:#fff;
  box-shadow:0 4px 13px -4px rgba(156,59,57,.75)
}
.opt.picked .k .kx{background:#fff;color:var(--wei);border-color:var(--wei)}

/* 选项插画图版 */
.opt .ph{
  position:relative;width:200px;height:150px;border-radius:3px;overflow:hidden;z-index:1;
  border:1px solid var(--rule);background:var(--paper3);
  box-shadow:0 3px 11px -5px rgba(40,35,25,.5)
}
.opt .ph img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .55s cubic-bezier(.2,.7,.3,1)
}
.opt:hover .ph img{transform:scale(1.07)}
.opt .ph .kx{
  position:absolute;left:0;bottom:0;font-family:var(--serif);font-style:normal;
  font-size:11px;line-height:1;padding:4px 8px;color:var(--ink2);
  background:rgba(253,250,243,.93);
  border-top:1px solid var(--rule);border-right:1px solid var(--rule);
  border-radius:0 2px 0 0;transition:.24s
}
.opt:hover .ph .kx,.opt.picked .ph .kx{background:var(--wei);color:#fff;border-color:var(--wei)}
/* 拿不到插画时，退回纸底 + 矢量徽记 */
.opt .ph.noimg{display:grid;place-items:center;color:var(--ink2);
  background:linear-gradient(150deg,#f5efe3,#e7dec9)}
.opt .ph.noimg svg{width:40px;height:40px;display:block}

.opt .oc{position:relative;z-index:1}
.opt .lb{display:block;font-family:var(--serif);font-size:17px;letter-spacing:.04em;margin-bottom:5px}
/* 标题前的线描小徽记 */
.opt .lb .ico{
  display:inline-grid;place-items:center;width:20px;height:20px;color:var(--ink3);
  vertical-align:-4px;margin-right:8px;transition:.24s
}
.opt .lb .ico svg{width:18px;height:18px;display:block}
.opt:hover .lb .ico{color:var(--wei)}
.opt .dt{display:block;font-size:13.5px;color:var(--ink2);line-height:1.65}

/* 效果标签：对己方有利为青，不利为朱 —— 比单纯正负号更好读 */
.opt .ef{
  position:relative;z-index:1;display:flex;flex-direction:column;gap:5px;
  align-items:flex-end;justify-content:center
}
.opt .ef i{
  font-style:normal;font-family:var(--serif);font-size:11px;line-height:1;letter-spacing:.03em;
  padding:4px 8px;border-radius:2px;white-space:nowrap
}
.opt .ef i.g{color:#1e6b58;background:rgba(43,122,103,.09);border:1px solid rgba(43,122,103,.24)}
.opt .ef i.b{color:#9c3b39;background:rgba(156,59,57,.075);border:1px solid rgba(156,59,57,.22)}
.opt .ef i.z{color:var(--ink3);background:var(--paper3);border:1px solid var(--rule2)}

.opt.picked{border-color:var(--wei);background:#fdf6f3}
.opt.picked::before{transform:scaleY(1)}
.opt.picked::after{background:radial-gradient(circle at 58% 58%,rgba(156,59,57,.17),transparent 62%)}

/* ---------- 参谋团 ---------- */
.council{margin-top:22px;display:none}
.council.on{display:block}
.council-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.council-hd h3{font-family:var(--serif);font-size:15px;letter-spacing:.16em}
.council-hd .hint{font-size:12px;color:var(--ink3)}
.ops{display:grid;gap:12px}
.op{
  display:grid;grid-template-columns:132px 1fr;gap:16px;padding:16px 18px;
  background:var(--paper2);border:1px solid var(--rule);border-left:3px solid var(--ink3);
  border-radius:3px;animation:fi .4s ease both
}
.op .who{font-size:12.5px;line-height:1.7}
.op .who b{display:block;font-family:var(--serif);font-size:13.5px;color:var(--ink);margin-bottom:3px}
.op .who code{font-size:10.5px;color:var(--ink3);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.op .say{font-size:14.5px;line-height:1.85;color:var(--ink2);font-family:var(--serif)}
/* 等待中的卡片：还没轮到开口的谋士，看起来就该是灰的 */
.op.wait{border-left-color:var(--rule2)}
.op.wait .who b,.op.wait .say{color:var(--ink3);font-weight:400}
/* 失手的谋士：单独标出来，不要让整组人的成果陪它一起消失 */
.op.bad{border-left-color:var(--wei)}
.op.bad .say{color:var(--wei);font-size:13px}
/* 单张重试：一位谋士被限流不该让整组重来 */
.op .retry{margin-left:10px;border:1px solid var(--rule2);background:transparent;
  color:var(--ink2);font-size:12px;font-family:var(--sans);padding:3px 10px;border-radius:2px;
  cursor:pointer;letter-spacing:.05em}
.op .retry:hover{border-color:var(--ink2);color:var(--ink)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dots{display:inline-flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:bl 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* 笔法切换 */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper2)}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:12.5px;color:var(--ink2);
  cursor:pointer;font-family:var(--sans);transition:.15s;letter-spacing:.06em}
.seg button + button{border-left:1px solid var(--rule)}
.seg button:hover:not(.on){background:var(--paper3);color:var(--ink)}
.seg button.on{background:var(--ink);color:#fdfbf5;font-weight:600}
.seglab{font-size:12.5px;color:var(--ink3);letter-spacing:.1em;margin-right:2px}

/* ---------- 后果 ---------- */
.outcome{margin-top:20px;padding:26px 28px;border-left:3px solid var(--gold);background:var(--paper2);border-radius:0 4px 4px 0;display:none}
.outcome.on{display:block;animation:fi .5s ease both}
.outcome .oh{font-family:var(--serif);font-size:13px;letter-spacing:.22em;color:var(--gold);margin-bottom:12px}
.outcome .oh .meta{font-family:var(--sans);font-size:11px;letter-spacing:.04em;color:var(--ink3);margin-left:9px}
.outcome .txt{font-size:16px;line-height:1.95;font-family:var(--serif);letter-spacing:.02em;white-space:pre-wrap}
.outcome .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
details.pbox{margin-top:16px;border-top:1px dashed var(--rule2);padding-top:14px}
details.pbox summary{font-size:12.5px;color:var(--ink3);cursor:pointer;letter-spacing:.08em;list-style:none}
details.pbox summary::-webkit-details-marker{display:none}
details.pbox summary::before{content:"▸ ";color:var(--seal)}
details.pbox[open] summary::before{content:"▾ "}
.prompt{background:#20232a;color:#e6e2d6;border-radius:3px;padding:14px 16px;margin-top:10px;
  font-family:ui-monospace,Consolas,monospace;font-size:11.8px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.prompt .pk{color:#e0a458}
.prompt .pf{color:#7f8794}
.pnote{font-size:12px;color:var(--ink3);line-height:1.85;margin:11px 0 0}
.pnote code{font-size:11.5px;background:var(--paper3);padding:1px 5px;border-radius:2px}

/* ---------- 结局 ---------- */
.ending{padding:10px 0 70px}
.ehero{
  position:relative;overflow:hidden;padding:44px 34px;border-radius:4px;text-align:center;
  border:1px solid var(--rule);background:var(--paper2);box-shadow:var(--sh-lg)
}
/* 装裱内框 */
.ehero::before{
  content:"";position:absolute;inset:9px;border:1px solid var(--rule2);border-radius:2px;pointer-events:none
}
/* 云气 */
.ehero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 58% 68% at 50% 122%,rgba(43,122,103,.12),transparent 66%),
    radial-gradient(ellipse 36% 48% at 4% -16%,rgba(156,59,57,.1),transparent 66%),
    radial-gradient(ellipse 36% 48% at 96% -16%,rgba(176,138,62,.1),transparent 66%)
}
.ehero > *{position:relative;z-index:1}
.ebadge{display:inline-block;font-size:11.5px;letter-spacing:.2em;padding:4px 12px;border-radius:99px;margin-bottom:16px}
.eb-史实线{background:rgba(43,122,103,.1);color:var(--wu);border:1px solid rgba(43,122,103,.3)}
.eb-反事实{background:rgba(156,59,57,.09);color:var(--wei);border:1px solid rgba(156,59,57,.3)}
.eb-惨胜{background:rgba(168,118,31,.1);color:var(--shu);border:1px solid rgba(168,118,31,.3)}
.ehero h2{font-size:clamp(30px,5.6vw,50px);letter-spacing:.14em}
.ehero .sub{color:var(--ink3);letter-spacing:.2em;font-size:13px;margin-top:12px}
.review{margin-top:24px}
.review h3{font-family:var(--serif);font-size:14px;letter-spacing:.2em;color:var(--ink3);margin-bottom:12px}
.rv{display:grid;grid-template-columns:126px 1fr 152px;gap:14px;padding:12px 16px;background:var(--paper2);
  border:1px solid var(--rule);border-radius:3px;margin-bottom:9px;font-size:13.5px;align-items:center}
.rv .rn{font-family:var(--serif);color:var(--ink3);font-size:12px;letter-spacing:.08em}
.rv .rc{font-family:var(--serif);font-size:14.5px}
.rv .rd{font-size:11.5px;color:var(--ink3);text-align:right;font-family:var(--serif)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;justify-content:center}
.verdict{margin-top:22px;padding:24px 28px;border-left:3px solid var(--seal);background:var(--paper2);border-radius:0 4px 4px 0}
.verdict .vh{font-family:var(--serif);font-size:13px;letter-spacing:.22em;color:var(--seal);margin-bottom:12px}
.verdict .vt{font-size:15.5px;line-height:1.95;font-family:var(--serif);white-space:pre-wrap}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.gallery figure{border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper2)}
.gallery img{width:100%;display:block}
.gallery figcaption{padding:9px 13px;font-size:11.5px;color:var(--ink3);letter-spacing:.08em;border-top:1px solid var(--rule2)}

/* ---------- 其它 ---------- */
.note{font-size:12.5px;color:var(--ink3);line-height:1.85;margin-top:26px;padding:16px 18px;
  background:var(--paper3);border-radius:3px}
.note b{color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#20232a;color:#f0ece0;
  padding:11px 20px;border-radius:3px;font-size:13px;z-index:200;box-shadow:var(--sh-lg);display:none}
.toast.on{display:block;animation:fi .25s ease both}
.audio-wrap{margin-top:14px}
audio{width:100%;height:38px}
.loading{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
@media(max-width:860px){
  .start-grid,.gallery{grid-template-columns:1fr}
  .frow{grid-template-columns:repeat(2,1fr)}
  .opt{grid-template-columns:122px 1fr;gap:13px;padding:12px 14px}
  .opt .ph{width:122px;height:92px;align-self:start}
  .opt .ph.noimg svg{width:30px;height:30px}
  .opt .k{width:52px;height:52px;align-self:start}
  .opt .k svg{width:30px;height:30px}
  /* 窄屏：效果标签移到标题下方，横排 */
  .opt .ef{
    grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;
    flex-wrap:wrap;gap:6px;margin-top:8px
  }
  .op{grid-template-columns:1fr;gap:8px}
  .rv{grid-template-columns:1fr;gap:4px}
  .rv .rd{text-align:left}
  .statbar{grid-template-columns:repeat(2,1fr);gap:11px}
  .bignum{font-size:104px;top:-14px}
  .scene-body{padding:22px 20px 22px 24px}
}

/* 结局判定：先到先得，顺序不可乱 */
function decide(s){
  if (s.naval >= 12 && s.fortune >= 8)  return 'victory';
  if (s.fortune <= 3 && s.morale >= 9)  return 'pyrrhic';
  if (s.cao <= 1 && s.naval >= 7)       return 'deception';
  if (s.morale <= 5 && s.naval <= 4)    return 'surrender';
  if (s.naval >= 8 && s.fortune >= 6)   return 'stalemate';
  if (s.morale <= 6 || s.cao >= 9)      return 'defeat';
  return 'victory';
}

/* 笔法：同一个结局，不同模型写出来的味道不同 —— 这本身就是模型差异的演示 */
const STYLES = [
  { k:'fast',    label:'快笔', note:'internlm3-8b-instruct · 约 5 秒' },

];
let NSTYLE = 'fast';
function segHTML(){
  return `<span class="seglab">笔法</span><span class="seg" id="seg">` +
    STYLES.map(s=>`<button data-k="${s.k}" class="${s.k===NSTYLE?'on':''}" title="${s.note}">${s.label}</button>`).join('') +
    `</span>`;
}
function bindSeg(){
  const el = document.getElementById('seg'); if (!el) return;
  el.querySelectorAll('button').forEach(b=>{
    b.onclick = () => {
      NSTYLE = b.dataset.k;
      el.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x.dataset.k === NSTYLE));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), ms||3000);
}

async function api(path, body){
  const r = await fetch(path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(()=>({error:'响应不是合法 JSON'}));
  if (!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function clamp(v){ return Math.max(0, Math.min(MAXV, v)); }

/* ---- 状态条 ---- */
function renderStats(prev){
  $('statbar').style.display = 'grid';
  $('statbar').innerHTML = STAT_META.map(m=>{
    const v = S[m.k];
    const d = prev ? v - prev[m.k] : 0;
    const dt = d ? `<span class="delta ${d>0?'up':'dn'}">${d>0?'+':''}${d}</span>` : '';
    return `<div class="stat" title="${m.hint}">
      <div class="lb"><span>${m.name}</span><b>${v}${dt}</b></div>
      <div class="track"><div class="fill f-${m.k}" style="width:${v/MAXV*100}%"></div></div>
    </div>`;
  }).join('');
}

/* ---- 进度点 ---- */
function renderProg(){
  $('prog').innerHTML = SCENES.map((s,i)=>{

}

/* 效果标签：军心/水战/天时 越高越好，曹疑 越低越好
   —— 所以按"对己方是否有利"着色，而不是简单地按正负号 */
const GOOD = { morale:1, naval:1, fortune:1, cao:-1 };
function effectHTML(d){
  const n = {morale:'军心', naval:'水战', fortune:'天时', cao:'曹疑'};
  const parts = Object.keys(d).filter(k=>d[k]).map(k=>{
    const ok = Math.sign(d[k]) === GOOD[k];
    return `<i class="${ok?'g':'b'}">${n[k]}${d[k]>0?'+':''}${d[k]}</i>`;
  });
  return parts.length ? parts.join('') : '<i class="z">无变化</i>';
}

async function askCouncil(sc){
  const btn = $('ask'); btn.disabled = true;
  const box = $('council'); box.classList.add('on');

  // 名单从 /api/status 来：config.json 里加过模型的同学，页面显示的位次与服务端一致。
  let roster = [];
  try{ roster = (await api('/api/status', {})).council || []; }catch(e){ /* 退化 */ }
  if (!roster.length) roster = ['','','','',''];

  const payload = {sceneTitle: sc.date + ' ' + sc.title,
                   sceneText: sc.text, options: sc.options};
  const t0 = Date.now();
  let done = 0;
  const chint = () => $('chint').textContent =
    `已陈词 ${done}/${roster.length}　·　已等待 ${((Date.now()-t0)/1000).toFixed(0)} 秒`;

  $('ops').innerHTML = roster.map((m,i)=>`
    <div class="op wait" id="op-${i}">
      <div class="who"><b>待 陈 词</b><code>${esc(m)}</code></div>
      <div class="say"><span class="dots"><i></i><i></i><i></i></span>　思量中…</div>
    </div>`).join('');
  const tick = setInterval(chint, 400);

  // settled 让"重试"不会把计数刷成 6/5
  const settled = {};
  const bump = i => { if (!settled[i]) { settled[i] = true; done++; chint(); } };

  const one = async i => {
    const box0 = $('op-'+i);
    if (box0 && !box0.classList.contains('wait')){
      box0.outerHTML = `
        <div class="op wait" id="op-${i}">
          <div class="who"><b>重 问 中</b><code>${esc(roster[i])}</code></div>
          <div class="say"><span class="dots"><i></i><i></i><i></i></span>　再问一次…</div>
        </div>`;
    }
    try{
      const d = await api('/api/council/one', Object.assign({index:i}, payload));
      // ok=false 的人单独标出来：配置问题和"模型说了句场面话"必须看得出来差别
      $('op-'+i).outerHTML = `
        <div class="op${d.opinion.ok === false ? ' bad' : ''}" style="animation-delay:${i*70}ms">
          <div class="who"><b>${esc(d.opinion.title)}</b><code>${esc(d.opinion.model)}</code></div>
          <div class="say">${esc(d.opinion.text)}
            ${d.opinion.ok === false
              ? `<button class="retry" data-i="${i}">重试这一位</button>` : ''}</div>
        </div>`;
    }catch(e){
      $('op-'+i).outerHTML = `
        <div class="op bad">
          <div class="who"><b>未 能 应 答</b><code>${esc(roster[i])}</code></div>
          <div class="say">${esc(e.message)}<button class="retry" data-i="${i}">重试这一位</button></div>
        </div>`;
    }
    bump(i);
    document.querySelectorAll('#ops .retry')
      .forEach(b => b.onclick = () => one(Number(b.dataset.i)));
  };
  await Promise.all(roster.map((_,i)=>one(i)));
  clearInterval(tick);
  toast('参谋团已各陈其词');
  btn.disabled = false;
}

async function writeVerdict(payload, btn){
  const vt = document.querySelector('.verdict .vt');
  const meta = $('vmeta');
  vt.innerHTML = '<span class="loading">落笔中 <span class="dots"><i></i><i></i><i></i></span></span>';
  if (btn) btn.disabled = true;
  try{
    const d = await api('/api/narrate', Object.assign({ style: NSTYLE }, payload));
    vt.textContent = d.text;
    if (meta) meta.textContent = `${d.styleLabel || ''} · ${d.model}`;
    return d;
  }catch(e){
    vt.textContent = '（史官未能落笔：' + e.message + '）';
    return null;
  }finally{ if (btn) btn.disabled = false; }
}

/* 选项插画清单：由 tools/gen_choice_images.py 生成。
   取不到就整站退回矢量徽记 —— 页面任何时候都不会因为缺图而破相。 */
let MANIFEST = {};
async function loadManifest(){
  try{
    const r = await fetch('assets/choices/manifest.json', { cache: 'no-store' });
    if (r.ok) MANIFEST = await r.json();
  }catch(e){ MANIFEST = {}; }
  console.log('选项插画已载入：' + Object.keys(MANIFEST).length + ' / 15');
}

loadManifest().finally(viewStart);
</script>
